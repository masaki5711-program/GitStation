# Memory-lean PostgreSQL 16 settings for GitStation's OWN instance
# (option A in ops/linux/postgresql/README.md). Append to postgresql.conf or
# place in conf.d/ (include_dir). Sized for a server shared with PFS: about
# 1 GiB of RAM for this instance in total. PLACEHOLDER values — revisit when
# the PFS team reports the free RAM.
#
# Do NOT apply these to the PFS cluster (option B): there the PFS team owns
# every setting; GitStation only needs the connection slots below.

listen_addresses = '127.0.0.1'       # same host only (forge: database.tls_mode = "disable")
port = 55433                         # PLACEHOLDER: not 5432 (PFS)

# Connections. forge needs (write + read pool) * 2 processes + 3
# = (5 + 5) * 2 + 3 = 23 within 80 % of the usable slots (forge doctor
# db.connections), plus forge backup / forgectl / pgBackRest / psql.
max_connections = 40
superuser_reserved_connections = 3

# Memory.
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB                       # per sort / hash node; forge's queries are small
maintenance_work_mem = 64MB
wal_buffers = 8MB
huge_pages = off

# SSD storage: without this the integrations' feed scans instead of using
# its index (docs/deploy/test-server-guide.md §1.1).
random_page_cost = 1.1
effective_io_concurrency = 100

# WAL and checkpoints (small write volume).
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9

# pgBackRest (runbook backup-restore). archive_mode needs a restart.
archive_mode = on
archive_command = 'pgbackrest --stanza=forge archive-push %p'

# Logging: slow statements only.
log_min_duration_statement = 1000
log_line_prefix = '%m [%p] %q%u@%d '
