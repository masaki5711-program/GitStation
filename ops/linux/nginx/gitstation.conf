# /etc/nginx/conf.d/gitstation.conf — TLS reverse proxy for GitStation.
# forge serve does not terminate TLS; it listens on loopback (server.bind).
# PLACEHOLDER: host name, certificate paths, upstream port, listen ports
# (if PFS already owns 443 on this host, add this server block to PFS's
# nginx with its own server_name instead of a second nginx).
#
# Requirements (sources: config git.http.*, ADR-0021, runbook connections):
#  - bodies up to git.http.push_max_bytes (2 GiB) and streamed both ways;
#  - timeouts at least git.http.timeout_ms (1 h) for clone / push;
#  - Authorization, Cookie, Origin and Host passed unchanged (CSRF compares
#    Origin with web.base_url; the session cookie is __Host-, Secure);
#  - no websockets: the UI polls (plain HTTP/1.1 to the upstream is enough).

# Per-client limits (http context; conf.d/ files are included there).
# forge sees only this proxy as its peer, so per-person limits live here.
# Sign-in starts and callbacks: a person needs a few per minute.
limit_req_zone  $binary_remote_addr zone=gitstation_auth:10m rate=10r/m;
# Open connections per client address (UI polling, git, API).
limit_conn_zone $binary_remote_addr zone=gitstation_conn:10m;
limit_req_status  429;
limit_conn_status 429;

# Access log without query strings ($uri, not $request / $args).
log_format gitstation_noargs '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                             '$status $body_bytes_sent $request_time "$http_user_agent"';

upstream gitstation {
    server 127.0.0.1:18080;          # = server.bind
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name gitstation.example.internal;
    return 301 https://$server_name$request_uri;   # fixed name, never the client's Host
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                        # nginx < 1.25.1: remove, use "listen 443 ssl http2;"
    server_name gitstation.example.internal;

    ssl_certificate     /etc/nginx/tls/gitstation.crt;   # chain signed by the internal CA
    ssl_certificate_key /etc/nginx/tls/gitstation.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:gitstation:10m;
    ssl_session_timeout 1h;

    # HSTS is the proxy's job (forge has no setting for it).
    add_header Strict-Transport-Security "max-age=31536000" always;

    # git push: the whole pack in one request body. Slightly above
    # git.http.push_max_bytes so forge, not nginx, refuses an oversized push
    # (forge answers with an FG code the pusher can quote).
    client_max_body_size 2100m;
    # Stream the body to forge instead of spooling it to disk first.
    proxy_request_buffering off;
    # Stream clone / fetch packs to the client.
    proxy_buffering off;
    proxy_max_temp_file_size 0;

    # >= git.http.timeout_ms. The UI and API answer much faster; forge has
    # its own idle and body timeouts (server.*, git.http.*).
    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    send_timeout 3600s;
    client_body_timeout 300s;        # = git.http.body_timeout_ms (idle between body reads)

    # No query strings and no Authorization in the log.
    access_log /var/log/nginx/gitstation.access.log gitstation_noargs;
    error_log  /var/log/nginx/gitstation.error.log warn;

    # At most 32 open connections per client address (a git clone holds one).
    limit_conn gitstation_conn 32;

    # Sign-in start and callback: rate-limited per client (the IdP's
    # back-channel logout and the rest of /-/auth/ are not).
    location ~ ^/-/auth/(login|callback)$ {
        limit_req zone=gitstation_auth burst=10 nodelay;
        proxy_pass http://gitstation;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        # Informational only: forge counts the socket peer (this proxy) and
        # never trusts X-Forwarded-* (server.max_connections_per_peer is the
        # proxy's whole share: runbook connections).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass forge's own error bodies (they carry the request_id).
        proxy_intercept_errors off;
    }

    location / {
        proxy_pass http://gitstation;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        # Informational only: forge counts the socket peer (this proxy) and
        # never trusts X-Forwarded-* (server.max_connections_per_peer is the
        # proxy's whole share: runbook connections).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass forge's own error bodies (they carry the request_id).
        proxy_intercept_errors off;
    }
}
