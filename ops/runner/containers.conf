# Podman settings for the job containers of the test runner (a drop-in loaded
# after the image's own ~/.config/containers/containers.conf).
#
# The podman/stable image is made to run Podman inside a container and
# defaults to `volumes = ["/proc:/proc"]` and host IPC/UTS namespaces. With
# those defaults a job container sees the runner container's /proc (every
# process of the runner, other jobs and services; its own pids are missing
# from it) and shares the runner's IPC and UTS namespaces. Nested rootless
# Podman can mount a fresh procfs, so we turn both off: each job gets its own
# /proc for its own PID namespace and its own IPC/UTS namespaces. This only
# tightens the job sandbox (the runner's flags stay: --network=none,
# --read-only, --cap-drop=all, no-new-privileges, limits).
#
# `volumes = []` is required: no Podman flag removes a configured default
# volume, and forge-runner refuses to start while one is set (FG-CI-0015,
# runbook ci-runner "ジョブの切り離し"). The namespaces are also set by
# forge-runner's own flags (--pid/--ipc/--uts/--cgroupns=private, pods
# --share=net); setting them here keeps any other container of this user
# private too.
[containers]
volumes = []
ipcns = "private"
utsns = "private"
