# TEST ONLY (ops/runner/README.md): plain HTTP to the forge. Never copy to production.
# Copy to ops/runner/.local/config.toml (test environment on this machine).
server = "http://host.docker.internal:28080"
allow_insecure_http = true            # test only: the test GitStation has no TLS
token_file = "/etc/forge-runner/token"
work_dir = "/var/lib/forge-runner"    # the runner-work volume in compose.yml
image_registries = ["registry:5000/"]
memory = "4g"                         # a Rust test job; inside compose mem_limit 8g
work_dir_max_bytes = 10737418240      # 10 GiB: Rust test build without debuginfo is 6.2 GB
