# Test-environment runner on a Docker host (ops/runner/README.md).
# No published ports: the runner only makes outbound requests.
name: gs-runner-test

services:
  registry:
    image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    networks: [runner]
    volumes:
      - registry-data:/var/lib/registry
    restart: unless-stopped

  runner:
    build:
      context: ../..
      dockerfile: ops/runner/Dockerfile
    image: gitstation/forge-runner:test
    depends_on: [registry]
    networks: [runner]
    user: podman
    # Rootless Podman inside an unprivileged container needs the user-namespace
    # syscalls Docker's default seccomp profile refuses, and /dev/fuse for
    # fuse-overlayfs. Not privileged; no Docker socket.
    security_opt:
      - seccomp=unconfined
    devices:
      - /dev/fuse
    volumes:
      - ./.local/config.toml:/etc/forge-runner/config.toml:ro
      - ./.local/token:/etc/forge-runner/token:ro
      - ./registries.conf:/etc/containers/registries.conf.d/50-test-registry.conf:ro
      # Job containers get their own /proc and IPC/UTS namespaces (containers.conf).
      - ./containers.conf:/home/podman/.config/containers/containers.conf.d/50-forge-job.conf:ro
      - podman-store:/home/podman/.local/share/containers
      # The job work directory, on disk: a Rust test build needs about 6.2 GB
      # (ops/ci-image/README.md), which a RAM tmpfs inside mem_limit cannot hold.
      # The quota is the runner's own work_dir_max_bytes (config.example.toml).
      - runner-work:/var/lib/forge-runner
    # Bounds the runner and every job container together (job memory 4g + a
    # service such as Postgres + the runner itself).
    mem_limit: 8g
    pids_limit: 4096
    stop_grace_period: 120s
    restart: unless-stopped

networks:
  runner:

volumes:
  registry-data:
  podman-store:
  runner-work:
