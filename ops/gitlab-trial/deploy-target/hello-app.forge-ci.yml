# .forge-ci.yml of the demo project on the PFS trial server (README
# 「自前の CI/CD」): copy it as `.forge-ci.yml` next to public/ and tests/ of
# ops/test-env/m4-hello-app. Same jobs as the test-environment one; the
# image comes from Docker Hub (the trial runner's image_registries) and
# the tag trial-demo (only this file uses it) selects the trial runner, whose
# only tag it is. build -> test here; the deploy to dev
# is forge's own (environment dev, auto_deploy_ref refs/heads/main): CI
# jobs have no network and never deploy.
version: 1
stages: [build, test]
jobs:
  build:
    stage: build
    image: docker.io/library/alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    timeout: 5m
    tags: [trial-demo]
    script:
      - mkdir -p dist
      - cp -R public/. dist/
      - ls -la dist
    artifacts:
      paths: [dist]
  test:
    stage: test
    needs: [build]
    image: docker.io/library/alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    timeout: 5m
    tags: [trial-demo]
    script:
      - sh tests/check.sh dist
