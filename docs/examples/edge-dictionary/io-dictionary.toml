# I/O の意味の辞書（全社に 1 つ: edge-fw/io-dictionary）。合成の例。
#
# 規則（scripts/check-append-only.py が CI で確かめる。手引き docs/guides/edge-release-pattern.md）:
# - id は永久。消さない・変えない・使い回さない。新しい id は今の最大 + 1。
# - name・type・unit・description は一度入れたら変えない（誤字も直さない: 新しい id を足して古い方に deprecated）。
# - 許されるのは [[signal]] の追加と、deprecated を付けることだけ。deprecated は付けたら外せない。
# - 中身を変えたら dictionary_version を 1 つ上げる。足した・deprecated にした行の since はその版。
# - 設備の文脈（「金型の温度」など）はここに書かない。設定のツールのラベル。

dictionary_version = 3

[[signal]]
id = 1
name = "temperature"
type = "analog"
unit = "Cel"
description = "温度（換算の後の値）"
since = 1

[[signal]]
id = 2
name = "button.pressed"
type = "digital"
description = "押しボタンが押されている"
since = 1

[[signal]]
id = 3
name = "pressure"
type = "analog"
unit = "kPa"
description = "圧力（ゲージ圧と絶対圧の区別なし）"
since = 1
deprecated = { since = 3, replaced_by = 5 }

[[signal]]
id = 4
name = "workpiece.count"
type = "counter"
unit = "1"
description = "加工した個数"
since = 2

[[signal]]
id = 5
name = "pressure.gauge"
type = "analog"
unit = "kPa"
description = "ゲージ圧（大気圧との差）"
since = 3
