# The agent tools of GitStation: the one list (plan 01 §3.11 "CLI と MCP は同じ
# API の 2 つの入り口", plan 06 §4.5, ADR-0023 Amendment 2026-11-10).
#
# A contract file like openapi.json. `gstn mcp` (crates/forge-client/src/mcp.rs)
# embeds it and builds `tools/list` and every request from it; the server's
# planned `/api/v1/ai-tools` (plan 02 §6) can embed the same file without a
# crate dependency.
#
# Each [[tool]] is one REST API v1 call with the caller's own token:
#   name, description   what the agent sees
#   gstn                the `gstn` command it mirrors (a leaf of `gstn help`)
#   method, path        the route, verbatim as in docs/api/openapi.json
#   read_only           false: a write (MCP annotations readOnlyHint=false)
#   destructive         writes only: it changes or ends what exists (destructiveHint)
#   idempotent          writes only: the same call again changes nothing more
#   params              in order: the query string keeps this order
#     name              the argument's name
#     in                path | query | body
#     wire              the name on the wire when it differs; always stated for
#                       body ("position.line": nested in the JSON body)
#     type              integer | string | boolean
#     required          default false
#     minimum, maximum  integers (minimum defaults to 1)
#     max_bytes         strings (default 256)
#     format            strings: text (one line, the default), markdown (lines),
#                       doc_id, lang, oid (40 / 64 hex digits)
#     allow_empty       strings: "" is a value (default false)
#     enum              strings: the only values
#   at_least_one        one of these arguments is required
#   together            each group: all of them or none
#   requires            [a, b]: a only with b
#
# Every `gstn` leaf command is a tool's `gstn`, or listed below as
# [[excluded]] (kept for people), [[not_api]] (no REST call of its own) or
# [[deferred]] (an agent may, not a tool yet) with a reason. The parity gate
# (crates/forge-client/src/agent_tools_tests.rs) fails on a command without a
# decision, a route missing from openapi.json, a tool on a command that calls
# no route of its own (mcp, api, help, schema), or a tool on what is kept for
# people: a people_only action (docs/authz/routes.generated.json), a route
# of an excluded command, or the action of an excluded command's write.

version = 1

# ── read: context, specification, documents (M3 X5, plan 13 stage 3) ──

[[tool]]
name = "get_work_item_context"
gstn = "context work-item"
read_only = true
method = "GET"
path = "/api/v1/projects/{id}/context/work-item"
description = "A kanflow work item (PBI-<n>) in one project: the merge requests linked to it and the @req tests of its acceptance criteria (PBI-<n>/AC-<m>) on the default branch, each with its source (project, commit, path, line)."
params = [
  { name = "project_id", in = "path", wire = "id", type = "integer", required = true, description = "The GitStation project id (gstn project list)." },
  { name = "ref", in = "query", type = "string", required = true, description = "The work item, canonical PBI-<n>." },
]

[[tool]]
name = "get_requirement"
gstn = "context requirement"
read_only = true
method = "GET"
path = "/api/v1/projects/{id}/context/requirement"
description = "One requirement of a project's specification: its text and document, the @req tests naming it, and its state in the newest version tags, each with its source."
params = [
  { name = "project_id", in = "path", wire = "id", type = "integer", required = true, description = "The GitStation project id (gstn project list)." },
  { name = "id", in = "query", type = "string", required = true, description = "The requirement id (ZEVA-CFG-012)." },
  { name = "ref", in = "query", type = "string", description = "A commit id, a branch or a tag (default: the default branch)." },
]

[[tool]]
name = "search_requirements"
gstn = "spec requirements"
read_only = true
method = "GET"
path = "/api/v1/projects/{id}/specs/requirements"
description = "Search a project's own specification: requirements whose id or text contains the query (case-insensitive), with path and line."
params = [
  { name = "project_id", in = "path", wire = "id", type = "integer", required = true, description = "The GitStation project id (gstn project list)." },
  { name = "ref", in = "query", type = "string", description = "A commit id, a branch or a tag (default: the default branch)." },
  { name = "query", in = "query", wire = "q", type = "string", description = "Text the id or the body contains; omit for all." },
  { name = "limit", in = "query", type = "integer", maximum = 500, description = "At most this many requirements, 1..=500 (default 100)." },
]

[[tool]]
name = "get_trace_matrix"
gstn = "spec trace"
read_only = true
method = "GET"
path = "/api/v1/projects/{id}/specs/trace"
description = "Each requirement of a project (its own specification and every pinned reference you may read) with the @req tests naming it: tested or untested."
params = [
  { name = "project_id", in = "path", wire = "id", type = "integer", required = true, description = "The GitStation project id (gstn project list)." },
  { name = "ref", in = "query", type = "string", description = "A commit id, a branch or a tag (default: the default branch)." },
]

[[tool]]
name = "get_merge_request_context"
gstn = "context merge-request"
read_only = true
method = "GET"
path = "/api/v1/projects/{id}/merge-requests/{iid}/context"
description = "A merge request's review context: its changed files, the requirements it adds or changes, its work items and the check runs on its head, each with its source."
params = [
  { name = "project_id", in = "path", wire = "id", type = "integer", required = true, description = "The GitStation project id (gstn project list)." },
  { name = "iid", in = "path", type = "integer", required = true, description = "The merge request's number in the project." },
]

[[tool]]
name = "list_documents"
gstn = "doc list"
read_only = true
method = "GET"
path = "/api/v1/projects/{id}/documents"
description = "A project's documents (id, title, type, path, classification, translations), by id, paged with next_after. Confidential documents are left out (`withheld` counts them when unfiltered)."
params = [
  { name = "project_id", in = "path", wire = "id", type = "integer", required = true, description = "The GitStation project id (gstn project list)." },
  { name = "ref", in = "query", type = "string", description = "A commit id, a branch or a tag (default: the default branch)." },
  { name = "doctype", in = "query", type = "string", description = "Only documents of this type (safety.risk-assessment)." },
  { name = "limit", in = "query", type = "integer", maximum = 500, description = "At most this many, 1..=500 (default 100)." },
  { name = "after", in = "query", type = "string", description = "The previous answer's next_after: the next page." },
]

[[tool]]
name = "get_document"
gstn = "doc show"
read_only = true
method = "GET"
path = "/api/v1/projects/{id}/documents/{doc_id}"
description = "One document: its front matter, its sections of text and blocks, and every [[...]] reference resolved (a more confidential target is its id only). Cite its id and path."
params = [
  { name = "project_id", in = "path", wire = "id", type = "integer", required = true, description = "The GitStation project id (gstn project list)." },
  { name = "id", in = "path", wire = "doc_id", type = "string", format = "doc_id", required = true, description = "The document id (RA-2026-014): ASCII letters, digits, '.', '_', '-', at most 128 bytes." },
  { name = "ref", in = "query", type = "string", description = "A commit id, a branch or a tag (default: the default branch)." },
  { name = "lang", in = "query", type = "string", format = "lang", description = "A translation's language (en, pt-BR); default: the original." },
]

[[tool]]
name = "get_document_block"
gstn = "doc show"
read_only = true
method = "GET"
path = "/api/v1/projects/{id}/documents/{doc_id}/blocks/{block_id}"
description = "One block of a document (a hazard, a requirement, a step) alone, with its section and the references inside it."
params = [
  { name = "project_id", in = "path", wire = "id", type = "integer", required = true, description = "The GitStation project id (gstn project list)." },
  { name = "id", in = "path", wire = "doc_id", type = "string", format = "doc_id", required = true, description = "The document id (RA-2026-014): ASCII letters, digits, '.', '_', '-', at most 128 bytes." },
  { name = "block", in = "path", wire = "block_id", type = "string", format = "doc_id", required = true, description = "The block id (H-01), as for the document id." },
  { name = "ref", in = "query", type = "string", description = "A commit id, a branch or a tag (default: the default branch)." },
  { name = "lang", in = "query", type = "string", format = "lang", description = "A translation's language (en, pt-BR); default: the original." },
]

[[tool]]
name = "get_document_referenced_by"
gstn = "doc refs"
read_only = true
method = "GET"
path = "/api/v1/projects/{id}/documents/{doc_id}/referenced-by"
description = "The documents (and translations) that refer to a document, or to one block of it, with the lines; paged with next_after. A more confidential referrer is its id only."
params = [
  { name = "project_id", in = "path", wire = "id", type = "integer", required = true, description = "The GitStation project id (gstn project list)." },
  { name = "id", in = "path", wire = "doc_id", type = "string", format = "doc_id", required = true, description = "The document id (RA-2026-014): ASCII letters, digits, '.', '_', '-', at most 128 bytes." },
  { name = "ref", in = "query", type = "string", description = "A commit id, a branch or a tag (default: the default branch)." },
  { name = "block", in = "query", type = "string", format = "doc_id", description = "Only the references to this block (H-01)." },
  { name = "limit", in = "query", type = "integer", maximum = 500, description = "At most this many, 1..=500 (default 100)." },
  { name = "after", in = "query", type = "string", description = "The previous answer's next_after: the next page." },
]

# ── read: merge requests, conflicts, checks, pipelines ──

[[tool]]
name = "list_merge_requests"
gstn = "mr list"
read_only = true
method = "GET"
path = "/api/v1/projects/{id}/merge-requests"
description = "A project's merge requests, newest first (open by default): iid, state, draft, branches, title, head. Paged with next_before."
params = [
  { name = "project_id", in = "path", wire = "id", type = "integer", required = true, description = "The GitStation project id (gstn project list)." },
  { name = "state", in = "query", type = "string", enum = ["open", "closed", "merged", "all"], description = "Only merge requests in this state (default open)." },
  { name = "limit", in = "query", type = "integer", maximum = 100, description = "At most this many, 1..=100 (default 20)." },
  { name = "before", in = "query", type = "integer", description = "The previous answer's next_before: merge requests with a smaller iid." },
]

[[tool]]
name = "get_merge_request"
gstn = "mr view"
read_only = true
method = "GET"
path = "/api/v1/projects/{id}/merge-requests/{iid}"
description = "One merge request: title, description, state, draft, source and target branch, author and head commit."
params = [
  { name = "project_id", in = "path", wire = "id", type = "integer", required = true, description = "The GitStation project id (gstn project list)." },
  { name = "iid", in = "path", type = "integer", required = true, description = "The merge request's number in the project." },
]

[[tool]]
name = "list_merge_request_versions"
gstn = "mr versions"
read_only = true
method = "GET"
path = "/api/v1/projects/{id}/merge-requests/{iid}/versions"
description = "A merge request's versions (one per pushed head), oldest first, with head and merge base: the version numbers the diff and inline comments name."
params = [
  { name = "project_id", in = "path", wire = "id", type = "integer", required = true, description = "The GitStation project id (gstn project list)." },
  { name = "iid", in = "path", type = "integer", required = true, description = "The merge request's number in the project." },
]

[[tool]]
name = "get_merge_request_diff"
gstn = "mr diff"
read_only = true
method = "GET"
path = "/api/v1/projects/{id}/merge-requests/{iid}/versions/{version}/diff"
description = "One version's diff (merge base to head): its commits and changed files with patches. A file of a confidential document is left out (`diff.withheld`)."
params = [
  { name = "project_id", in = "path", wire = "id", type = "integer", required = true, description = "The GitStation project id (gstn project list)." },
  { name = "iid", in = "path", type = "integer", required = true, description = "The merge request's number in the project." },
  { name = "version", in = "path", type = "integer", required = true, description = "The version (list_merge_request_versions); the newest is the current head." },
]

[[tool]]
name = "compare_merge_request_versions"
gstn = "mr diff"
read_only = true
method = "GET"
path = "/api/v1/projects/{id}/merge-requests/{iid}/compare"
description = "What changed between two versions of a merge request (head to head): the commits and the changed files with patches."
params = [
  { name = "project_id", in = "path", wire = "id", type = "integer", required = true, description = "The GitStation project id (gstn project list)." },
  { name = "iid", in = "path", type = "integer", required = true, description = "The merge request's number in the project." },
  { name = "from", in = "query", type = "integer", required = true, description = "The earlier version." },
  { name = "to", in = "query", type = "integer", required = true, description = "The later version." },
]

[[tool]]
name = "get_merge_request_status"
gstn = "mr status"
read_only = true
method = "GET"
path = "/api/v1/projects/{id}/merge-requests/{iid}/status"
description = "Whether a merge request may merge now, and every reason it may not (blockers: approvals, checks, discussions, conflicts, draft), each with its code. Read this before asking a person to approve."
params = [
  { name = "project_id", in = "path", wire = "id", type = "integer", required = true, description = "The GitStation project id (gstn project list)." },
  { name = "iid", in = "path", type = "integer", required = true, description = "The merge request's number in the project." },
]

[[tool]]
name = "list_merge_request_discussions"
gstn = "mr discussions"
read_only = true
method = "GET"
path = "/api/v1/projects/{id}/merge-requests/{iid}/discussions"
description = "A merge request's discussions with their notes: general or on a line of a version's diff, resolved or not, and whether a later version changed the line (outdated)."
params = [
  { name = "project_id", in = "path", wire = "id", type = "integer", required = true, description = "The GitStation project id (gstn project list)." },
  { name = "iid", in = "path", type = "integer", required = true, description = "The merge request's number in the project." },
]

[[tool]]
name = "get_merge_request_conflicts"
gstn = "conflicts"
read_only = true
method = "GET"
path = "/api/v1/projects/{id}/merge-requests/{iid}/conflicts"
description = "A merge request's predicted conflicts with the other open merge requests on its target branch (drafts included), with the conflicting paths, as the last scan found them (never starts a scan)."
params = [
  { name = "project_id", in = "path", wire = "id", type = "integer", required = true, description = "The GitStation project id (gstn project list)." },
  { name = "iid", in = "path", type = "integer", required = true, description = "The merge request's number in the project." },
]

[[tool]]
name = "list_check_runs"
gstn = "checks list"
read_only = true
method = "GET"
path = "/api/v1/projects/{id}/commits/{sha}/checks"
description = "Every check run of a commit, by name: status, conclusion, summary, annotations (path and line) and who reported it."
params = [
  { name = "project_id", in = "path", wire = "id", type = "integer", required = true, description = "The GitStation project id (gstn project list)." },
  { name = "sha", in = "path", type = "string", format = "oid", required = true, description = "The full commit id (40 or 64 hex digits), e.g. a merge request's head." },
]

[[tool]]
name = "list_pipelines"
gstn = "pipeline list"
read_only = true
method = "GET"
path = "/api/v1/projects/{id}/pipelines"
description = "A project's CI pipelines, newest first: id, status, source, branch, commit, and the error code of a failed one. Paged with next_before."
params = [
  { name = "project_id", in = "path", wire = "id", type = "integer", required = true, description = "The GitStation project id (gstn project list)." },
  { name = "ref", in = "query", type = "string", description = "Only this branch (main or refs/heads/main)." },
  { name = "before", in = "query", type = "integer", description = "The previous answer's next_before: pipelines with a smaller id." },
  { name = "limit", in = "query", type = "integer", maximum = 100, description = "At most this many, 1..=100 (default 20)." },
]

[[tool]]
name = "get_pipeline"
gstn = "pipeline show"
read_only = true
method = "GET"
path = "/api/v1/projects/{id}/pipelines/{pipeline_id}"
description = "One pipeline with its jobs (wave, stage, status, attempt); an invalid one with its problems (line, reason), a failed one with its error code."
params = [
  { name = "project_id", in = "path", wire = "id", type = "integer", required = true, description = "The GitStation project id (gstn project list)." },
  { name = "pipeline_id", in = "path", type = "integer", required = true, description = "The pipeline id (list_pipelines)." },
]

# M4 C5 (ADR-0029 decision 5): CI outputs. The server decides them on the
# marks: gstn mcp declares an agent audience on every request, so the log and
# the diagnosis of a pipeline whose commit, or whose repository's default
# branch, holds a confidential document are refused (FG-AUTH-0022) whatever
# the token — a tool result with isError, never the text.

[[tool]]
name = "get_job_log"
gstn = "pipeline log"
read_only = true
method = "GET"
path = "/api/v1/projects/{id}/pipelines/{pipeline_id}/jobs/{job_id}/log"
description = "One page of a CI job's log (secrets masked): text, next_from for the next page, complete when the attempt is over. Refused (FG-AUTH-0022) for a repository with a confidential document."
params = [
  { name = "project_id", in = "path", wire = "id", type = "integer", required = true, description = "The GitStation project id (gstn project list)." },
  { name = "pipeline_id", in = "path", type = "integer", required = true, description = "The pipeline id (list_pipelines)." },
  { name = "job_id", in = "path", type = "integer", required = true, description = "The job id (get_pipeline)." },
  { name = "attempt", in = "query", type = "integer", maximum = 100, description = "The job's attempt (default its current one)." },
  { name = "from", in = "query", type = "integer", minimum = 0, maximum = 4095, description = "The first chunk: the previous page's next_from (default 0)." },
]

[[tool]]
name = "get_pipeline_diagnosis"
gstn = "pipeline diagnosis"
read_only = true
method = "GET"
path = "/api/v1/projects/{id}/pipelines/{pipeline_id}/diagnosis"
description = "Why a pipeline failed, deterministically: each failed job's fingerprint, error codes, masked excerpt with its log lines, how often it failed, and known fixes (merge requests that fixed the same fingerprint). Refused (FG-AUTH-0022) for a repository with a confidential document."
params = [
  { name = "project_id", in = "path", wire = "id", type = "integer", required = true, description = "The GitStation project id (gstn project list)." },
  { name = "pipeline_id", in = "path", type = "integer", required = true, description = "The pipeline id (list_pipelines)." },
]

# ── write: merge requests and pipelines (Developers; an is_agent token may) ──

[[tool]]
name = "create_merge_request"
gstn = "mr create"
read_only = false
destructive = false
idempotent = false
method = "POST"
path = "/api/v1/projects/{id}/merge-requests"
description = "Open a merge request from an existing branch into another. Push the branch with git first. A person approves it; an agent never merges."
params = [
  { name = "project_id", in = "path", wire = "id", type = "integer", required = true, description = "The GitStation project id (gstn project list)." },
  { name = "source_branch", in = "body", wire = "source_branch", type = "string", required = true, description = "The source branch (feature/x or refs/heads/feature/x); it must exist." },
  { name = "target_branch", in = "body", wire = "target_branch", type = "string", required = true, description = "The target branch, another than the source; it must exist." },
  { name = "title", in = "body", wire = "title", type = "string", max_bytes = 1024, required = true, description = "The title, 1..=255 characters." },
  { name = "description", in = "body", wire = "description", type = "string", format = "markdown", max_bytes = 32768, allow_empty = true, description = "The description (Markdown)." },
  { name = "draft", in = "body", wire = "draft", type = "boolean", description = "Open it as a draft (default false)." },
]

[[tool]]
name = "update_merge_request"
gstn = "mr edit"
read_only = false
destructive = true
idempotent = true
method = "PATCH"
path = "/api/v1/projects/{id}/merge-requests/{iid}"
description = "Change an open merge request's title, description or draft flag; what is not given stays."
at_least_one = ["title", "description", "draft"]
params = [
  { name = "project_id", in = "path", wire = "id", type = "integer", required = true, description = "The GitStation project id (gstn project list)." },
  { name = "iid", in = "path", type = "integer", required = true, description = "The merge request's number in the project." },
  { name = "title", in = "body", wire = "title", type = "string", max_bytes = 1024, description = "The new title, 1..=255 characters." },
  { name = "description", in = "body", wire = "description", type = "string", format = "markdown", max_bytes = 32768, allow_empty = true, description = "The new description (Markdown); replaces the old one." },
  { name = "draft", in = "body", wire = "draft", type = "boolean", description = "true: a draft; false: ready for review." },
]

[[tool]]
name = "close_merge_request"
gstn = "mr close"
read_only = false
destructive = true
idempotent = true
method = "POST"
path = "/api/v1/projects/{id}/merge-requests/{iid}/close"
description = "Close an open merge request without merging it (reopen_merge_request opens it again)."
params = [
  { name = "project_id", in = "path", wire = "id", type = "integer", required = true, description = "The GitStation project id (gstn project list)." },
  { name = "iid", in = "path", type = "integer", required = true, description = "The merge request's number in the project." },
]

[[tool]]
name = "reopen_merge_request"
gstn = "mr reopen"
read_only = false
destructive = false
idempotent = true
method = "POST"
path = "/api/v1/projects/{id}/merge-requests/{iid}/reopen"
description = "Reopen a closed merge request (its branches must still exist)."
params = [
  { name = "project_id", in = "path", wire = "id", type = "integer", required = true, description = "The GitStation project id (gstn project list)." },
  { name = "iid", in = "path", type = "integer", required = true, description = "The merge request's number in the project." },
]

[[tool]]
name = "comment_on_merge_request"
gstn = "mr comment"
read_only = false
destructive = false
idempotent = false
method = "POST"
path = "/api/v1/projects/{id}/merge-requests/{iid}/discussions"
description = "Start a discussion on a merge request: general, or on one line of a version's diff (version, path and line together)."
together = [["version", "path", "line"]]
requires = [["side", "version"]]
params = [
  { name = "project_id", in = "path", wire = "id", type = "integer", required = true, description = "The GitStation project id (gstn project list)." },
  { name = "iid", in = "path", type = "integer", required = true, description = "The merge request's number in the project." },
  { name = "body", in = "body", wire = "body", type = "string", format = "markdown", max_bytes = 32768, required = true, description = "The note (plain text / Markdown)." },
  { name = "version", in = "body", wire = "position.version", type = "integer", description = "An inline discussion: the version whose diff the line is in." },
  { name = "path", in = "body", wire = "position.path", type = "string", max_bytes = 4096, description = "An inline discussion: the file's path on that side of the diff." },
  { name = "line", in = "body", wire = "position.line", type = "integer", description = "An inline discussion: the line, inside a hunk of that file." },
  { name = "side", in = "body", wire = "position.side", type = "string", enum = ["old", "new"], description = "An inline discussion: old (the merge base) or new (the head, default)." },
]

[[tool]]
name = "reply_to_discussion"
gstn = "mr comment"
read_only = false
destructive = false
idempotent = false
method = "POST"
path = "/api/v1/projects/{id}/merge-requests/{iid}/discussions/{discussion_id}/notes"
description = "Reply to a discussion of a merge request. Resolving a discussion is kept for people."
params = [
  { name = "project_id", in = "path", wire = "id", type = "integer", required = true, description = "The GitStation project id (gstn project list)." },
  { name = "iid", in = "path", type = "integer", required = true, description = "The merge request's number in the project." },
  { name = "discussion_id", in = "path", type = "integer", required = true, description = "The discussion (list_merge_request_discussions)." },
  { name = "body", in = "body", wire = "body", type = "string", format = "markdown", max_bytes = 32768, required = true, description = "The note (plain text / Markdown)." },
]

[[tool]]
name = "run_pipeline"
gstn = "pipeline run"
read_only = false
destructive = false
idempotent = false
method = "POST"
path = "/api/v1/projects/{id}/pipelines"
description = "Run a pipeline by hand on a branch's tip (never as protected: a job with secrets makes it invalid)."
params = [
  { name = "project_id", in = "path", wire = "id", type = "integer", required = true, description = "The GitStation project id (gstn project list)." },
  { name = "ref", in = "body", wire = "ref", type = "string", required = true, description = "The branch (main or refs/heads/main)." },
]

[[tool]]
name = "cancel_pipeline"
gstn = "pipeline cancel"
read_only = false
destructive = true
idempotent = true
method = "POST"
path = "/api/v1/projects/{id}/pipelines/{pipeline_id}/cancel"
description = "Cancel a pending or running pipeline: its jobs that have not finished stop."
params = [
  { name = "project_id", in = "path", wire = "id", type = "integer", required = true, description = "The GitStation project id (gstn project list)." },
  { name = "pipeline_id", in = "path", type = "integer", required = true, description = "The pipeline id (list_pipelines)." },
]

[[tool]]
name = "retry_pipeline"
gstn = "pipeline retry"
read_only = false
destructive = false
idempotent = false
method = "POST"
path = "/api/v1/projects/{id}/pipelines/{pipeline_id}/retry"
description = "Retry a failed or cancelled pipeline: its failed and cancelled jobs run again."
params = [
  { name = "project_id", in = "path", wire = "id", type = "integer", required = true, description = "The GitStation project id (gstn project list)." },
  { name = "pipeline_id", in = "path", type = "integer", required = true, description = "The pipeline id (list_pipelines)." },
]

