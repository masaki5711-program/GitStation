[package]
name = "forge-cli"
description = "the `forge` binary: server entry point and operator commands (explain, errors list; later serve, doctor, diag)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
forge-errors.workspace = true
forge-core.workspace = true
forge-db.workspace = true
serde_json.workspace = true
clap = { workspace = true, features = ["env"] }
forge-git.workspace = true
forge-web.workspace = true
forge-hosting.workspace = true
# M3 R1a: merge requests (ADR-0024 §11).
forge-review.workspace = true
forge-checks.workspace = true
# M3 I1c: the integrations' event feed (serve).
forge-integ.workspace = true
# M3 N1: the notify subscriber and the mail job (the worker's notification lane).
forge-notify.workspace = true
forge-oidc.workspace = true
httpdate.workspace = true
tokio.workspace = true
tracing.workspace = true
# M3 O1: forge backup / restore (the encrypted archive, its checksum).
aes-gcm.workspace = true
getrandom.workspace = true
sha2.workspace = true
hmac.workspace = true
subtle.workspace = true
serde.workspace = true

[target.'cfg(unix)'.dependencies]
# M3 O1: the backup directory must be owned by the account that runs forge.
rustix.workspace = true

[features]
# Serve the built web UI (ADR-0022 §2): `npm run build` in web/ first; the
# release build uses it. Without it the shell is the placeholder (doctor:
# `warn web.ui placeholder`).
embed-ui = ["forge-web/embed-ui"]

[dev-dependencies]
# M3 O2: the mirror lane's tests push to a local bare repository.
forge-git = { workspace = true, features = ["test-support"] }
forge-oidc = { workspace = true, features = ["test-support"] }
forge-db = { workspace = true, features = ["test-support"] }
# The worker test reads the mail a fake relay received.
forge-notify = { workspace = true, features = ["test-support"] }
# tests/smart_http_e2e.rs: gzip request bodies.
flate2.workspace = true
tempfile.workspace = true
# The worker loop tests: paused time and captured JSON logs.
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
# M3 R1b: the worker test opens a merge request with a real proof.
forge-auth.workspace = true

[lints]
workspace = true
