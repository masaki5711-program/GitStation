[package]
name = "forge-cli"
description = "the `forge` binary: server entry point and operator commands (explain, errors list; later serve, doctor, diag)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
forge-errors.workspace = true
forge-core.workspace = true
forge-db.workspace = true
serde_json.workspace = true
clap = { workspace = true, features = ["env"] }
forge-git.workspace = true
forge-web.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
forge-db = { workspace = true, features = ["test-support"] }
# tests/smart_http_e2e.rs: gzip request bodies.
flate2.workspace = true
tempfile.workspace = true
# The worker loop tests: paused time and captured JSON logs.
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
