[package]
name = "forge-integ"
description = "forge integrations: the event feed an integration (kanflow) reads, its cursors and its decision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A feature crate (plan 11 §3.7, §5 I1; ADR-0016 §7): forge-web / forge-cli
# → forge-integ → forge-auth / forge-db → forge-core → forge-errors. It
# runs no SQL of its own (the SQL is `forge_db::feed`) and never depends on
# another feature crate: it reads only domain events (the outbox).
[dependencies]
forge-auth.workspace = true
forge-core.workspace = true
forge-db.workspace = true
forge-errors.workspace = true
# The events' stored `data` (jsonb), passed through.
serde_json.workspace = true
tracing.workspace = true
# ── M3 I2: webhooks (ADR-0016 §8) ──
# The delivery's HTTP client: rustls with only webhook.ca_file's roots, no
# proxy, no redirect (the same 0.12 as forge-oidc). MIT OR Apache-2.0.
reqwest.workspace = true
# The name's resolution at connect time and the attempt's deadline.
tokio.workspace = true
uuid.workspace = true
# ── end M3 I2 ──

[dev-dependencies]
forge-core = { workspace = true, features = ["test-support"] }
forge-db = { workspace = true, features = ["test-support"] }
sqlx.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
