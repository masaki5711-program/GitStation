[package]
name = "forge-marketplace"
description = "forge agent marketplace: publish agent part versions from tags (read with git, linted, scanned, signed), promote and revoke them, and read the catalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A feature crate (plan 16 §2.3 A5, ADR-0032 Amendment A5, contract 9):
# forge-web / forge-cli -> forge-marketplace -> forge-auth / forge-git /
# forge-db -> forge-core -> forge-agent -> forge-errors. It runs no SQL of
# its own (`forge_db::agent_marketplace`), never depends on another
# feature crate, and is the one place that signs agent parts
# (clippy.toml `disallowed-methods`).
[dependencies]
forge-agent.workspace = true
forge-auth.workspace = true
forge-core.workspace = true
forge-db.workspace = true
forge-errors.workspace = true
forge-git.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
forge-db = { workspace = true, features = ["test-support"] }
tokio.workspace = true
sqlx.workspace = true
tempfile.workspace = true
uuid.workspace = true

[lints]
workspace = true
