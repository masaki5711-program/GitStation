# forge error registry — the single source of truth for every FG error code.
#
# Contract: .claude/rules/forge-error-contract.md (agent model) — procedure:
# error-contract skill. Generated from this file:
#   - the `ErrorCode` enum (build.rs → OUT_DIR/generated.rs)
#   - Git/docs/errors/<CODE>.md   (cargo run -p forge-errors --bin gen-catalog)
# Never edit generated output by hand. Never reuse or renumber a code; retire it
# with `retired = true`.
#
# Fields: code, name (PascalCase enum variant), http_status, severity
# (alert|warn|info), user_message_ja, user_message_en, user_message_id (Indonesian), cause, diagnosis, fix,
# test (a test that produces the code), runbook (required when severity = alert).

[[error]]
code = "FG-SYS-0001"
name = "Internal"
http_status = 500
severity = "alert"
user_message_ja = "内部エラーが発生しました。問い合わせ番号を添えて管理者に連絡してください。"
user_message_en = "An internal error occurred. Contact the administrator with the request ID."
user_message_id = "Terjadi kesalahan internal. Hubungi administrator dengan menyertakan ID permintaan."
cause = "A failure that no more specific code describes reached a boundary. Every occurrence is a gap in the registry."
diagnosis = "Filter logs by error_code=FG-SYS-0001 and the reported request_id; read the `context` and `source` fields and the span chain to find the origin crate and operation. From the list routes: `reason=lists_unconfigured` (the server was built without the page loaders and cursor keys — `forge serve` always sets them, so this is a test or embedding error), `page_out_of_order` (the page loader returned ids not strictly ascending after the cursor: a loader bug, the page was refused rather than repeat or skip rows), `page_size_out_of_range` (a caller asked forge_db::lists for 0 or more than 10000 rows, or forge_db::users::admin_page for 0 or more than 101). M2 MR6: `purge_batch_out_of_range` (sessions::purge_expired asked for 0 or more than 500 rows), `purge_too_many_owners` (a purge batch touched more owners than one change may audit: unreachable with the batch bound), `session_public_id_unchecked` (sessions::owner got a value that is not 16 lowercase hex: the route must validate first), `resolve_viewer_missing` / `search_viewer_missing` / `token_route_without_user` / `session_route_without_user` (a route that needs a signed-in caller ran without one: a registry bug), `caller_limiter_poisoned` (with `route`: a panic while the rate-limit table was held; the table was emptied and counting goes on), `http_disable_past_guard` (users::disable reported a forced disable to the HTTP route, which never forces). M3 R1a merge requests (crate / operation in brackets): `review_unconfigured` (forge-web merge request routes: the server was built without `AppState::with_review`; `forge serve` always sets it), `proof_action_mismatch` / `proof_shape_mismatch` / `proof_without_user` (forge-review: a handler passed a proof for another action, a create's proof without iid to a command on a stored merge request or the reverse, or a proof without a caller), `proof_without_iid` / `merge_request_without_project_row` (forge-web merge request handlers: a proof or loaded row missing what its loader always sets), `loaded_another_project` (forge-web merge request loader: the project loader answered another id), `audit_only_event` / `empty_merge_request_change` (forge_db::review: a merge request change without its event or without any transition), `edit_not_open` / `close_merged` / `reopen_merged` (forge_db::review, with `merge_request_id` and `state`: a write the state machine forbids reached the command although authorize() allowed it), `stored_branch_invalid` / `stored_state_invalid` (forge_db::review, with `merge_request_id`: a row the table CHECKs should have refused), `written_merge_request_missing` (forge-web `GET …/merge-requests/{iid}`: the row went away between the decision and the answer)."
fix = "Fix the underlying failure, then register a specific code for it so this catch-all stops appearing (feedback action)."
runbook = "internal-error"
test = "internal_error_is_alerting_500"

[[error]]
code = "FG-SYS-0002"
name = "ConfigInvalid"
http_status = 500
severity = "alert"
user_message_ja = "サーバーの設定に問題があります。管理者に連絡してください。"
user_message_en = "The server configuration is invalid. Contact the administrator."
user_message_id = "Konfigurasi server tidak valid. Hubungi administrator."
cause = "The configuration file or environment is missing a required value or contains an invalid one; detected at startup or on reload."
diagnosis = "The log event carries `config_key` and `reason`. `config_key` is a key such as `database.url` (its environment variable is derived: `FORGE_DATABASE_URL`), `config_file` (then see `path`), or an unknown `FORGE_*` variable (a typo). Layers, later wins: config file (`--config` / `FORGE_CONFIG`) → environment → command-line flags. `reason` is one of missing, invalid, empty, zero, above_max (min_connections above write_max_connections or read_max_connections; server.max_connections_per_peer above server.max_connections), above_keep_alive_max (server.header_read_timeout_ms or server.body_read_timeout_ms above server.keep_alive_max_ms), below_git_idle_timeout (server.read_idle_timeout_ms below git.http.idle_timeout_ms), duplicate (a repeated database.privileged_members entry), unknown_key, unknown_env, renamed (see `renamed_to`; e.g. FORGE_DATABASE_MAX_CONNECTIONS → FORGE_DATABASE_WRITE_MAX_CONNECTIONS), not_unicode, unreadable, parse (see `line` / `column`; the offending text is not logged), password_in_url (use `database.password_file`), query_in_url (the URL is only postgres://user@host[:port]/dbname — TLS, timeouts and options come from the configuration), libpq_env (a PG* variable such as PGPASSWORD or PGSSLROOTCERT is set; `config_key` names it — unset it), unverified_remote (tls_mode require / disable for a non-loopback host without database.tls_allow_unverified = true), not_absolute, insecure_permissions (Unix: the password file must not be readable by group or others; see `mode`), wrong_role (the database login is not the expected role — see `role_check`: for database.url not_member (not a member of forge_ro), superuser (a superuser or BYPASSRLS login), privileged (it can reach forge_owner / forge_seq / forge_purge), role_not_applied / not_read_only (the read-pool session settings did not take effect); for database.migrate_url not_member (not a member of forge_owner), owner_missing (the bootstrap has not run), superuser, not_owner), not_for_this_command (forge serve was given database.migrate_password_file or database.maint_password_file — the server process must not hold those credentials), connection_budget (`needed` connections of the configured pools exceed 80 % of the server's `usable` slots; `server_slots` when none are left). Secret values are never logged."
fix = "Correct the value named by `config_key` in the configuration file or environment and restart. Never commit secrets to the config sample."
runbook = "config-invalid"
test = "config_invalid_is_alerting_500"

[[error]]
code = "FG-SYS-0003"
name = "UnknownErrorCode"
http_status = 400
severity = "info"
user_message_ja = "指定されたエラーコードは登録されていません。"
user_message_en = "The given error code is not registered."
user_message_id = "Kode kesalahan yang diberikan tidak terdaftar."
cause = "`forge explain` was given a code that is not in the registry (typo or a code from a newer version)."
diagnosis = "Compare the code with `forge errors list`; check the forge version with `forge --version`."
fix = "Use a registered code, or upgrade the CLI to the server's version."
test = "explain_rejects_unknown_code"

# --- GIT: the git subprocess (forge-git) -------------------------------------

[[error]]
code = "FG-GIT-0001"
name = "GitUnavailable"
http_status = 500
severity = "alert"
user_message_ja = "Git の処理基盤が利用できません。管理者に連絡してください。"
user_message_en = "The Git backend is unavailable. Contact the administrator."
user_message_id = "Layanan Git tidak tersedia. Hubungi administrator."
cause = "The configured git binary cannot be executed, or its version is older than the minimum forge requires (2.38, for merge-tree --write-tree)."
diagnosis = "The log event carries `reason`: `spawn_failed` (with `git_bin`), `unparseable_version` (with the first characters of the output in `output`), `too_old` (with `found` and `minimum`), `process_tree_failed` (Windows: the Job Object for a stream could not be created or assigned; `source` has the OS error), or `hooks_dir` (Smart HTTP: `<git home>/empty-hooks` is not an empty real directory; `detail` = `not_empty`, `not_a_directory`, `insecure_permissions` (group- or world-writable; with `mode` — it is created 0700), `create_failed`, `unreadable` or `not_absolute_utf8`, with `path`). Run the configured git binary with `version` as the forge service user."
fix = "Install git >= 2.38 on the server (Debian 12 / RHEL 9 / Ubuntu 24.04 ship a new enough version) or point the configured git binary at it, then restart. For `hooks_dir`: find out who put files into `empty-hooks` (it must stay empty — no hook runs in Smart HTTP in M1 phase 9), remove them, and record it as an incident (runbook smart-http)."
runbook = "git-unavailable"
test = "version_below_2_38_is_git_unavailable"

[[error]]
code = "FG-GIT-0002"
name = "GitTimeout"
http_status = 504
severity = "warn"
user_message_ja = "Git の処理が時間内に終わりませんでした。しばらくしてから再度お試しください。"
user_message_en = "The Git operation did not finish in time. Try again later."
user_message_id = "Operasi Git tidak selesai tepat waktu. Coba lagi nanti."
cause = "A git subprocess exceeded its total timeout, or a streaming one (Smart HTTP) moved no byte in either direction for its idle timeout; it was killed (streams: with its process group / Job Object) and reaped."
diagnosis = "The log event carries `subcommand` and `kind`: `total` (with `timeout_ms`) or `idle` (streams, with `idle_timeout_ms`, `bytes_in`, `bytes_out`, `duration_ms`). `idle` with small byte counts means a stalled client or a proxy buffering the body; `total` for one repository points at its size or storage latency, across repositories at host load. `reap_failed` (`kill_failed`, `wait_failed`, `wait_timeout`, with `reap_error`) on this or any FG-GIT code means forge could not confirm the killed git was reaped: it may still be running and holding repository locks (`pgrep -af git`). `operation=confidential_paths` (with `timeout_ms`, `commit`): deciding which files of a commit an AI agent is not given (`forge_checks::confidential`: the specification index and the read of the documents, 20 s in all) did not finish — a very large tree or slow storage; the agent's read is refused, never served. `operation=want_check` (with `timeout_ms`, no `subcommand`): the reachability check of an upload-pack request's wants (ADR-0007 option (a)) did not finish within `git.http.want_check_timeout_ms` — many refs or, for non-commit wants, many objects. `operation=fast_forward_check` (M1 phase 9 MR4): telling a fast-forward from a force push for a push's protected branches (or, after the push, for its record) took over 10 s. `check=reachability` (with `subcommand=rev-list`, `repo_id`; event `forge.git.browse.reach_undecided`): the browse API's check that a commit named by id is reachable from a branch or tag (M3 P6) did not finish within its own limit (5 s, `BrowseLimits::reach_timeout`, never past the operation's 10 s) — a very large history without a commit-graph. It is never treated as reachable; the user is answered FG-REPO-0023 `ref_not_found` (with `reach_error=FG-GIT-0002`), like a missing id, so the status does not reveal that the commit exists. See runbook smart-http for streams."
fix = "Check storage latency and host load; for a legitimately large repository raise the git total timeout (`GitConfig::timeout_total`, streams `GitConfig::stream_timeout_total`) for that operation. For idle kills check the reverse proxy's request buffering and timeouts first."
test = "hung_git_is_killed_after_timeout"

[[error]]
code = "FG-GIT-0003"
name = "GitProcessFailed"
http_status = 500
severity = "alert"
user_message_ja = "Git の処理に失敗しました。問い合わせ番号を添えて管理者に連絡してください。"
user_message_en = "The Git operation failed. Contact the administrator with the request ID."
user_message_id = "Operasi Git gagal. Hubungi administrator dengan menyertakan ID permintaan."
cause = "A git subprocess exited with an unexpected non-zero status, or reading its output / waiting on it failed (spawn failure is FG-GIT-0001). Callers map expected non-zero exits, such as a missing ref, to specific codes; this code means the failure was not expected."
diagnosis = "The log event carries `subcommand`, `exit_code` and the first lines of git's stderr (`stderr`, URL credentials redacted); when reading or waiting failed there is no `exit_code` and the cause is in `source`. Reproduce with the same subcommand against the repository path printed by `forge admin repo-path`. receive-pack (M1 phase 9 MR4): `reason=report_unreadable` (with `detail`, `refs`) — git's answer to a push had no readable report-status; forge forwarded it unchanged and could not tell which refs changed, so nothing was recorded: compare the repository's refs with the push's commands (runbook smart-http). `phase=push_record_kinds` / `push_record_commits`: classifying or listing the commits of an applied push failed; the push was recorded as `force` / without commits (`total_commits_partial`). Browse history (M2 MR8): `reason=log_record_fields` / `log_record_oid` / `log_record_parent` (a `git log -z` record forge cannot read), `commit_record_missing` (`log -1` of a commit that exists returned no matching record), `diff_raw_meta` / `diff_raw_status` / `diff_raw_paths` / `diff_raw_unterminated` / `diff_path_not_utf8` (`diff-tree --raw -z` output that is not the documented shape), `diff_chunk_mismatch` (the patch has a different number of `diff --git` sections than the file list: forge never guesses which patch belongs to which file), `blame_line_without_header` / `blame_metadata_without_header` / `blame_author_time` (`blame --porcelain` output that is not the documented shape); each is a git version or repository problem, not user input — reproduce with the same subcommand (`git log -z`, `git diff-tree -r -M --raw -z`, `git blame --porcelain`) on the commit named by `commit`. merge-base (git 2.43): `reason=unreadable_history` (with `stderr`) when `--is-ancestor` answered 1 while printing an error such as `Could not read <id>` — a missing or corrupt commit, not a decided \"not an ancestor\"; the merge status shows the fast-forward check as unknown. Run `forge admin repo maintain <repo_id>` and read its fsck result."
fix = "Act on git's stderr: repository corruption (`git fsck`), permissions on the storage root, or disk space."
runbook = "git-process-failed"
test = "nonzero_exit_is_git_process_failed"

[[error]]
code = "FG-GIT-0004"
name = "GitBusy"
http_status = 503
severity = "warn"
user_message_ja = "Git の処理が混み合っています。しばらくしてから再度お試しください。"
user_message_en = "The Git backend is busy. Try again later."
user_message_id = "Layanan Git sedang sibuk. Coba lagi nanti."
cause = "Every git subprocess slot was in use for longer than the acquire timeout, or a principal already holds its maximum number of streams."
diagnosis = "Without `reason`: the captured pool (`GitConfig::max_concurrency`). `reason=streams`: the streaming pool for Smart HTTP (`max_streams`, default 16) — long clones hold slots. `reason=principal_streams`: one principal (user or client address) already has `max_per_principal` (default 4) streams open; refused at once. `reason=body_reads` / `principal_body_reads` (forge-web, M1 phase 9 MR3): every Smart HTTP request-body read slot is taken (sized like the stream pool: `git.http.max_streams` in total, waited for up to `acquire_timeout`, `wait_ms`) or this user already reads `git.http.max_streams_per_principal` bodies (`max`, refused at once) — many slow or stalled uploads at the same time. `reason=repo_browse` (with `repo_id`, `max_per_repo`; M2 MR7): one repository already runs `BrowseLimits::max_per_repo` (default 8) captured browse calls; refused at once — with `check=reachability` it was the check that a commit named by id is reachable (M3 P6): not treated as reachable, logged as `forge.git.browse.reach_undecided` and answered to the user as FG-REPO-0023 `ref_not_found` (`reach_error=FG-GIT-0004`). `reason=caller_reach_rate` (with `burst`, `refill_ms`) / `reason=caller_reach` (with `max`, `wait_ms`): one caller made more commit-id browse lookups than its token bucket allows (`BrowseLimits::reach_caller_burst` 60, one back per `reach_caller_refill` 250 ms) or already runs `reach_per_caller` (2) of them and none finished within `reach_caller_wait` (2 s) — counted before the id is looked at, so missing and existing ids are refused alike (M3 P6, ADR-0024 #37). Usually a script walking commit ids; the UI browses by branch name. Compare with the number of concurrent clones/pushes in the access log."
fix = "Raise the git concurrency limit if the host has CPU and IO headroom, or find the operations that hold slots for long."
test = "concurrency_limit_reports_git_busy"

[[error]]
code = "FG-GIT-0006"
name = "GitOutputTooLarge"
http_status = 500
severity = "warn"
user_message_ja = "Git の処理結果が大きすぎるため中断しました。"
user_message_en = "The Git operation produced too much output and was stopped."
user_message_id = "Operasi Git menghasilkan keluaran terlalu besar dan dihentikan."
cause = "A captured (non-streaming) git invocation wrote more stdout than `GitConfig::max_output_bytes`; the child was killed. Large data (blobs, packs) must use the streaming path."
diagnosis = "The log event carries `subcommand` and `max_output_bytes`. Find the caller from the span chain: a captured call on unbounded data is a bug to fix with streaming or a limit."
fix = "Move the caller to streaming, or bound what it asks git for (e.g. `--max-count`)."
test = "output_over_cap_is_git_output_too_large"

[[error]]
code = "FG-GIT-0005"
name = "InvalidRefName"
http_status = 400
severity = "info"
user_message_ja = "ブランチ名またはタグ名が正しくありません。"
user_message_en = "The branch or tag name is not valid."
user_message_id = "Nama branch atau tag tidak valid."
cause = "A ref name failed git's check-ref-format rules (or forge's extra rule: no component may start with '-')."
diagnosis = "The log event carries `reason` (which rule failed); the rejected name is not logged in full."
fix = "Use a name that `git check-ref-format` accepts."
test = "invalid_ref_names_are_rejected"

# --- REPO: repositories and their storage --------------------------------------

[[error]]
code = "FG-REPO-0001"
name = "StoragePathRejected"
http_status = 500
severity = "alert"
user_message_ja = "リポジトリの保存先に問題があります。管理者に連絡してください。"
user_message_en = "There is a problem with repository storage. Contact the administrator."
user_message_id = "Terjadi masalah pada penyimpanan repositori. Hubungi administrator."
cause = "A repository path resolved outside the storage root or through a symlink, an entry under the root is not a directory, or the storage root itself is missing, a symlink, or not a directory."
diagnosis = "The log event carries `repo_id` (when a repository is involved) and `reason`: `outside_root`, `symlink`, `not_dir`, `root_missing`, `root_not_dir`, `root_symlink`. Check the entry with `forge admin repo-path <repo_id>` and inspect it with `ls -la` (a symlink under the root may be tampering)."
fix = "Remove or move the symlink or misplaced entry under the storage root (record it first), or fix the configured storage root; never point the root at a symlink."
runbook = "repo-storage"
test = "path_outside_root_is_rejected"

[[error]]
code = "FG-REPO-0002"
name = "StorageMissing"
http_status = 500
severity = "alert"
user_message_ja = "リポジトリのデータが見つかりません。問い合わせ番号を添えて管理者に連絡してください。"
user_message_en = "The repository data is missing. Contact the administrator with the request ID."
user_message_id = "Data repositori tidak ditemukan. Hubungi administrator dengan menyertakan ID permintaan."
cause = "The database knows the repository but its directory does not exist under the storage root."
diagnosis = "The log event carries `repo_id` and `path`. Check whether the storage volume is mounted and whether a purge job removed the directory early. `forge doctor` (check `repositories.storage`) reports the first ready repository whose directory is missing, with `missing` (how many of the checked ones) and `checked`; it checks at most 10 000 ready repositories per run and says so (`truncated`)."
fix = "Remount the storage volume or restore the repository from backup; then confirm with `forge admin repo-path <repo_id>` (state `exists`)."
runbook = "repo-storage"
test = "missing_repository_dir_is_storage_missing"

[[error]]
code = "FG-REPO-0003"
name = "StorageIoFailed"
http_status = 500
severity = "alert"
user_message_ja = "リポジトリの保存先の読み書きに失敗しました。管理者に連絡してください。"
user_message_en = "Reading or writing repository storage failed. Contact the administrator."
user_message_id = "Gagal membaca atau menulis penyimpanan repositori. Hubungi administrator."
cause = "A file-system operation on the storage root failed: permission denied, disk full, or an I/O error while creating or inspecting a repository directory."
diagnosis = "The log event carries `operation` (`inspect`, `create_shard`, `create_temp`, `rename`, `cleanup`), `repo_id` when known, and the OS error in `source`. `reason=deadline` (with `operation`): the provisioning job's deadline ran out during that file-system step (the job retries); `operation=doctor_storage reason=check_timeout`: `forge doctor` `repositories.storage` did not finish its walk over the ready repositories in 60 s (`checked`, `missing`, `other` say how far it got) — a slow or hung storage volume. Check free space (`df -h <root>`), ownership and mode of the storage root, and the kernel log for I/O errors."
fix = "Free disk space, restore ownership of the storage root to the forge service user, or replace the failing volume."
runbook = "repo-storage"
test = "unreadable_or_unwritable_storage_is_storage_io_failed"

[[error]]
code = "FG-REPO-0004"
name = "RepoPathOccupied"
http_status = 500
severity = "alert"
user_message_ja = "リポジトリを作成できませんでした。問い合わせ番号を添えて管理者に連絡してください。"
user_message_en = "The repository could not be created. Contact the administrator with the request ID."
user_message_id = "Repositori tidak dapat dibuat. Hubungi administrator dengan menyertakan ID permintaan."
cause = "Something already exists at the storage path of a repository being created. forge never initializes over existing data: an id reused after a database restore would otherwise expose another project's history."
diagnosis = "The log event carries `repo_id` and `path`. Compare the directory's content (`git -C <path> log -1`) with the database: a restored database whose id sequence went backwards is the usual cause."
fix = "Do not delete the directory blindly: identify which project it belongs to, move it aside, and advance the repository id sequence past the highest existing id."
runbook = "repo-storage"
test = "init_bare_refuses_an_existing_path"

[[error]]
code = "FG-REPO-0005"
name = "NotFound"
http_status = 404
severity = "info"
user_message_ja = "指定されたプロジェクトまたはリポジトリが見つかりません。"
user_message_en = "The project or repository was not found."
user_message_id = "Proyek atau repositori tidak ditemukan."
cause = "The resource does not exist, or the caller may not see it. Both cases return the same code so that private resources do not leak their existence (ADR-0010)."
diagnosis = "The log event carries `action` and `reason`: `not_visible` (the user is not a member of a private project — check memberships, not the URL), `tombstone_not_visible` (the same behind a moved path, `PathResolve`), `absent` / `tombstone_deleted` / `kind_mismatch` (from the web dispatcher and `GET /api/v1/namespaces/resolve`, with `route=`: nothing at the path, a deleted path, or a path of another kind than the route — `raw` on a group; `via=moved` and `tombstone_id=` when a moved path led to an invisible project; `tombstone_post` / `tombstone_push` when a moved path is used for a POST or a push, which are never redirected; a malformed `path` or `{id}` parameter is FG-WEB-0006 since M1 phase 8b, decided before any lookup), `foreign_token` (another user's token id), `doc_confidential` (the document API to an AI agent audience, plan 06 D-5: the document is `confidential` at the revision read or at the default tip, by id or by its file's path, or no default branch is born — answered as absent so an agent cannot tell; with `doc_id` and `path`, and the event `forge.context.withheld`), `document_not_found` / `translation_not_found` / `block_not_found` (the document API, plan 13 stage 3 — `block_not_found` with `block_id` from `…/blocks/{block_id}` or `…/referenced-by?block=`: no document with that `doc_id` — a `.md` naming a `doctype` and named `<id>.md` — or no `<id>.<lang>.md` translation at the revision read; with `incomplete=<bound>` when the read of the tree hit a bound of FG-DOC-0002, so the document may be in what was not read), `refused_code` (an act-as confirmation, `action=ActAsConfirmView` / `ActAsAssertionIssue`, ADR-0025 decision of 2026-11-10: every refusal of the confirmation answers this 404 so nobody learns whether an integration exists or what the binding state is; `refused_code` is the refusal's own code and the rest of the context is its own — e.g. `FG-AUTH-0003 reason=integration_disabled` / `act_as_unbound` / `required_role=`, `FG-AUTH-0002 reason=session_required` for a token, `FG-REVIEW-0013` for self-approval), or, from the lookup layer and the forge-db commands, `absent` with `resource` (`resource=user`: users::disable, a group command or a project create on a user id that does not exist; `resource=group`: a member change on an unknown group, or roles::load_group_roles on a group id without a namespace; `resource=namespace`: a group or project create under an unknown parent, or roles::load_namespace_roles on an unknown namespace id; `resource=project`: roles::load_project_roles or projects::access on a project id without a project namespace / project row)."
fix = "Check the path; add the user to the project or group if they should see it."
test = "invisible_private_project_is_not_found"

[[error]]
code = "FG-REPO-0006"
name = "PendingDeletion"
http_status = 410
severity = "info"
user_message_ja = "このプロジェクトは削除予定のため操作できません。"
user_message_en = "This project is scheduled for deletion and cannot be used."
user_message_id = "Proyek ini dijadwalkan untuk dihapus dan tidak dapat digunakan."
cause = "The project was deleted and is inside its grace period; only restore (or the purge job) may act on it."
diagnosis = "The log event carries `action`. The audit log has the `project.deleted` entry with who deleted it and when."
fix = "An Owner (or an administrator) restores the project before the grace period ends, if the deletion was a mistake."
test = "pending_deletion_blocks_everything_but_restore"

[[error]]
code = "FG-REPO-0007"
name = "NamespacePathInvalid"
http_status = 400
severity = "info"
user_message_ja = "この名前は使えません。小文字の英数字と . _ - だけを、1〜64 文字で指定してください。"
user_message_en = "This name cannot be used. Use 1 to 64 lowercase letters, digits, '.', '_' or '-'."
user_message_id = "Nama ini tidak dapat digunakan. Gunakan 1 sampai 64 huruf kecil, angka, '.', '_' atau '-'."
cause = "A user, group or project name (a namespace path segment) breaks the rules of ADR-0015: 1 to 64 characters matching ^[a-z0-9]([a-z0-9._-]{0,62}[a-z0-9])?$, no '..', not ending in .git / .atom / .wiki, and not a Windows device name (con, prn, aux, nul, com1-9, lpt1-9), also not when only the part before the first dot is one."
diagnosis = "The log event carries `reason` (empty, too_long, charset, edge, double_dot, reserved_suffix, device_name; for a nested group or a project also too_deep, more than 20 levels, and path_too_long, a full path over 255 characters) and `len`; the name itself is not logged. The same rules are a CHECK of forge.namespaces.segment, so a name the parser accepts is never refused by the database."
fix = "Choose a name that follows the rules."
test = "path_segment_rules_match_adr_0015"

[[error]]
code = "FG-REPO-0008"
name = "NamespacePathReserved"
http_status = 400
severity = "info"
user_message_ja = "この名前は予約されているため、トップレベルでは使えません。"
user_message_en = "This name is reserved and cannot be used at the top level."
user_message_id = "Nama ini dicadangkan dan tidak dapat digunakan di tingkat teratas."
cause = "A top-level name (a user name or a top-level group) is on the reserved list of ADR-0015 (forge_core RESERVED_TOP_LEVEL): it would shadow a route or a static file."
diagnosis = "The log event carries `reason=reserved`; the name is not logged. Compare the request with RESERVED_TOP_LEVEL."
fix = "Choose another name; to use a reserved word, place it below a group."
test = "a_reserved_top_level_segment_is_rejected"

[[error]]
code = "FG-REPO-0009"
name = "NamespacePathTaken"
http_status = 409
severity = "info"
user_message_ja = "この名前はすでに使われています。別の名前を指定してください。"
user_message_en = "This name is already in use. Choose another name."
user_message_id = "Nama ini sudah digunakan. Pilih nama lain."
cause = "The path is used by a sibling (user, group or project under the same parent) or blocked by a tombstone of a renamed, moved or deleted namespace (ADR-0015); a tombstone blocks the path until it is released."
diagnosis = "The log event carries `reason`: `sibling` (a namespace with this path exists) or `tombstoned` (forge.namespace_tombstones has the path; the audit log has the rename, transfer or delete that wrote it), or `parent_moved` (a create's parent namespace no longer had the path the create computed when it took the path lock — a concurrent move; retry the create, D5 MR2). A move refuses a new path of any node of its subtree the same way, unless it reclaims its own `moved` tombstones (`reclaim`, ADR-0015 Amendment D5). Showing which of the two is an accepted exposure (ADR-0015). A `sibling` right after a create that failed with FG-DB-0002 `reason=commit_outcome_unknown` usually means the first attempt did commit: look the path up in forge.namespaces and the audit log (`user.created`, `group.created` or `project.created` with the same request_id) before treating it as a conflict."
fix = "Choose another name, or have the tombstone released by the current owner of its target (or an administrator) when the old path is meant to be reused."
test = "a_reserved_or_taken_or_tombstoned_username_is_rejected"

[[error]]
code = "FG-REPO-0010"
name = "MembershipConflict"
http_status = 409
severity = "info"
user_message_ja = "メンバーの変更が、今のメンバーの状態と合いません。画面を更新して確認してください。"
user_message_en = "The membership change does not fit the current members. Refresh and check."
user_message_id = "Perubahan anggota tidak sesuai dengan keadaan anggota saat ini. Muat ulang dan periksa."
cause = "A group or project membership change conflicts with the current members: the user is already a member, is not a member, would remove or demote the last direct active Owner of a top-level group, would remove or demote the last direct Owner of a project that has no inherited active Owner (an ancestor group's direct Owner or the owner of the personal namespace the project is in; D4 MR4), or no longer has the direct role the caller authorized against (`role_changed`: change_member / remove_member take that role as `from` and re-read it under the lock, so a promotion committed between authorize() and the change is not overridden; D4 review), or is a bot (bots act for a person and are never members, ADR-0017; also when a bot is named as the first Owner of a new group or as the creator of a new project, or a project is to be created in a bot's personal namespace, whose owner would inherit Owner). The last-owner rule holds against member changes and concurrent disables of the other owners. Disabling the sole active Owner of a top-level group, or the only active Owner (direct or inherited) of a project, is refused by users::disable with FG-AUTH-0009 `last_owner` (steps D3, D4 MR4); disabling the ancestor owners a subgroup relies on is not refused (subgroups may be left to inherit)."
diagnosis = "The log event carries `reason` (already_member, not_member, last_owner, bot_member, role_changed with `expected` and `actual`, the authorized and the stored direct role) and `action`; ids only, no names. For last_owner, the event also carries `group_id` (a group) or `project_id` (a project); list that group's direct owners with a privileged query on forge.group_members joined to forge.users (state = 'active'): a top-level group needs at least one; a subgroup relies on its ancestors' owners. A project needs one active Owner among its direct owners (forge.project_members role = 'owner'), its ancestor groups' direct owners and the owner of its personal parent namespace."
fix = "Refresh and retry (for role_changed, reload the member's role and authorize again); for last_owner, first make another active user an Owner of the group or project."
test = "removing_the_last_owner_is_refused_under_concurrency"

[[error]]
code = "FG-REPO-0011"
name = "GroupRequestInvalid"
http_status = 400
severity = "info"
user_message_ja = "グループの情報が正しくありません。入力内容を確認してください。"
user_message_en = "The group details are not valid. Check what was entered."
user_message_id = "Data grup tidak valid. Periksa kembali isian Anda."
cause = "A request to create or update a group (forge_db::groups::create / update_decided; `POST /api/v1/groups`, `POST /api/v1/groups/{id}/subgroups`, `PATCH /api/v1/groups/{id}`, M1 phase 8b MR7a) broke a rule before anything was written: the display name or description is empty, too long or holds a NUL character, an update names no field (`empty_update`), the parent namespace is not a group (groups nest only under groups, ADR-0015 Amendment D2), or the first Owner is not an active user (a bot as first Owner is FG-REPO-0010 `bot_member`)."
diagnosis = "The log event carries `reason` (display_name_length, description_length, nul_character, empty_update, parent_not_group, owner_inactive) and `len` where it applies; values are not logged."
fix = "Correct the field named by `reason`; create subgroups below a group, not below a user."
test = "an_invalid_group_request_is_group_request_invalid"

[[error]]
code = "FG-REPO-0012"
name = "RepositoryProvisioningStuck"
http_status = 500
severity = "alert"
user_message_ja = "リポジトリの準備が終わっていません。問い合わせ番号を添えて管理者に連絡してください。"
user_message_en = "The repository is not ready yet. Contact the administrator with the request ID."
user_message_id = "Repositori belum siap. Hubungi administrator dengan menyertakan ID permintaan."
cause = "A repository has stayed in state `provisioning` (forge.repositories, step D4) for longer than 10 minutes, or its provisioning job (`repository.provision`, dedup key `repository_provision:<repo_id>`) is no longer queued or running: it is dead (a permanent failure such as FG-REPO-0004 `adopt_refused`, or its attempts were used up), missing, or it succeeded without the repository being marked ready. The job normally creates the bare directory (`init_bare_or_adopt`) and marks the repository ready within seconds; until then the project exists but cannot be cloned or pushed."
diagnosis = "Reported by `forge doctor` (check `repositories.provisioning`) with `reason` of the first stuck repository (`job_not_live`: no queued or running provisioning job; `too_old`: the job is still live but the repository waits longer than the threshold), `stuck` and the counts per reason `job_not_live` / `too_old` (the 10 000 oldest provisioning repositories are classified; `truncated` when there are more), and the first one's `repo_id`, `project_id`, `age_ms`, `job_state` and `threshold_ms`. `job_not_live` repositories are listed before `too_old` ones, each oldest first. The job is the end of the repository's key chain: `repository_provision:<repo_id>`, then `repository_provision:<repo_id>:after:<job id>` for each reprovision behind a succeeded job. `job_state` is that job's state: `queued`, `running`, `succeeded` (it succeeded but the repository is not ready: a database restore or a manual change; the doctor line says so in `detail`) or `none` (dead or missing). Look up the jobs with a privileged query on forge.jobs (kind `repository.provision`, dedup_key `repository_provision:<repo_id>` or `repository_provision:<repo_id>:after:%`, newest first): `last_error_code` / `last_error` say why one died; the worker log has `forge.repo.provisioned` for each success and the job failure (FG-DB-0006) with the same origin request id. `too_old` with a queued job usually means no `forge worker` runs (doctor `outbox.sequencer_lag` says whether one was observed)."
fix = "Follow the runbook: fix the cause the job reported (storage root permissions or space for FG-REPO-0003, a directory at the path for FG-REPO-0004: inspect it, never delete it blindly), make sure a `forge worker` runs, then run `forge admin repo reprovision <repo_id>` (an approved runbook step): it enqueues the job again after a dead or missing job, and after a succeeded one under the key `repository_provision:<repo_id>:after:<job id>`; it changes nothing while a job is queued or running."
runbook = "repository-provisioning"
test = "a_repository_stuck_in_provisioning_is_reported_by_doctor"

[[error]]
code = "FG-REPO-0013"
name = "ProtectedRefRuleInvalid"
http_status = 400
severity = "info"
user_message_ja = "保護ブランチの規則が正しくありません。refs/heads/ か refs/tags/ で始まる 255 バイトまでのパターンで、* は最後の部分に 1 つだけ使えます。"
user_message_en = "The protected branch rule is not valid. Use a pattern of up to 255 bytes that starts with refs/heads/ or refs/tags/, with at most one '*' in its last part."
user_message_id = "Aturan branch terlindungi tidak valid. Gunakan pola hingga 255 byte yang diawali refs/heads/ atau refs/tags/, dengan paling banyak satu '*' di bagian terakhirnya."
cause = "A protected ref rule (forge.protected_refs, ADR-0008) broke a rule before anything was written. The pattern (forge_core RefPattern::parse) is longer than 255 bytes, does not start with refs/heads/ or refs/tags/, has more than one '*' or a '*' outside its last path component, or, with the '*' read as an ordinary character, breaks git's check-ref-format rules (the rules of RefName, including forge's no-leading-'-' rule). Protected ref changes (forge_db::protected_refs, step D4 MR5) also refuse a 101st rule of one project, and a minimum push role of Guest or Reporter (they cannot push anyway, so such a rule would protect nothing)."
diagnosis = "The log event carries `reason`: too_long (with `len`, in bytes), prefix, wildcard, check_ref_format (with `rule`, the RefName rule that failed: trailing_slash, double_dot, forbidden_character, component_starts_with_dot, ...), too_many_rules (the project already has 100 rules, with `rules`; this cap is enforced by the application only, the database has no limit), or push_min_role (the rule names Guest or Reporter). The pattern itself is not logged. The database CHECKs (protected_refs_pattern_prefix, protected_refs_pattern_length) hold only the prefix and length rules; the rest is the parser's job, so a pattern written without RefPattern::parse can pass the database."
fix = "Correct the pattern named by `reason`: start it with refs/heads/ or refs/tags/, keep it within 255 bytes, use at most one '*' and only in the last part (refs/heads/release/*), remove unused rules before adding more than 100; use Developer, Maintainer or Owner as the minimum push role."
test = "a_protected_ref_pattern_breaking_the_rules_is_rejected"

[[error]]
code = "FG-REPO-0014"
name = "ProjectRequestInvalid"
http_status = 400
severity = "info"
user_message_ja = "プロジェクトの情報が正しくありません。入力内容を確認してください。"
user_message_en = "The project details are not valid. Check what was entered."
user_message_id = "Data proyek tidak valid. Periksa kembali isian Anda."
cause = "A request to create or update a project (forge_db::projects::create, step D4; update_decided, `POST /api/v1/projects`, `PATCH /api/v1/projects/{id}`, M1 phase 8b MR7a) broke a rule before anything was written: the display name (1 to 255 characters) or the description (at most 2000 characters) is out of range or holds a NUL character, an update names no field (`empty_update`), the parent namespace is a project (projects live only under a personal namespace or a group, ADR-0015 Amendment D4), the parent is a personal namespace whose owner is not active (that owner would inherit Owner of the project), the creator, who becomes the first direct Owner, is not an active user, or the creator is not the acting user of the request (only the operator CLI and the worker, actor `system`, may create a project for another user). A bot as creator, or a bot's personal namespace as parent, is FG-REPO-0010 `bot_member`, as for groups. The path rules are FG-REPO-0007..0009. Also: `forge admin repo reprovision` (step D4 MR3b) was asked to provision a repository that is already `ready` (reason `repository_ready`): there is nothing to provision."
diagnosis = "The log event carries `reason` (display_name_length, description_length, nul_character, empty_update, parent_not_owner_namespace, parent_owner_inactive, creator_inactive, creator_not_actor; repository_ready from `forge admin repo reprovision`, with `repo_id`) and `len` where it applies; values are not logged."
fix = "Correct the field named by `reason`; create the project below a user or a group, not below another project nor in the namespace of a disabled user; let an active user create it for themselves (creator_not_actor on a route means the route passed something other than its principal: a bug in that route). For repository_ready: do not reprovision; if its directory is missing, that is FG-REPO-0002 (restore from backup, runbook repo-storage)."
test = "an_invalid_project_request_is_project_request_invalid"

[[error]]
code = "FG-REPO-0015"
name = "TransferInvalid"
http_status = 409
severity = "info"
user_message_ja = "この場所へは移動できません。移動先と名前を確認してください。"
user_message_en = "This cannot be moved there. Check the destination and the name."
user_message_id = "Tidak dapat dipindahkan ke sana. Periksa tujuan dan namanya."
cause = "A namespace move (a project or group transfer or rename, or a user rename; forge_db::projects::move_decided, groups::move_decided, users::rename_decided, step D5 MR2, ADR-0015 Amendment D5) broke a rule of the subtree move before anything was written: the moved namespace has more than 1000 namespaces in its subtree, the new parent is of a kind it may not go under (a project only under a group or a personal namespace, a group only under a group or at the top level, a user only at the top level), the move would change nothing, the new parent is a personal namespace whose owner is a bot or not active (that owner would inherit Owner), the new parent is the moved namespace or one of its descendants, the subtree would end deeper than 20 levels, or a path of the subtree would be longer than 255 characters, or after the move a project of the subtree would have no active Owner left (direct, an ancestor group's direct Owner, or the owner of a personal parent; projects that already had none are not counted) or a group moved to the top level has no direct active Owner — refused for administrators too, the invariant the member commands and users::disable keep. Collisions with an existing path or a tombstone are FG-REPO-0009; the segment's own rules FG-REPO-0007 / 0008."
diagnosis = "The log event carries `reason` (subtree_too_large with `limit`, target_kind, same_location, parent_owner_bot, parent_owner_inactive, cycle, too_deep with `len` = the deepest new depth, path_too_long with `len` = the longest new path in characters, no_active_owner with `project_id` or `group_id`) and the route's ids; paths and names are not logged. The subtree can be inspected with a privileged recursive query on forge.namespaces from the moved namespace's id (parent_id links, depth, full_path)."
fix = "Choose another destination or a shorter name; move a large group in parts (move subgroups first); for no_active_owner first make an active user a direct Owner of the project (or group) that would lose it; to place a project under a disabled user's namespace, re-enable the user first."
test = "a_move_breaking_a_subtree_rule_is_transfer_invalid"

[[error]]
code = "FG-REPO-0016"
name = "RepositoryNotReady"
http_status = 503
severity = "info"
user_message_ja = "リポジトリの準備がまだ終わっていません。しばらくしてから再度お試しください。"
user_message_en = "The repository is not ready yet. Try again in a moment."
user_message_id = "Repositori belum siap. Coba lagi sebentar lagi."
cause = "A Smart HTTP request (clone / fetch, M1 phase 9) reached a project whose repository is still in state `provisioning` (forge.repositories, step D4): the project exists and the caller may read it, but the provisioning job has not created the bare directory yet. Decided after authorize() allowed, so it never tells a caller who may not see the project that it exists."
diagnosis = "The log event carries `repo_id`, `project_id`, `state` and `route`. A new project is normally ready within seconds. If the same repository keeps answering this, its provisioning is stuck: `forge doctor` reports it as FG-REPO-0012 (runbook repository-provisioning)."
fix = "Wait a few seconds and retry. If it persists, follow FG-REPO-0012's runbook repository-provisioning (make sure a `forge worker` runs, read why the job died)."
test = "a_provisioning_repository_is_repository_not_ready"

[[error]]
code = "FG-REPO-0017"
name = "ProtectedRefPatternTaken"
http_status = 409
severity = "info"
user_message_ja = "同じパターンの保護ブランチの規則がすでにあります。既存の規則を変更してください。"
user_message_en = "A protected branch rule with this pattern already exists. Change the existing rule instead."
user_message_id = "Aturan branch terlindungi dengan pola ini sudah ada. Ubah aturan yang sudah ada."
cause = "A protected ref rule was to be added (forge_db::protected_refs::create / create_decided; `POST /api/v1/projects/{id}/protected-refs`, M1 phase 8b MR8) with a pattern that equals an existing rule of the same project ignoring case (RefPattern::key, non-ASCII case included; the database backstop is the unique index protected_refs_project_pattern on lower(pattern), which folds ASCII letters only). The check runs under the project row lock, so two concurrent adds of equal patterns never both commit. Nothing was written. Until MR8 this was FG-REPO-0013 `duplicate_pattern` (400); it is a conflict with the stored rules, not a malformed request, so clients (gstn) can tell the two apart."
diagnosis = "The log event carries `reason=duplicate_pattern` (the application check) or `reason=unique_index` (the database backstop) and `project_id`; the pattern itself is not logged. List the project's rules with `GET /api/v1/projects/{id}/protected-refs` (or a privileged query on forge.protected_refs by project_id) and compare ignoring case."
fix = "Change the minimum push role of the existing rule (`PATCH /api/v1/projects/{id}/protected-refs/{rule_id}`) instead of adding a second one, or delete it first."
test = "a_duplicate_protected_ref_pattern_is_pattern_taken"

[[error]]
code = "FG-REPO-0018"
name = "RenameRateLimited"
http_status = 429
severity = "info"
user_message_ja = "短い期間に名前の変更や移動を繰り返しています。時間をおいてから再度お試しください。"
user_message_en = "This was renamed or moved too often recently. Try again later."
user_message_id = "Nama atau lokasi ini terlalu sering diubah akhir-akhir ini. Coba lagi nanti."
cause = "A namespace (a project, group or user) was renamed or moved 10 times within the last 24 hours (step D5 plan; ADR-0015: every move leaves a tombstone per node, so moves are limited to keep tombstones from piling up). The count is the number of the resource's own succeeded move audit rows within 24 h (forge.audit_log, action project.moved / group.moved / user.renamed on that resource_type / resource_id, without the per-project rows of a moved ancestor, which carry `moved_namespace_id`); the audit log is append-only, so releasing or reclaiming tombstones does not lower it. Administrators are limited too; only the operator CLI (actor system) is exempt."
diagnosis = "The log event carries `reason=moves_per_day`, `moves`, `limit`, `resource` and `id`. List the recent moves with a privileged query on forge.audit_log (resource_type, resource_id, action IN ('project.moved', 'group.moved', 'user.renamed'), occurred_at > now() - interval '24 hours'; index audit_log_moves)."
fix = "Wait until the oldest of those moves is 24 hours old. An operator can move it with the operator CLI (exempt) when the move is approved."
test = "the_eleventh_move_in_a_day_is_rate_limited"

[[error]]
code = "FG-REPO-0019"
name = "RestoreUnavailable"
http_status = 409
severity = "info"
user_message_ja = "このプロジェクトは復元できません。"
user_message_en = "This project cannot be restored."
user_message_id = "Proyek ini tidak dapat dipulihkan."
cause = "A restore (POST /api/v1/projects/{id}/restore, forge_db::projects::restore_decided, step D5 MR3, ADR-0015 Amendment D5) was decided and allowed, but the project cannot come back: it is not pending deletion (`reason=not_deleted`: it was restored already, or never deleted), or its repository is already being purged (`reason=purging`: the purge job has started, the bare repository is being removed and cannot be recovered). The project row is locked and the repository row read under the same transaction, so the answer is what the purge job will also see."
diagnosis = "The log event carries `reason` (`not_deleted`, `purging`) and `project_id`. For `purging` the repository's state is `purging` (privileged query: SELECT state FROM forge.repositories WHERE project_id = <id>): the purge task of `forge worker` (D5 MR4) has started and finishes on its next run, or it is stuck (FG-REPO-0020, runbook repository-purge); for `not_deleted` read the audit log: a `project.restored` row for the project after its last `project.deleted` row."
fix = "`not_deleted`: nothing to do, the project is available. `purging`: the project cannot be restored; create it again under the same path once the purge has finished and the path is released (ADR-0015), or ask the operator to restore the repository from a backup."
test = "restoring_a_project_that_is_not_deleted_or_is_purging_is_restore_unavailable"

[[error]]
code = "FG-REPO-0020"
name = "RepositoryPurgeStuck"
http_status = 500
severity = "alert"
user_message_ja = "削除したプロジェクトの完全削除が終わっていません。問い合わせ番号を添えて管理者に連絡してください。"
user_message_en = "The purge of a deleted project has not finished. Contact the administrator with the request ID."
user_message_id = "Penghapusan permanen proyek yang dihapus belum selesai. Hubungi administrator dengan menyertakan ID permintaan."
cause = "The purge (step D5 MR4, ADR-0015 Amendment D5: the `purge` task of `forge worker` every `hosting.purge_interval_secs`, or `forge admin project purge --now`) could not finish one project whose grace period is over. The purge has two phases: (1) one transaction moves the repository to `purging` (after that the project can no longer be restored, FG-REPO-0019 reason=purging); (2) the bare directory is removed from the storage root (renamed aside, then deleted, bounded by a deadline) and one transaction deletes the rows (members, protected refs, repository, namespace, project), writes the `deleted` tombstone of the path, the `project.purged` audit row and event. A failure in either phase leaves the project as it was at the end of the last completed step; the next run resumes it (a `purging` repository never goes back to `ready`). `step` says where it failed: `lock` (taking the project's purge lock: the database), `start` (phase 1: the database), `provision_check` (reading the state of the repository's provisioning job), `storage` (the directory: FG-REPO-0001 a symlink or a file where the repository or a leftover should be — possible tampering, FG-REPO-0003 an I/O failure), `finish` (phase 2's transaction). Not failures (no code): a project whose purge lock another purge holds, and a removal slower than the run's 120 s wait (it goes on in the background holding the lock) — both are `forge.repo.purge_deferred` (`reason=in_progress` / `removal_running`)."
diagnosis = "The log event of the purge task (`task=purge`, or the CLI's) carries `step`, `project_id`, `repo_id`, `cause_code` (the code of the underlying failure, whose own `context` is in `source`) and `overdue_s` (seconds since `purge_after`). The same project failing on every run is stuck; one failure followed by `forge.repo.purged` for that project was transient. Look at the state with privileged queries: SELECT state FROM forge.repositories WHERE project_id = <id>; SELECT deleted_at, purge_after FROM forge.projects WHERE id = <id>. `forge admin repo-path <repo_id>` prints the directory and whether it still exists; leftovers of an interrupted removal are named `.purge-<repo_id>-*.git` (and of an interrupted provisioning `.tmp-<repo_id>-*.git`) in the same shard directory. `cause_code=FG-DB-0009 reason=rejected` in `start` means the database guard refused `purging` (the project is not pending deletion or its grace period is not over: a clock difference, or a restore committed in between — it is skipped on the next run). A purge also waits (`forge.repo.purge_deferred`, not an error) while the repository's provisioning job is running."
fix = "Follow the runbook: for FG-REPO-0003 free space or fix the permissions of the storage root, for FG-REPO-0001 inspect what is at the path (never delete it blindly: a symlink there may point outside the storage root), for database failures restore database access. Then run `forge admin project purge --dry-run` to see what is due and `forge admin project purge --now` (an approved runbook step) or wait for the next run of the worker: the purge resumes where it stopped and is idempotent (a directory already gone is not an error, the rows and the event are written once)."
runbook = "repository-purge"
test = "a_failed_purge_is_repository_purge_stuck_and_retried_next_run"

[[error]]
code = "FG-REPO-0021"
name = "PurgeBatchIncomplete"
http_status = 500
severity = "warn"
user_message_ja = "完全削除できなかったプロジェクトがあります。"
user_message_en = "Some projects could not be purged."
user_message_id = "Beberapa proyek tidak dapat dihapus permanen."
cause = "`forge admin project purge --now` (step D5 MR4) ran one batch and at least one project failed. Each failed project was already logged on its own as FG-REPO-0020 RepositoryPurgeStuck (the alert); this summary only makes the command's exit code non-zero and is deliberately not an alert, so one failure never raises two."
diagnosis = "The context carries `failed` and `purged`; the command's output has one line per project with `failed` and the project's `request_id`. Look up those request ids for the FG-REPO-0020 lines (`step`, `cause_code`)."
fix = "Follow the runbook repository-purge for each failed project, then run `forge admin project purge --now` again (it resumes where it stopped)."
runbook = "repository-purge"
test = "now_fails_when_a_project_could_not_be_purged"

[[error]]
code = "FG-REPO-0022"
name = "NamespaceMoveContended"
http_status = 503
severity = "warn"
user_message_ja = "ほかの変更と重なったため、移動または名前の変更を完了できませんでした。少し待ってから再度お試しください。"
user_message_en = "The move or rename collided with other changes and could not finish. Wait a moment and try again."
user_message_id = "Pemindahan atau penggantian nama bertabrakan dengan perubahan lain dan tidak dapat diselesaikan. Tunggu sebentar lalu coba lagi."
cause = "A namespace move, rename or tombstone release through the API (forge_hosting::Hosting::move_project, move_group, rename_user, release_tombstone; step D5 MR5) lost a retryable conflict on every attempt: its transaction was rolled back with FG-DB-0002 `retryable=true` (`deadlock` — two moves whose subtrees and targets cross each other; `subtree_unstable` — namespaces kept being created below the moving subtree while it was being locked; `tombstone_changed` — the tombstone's target was purged meanwhile; `serialization`) and was run again from the start, decided again each time, up to 3 attempts in all (forge_hosting::MOVE_ATTEMPTS). Nothing was written by any attempt. Not a bug by itself: it means heavy concurrent changes on the same part of the namespace tree."
diagnosis = "The log event carries `command` (project_move, group_move, user_rename, tombstone_release), `attempts` and `last_reason` (the FG-DB-0002 reason of the last conflict); the source is that FG-DB-0002. Look for other moves, creates or purges in the same subtree at that time (forge.audit_log by occurred_at: project.moved, group.moved, user.renamed, project.created, group.created, project.purged) and in pg_locks / pg_stat_activity for long transactions."
fix = "Retry the request (the client may retry it as is: nothing was written). If it keeps failing, find the competing writer (a script moving many namespaces at once, a purge of the subtree) and let it finish first; move large groups in parts."
runbook = "namespace-redirects"
test = "a_move_that_keeps_losing_conflicts_is_namespace_move_contended"

[[error]]
code = "FG-REPO-0023"
name = "RepositoryPathNotResolved"
http_status = 404
severity = "info"
user_message_ja = "指定したブランチ・タグ・コミット、またはファイルが見つかりません。名前とパスを確かめてください。"
user_message_en = "The branch, tag, commit or file was not found. Check the name and the path."
user_message_id = "Branch, tag, commit, atau berkas tidak ditemukan. Periksa nama dan jalurnya."
cause = "A repository browse request (the API `GET /api/v1/projects/{id}/repository/{refs,resolve,tree,blob,commits,commits/{oid},compare,blame}` or the content routes `{path}/-/raw/{ref}/{file}` / `{path}/-/archive/{ref}.{zip|tar.gz}`, M2 MR7, ADR-0015 Amendment M2) named something the repository does not have. Decided only after authorize() allowed (RepoBrowse / RepoRead), so it never tells a caller who may not read the project anything about it. `reason`: `ref_not_found` (no 40 / 64-hex commit id, no branch and no tag matches — ADR-0015 order: id, longest branch, longest tag; also an empty repository; also, for a 40 / 64-hex id, anything that is not a commit a branch or tag reaches, answered exactly like a missing id so existence never leaks (M3 P6, ADR-0024 §2): a commit no branch or tag reaches — a deleted or force-pushed-away branch's commit, one only `commit-tree` made — (`unreachable=true`), a tree or blob (`object=not_a_commit`), or a reachability check that could not decide (`reach_error=FG-GIT-0002` / `FG-GIT-0004`, logged once as `forge.git.browse.reach_undecided` with that code)), `not_a_commit` (a branch or tag names a tree, blob or a tag of one; an id of one is `ref_not_found` with `object=not_a_commit`), `path_not_found` (no such entry in that commit's tree), `not_a_tree` / `not_a_blob` (the entry is of the other kind; a submodule is neither), `archive_format` (the archive name does not end in `.zip` or `.tar.gz`), `path_remainder` (an archive name with more than a ref)."
diagnosis = "The log event carries `reason`, `project_id`, `repo_id`, `route` and, once resolved, `commit`; never the requested ref or path (they are user input). Usually a typo, a deleted branch or a file that does not exist in that commit. To check by hand on the server: `git --git-dir <storage path of repo_id> for-each-ref refs/heads refs/tags` and `git ls-tree <commit> -- <path>`; for `unreachable=true`: `echo <commit> | git --git-dir <storage path> rev-list --max-count=1 --stdin --not --branches --tags` prints the id when no branch or tag reaches it (the answer is cached for up to 5 s and dropped on every push). M3 R1a: also from the merge request routes (`POST /api/v1/projects/{id}/merge-requests`, `PATCH …/merge-requests/{iid}` with `target_branch`, `POST …/merge-requests/{iid}/reopen`) when a named branch does not exist: forge-review checks the full `refs/heads/…` name through the browse API's refs, and the event carries `branch=source_branch|target_branch` (which of the two; the name itself is not logged) besides `reason=ref_not_found`."
fix = "Nothing to fix on the server: correct the ref or the path (gstn browse refs lists the branches and tags). If an existing branch is reported missing right after a push, wait a few seconds (the ref list is cached for at most 5 s and dropped on every push)."
test = "an_unknown_ref_or_path_is_repository_path_not_resolved"

# ── M3 X1: `.forge/repo.yml` and its spec references (plan 03 §4.4, ADR-0023 Amendment X1) ──

[[error]]
code = "FG-REPO-0024"
name = "RepoConfigInvalid"
http_status = 422
severity = "info"
user_message_ja = "このリビジョンの .forge/repo.yml を読めません。示された行と理由を見て、ファイルを直してください。"
user_message_en = "The .forge/repo.yml of this revision cannot be read. Fix the file at the line and for the reason shown."
user_message_id = "Berkas .forge/repo.yml pada revisi ini tidak dapat dibaca. Perbaiki berkas pada baris dan alasan yang ditampilkan."
cause = "`GET /api/v1/projects/{id}/repository/spec-refs` (M3 X1, action SpecRefRead) read `.forge/repo.yml` at the requested revision and forge_core::repo_config refused it. Not a server fault: the file is the repository's content. The answer is still 200 with `config: \"invalid\"` and `problem {error_code, line, reason}` (the line is 1-based, 0 for the whole file), so the reader sees what to fix; no reference is resolved from an invalid file (fail closed: never a partial reading). `reason`: syntax (not YAML), not_utf8, too_large (over 64 KiB), not_a_file (a directory, a symlink or a submodule at that path), not_a_mapping, unknown_key (a top-level key other than `specs` and the reserved `review`, or an entry key other than repo / path / version / track / scope — `kind:` was removed by ADR-0023), duplicate_key (in any mapping, read or not), too_many_keys (over 64 keys in one mapping), key_not_text, not_text (a list or mapping where text belongs), multiple_documents, yaml_anchor, yaml_alias, yaml_tag (refused, never expanded), too_deep (collections nested over 16), specs_not_a_list, too_many_specs (over 32 entries), entry_not_a_mapping, neither_repo_nor_path, repo_and_path, no_version, version_and_track, version_on_path, repo_invalid (empty, or not a namespace path ADR-0015 accepts), version_invalid / track_invalid (empty or null, not a short tag / branch name git accepts, a full `refs/...` name, or a component starting with `-`), path_invalid (empty or null, absolute, a `.` / `..` or empty segment, a control character, a backslash, a leading `:` (pathspec magic), a drive letter such as `C:`, or over 4096 bytes), scope_not_a_list, too_many_scopes (over 64), scope_invalid (not upper-case letters, digits and `-`, optionally ending in one `*`), duplicate_repo, duplicate_path."
diagnosis = "The event `forge.spec_refs.repo_yml_invalid` (info) carries `error_code`, `request_id`, `project_id`, `repo_id`, `commit`, `line` and `reason`; never the file's text. Read the file at that commit (read-only): git --git-dir <storage path of repo_id> show <commit>:.forge/repo.yml | sed -n '<line>p'."
fix = "Correct `.forge/repo.yml` on the branch (a merge request: `.forge/**` changes need a Maintainer's approval, ADR-0017 §2.7) by the reason and line in the answer. The format is in plan 03 §4.4 and forge_core::repo_config."
test = "an_invalid_repo_yml_is_repo_config_invalid_with_line_and_reason"

[[error]]
code = "FG-REPO-0025"
name = "SpecVersionNotFound"
http_status = 404
severity = "info"
user_message_ja = "参照している仕様のリポジトリに、指定した版（タグ）またはブランチがありません。.forge/repo.yml の version / track を確かめてください。"
user_message_en = "The referenced specification repository has no such version (tag) or branch. Check version / track in .forge/repo.yml."
user_message_id = "Repositori spesifikasi yang dirujuk tidak memiliki versi (tag) atau branch tersebut. Periksa version / track di .forge/repo.yml."
cause = "`GET /api/v1/projects/{id}/repository/spec-refs` (M3 X1): an entry `repo: <path>` with `version: <tag>` (or `track: <branch>`) named a repository the reader may read (SpecRefRead allowed on it with the reader's own permissions), but `refs/tags/<tag>` (`refs/heads/<branch>`) does not exist there or does not name a commit. Reported per entry (`status: \"version_not_found\"`, `error_code`), never for a repository the reader cannot read (that is FG-REPO-0026, so the answer never tells which tags a hidden repository has). The other entries are still resolved."
diagnosis = "The event `forge.spec_refs.unresolved` (info) carries `error_code`, `request_id`, `project_id` (the referencing project), `referenced_project_id`, `line` (the entry's line in .forge/repo.yml), `pin` (version / track) and `reason` (ref_not_found, not_a_commit); never the tag name. List the referenced repository's tags: gstn browse refs --project <referenced_project_id> --type tag, or on the server git --git-dir <storage path> for-each-ref refs/tags."
fix = "Publish the tag in the specification repository, or correct `version:` / `track:` in .forge/repo.yml to an existing one. A tag pushed a moment ago may be missing for up to 5 s (the ref list cache)."
test = "a_missing_spec_version_is_spec_version_not_found"

[[error]]
code = "FG-REPO-0026"
name = "SpecRepositoryUnavailable"
http_status = 404
severity = "info"
user_message_ja = "参照している仕様のリポジトリが見つからないか、あなたには読む権限がありません。パスを確かめるか、そのリポジトリの管理者に読む権限を依頼してください。"
user_message_en = "The referenced specification repository was not found, or you may not read it. Check the path, or ask its maintainers for read access."
user_message_id = "Repositori spesifikasi yang dirujuk tidak ditemukan, atau Anda tidak berhak membacanya. Periksa jalurnya, atau minta akses baca kepada pengelolanya."
cause = "`GET /api/v1/projects/{id}/repository/spec-refs` (M3 X1): an entry `repo: <path>` could not be followed for this reader. Every case answers the same (`status: \"unavailable\"`, `error_code`, no project id, no version) so the answer is no existence oracle: nothing lives at the path, the path is a group or a user, the path is a moved or deleted tombstone (a pinned reference is not redirected: update the path), authorize() refused SpecRefRead on the project for the reader's own permissions (not visible, a service account that is not a member, pending deletion, a token without read_api), or the reader may read it but its repository is still provisioning or git could not read it (busy, timed out, a storage failure: shown as unavailable so the status never tells a readable repository from a hidden one). Each lookup costs the same statements whatever the outcome (NamespaceResolver contract). The other entries are still resolved."
diagnosis = "The event `forge.spec_refs.unresolved` (info) carries `error_code`, `request_id`, `project_id`, `line` and `reason`: absent, not_a_project, moved, tombstone_deleted, denied (with `decision_error_code`: the code authorize() gave — FG-REPO-0005, FG-REPO-0006, FG-AUTH-0002, …), not_ready (with `referenced_project_id`) or git_failed (logged at warn, with `git_error_code` — FG-GIT-0002 timeout, FG-GIT-0004 busy, a storage code — `git_error`, `referenced_project_id` and `referenced_repo_id`; follow that code's own runbook). Never the path itself. For denied: check the reader's membership of the referenced project (gstn member list --project <id>); for moved: GET /api/v1/namespaces/resolve?path=<path> shows the current path."
fix = "Correct `repo:` in .forge/repo.yml to the repository's current path, or give the readers Reporter on it (an internal project is readable by every signed-in person). A service account must be a member. Nothing to change on the server."
test = "an_unreadable_spec_repository_is_spec_repository_unavailable"

[[error]]
code = "FG-REPO-0027"
name = "SpecVersionBehind"
http_status = 409
severity = "info"
user_message_ja = "このコミットの .forge/repo.yml が固定している仕様の版より新しい版が公開されています。新しい版の変更を確かめ、必要なら version を上げてください。"
user_message_en = "A later version of a specification this commit's .forge/repo.yml pins has been published. Review its changes and raise version if needed."
user_message_id = "Versi yang lebih baru dari spesifikasi yang dipatok oleh .forge/repo.yml pada commit ini telah dipublikasikan. Tinjau perubahannya dan naikkan version bila perlu."
cause = "The check `forge/spec-drift` (M3 X2, plan 03 §5.4, ADR-0023 Amendment X2) evaluated a merge request version's head: an entry `repo: <path>` with `version: <tag>` names a repository every signed-in person may read, and that repository has a later tag of the same series (the same prefix, numbers compared as numbers, a missing part as 0; prerelease tags such as v2.0-rc1 are no versions). A notice, never an HTTP error: the run concludes `neutral` (it never blocks a merge unless a protected branch requires forge/spec-drift, and `neutral` does not satisfy a required check) and its summary and annotation name the line, the pin and the latest version with this code."
diagnosis = "Open the run: gstn checks list --project <id> --sha <head> (forge/spec-drift; the summary lists every entry with its state). The job's log event `forge.spec_drift.recorded` carries `request_id`, `project_id`, `head_sha`, `conclusion` and `check_run_id`. List the referenced repository's tags: gstn browse refs --project <referenced project> --type tag."
fix = "Read the later version's changes and raise `version:` in .forge/repo.yml in this merge request, or keep the pin on purpose (the run stays neutral). Nothing to change on the server."
test = "a_pin_behind_the_latest_version_is_neutral_with_spec_version_behind"

[[error]]
code = "FG-REPO-0028"
name = "SpecLintProblem"
http_status = 422
severity = "info"
user_message_ja = "このコミットの仕様の文書か @req の参照が規則に合っていません。forge/spec-lint の一覧のファイルと行を直してください。"
user_message_en = "A specification document or @req reference at this commit breaks a rule. Fix the files and lines forge/spec-lint lists."
user_message_id = "Dokumen spesifikasi atau referensi @req pada commit ini melanggar aturan. Perbaiki berkas dan baris yang dicantumkan forge/spec-lint."
cause = "The check `forge/spec-lint` (M3 X4, plan 03 §5.4, ADR-0023 Amendment X4) indexed a merge request version's head: the Markdown files under the repository's own specification directories (its `.forge/repo.yml` `path:` entries, or `spec/`) and every `@req` tag of its tree. A rule is broken; the run concludes `failure` and its summary and annotations list each `path:line rule`. Document rules (forge_core::spec_doc): not_utf8, file_too_large (over 256 KiB: not read), front_matter_missing (requirement blocks without a front matter), front_matter_unclosed, front_matter_too_large, front_matter_syntax, front_matter_not_a_mapping, front_matter_duplicate_key, front_matter_multiple_documents, front_matter_yaml_feature (anchors, aliases, tags), front_matter_unknown_key (only spec / title / status / owners / confidential; in a plan 13 `doctype: spec.system` front matter — ADR-0026 §7, the older format's type, e.g. after `gstn doc fmt --migrate` — only the base keys: id is the name, retired makes it deprecated, classification is the mark; a document of another doctype is not indexed), spec_missing, spec_invalid, title_missing, title_invalid, status_missing, status_invalid (draft / review / approved / deprecated), owners_invalid (a list of at most 32 short texts), requirement_id_missing, requirement_id_invalid (upper-case letters and digits in two or more `-`-separated segments, first a letter, at most 64 bytes, never the `PBI` family), attribute_invalid (not key=value), attribute_unknown (only priority / status), attribute_duplicate, priority_invalid (must / should / could / wont), requirement_status_invalid (active / deprecated), block_nested (`::: req` inside a requirement), block_unclosed, close_unmatched (a `:::` with nothing open), body_empty, body_too_long (over 16 KiB), too_many_requirements (over 2000 in one file), too_deep (containers nested over 16), unclosed_comment (an HTML comment `<!--` never closed, on the line it opens, when a `::: req` line follows: the blocks after it are not read), doctype_not_spec (a front matter naming another `doctype` than spec.system — or one that is no text — while it has a key of the older format or a requirement block: its front matter is not used, so it is withheld from an AI; its requirements are read; a document of another type without either is not indexed). A repository's `.forge/doctypes/spec.system.yml` with `defaults: classification: confidential` (or one that cannot be read) withholds every specification document from an AI. Index rules (forge_core::spec_index::lint): duplicate_id (an id defined twice; the detail names the first place), duplicate_spec (a `spec:` name used twice), broken_reference (a tag names an id of one of this repository's own families — the id without its last segment — that it does not define and no `repo:` entry's `scope:` covers). Not a server fault: the files are the repository's content. A block inside a fenced code block is never read."
diagnosis = "Open the run: gstn checks list --project <id> --sha <head> (forge/spec-lint; the summary lists every problem). The job's log event `forge.spec_index.recorded` carries `request_id`, `project_id`, `iid`, `head_sha`, both conclusions and the document and tag counts. Read the file at that commit (read-only): gstn browse blob --project <id> --ref <head> --path <path>, or check the whole index with gstn spec requirements --project <id> --ref <head>."
fix = "Correct the document or the tag at the listed line in the merge request. An id is never removed: mark it `status=deprecated` (plan 03 §4.2). Nothing to change on the server."
test = "a_spec_lint_problem_fails_with_spec_lint_problem_and_an_annotation"

[[error]]
code = "FG-REPO-0029"
name = "RequirementUntested"
http_status = 409
severity = "info"
user_message_ja = "この MR が触れる要件か作業項目に、@req の付いたテストがありません。テストに @req <要件 ID> または @req PBI-<番号>/AC-<番号> を付けてください。"
user_message_en = "A requirement or work item this merge request touches has no @req test. Tag a test with @req <requirement id> or @req PBI-<n>/AC-<m>."
user_message_id = "Persyaratan atau item kerja yang disentuh merge request ini tidak memiliki tes @req. Tandai tes dengan @req <id persyaratan> atau @req PBI-<n>/AC-<m>."
cause = "The check `forge/spec-trace` (M3 X4, plan 03 §5.4, plan 06 D-7; advisory, plan 03 §9-4) found a touched subject with no `@req` tag naming it anywhere in the head's tree: a requirement added or changed in this repository's own specification since the merge base with the target branch (a deprecated one is not touched), or a kanflow work item the merge request is linked to (`PBI-<n>`) without any test of one of its acceptance criteria (`@req PBI-<n>/AC-<m>`). A notice, never an HTTP error: the run concludes `neutral` and never `failure` (it blocks a merge only when a protected branch requires forge/spec-trace, and `neutral` does not satisfy a required check). In M3 the check looks for a tagged test, not for its result in a pipeline (that comes with the CI of M4, ADR-0017 §4.1.1)."
diagnosis = "Open the run: gstn checks list --project <id> --sha <head> (forge/spec-trace; the summary lists every touched subject with `tested` / `untested` / `unknown`, why it is touched — spec_changed, tag_added, work_item_linked — and where). The trace of the whole specification at a revision: gstn spec trace --project <id> --ref <rev>. The work item links: gstn mr work-items --project <id> --iid <iid>."
fix = "Add or tag a test for the requirement (a comment or a name with `@req <ID>`; any language), or for one of the work item's acceptance criteria (`@req PBI-<n>/AC-<m>`). A requirement that no longer applies is `status=deprecated`. Nothing to change on the server."
test = "an_untested_touched_requirement_is_a_neutral_trace_never_a_failure"

[[error]]
code = "FG-REPO-0030"
name = "RequirementTagUnknown"
http_status = 422
severity = "info"
user_message_ja = "@req のタグが、どの要件にも、参照している仕様の範囲にも当たりません（または形式が違います）。要件 ID か PBI-<番号>/AC-<番号> を確かめてください。"
user_message_en = "A @req tag names no requirement here or in a referenced specification's scope (or is malformed). Check the requirement id or PBI-<n>/AC-<m>."
user_message_id = "Tag @req tidak merujuk persyaratan mana pun di sini maupun dalam cakupan spesifikasi yang dirujuk (atau formatnya salah). Periksa id persyaratan atau PBI-<n>/AC-<m>."
cause = "The check `forge/spec-trace` (M3 X4, advisory) found a `@req` tag the merge request adds (a (path, id) pair not at the merge base) whose id this repository's own specification does not define and no `.forge/repo.yml` `repo:` entry's `scope:` covers (an entry without a scope covers every id), or a tag followed by no requirement id or acceptance criterion at all (malformed: `@req` then text that is neither `<ID>` nor `PBI-<n>/AC-<m>`). The referenced specifications themselves are not read by the check (the run is shown to every reader of the project), so a covered id counts as known. A notice: the run concludes `neutral`, never `failure`."
diagnosis = "Open the run: gstn checks list --project <id> --sha <head> (forge/spec-trace; `unknown <ID>` and `malformed @req at <path>:<line>` lines, with an annotation on each). Compare with the requirement index: gstn spec requirements --project <id> --ref <head> and the references: gstn browse spec-refs --project <id> --ref <head>."
fix = "Correct the id in the tag, add the requirement to the specification, or add the referenced specification's id pattern to `scope:` in .forge/repo.yml. Nothing to change on the server."
test = "spec_trace_counts_added_tags_and_flags_unknown_and_malformed_ones"

[[error]]
code = "FG-REPO-0031"
name = "SpecIndexIncomplete"
http_status = 409
severity = "info"
user_message_ja = "仕様の索引が上限に達したため、一部しか読めていません。結果は読めた範囲のものです。仕様のファイルを分けるか小さくしてください。"
user_message_en = "The specification index hit a bound, so only part of it was read; the results are about what was read. Split or shrink the specification files."
user_message_id = "Indeks spesifikasi mencapai batas sehingga hanya sebagian yang terbaca; hasilnya hanya untuk bagian yang terbaca. Pecah atau perkecil berkas spesifikasi."
cause = "Indexing a commit's requirements (M3 X4, forge-checks spec_index: `forge/spec-lint`, `forge/spec-trace` and the spec API `GET /api/v1/projects/{id}/specs/…`) stops at its bounds rather than run unbounded: at most 1000 Markdown files under the specification directories (`spec_files`), at most 8 MiB read in all (`spec_bytes`; a single file over 256 KiB is not read and is the problem file_too_large instead), and at most 8 MiB of `git grep` output for the `@req` tags (`tag_lines`). The first bound hit is named; the answers are about what was read and never claim more: spec-lint concludes `neutral` instead of `success`, spec-trace `neutral`, and the API answers carry `incomplete: <reason>` with this code. Not a server fault."
diagnosis = "The run's summary or the API's `incomplete` names the bound. Count the files: gstn browse tree --project <id> --ref <rev> --path spec. The job's log event `forge.spec_index.recorded` carries `incomplete` with `request_id`."
fix = "Keep the specification within the bounds: fewer, smaller Markdown files under the specification directories (split a large one), or list only the specification directories in `.forge/repo.yml` `path:` entries. Nothing to change on the server."
test = "an_incomplete_index_is_never_a_silent_pass"

[[error]]
code = "FG-REPO-0032"
name = "RequirementNotFound"
http_status = 404
severity = "info"
user_message_ja = "その要件 ID は、この版の仕様にありません。ID と版を確かめてください。"
user_message_en = "That requirement id is not in the specification at this revision. Check the id and the revision."
user_message_id = "ID persyaratan itu tidak ada dalam spesifikasi pada revisi ini. Periksa ID dan revisinya."
cause = "`GET /api/v1/projects/{id}/context/requirement?id=…[&ref=…]` (M3 X5, plan 03 §6) looks the id up in the project's own specification at the revision (forge-checks spec_index, the same index as the spec API): no requirement block defines it there. The id may be defined only in a later or earlier version, in another repository (a `repo:` reference: ask that project), or be a kanflow acceptance criterion (`PBI-<n>/AC-<m>`, read with …/context/work-item). Not a server fault."
diagnosis = "The log event carries `route`, `project_id`, `requirement` and `commit`. List what the revision defines: gstn spec requirements --project <id> --ref <rev> --search <id>. If the answer of that list carries `incomplete` (FG-REPO-0031), the definition may lie past the index's bounds."
fix = "Use an id the revision defines, or the revision that defines it (gstn spec versions --project <id>)."
test = "an_unknown_requirement_is_not_found"

# --- DOC: documents in the plan 13 format (forge-doc; ADR-0026) ---------------

[[error]]
code = "FG-DOC-0001"
name = "DocLintProblem"
http_status = 422
severity = "info"
user_message_ja = "文書が規則に合っていません。一覧のファイルと行を直してください。"
user_message_en = "A document breaks a rule. Fix the files and lines listed."
user_message_id = "Sebuah dokumen melanggar aturan. Perbaiki berkas dan baris yang dicantumkan."
cause = "The document lint (forge_doc::lint, plan 13 §5, ADR-0026) found a problem in a document: a `.md` file whose front matter names a `doctype`, in any folder. Two places run the same lint on the same bytes: the check `forge/doc-lint` (written by the `check.spec_index` job on a merge request version's head; it concludes `failure`) and `gstn doc lint` on the working tree (exit 1). Each problem is `path:line rule [subject]`. Rules: the text (forge_doc::document: too_large over 1 MiB, not_utf8, front matter syntax, blocks, references, html_not_allowed), the front matter (field_missing, field_invalid, field_unknown, classification_invalid / _below_default / _conflict, id_invalid, id_not_filename, id_duplicate, translation_invalid, retired_invalid), the type (doctype_unknown: no `.forge/doctypes/<type>.yml`; doctype_invalid: that definition cannot be used — FG-DOC-0003), the body (section_missing, section_order, block_kind_unknown, block_id_missing / _invalid / _duplicate, block_body_empty, block_outside_section, attr_unknown, attr_invalid, replaced_by_not_deprecated), references (ref_broken: the id or block is not in this repository; ref_kind_mismatch, ref_doctype_mismatch) and the type's own rules (e.g. every_hazard_has_control). Broken references are errors (plan 13 Q13); `gstn doc lint --migration-warnings` reports `ref_broken` as a warning instead, locally only (the repository setting that lowers them on the server with an expiry is not built yet). Not a server fault: the files are the repository's content."
diagnosis = "Locally: gstn doc lint (or gstn doc lint <path> --json: each problem with path, line, rule, subject, level). On the server: gstn checks list --project <id> --sha <head> (forge/doc-lint; the summary and the annotations list each problem). The job's log event `forge.spec_index.recorded` carries `request_id`, `project_id`, `iid`, `head_sha` and `doc_lint_conclusion`."
fix = "Correct the document (or its type's definition) at the listed line in the merge request; run gstn doc lint before pushing. A reference to a document not yet in GitStation: add that document first (or, while migrating locally, pass --migration-warnings). Nothing to change on the server."
test = "a_doc_lint_problem_fails_with_doc_lint_problem"

[[error]]
code = "FG-DOC-0002"
name = "DocIndexBounded"
http_status = 409
severity = "warn"
user_message_ja = "文書が多すぎるか大きすぎるため、一部しか検査できていません。結果は読めた範囲のものです。"
user_message_en = "Only part of the documents could be checked: there are too many, or they are too large. The results are about what was read."
user_message_id = "Hanya sebagian dokumen yang dapat diperiksa: terlalu banyak atau terlalu besar. Hasilnya hanya untuk bagian yang terbaca."
cause = "Reading a revision's documents for the document lint stops at its bounds rather than run unbounded, and says so instead of passing. Server (`forge/doc-lint`, forge-checks doc_lint DocLimits): the head's tree listing over 50000 entries or 8 MiB (`doc_tree`), more than 2000 `.md` files (`doc_files`), more than 100 files over the parser's limit (`doc_large_files`; each is read only up to the limit + 1 byte — 1 MiB for a document, 64 KiB for a type definition — as gstn reads it, so a large Markdown file without a `doctype` is no bound), more than 32 MiB read in all (`doc_bytes`), more than 64 type definitions (`doctype_files`); the run concludes `neutral` when it found no problem (a broken reference alone is no failure then: the target may be in what was not read). The document API (`GET …/documents[/{doc_id}]`, plan 13 stage 3) reads with the same server bounds and answers `incomplete {error_code: FG-DOC-0002, reason}` beside what it read (a reference may then read `broken` although its target exists); its referrers route (`…/documents/{doc_id}/referenced-by`) also answers `reason: doc_refs` when a document it may show hit the parser's 5000 references per document (`MAX_REFS_PER_DOCUMENT`, lint rule `too_many_references`), so a referrer may be missing — split that document. Client (`gstn doc lint` / `gstn doc fmt`, forge-client doc): more than 5000 `.md` files (`doc_files`), more than 64 MiB of `.md` (`doc_bytes`), a `git ls-files` listing over 16 MiB (`doc_tree`), more than 64 type definitions (`doctype_files`), or a file name that is not UTF-8 (`path_not_utf8`); gstn exits 1 with this code when it found no other problem. Not a server fault."
diagnosis = "The run's summary (server) or the warning line on stderr / `incomplete.reason` in --json (gstn) names the bound. Count the Markdown files: git ls-files '*.md' | wc -l. The job's log event `forge.spec_index.recorded` carries `doc_incomplete` with `request_id`."
fix = "Keep the repository within the bounds: fewer or smaller Markdown files (split a large document; plan 13 §8.2 suggests at most 1500 lines), or move generated Markdown out of the repository. Nothing to change on the server."
test = "a_bounded_doc_index_is_never_a_silent_pass"

[[error]]
code = "FG-DOC-0003"
name = "DoctypeDefinitionInvalid"
http_status = 422
severity = "info"
user_message_ja = "文書の型の定義（.forge/doctypes/ の YAML）を読めません。型の定義を直してください。その型の文書は検査できません。"
user_message_en = "A document type definition (the YAML under .forge/doctypes/) cannot be read. Fix the definition; documents of that type cannot be checked."
user_message_id = "Definisi tipe dokumen (YAML di .forge/doctypes/) tidak dapat dibaca. Perbaiki definisinya; dokumen bertipe itu tidak dapat diperiksa."
cause = "`.forge/doctypes/<type>.yml` (forge_doc::doctype::parse_doctype, plan 13 §5, ADR-0026) is refused: over 64 KiB (doctype_too_large), not UTF-8 (doctype_not_utf8), its `name` is not its file name (doctype_name_not_filename), an unknown key (doctype_unknown_key), an unknown rule (doctype_rule_unknown), a pattern that is not a valid regular expression (doctype_pattern_invalid), an unknown value type (doctype_type_unknown), or another shape error (doctype_invalid). The definition's own problem is reported on the `.yml` file; every document of that type gets `doctype_invalid` (its type's rules cannot be applied). `forge/doc-lint` concludes `failure`; `gstn doc lint` exits 1 with this code; `gstn doc fmt` leaves the documents of that type as they are (their field and attribute order is the type's) and exits 1 with this code. Not a server fault."
diagnosis = "gstn doc lint .forge/doctypes --json lists the definition's problem with its line and rule; on the server the forge/doc-lint run's annotations name `.forge/doctypes/<type>.yml`."
fix = "Correct the definition at the listed line (plan 13 §5 describes the keys), then run gstn doc lint again."
test = "an_invalid_doctype_definition_is_doctype_definition_invalid"

[[error]]
code = "FG-DOC-0004"
name = "DocFormatWouldChange"
http_status = 422
severity = "info"
user_message_ja = "整形されていない文書があります。gstn doc fmt で整形してください。"
user_message_en = "Some documents are not formatted. Format them with gstn doc fmt."
user_message_id = "Ada dokumen yang belum diformat. Format dengan gstn doc fmt."
cause = "`gstn doc fmt --check` (forge_doc::fmt::format_document, ADR-0026 §4: one sentence per line, the front matter's keys and a block's attributes in the type's order) found a document whose formatted bytes differ from the file, or a file it could not check: a file named on the command line that is no document (`not_a_document`), or a document (its front matter names a `doctype`) that is too large (over 1 MiB) or not UTF-8 — a file fmt cannot check is never a pass (`unchecked=<n>` in the detail). Nothing was written (--check never writes). Only documents in the plan 13 format are formatted: an older `spec:` document or a Markdown file without a `doctype` is left alone."
diagnosis = "gstn doc fmt --check --json lists `changed` (the files that would change) and `skipped` with each reason. Run gstn doc fmt <path> and look at git diff to see what the formatting does."
fix = "Run gstn doc fmt (without --check) and commit the result."
test = "fmt_check_exits_non_zero_when_a_file_would_change"

[[error]]
code = "FG-DOC-0005"
name = "DocLintMigrationUntilInvalid"
http_status = 400
severity = "info"
user_message_ja = "移行中の期限は、明日から 180 日後までの日付にしてください。"
user_message_en = "The migration's end date must be between tomorrow and 180 days from today."
user_message_id = "Tanggal akhir migrasi harus antara besok dan 180 hari dari hari ini."
cause = "`PUT /api/v1/projects/{id}/doc-lint/migration` (plan 13 Q13, ADR-0026; `gstn doc migration set`) names a `warn_until` date that is today or earlier (`reason=not_in_future`) or more than 180 days after today (`reason=too_far`). Today is the database's date in UTC (`(now() AT TIME ZONE 'UTC')::date`), never the client's or the web server's clock. The bound keeps the downgrade of broken references (`ref_broken`) to warnings temporary: past its date they are errors again by themselves. A date that is not a calendar date `YYYY-MM-DD` is FG-WEB-0006 (`param=warn_until`). Nothing was stored."
diagnosis = "The log event carries `reason`, `warn_until` (the date sent), `today` and `max_until` (the database's bounds at the time)."
fix = "Choose a date between tomorrow and 180 days from today (UTC). To lengthen a migration, set a new date before or after the old one ends; to end it now, clear the setting (DELETE, `gstn doc migration clear`)."
test = "a_migration_date_outside_the_bounds_is_refused"

# --- AUTH: authentication and authorization (forge-auth) ----------------------

[[error]]
code = "FG-AUTH-0001"
name = "Unauthenticated"
http_status = 401
severity = "info"
user_message_ja = "ログインが必要です。"
user_message_en = "You need to sign in."
user_message_id = "Anda perlu masuk terlebih dahulu."
cause = "The request carried no valid credentials; forge has no anonymous access. Credentials are `Authorization: Bearer <token>`, `Authorization: Basic` whose password is the token (git Smart HTTP and the raw / archive routes only), or the web session cookie `__Host-gstn_session` (the API and raw / archive; ignored on git routes; M2 MR3, ADR-0021)."
diagnosis = "The log event carries `action`, or (`forge.auth.token_rejected` / `forge.auth.session_rejected`) `reason` and `scheme` (`bearer`, `basic`, `session`) and, when known, `public_id`. Token reasons: malformed, unknown, mismatch, revoked, expired; header reasons: malformed_header, unsupported_scheme, ambiguous (two Authorization headers, two session cookies, or a session cookie together with an Authorization header on the API or raw / archive — neither is tried), basic_not_allowed (Basic on /api/v1: the API takes Bearer only, so a browser never remembers a token as a Basic password; ADR-0019 Amendment M2). Session reasons: session_malformed, session_unknown, session_mismatch, session_revoked (with `revoked_reason`: logout, backchannel, user_disabled, admin, idp_revoked), session_expired (idle or absolute lifetime, web.session_idle_secs / web.session_absolute_secs); the response then clears the cookie. For git clients, a 401 makes git prompt for credentials; repeated 401s from one client usually mean a missing or mistyped token in its credential helper. /api/v1 401s challenge with Bearer only; raw / archive drop the Basic challenge for browser requests (Sec-Fetch-Mode / Sec-Fetch-Dest or the session cookie)."
fix = "Sign in again (an expired or revoked session), or configure the git credential helper with a personal access token. Send API tokens as `Authorization: Bearer`, not Basic. Send either a token or the session cookie, never both."
test = "anonymous_is_unauthenticated"

[[error]]
code = "FG-AUTH-0002"
name = "InsufficientScope"
http_status = 403
severity = "info"
user_message_ja = "このアクセストークンには、この操作の権限（スコープ）がありません。"
user_message_en = "This access token does not have the scope for this operation."
user_message_id = "Token akses ini tidak memiliki cakupan (scope) untuk operasi ini."
cause = "The caller authenticated with a token whose scopes do not include the scope the action requires. Scopes only narrow a role; they never widen it."
diagnosis = "The log event carries `action`, `required_scope` and `token_scopes`, or `reason=session_required` for an action only a web session may perform (`GET /api/v1/session`, ADR-0021 §17), whatever the token's scopes."
fix = "Create a token with the required scope (for example write_repository for push). For session_required, use the browser session; a token cannot do it."
test = "token_scope_narrows_role"

[[error]]
code = "FG-AUTH-0003"
name = "Forbidden"
http_status = 403
severity = "info"
user_message_ja = "この操作を行う権限がありません。"
user_message_en = "You do not have permission to do this."
user_message_id = "Anda tidak memiliki izin untuk melakukan ini."
cause = "The caller can see the resource but their role is below what the action requires (or the action needs an administrator)."
diagnosis = "The log event carries `action` and either `required_role` / `actual_role` (role too low; `required_role=admin` for administrator-only actions) or `reason` (`above_own_role` for membership and protection changes, `last_owner`, `foreign_namespace`, `token_cannot_mint`, `admin_scope_requires_admin`, `agent_token`: a credential issued for an AI agent on an action kept for people — ProjectVisibilityChange, MemberManage, ProtectedRefManage, ADR-0017 amendments MR7a / MR8, whatever the role). Compare with the permission matrix (`forge-auth` `matrix_rows.rs`). An administrator's token acts as a normal user unless it has the `admin` scope."
fix = "Grant the user the required role on the project or group, if appropriate. For `agent_token`, a person does the change with their own session or a token issued without is_agent."
test = "denied_matrix_rows_all_deny"

[[error]]
code = "FG-AUTH-0004"
name = "AccountDisabled"
http_status = 403
severity = "info"
user_message_ja = "このアカウントは無効化されています。管理者に連絡してください。"
user_message_en = "This account is disabled. Contact the administrator."
user_message_id = "Akun ini dinonaktifkan. Hubungi administrator."
cause = "The user exists but is disabled (by an administrator, or locked after repeated failed sign-ins)."
diagnosis = "The log event carries `action`, or for a personal access token or a web session `reason=owner_disabled` with `user` and `public_id` (tokens::authenticate and sessions::authenticate refuse a disabled owner's credential themselves, ADR-0019; a disable also revokes the user's sessions, `user.disabled` details `revoked_sessions`, ADR-0019 Amendment M2). The audit log records who disabled the account, or the lockout."
fix = "An administrator re-enables the account if it should be active."
test = "disabled_account_is_denied"

[[error]]
code = "FG-AUTH-0005"
name = "UserEmailTaken"
http_status = 409
severity = "info"
user_message_ja = "このメールアドレスはすでに登録されています。"
user_message_en = "This email address is already registered."
user_message_id = "Alamat email ini sudah terdaftar."
cause = "A human user with the same email address (compared ignoring case) already exists; forge.users has a unique index on lower(email)."
diagnosis = "The log event carries `reason=email_taken`; the address is not logged (personal data). Look the address up with a privileged query on forge.users (the read pool cannot see email)."
fix = "Use another address, or sign in as the existing user; an administrator merges or disables duplicate accounts."
test = "a_second_user_with_the_same_email_is_user_email_taken"

[[error]]
code = "FG-AUTH-0006"
name = "UserRequestInvalid"
http_status = 400
severity = "info"
user_message_ja = "ユーザーの情報が正しくありません。入力内容を確認してください。"
user_message_en = "The user details are not valid. Check what was entered."
user_message_id = "Data pengguna tidak valid. Periksa kembali isian Anda."
cause = "A request to create a user broke a rule of forge.users before anything was written: a human without an email, or a field that is empty, too long or holds a NUL character (display_name 1 to 255, email 1 to 320, employee_number 1 to 64, external_id 1 to 255 characters). For a service account (M3 S0, forge_db::service_accounts::create / update): a purpose that is empty, blank, over 500 characters or holds a control character, or an owner that does not exist, is not a person (kind human) or is disabled."
diagnosis = "The log event carries `reason` (email_missing, display_name_length, email_length, employee_number_length, external_id_length, nul_character; for a service account also service_account_personal_data (an e-mail, employee number or external id was given), service_account_admin, purpose_length, purpose_control_character, owner_absent, owner_not_human, owner_disabled — the owner ones with `owner`, the owner's user id) and `len`; the value itself is not logged (personal data, free text). The same limits are CHECK constraints of forge.users (migration 20261028100100) and forge.service_account_profiles (20261113100000), so a request forge-db accepts is never refused by the database."
fix = "Correct the field named by `reason`; for LDAP accounts, fix the directory entry that fed it. For owner_not_human / owner_disabled name an active person as the service account's owner (runbook service-accounts)."
test = "an_invalid_user_request_is_user_request_invalid"

[[error]]
code = "FG-AUTH-0007"
name = "UserIdentifierTaken"
http_status = 409
severity = "info"
user_message_ja = "この社員番号または外部 ID は、すでに別のユーザーに使われています。"
user_message_en = "This employee number or external ID is already used by another user."
user_message_id = "Nomor karyawan atau ID eksternal ini sudah digunakan oleh pengguna lain."
cause = "Another user already has the same employee_number, or the same external_id for the same auth_source (unique indexes users_employee_number and users_external_id on forge.users)."
diagnosis = "The log event carries `reason` (employee_number_taken or external_id_taken); the value is not logged (personal data). Find the other account with a privileged query on forge.users (the read pool cannot see these columns); a duplicate usually means a re-hired employee or an LDAP entry that was recreated."
fix = "An administrator decides which account keeps the identifier: disable or correct the stale account, then retry."
test = "a_taken_employee_number_or_external_id_is_user_identifier_taken"

[[error]]
code = "FG-AUTH-0008"
name = "TokenRequestInvalid"
http_status = 400
severity = "info"
user_message_ja = "トークンの発行リクエストが正しくありません。入力を確認してください。"
user_message_en = "The token request is not valid. Check the input."
user_message_id = "Permintaan token tidak valid. Periksa input."
cause = "A personal access token could not be issued because the request breaks a rule of forge_db::tokens::issue (ADR-0019): the expiry is under 1 day or over 365 days, no scope or an unknown scope, a name that is empty, over 100 characters or holds NUL or another control character, the admin scope for a non-admin owner, a bot owner, a disabled owner, or the owner already holds 50 active tokens."
diagnosis = "The log event carries `reason` (expires_out_of_range, expires_malformed (a `--expires-in` that is not `<days>d`), scopes_empty, scope_unknown, name_length, nul_character, control_character, admin_scope_requires_admin, owner_bot, owner_disabled, active_limit or owner_not_service_account — the service account issue route named a user who is no service account, M3 S0) and, when forge_db::tokens::issue refused it, `user` (the owner id; `scope_unknown` and `expires_malformed` are refused by the CLI before the owner is looked up, so they carry no `user`); never the name or any token. For active_limit read the owner's tokens with `forge admin token list --user <name>`."
fix = "Correct the request. For active_limit revoke tokens that are no longer used. For owner_bot / owner_disabled / admin_scope_requires_admin the owner or the scope is the wrong choice; nothing was written."
test = "expiry_over_365_or_under_1_day_is_token_request_invalid"

[[error]]
code = "FG-AUTH-0009"
name = "AdministrationConflict"
http_status = 409
severity = "info"
user_message_ja = "管理者またはグループの Owner がいなくなるため、この操作は拒否されました。問い合わせ番号を添えて管理者に連絡してください。"
user_message_en = "This was refused because it would leave no administrator or group Owner. Contact the administrator with the request ID."
user_message_id = "Tindakan ini ditolak karena akan membuat tidak ada administrator atau Owner grup. Hubungi administrator dengan menyertakan ID permintaan."
cause = "An administration command was refused to keep forge manageable (ADR-0019 §10, Amendment D3 MR2). forge_db::users::disable refuses to disable the last active human administrator (bots, service accounts and disabled users do not count) or the last direct active Owner of a top-level group (subgroups inherit their ancestors' Owners and are not checked), or the only active Owner of a project, direct or inherited (D4 MR4; projects pending deletion are not checked); a refused disable writes nothing and revokes no token. forge_db::users::bootstrap_admin (forge admin bootstrap-admin) is refused while an active human administrator exists, and for a user that is not a human or is disabled."
diagnosis = "The log event carries `reason`: self_disable (M2 MR6: an administrator asked `POST /api/v1/admin/users/{id}/disable` for their own account; over HTTP nobody disables themself — the operator CLI `forge admin user disable` is the path, with the same guard), last_admin (with `user`, the user id being disabled), last_owner (with `user`, `group_id` — the first top-level group that would be left without a direct active Owner — or, when no group is affected, `project_id` — the first project that would be left without an active Owner — and `ownerless_groups` and `ownerless_projects`, how many), admin_exists (with `active_human_admins`), not_human or user_disabled (with `user` when promoting an existing user; `bootstrap-admin --create` refuses before any user exists, so it carries no `user`). Ids only, never names. List the group's direct owners with a privileged query on forge.group_members joined to forge.users (role = 'owner' AND state = 'active'); list the administrators with SELECT id, kind, state FROM forge.users WHERE is_admin."
fix = "There is no command yet to grant administrator rights or change group members (D3), so the guard cannot be satisfied by adding a successor first. For last_admin / last_owner follow runbook user-offboarding: with approval naming the successor, disable with `forge admin user disable <username> --force`, then at once restore an administrator with `forge admin bootstrap-admin --user <successor>` (or `--create`); top-level groups left without an Owner stay reported by forge doctor (FG-AUTH-0010) until a member-change route exists. For admin_exists: bootstrap-admin is only for a forge without an active human administrator. For not_human / user_disabled: name an active human, or use --create."
runbook = "user-offboarding"
test = "disabling_the_last_active_human_admin_is_administration_conflict"

[[error]]
code = "FG-AUTH-0010"
name = "AdministrationOrphaned"
http_status = 500
severity = "warn"
user_message_ja = "管理者またはグループの Owner がいない状態です。管理者に連絡してください。"
user_message_en = "There is no administrator or a group has no Owner. Contact the administrator."
user_message_id = "Tidak ada administrator atau sebuah grup tidak memiliki Owner. Hubungi administrator."
cause = "forge doctor (check users.administration) found forge without an active human administrator, a top-level group without a direct active Owner, or a project (not pending deletion) without any active Owner, direct or inherited (forge_db::projects::ownerless, D4 MR4). This is what a forced disable (`forge admin user disable --force`) leaves behind, or a disable / demotion done outside forge-db. Nobody can then administer forge, or manage that group's members, until it is recovered. A forge with no users at all (a new install) is reported as `warn` without this code. Since M3 S0 the check `service_accounts.ownerless` reports it too (`reason=ownerless_service_account`): an active service account whose owner is disabled (offboarding did not hand it on) or that has no profile — nobody answers for its tokens."
diagnosis = "The doctor line carries `reason` (no_admin when there is no active human administrator, otherwise ownerless_group), `active_human_admins`, `ownerless_groups` (how many top-level groups have no direct active Owner) and `group_ids` (the first 10 of them); a project finding carries `reason=ownerless_project`, `ownerless_projects` and `project_ids` (the first 10); a service account finding (check `service_accounts.ownerless`) carries `reason=ownerless_service_account`, `ownerless_service_accounts` and `user_ids` (the first 10; `gstn admin service-account view <id>` shows the owner). The audit log shows how it happened: SELECT created_at, actor_label, request_id, details FROM forge.audit_log WHERE action = 'user.disabled' AND details->>'forced' = 'true' ORDER BY id DESC."
fix = "Follow runbook user-offboarding: as an approved step, run `forge admin bootstrap-admin --user <username>` (or `--create`) to restore an administrator. Top-level groups without an Owner cannot be fixed yet (no member-change command or route exists in D3): record the listed group_ids in the incident record; the finding stays (warn) until a member-change route lands and an active user is made their Owner. Re-run forge doctor after each step. For `ownerless_service_account` follow runbook service-accounts: give the account a new owner (`gstn admin service-account update <id> --owner <user id>`) or, when it is no longer needed, disable it (`gstn user disable <id> --yes`, which revokes its tokens)."
runbook = "user-offboarding"
test = "administration_orphaned_is_reported_for_no_admin_and_an_ownerless_group"

[[error]]
code = "FG-AUTH-0011"
name = "LoginStateInvalid"
http_status = 400
severity = "info"
user_message_ja = "ログインを完了できませんでした。もう一度ログインしてください。"
user_message_en = "The sign-in could not be completed. Sign in again."
user_message_id = "Proses masuk tidak dapat diselesaikan. Silakan masuk lagi."
cause = "The browser came back to `GET /-/auth/callback` (ADR-0021 §3) without a usable login state: the state cookie `__Host-gstn_oidc` was missing, could not be opened (another key, tampered, truncated), was older than 10 minutes, or its `state` did not equal the query's; or the identity provider answered with `error=` instead of a code; or the token endpoint refused the code (`invalid_grant`: the code was already used — a replayed callback — or expired, or the PKCE verifier did not match). The state cookie is single-use: every callback answer clears it. Nothing was written."
diagnosis = "The log event `forge.auth.login_failed` carries `reason`: state_cookie_missing, state_cookie_invalid (with `detail` = truncated|version|kid|tag|json), state_expired, state_mismatch, query_missing (no `code` / `state`), idp_error (with `idp_error`, the OAuth error code only — never `error_description`), code_rejected (the token endpoint refused the code, usually `oauth_error=invalid_grant`, with `status`; a refusal of the client itself is FG-AUTH-0015 client_rejected). A burst of state_mismatch / state_cookie_missing from one client is a login-CSRF attempt or a browser that blocks cookies; one code_rejected after a double click is a replayed callback."
fix = "For a person: start the sign-in again (`/-/auth/login`) and allow cookies for GitStation. If every sign-in fails with state_cookie_invalid, `web.session_key_file` changed between login and callback or differs between processes: use the same key file everywhere. idp_error=access_denied means the person cancelled at the identity provider."
test = "login_state_failures_are_login_state_invalid"

[[error]]
code = "FG-AUTH-0012"
name = "IdTokenInvalid"
http_status = 401
severity = "warn"
user_message_ja = "ログインを完了できませんでした。問い合わせ番号を添えて管理者に連絡してください。"
user_message_en = "The sign-in could not be completed. Contact the administrator with the request ID."
user_message_id = "Proses masuk tidak dapat diselesaikan. Hubungi administrator dengan menyertakan ID permintaan."
cause = "The ID token the identity provider returned at the callback failed verification (ADR-0021 §9): its signature, its algorithm (only `auth.oidc.signing_algs`, RS256 by default, ES256 optional; never `none`, HS* or PS*), its key (`kid` required; the JWKS key must pair kty and alg: RS256 = RSA 2048..8192 bit, ES256 = EC P-256 with 32-byte x / y on the curve), `iss` (equal to the discovery issuer and `auth.oidc.issuer`), `aud` (must contain the client id; with several audiences `azp` must be the client id), `exp` / `iat` / `nbf` (60 s clock skew), `nonce` (the login's) or `sub` (1..255 characters). Nothing was written; the person is not signed in."
diagnosis = "The log event `forge.auth.login_failed` carries `reason`: malformed, alg_not_allowed (with `alg`), kid_missing, unknown_kid (also after the JWKS refetch, or within 60 s of the last refetch), key_invalid (with `detail`: base64, rsa_modulus_size, rsa_exponent, ec_coordinate_length, ec_point, crv, kty, use), key_alg_mismatch (with `alg`, `kty`), signature, issuer, audience, azp, expired, not_yet_valid (iat or nbf in the future beyond the skew), nonce, subject, missing_claim (with `claim`). The token itself is never logged. `signature` / `unknown_kid` right after a key rotation at the identity provider are expected for at most 60 s; constant ones point at a wrong `auth.oidc.issuer`, a wrong realm key or a man in the middle."
fix = "Follow runbook oidc-login: compare `auth.oidc.issuer` with the discovery document, check the realm's signing keys and algorithm (RS256), the client id and the server clock (`forge doctor` reports the clock skew to the identity provider). For key_alg_mismatch / key_invalid, fix the realm's key configuration."
runbook = "oidc-login"
test = "id_token_failures_are_id_token_invalid"

[[error]]
code = "FG-AUTH-0013"
name = "LoginNotPermitted"
http_status = 403
severity = "info"
user_message_ja = "このアカウントでは GitStation にログインできません。必要なら管理者に連絡してください。"
user_message_en = "This account cannot sign in to GitStation. Contact the administrator if you need access."
user_message_id = "Akun ini tidak dapat masuk ke GitStation. Hubungi administrator jika Anda memerlukan akses."
cause = "The identity provider signed the person in, but `authorize()` refused the admission (`SessionCreate` on `Resource::Admission`, ADR-0021 §3): the ID token has no access client role (`resource_access.<client_id>.roles` does not contain `auth.oidc.access_role`), or the GitStation account it belongs to is disabled, or it is a bot or service account (those never sign in to the web). No session was issued and no user or identity link was written."
diagnosis = "The log event `forge.auth.login_failed` carries `reason` (no_access_role, user_disabled, not_human), `action=SessionCreate` and, when the account is known, `user`. A person without the role is the expected case for someone outside the GitStation user group."
fix = "Grant the person the access role of the GitStation client in Keycloak (or the group that carries it) if they should use GitStation. A disabled account stays disabled until an administrator re-enables it (approved step, runbook user-offboarding). Bots and service accounts use tokens, not the web."
test = "admission_denials_are_login_not_permitted"

[[error]]
code = "FG-AUTH-0014"
name = "IdentityLinkConflict"
http_status = 409
severity = "warn"
user_message_ja = "このアカウントを GitStation の利用者に結び付けられませんでした。問い合わせ番号を添えて管理者に連絡してください。"
user_message_en = "This account could not be linked to a GitStation user. Contact the administrator with the request ID."
user_message_id = "Akun ini tidak dapat ditautkan ke pengguna GitStation. Hubungi administrator dengan menyertakan ID permintaan."
cause = "At the first sign-in of an identity (issuer + subject not linked yet), GitStation neither linked it to an existing user nor created one (ADR-0021 §4): an e-mail address alone never links; an employee number links only together with a verified matching e-mail, only to a human non-administrator not yet linked to this issuer, and only with `auth.oidc.auto_link = true`; a new user needs the employee number claim, a verified e-mail and a free username and e-mail. Nothing was written. Also `forge admin user link-identity` when the identity or the user is already linked."
diagnosis = "The log event `forge.auth.login_failed` (or the CLI's error) carries `reason` only — never the claims: employee_number_missing (the ID token has no `auth.oidc.employee_number_claim`), email_missing, email_unverified (`email_verified` is not true), email_mismatch (the employee number matched a user whose e-mail differs), privileged_account (the employee number belongs to an administrator: linked only by the operator), employee_number_linked (that user is linked to another subject of this issuer), auto_link_disabled (`auth.oidc.auto_link = false` and the employee number belongs to an existing user), username_unavailable (`preferred_username` missing, invalid, reserved, taken or tombstoned), email_taken (another user has the e-mail), employee_number_taken (a concurrent sign-in created a user with it first: retry), claim_invalid (with `detail`: a claim breaks a forge.users rule, e.g. an e-mail above 320 characters); CLI: subject_linked (the identity belongs to another user), already_linked (the user has an identity of this issuer), not_human (M3 S0: the user is a service account or a bot; only a person is linked to an identity)."
fix = "Follow runbook oidc-identity-link: find the person by employee number and e-mail in the identity provider and in GitStation, decide whom the identity belongs to, and link it as an approved step with `forge admin user link-identity --user <username> --issuer <issuer> --subject <sub>`; or fix the claim mappers (employee_number, email_verified) in the realm."
runbook = "oidc-identity-link"
test = "identity_link_conflicts_name_their_reason"

[[error]]
code = "FG-AUTH-0015"
name = "IdentityProviderUnavailable"
http_status = 503
severity = "alert"
user_message_ja = "認証サーバーに接続できないため、今はログインできません。ログイン済みの方はそのまま使えます。しばらくしてからもう一度お試しください。"
user_message_en = "Sign-in is unavailable because the identity provider cannot be reached. Signed-in users are not affected. Try again later."
user_message_id = "Proses masuk tidak tersedia karena penyedia identitas tidak dapat dihubungi. Pengguna yang sudah masuk tidak terpengaruh. Coba lagi nanti."
cause = "A call to the OIDC identity provider (Keycloak) failed (ADR-0021 §11): discovery, JWKS or the token endpoint did not answer in time (connect 2 s, 5 s per call), answered 5xx or an unexpected status, sent a body above 1 MiB or not the expected JSON, failed TLS against `auth.oidc.ca_file`, redirected, or the discovery document named an endpoint outside the issuer's origin; or the token endpoint refused the client itself (OAuth `invalid_client`, `unauthorized_client`, `invalid_request`: a wrong client secret, a disabled or misconfigured client), so no sign-in can succeed until an operator acts; or the 5-minute refresh check of a signed-in session (M2 MR5, call=refresh, 3 s) could not reach the token endpoint (logged as warn, the session goes on). Only new sign-ins fail: sessions already issued, git and the token API keep working (`/readyz` does not look at the identity provider)."
diagnosis = "The log event carries `call` (discovery, jwks, token, refresh — the 5-minute refresh check of a signed-in session, M2 MR5: logged as warn once per session per 5 minutes and the session goes on) and `reason`: connect_timeout, timeout, connect, tls, status (with `status`), redirect, body_too_large, body (the body broke off), request (any other transport failure), invalid_json (with `detail`), endpoint_origin (with `endpoint`), issuer_mismatch (the discovery document's issuer is not `auth.oidc.issuer`), client_rejected (call=token, with `status` and `oauth_error`: check `auth.oidc.client_id`, the client secret file and the client in Keycloak), backoff (call=jwks: a JWKS fetch failed less than 60 s ago, so no new call was made; the first failure is logged with its own reason). The response body is never logged (it may hold tokens). `forge doctor` checks auth.oidc (discovery, JWKS, the clock skew) from the server."
fix = "Follow runbook keycloak-unreachable: check that Keycloak is up and reachable from the GitStation host (`forge doctor`, then curl the issuer's `/.well-known/openid-configuration` with the configured CA), the CA file and the network path (forge never uses an environment proxy). Nothing to repair in GitStation; sign-ins resume once the identity provider answers."
runbook = "keycloak-unreachable"
test = "idp_timeout_is_identity_provider_unavailable"

[[error]]
code = "FG-AUTH-0016"
name = "CsrfRejected"
http_status = 403
severity = "info"
user_message_ja = "この操作は受け付けられませんでした。ページを再読み込みしてから、もう一度実行してください。"
user_message_en = "This action was not accepted. Reload the page and try again."
user_message_id = "Tindakan ini tidak diterima. Muat ulang halaman lalu coba lagi."
cause = "A state-changing request (not GET, HEAD or OPTIONS) failed the cross-site request checks (ADR-0021 §6, M2 MR3). Two checks run independently: (1) any request that carries fetch metadata (Sec-Fetch-Site / -Mode / -Dest) or an Origin header — whatever its credentials, Bearer and anonymous included — must have `Sec-Fetch-Site: same-origin` when present and an `Origin` exactly equal to the origin of web.base_url; (2) a request authenticated by anything but `Authorization: Bearer` on the API or raw / archive (in practice the session cookie `__Host-gstn_session`) must also send `Origin` and the header `X-GitStation-CSRF` with the session's CSRF token (HMAC-SHA256 of the cookie's secret; `GET /api/v1/session` returns it). git Smart HTTP gets check (1) only (git sends neither header)."
diagnosis = "The log event `forge.auth.csrf_rejected` carries `reason`: token_missing (no X-GitStation-CSRF header), token_mismatch (not this session's token — another session's, an old page's after a new sign-in, or a forged one), origin_missing (a session request without Origin), origin_mismatch (Origin is another origin: another subdomain, http vs https, another port; with `expected_origin`; `base_url=unset` when web.base_url is not configured), fetch_site (Sec-Fetch-Site was same-site, cross-site or none). It also carries `method`, `path` (log-safe) and, for a session, `public_id`. Header values are never logged except the expected origin. A burst of origin_mismatch from one client usually means a page of another site posting to GitStation (an attack or a misconfigured integration); a single token_mismatch after a new sign-in is a stale tab."
fix = "For a person: reload the page (it fetches the current CSRF token) and repeat the action. For an integration or script: authenticate with `Authorization: Bearer <token>` and do not send browser headers (Origin / Sec-Fetch-*) from another origin. If every browser request fails with origin_mismatch, check that web.base_url is exactly the URL people open (scheme, host and port)."
test = "csrf_rejections_name_their_reason"

[[error]]
code = "FG-AUTH-0017"
name = "LogoutTokenInvalid"
http_status = 400
severity = "warn"
user_message_ja = "ログアウトの通知を受け付けられませんでした。"
user_message_en = "The logout notification was not accepted."
user_message_id = "Pemberitahuan keluar tidak diterima."
cause = "`POST /-/auth/backchannel-logout` (OIDC Back-Channel Logout, ADR-0021 §8, M2 MR5) received a logout token that failed verification: not a form body with one `logout_token` of at most 64 KiB; its signature, algorithm or key (the ID token's rules, ADR-0021 §9); `iss` (not `auth.oidc.issuer`); `aud` (without the client id); `iat` (missing, more than 60 s in the future or more than 2 minutes old); `exp` (when present, passed beyond the 60 s skew); `events` without `http://schemas.openid.net/event/backchannel-logout`; neither `sid` nor `sub`; a `nonce` (a logout token never has one); no `jti`; or a `jti` already accepted in the last 10 minutes (a replay). No session was revoked. The caller is the identity provider's server, never a browser: a person never sees this message."
diagnosis = "The log event `forge.auth.backchannel_logout_failed` carries `reason`: body (with `detail`: content_type, too_large, form, token_missing), malformed, alg_not_allowed, kid_missing, unknown_kid, key_invalid, key_alg_mismatch, signature, issuer, audience, expired, not_yet_valid, too_old (iat older than 2 minutes: a delayed delivery or a replay), missing_claim (with `claim`: iat, jti, events, sid_or_sub), events, nonce_present, replayed (the jti was seen), replay_table_full (more than 10 000 logouts within 10 minutes). The token itself is never logged. A burst of signature / issuer from one peer is someone probing the endpoint; replayed right after a Keycloak restart can be Keycloak re-sending a delivered logout (harmless: the sessions were revoked the first time); too_old in numbers points at a clock skew (`forge doctor` reports it) or a queue at the identity provider."
fix = "Follow runbook oidc-login: check that the realm's client `gitstation` sends back-channel logouts to `web.base_url` + `/-/auth/backchannel-logout` with \"Backchannel logout session required\" on, that `auth.oidc.issuer` and the client id match the realm, and the clocks of both servers (`forge doctor`). Probing from elsewhere needs no fix: the endpoint revokes nothing without a valid signed token; block the peer at the network if it persists."
runbook = "oidc-login"
test = "logout_token_failures_are_logout_token_invalid"

[[error]]
code = "FG-AUTH-0018"
name = "LoginNotConfigured"
http_status = 503
severity = "info"
user_message_ja = "このサーバーではブラウザのログインが設定されていません。gstn と個人アクセストークンを使ってください。"
user_message_en = "Browser sign-in is not configured on this server. Use gstn and a personal access token."
user_message_id = "Proses masuk melalui browser belum dikonfigurasi di server ini. Gunakan gstn dan token akses pribadi."
cause = "`GET /-/auth/login` or `/-/auth/callback` was requested while `auth.oidc` is not configured (ADR-0021 §12). A server without browser sign-in is a valid configuration (git, gstn and the token API work), so this is not FG-SYS-0002; `forge doctor` warns `auth.oidc not configured`."
diagnosis = "The log event carries `route`. If browser sign-in was expected, the server's configuration has no `[auth.oidc]` (or FORGE_AUTH_OIDC_*) values."
fix = "Configure `auth.oidc.issuer`, `auth.oidc.client_id`, `auth.oidc.client_secret_file` (and `auth.oidc.ca_file` for an https issuer) together with `web.session_key_file`, then restart (runbook oidc-login). Until then use gstn with a personal access token."
test = "login_without_oidc_is_login_not_configured"

[[error]]
code = "FG-AUTH-0019"
name = "ServiceAccountTokenExpiring"
http_status = 500
severity = "warn"
user_message_ja = "サービスアカウントのトークンの期限が近づいています。管理者に連絡してください。"
user_message_en = "A service account's token expires soon. Contact the administrator."
user_message_id = "Token akun layanan akan segera kedaluwarsa. Hubungi administrator."
cause = "forge doctor (check service_accounts.tokens_expiring, M3 S0) found an active service account whose active tokens all expire within 14 days: nobody issued its next token yet (a token lives at most 365 days, ADR-0019). When the last one expires the integration that uses it (kanflow, a CI reporter) stops working with FG-AUTH-0001 and nothing else warns. Only doctor raises it; no request fails with it."
diagnosis = "The doctor line carries `expiring_service_accounts` (how many), `user_ids` (the first 10 service accounts), `soonest_expiry` (RFC 3339, UTC) and `within_days` (14). `gstn admin service-account tokens <id> --json` lists each account's tokens with `expires_at` and `issued_by_user_id`; `gstn admin service-account view <id>` names the owner who must arrange the rotation."
fix = "Follow runbook service-accounts (rotation): an administrator issues a new token for the account in the browser session (the service account screen, or POST /api/v1/admin/service-accounts/{id}/tokens; a token can never issue one), the owner puts it into the integration's secret file, the integration is checked, then the old token is revoked (`gstn admin service-account revoke-token <id> <token id> --yes`). Re-run forge doctor: the line is ok once a token expiring later than 14 days exists."
runbook = "service-accounts"
test = "doctor_warns_token_expiring_within_14_days"

[[error]]
code = "FG-AUTH-0020"
name = "ActAsAssertionInvalid"
http_status = 403
severity = "warn"
user_message_ja = "確認の操作が無効か、期限が切れています。GitStation の確認の画面をもう一度開いて、押し直してください。"
user_message_en = "The confirmation is invalid or has expired. Open the GitStation confirmation screen again and confirm once more."
user_message_id = "Konfirmasi tidak valid atau sudah kedaluwarsa. Buka lagi layar konfirmasi GitStation dan konfirmasi sekali lagi."
cause = "A service account (kanflow) acting for a person (`Forge-Act-As`, ADR-0025 §5) sent a `Forge-Assertion` that does not prove the person confirmed exactly this action, or claimed one that cannot be claimed. The assertion (`fga_<public_id>_<secret>`) is issued only when the person presses the confirmation in a forge session, claimed once by the integration (its secret is created at the claim and never stored), used once within 5 minutes, and bound by an HMAC to the intent, the project, the merge request, its head SHA, the target ref and the target's tip. Verification happens before anything is written; an assertion that was verified and then not used (any later refusal or failure) is consumed as `rejected`. Nothing else was written."
diagnosis = "The log line `forge.auth.act_as` (and the denial) carries `reason`: on the request — multiple_headers, malformed, unexpected (an assertion without Forge-Act-As, or on a read), missing (an approve / unapprove without one), unknown (no claimed assertion with that public id), key_retired, mac_mismatch (the row was changed or written without the key: treat as tampering), expired, consumed (used before, or a concurrent second use), wrong_integration, wrong_user (the person named by Forge-Act-As is not the one who confirmed), wrong_action, wrong_resource, sha_mismatch (the body's sha), head_changed (a push since the confirmation), target_retargeted, target_changed (the target branch moved); on `POST /api/v1/integrations/{id}/act-as/claim` — claim_unknown, claim_expired, claim_repeated. With `assertion_public_id`, `integration_id`, `actor.user`, `actor.via`. SELECT state, intent, reject_reason, issued_at, claimed_at, finished_at FROM forge.act_as_assertions WHERE public_id = '<assertion_public_id>'."
fix = "Follow runbook act-as: the person opens the confirmation screen again from kanflow and presses it (a new assertion); kanflow sends the head it showed and the sub of the claim as Forge-Act-As. mac_mismatch is a tampering signal: keep the row, check who can write forge.act_as_assertions, and rotate the act-as keys (approved runbook step)."
runbook = "act-as"
test = "act_as_approve_without_assertion_is_refused"

[[error]]
code = "FG-AUTH-0021"
name = "ContextWithheld"
http_status = 403
severity = "info"
user_message_ja = "この項目は機密の印が付いているため、AI エージェントのトークンには渡しません。人のアカウントで開いてください。"
user_message_en = "This item is marked confidential and is not given to an AI agent's token. Open it with a person's account."
user_message_id = "Item ini ditandai rahasia dan tidak diberikan kepada token agen AI. Buka dengan akun orang."
cause = "Plan 06 D-5 (M3 X5, ADR-0023 Amendment X5): what is marked confidential is never handed to an AI agent by the context API. The caller was allowed to read the project (ContextRead / MergeRequestRead decided it), but it is an agent audience — a token issued with `is_agent`, a service account or a bot (`Principal::is_agent_audience`), or the request said `Forge-Context-Audience: agent` (gstn mcp always does) — and the one item asked for is marked: a work item with `forge.work_items.confidential`, or a requirement whose specification document has `confidential: true` in its front matter (or a front matter that cannot be read: the mark may be in it, so it fails closed). The repository read routes (blob, raw, blame) refuse a file confidential at the revision read or at the default branch's tip by one rule (`forge_checks::confidential`, `reason=spec_confidential` with `path`): a specification document marked as above, or any `.md` whose `classification` (or older `confidential`; both written fails closed) is `confidential`, with its type's default from `.forge/doctypes/<type>.yml` as a floor (a type that cannot be read, a front matter that cannot be read, a document not read because of a bound, or no default branch born: confidential). The document API (plan 13 stage 3) answers such a document as an absent one instead (FG-REPO-0005 `reason=doc_confidential`, no existence oracle). Lists and diffs (the spec API, a merge request's context, compare, a commit, a merge request's diffs) leave such items out and count them in `withheld` instead of refusing (the document list leaves them out without a count). Not a fault."
diagnosis = "The log event carries `route`, `project_id`, `reason` (`work_item_confidential` or `spec_confidential`), `audience` (`agent_token`, `service_account`, `bot` or `header`) and, by reason, `work_item` or `requirement` and `path`. Read the mark: the document's front matter (gstn browse blob --project <id> --ref <rev> --path <path>), or SELECT confidential FROM forge.work_items WHERE ref = '<PBI-n>'."
fix = "Expected for an AI agent: a person reads the item with their own session or a token without `is_agent`. If the mark is wrong, correct it where it is set (the document's front matter; the work item's mark comes from kanflow). A front matter that cannot be read is fixed by fixing it (forge/spec-lint names the rule)."
test = "a_confidential_item_is_withheld_from_an_agent"

[[error]]
code = "FG-AUTH-0022"
name = "RepositoryCopyWithheld"
http_status = 403
severity = "info"
user_message_ja = "このリポジトリには機密の文書がある（または確かめられなかった）ため、AI エージェントのアカウントでは clone・fetch・アーカイブの取得や、CI のログ・診断の読み取りができません。人のアカウントを使ってください。"
user_message_en = "This repository holds a confidential document (or it could not be checked), so an AI agent's account cannot clone, fetch or download an archive of it, or read its CI logs and diagnosis. Use a person's account."
user_message_id = "Repositori ini berisi dokumen rahasia (atau tidak dapat diperiksa), sehingga akun agen AI tidak dapat melakukan clone, fetch, mengunduh arsipnya, atau membaca log dan diagnosis CI-nya. Gunakan akun orang."
cause = "Plan 06 D-5, ADR-0026 decision of 2026-11-10 (the safety net), extended to the CI outputs by ADR-0029 decision 5 (M4 C5). An AI agent audience — a token issued with `is_agent`, a service account or a bot (`Principal::is_agent_audience`) — asked for (a) a whole copy of a repository (Smart HTTP clone / fetch: `GET info/refs?service=git-upload-pack` or `POST git-upload-pack`; or `GET -/archive/{ref}.{zip|tar.gz}`; authorize() RepoRead on Resource::RepoCopy, forge_auth::authorize_repo_copy) or (b) a CI output — a job's log (`GET …/pipelines/{pipeline_id}/jobs/{job_id}/log`, CiLogRead) or a pipeline's diagnosis (`GET …/pipelines/{pipeline_id}/diagnosis`, PipelineDiagnosisRead; authorize() on Resource::CiOutput, forge_auth::authorize_ci_output) — and it was refused because a mark was not measured open. For a copy, and for a CI output with `mark_of=tip`, the default branch's tip: `tip_confidential` (forge_checks::confidential found a confidential file there — a spec document with `confidential: true`, a `.md` with `classification: confidential`, its type's default, both keys, or a front matter / type definition that cannot be read), `default_branch_unborn` (HEAD names a branch not born while other refs exist: nothing to measure against, fail closed), `tip_undecided` (the measurement did not complete: its 20 s timeout FG-GIT-0002 operation=confidential_paths, a bound of the document read, or a git error — `check_error` names its code) or `tip_not_measured` (a defect: the route did not measure). For a CI output with `mark_of=pipeline`, the pipeline's own commit as measured when the pipeline was created (`ci_pipelines.copy_mark`, looked at first: it is what the job saw): `pipeline_confidential` or `pipeline_undecided` (the measurement failed then: fail closed, ADR-0029 obligation 4). A job may copy a confidential repository (its pinned copy is never measured), so everything it prints inherits the marks. Persons are never refused; pushes (receive-pack) are unchanged. Git gets the refusal in-band (HTTP 200 and one `ERR` packet: `fatal: remote error: <message> (request_id: …)`); the archive and the CI routes get the JSON 403 (gstn and gstn mcp show it as is). The operating rule is that confidential documents live in repositories the agent's account cannot read — this refusal is the safety net. It looks only at the default branch's tip and the pipeline's commit: a confidential file only in history or on another branch is not detected. Not a fault."
diagnosis = "The log event carries `route` (`info_refs`, `upload_pack`, `archive`, `ci_log`, `ci_diagnosis`), `project_id`, `reason` (above), `audience` (`agent_token`, `service_account`, `bot`) and, for a copy, `repo_id`, `tip` (the default branch's commit), `paths` (the first confidential paths, for `tip_confidential`) and, for `tip_undecided`, `check_error` with the cause's own context (`operation`, `timeout_ms`, `bound`); for a CI output, `mark_of` (`pipeline` or `tip`), `pipeline_id` and (a log) `job_id`. Read the marks at the tip: gstn browse blob --project <id> --ref <tip> --path <path>; the pipeline's: gstn pipeline show --project <id> <pipeline_id> (`copy_mark`)."
fix = "Expected for an AI agent. Follow runbook smart-http (agents and confidential documents) for a copy and runbook checks-reporting (CI outputs) for a log or a diagnosis: move the confidential documents to a repository the agent's account cannot read (the operating rule), or read with a person's account. A wrong mark is corrected in the document's front matter (or its type's default); once the default branch's tip has no confidential file the agent can clone again (the answer is cached per repository and tip commit, so a push changes it at once). A pipeline's own mark never changes: run a new pipeline on a commit without the confidential file. `tip_undecided` from a timeout: retry; if it repeats, the repository's documents exceed the bounds — reduce them or use a person's account."
runbook = "smart-http"
test = "an_agent_cannot_clone_fetch_or_archive_a_repository_with_a_confidential_document"

[[error]]
code = "FG-GIT-0007"
name = "ProtectedRefForcePush"
http_status = 403
severity = "info"
user_message_ja = "保護されたブランチ・タグには強制プッシュできません。"
user_message_en = "Force pushes to a protected branch or tag are not allowed."
user_message_id = "Force push ke branch atau tag yang dilindungi tidak diizinkan."
cause = "A push would rewrite (non-fast-forward) a protected ref. In M1 no role, including administrators, may force-push a protected ref."
diagnosis = "The log event carries `action` and `protection` (the protection's minimum push role). Smart HTTP push (M1 phase 9 MR4, ADR-0008 option B): forge decides it before git runs when the new commit is already in the repository or the ref is an existing tag (then also `refs`, `denied_refs`, `denied_codes`, `first_denied_kind`: the whole push was refused in-band); `reason=git_denied_non_fast_forward` (with `refs`) means git refused it (`receive.denyNonFastForwards`, set for a push touching a protected branch) and forge rewrote git's `non-fast-forward` answer — other refs of that push may have been applied."
fix = "Push a new commit on top instead, or open a merge request; ask a maintainer to change the protection only if history must really be rewritten."
test = "force_push_to_protected_is_denied_even_for_admin"

[[error]]
code = "FG-GIT-0008"
name = "ProtectedRefPushNotAllowed"
http_status = 403
severity = "info"
user_message_ja = "この保護されたブランチ・タグにプッシュする権限がありません。"
user_message_en = "You are not allowed to push to this protected branch or tag."
user_message_id = "Anda tidak diizinkan melakukan push ke branch atau tag yang dilindungi ini."
cause = "The ref is protected and the caller's role is below the protection's minimum push role."
diagnosis = "The log event carries `action`, `protection` / `required_role` (the protection's minimum) and `actual_role`. On a Smart HTTP push also `refs`, `denied_refs`, `denied_codes`: the whole push was refused in-band before git ran (no ref changed)."
fix = "Push to a feature branch and open a merge request, or ask a maintainer to adjust the protection."
test = "push_below_protection_min_role_is_denied"

[[error]]
code = "FG-GIT-0009"
name = "ProtectedRefDeletion"
http_status = 403
severity = "info"
user_message_ja = "保護されたブランチ・タグは削除できません。"
user_message_en = "A protected branch or tag cannot be deleted."
user_message_id = "Branch atau tag yang dilindungi tidak dapat dihapus."
cause = "A push would delete a protected ref; protected refs cannot be deleted by push."
diagnosis = "The log event carries `action` and `protection` (the protection's minimum push role)."
fix = "Remove the protection first (maintainer) if the ref must really be deleted."
test = "delete_protected_ref_is_denied"

[[error]]
code = "FG-GIT-0010"
name = "ReservedRefNamespace"
http_status = 403
severity = "info"
user_message_ja = "この名前の ref には push できません（GitStation が管理する領域です）。"
user_message_en = "This ref cannot be pushed: it is in a namespace managed by GitStation."
user_message_id = "Ref ini tidak dapat di-push: berada di namespace yang dikelola GitStation."
cause = "A push targeted a ref outside refs/heads/ and refs/tags/ (for example refs/merge-requests/*, refs/replace/*, refs/meta/*). Those namespaces are written only by forge; a client-pushed replace ref could make a reviewed commit show other content."
diagnosis = "The log event carries `action`. The rejected ref name is in the push command list (log only)."
fix = "Push branches under refs/heads/ and tags under refs/tags/ only."
test = "reserved_ref_namespace_is_rejected_even_for_admins"

# ── M1 phase 9 MR4: pushing over Smart HTTP ───────────────────────
[[error]]
code = "FG-GIT-0011"
name = "AmbiguousRefName"
http_status = 400
severity = "info"
user_message_ja = "オブジェクト ID と区別できない名前のブランチ・タグは作れません。"
user_message_en = "A branch or tag name that looks like an object ID is not allowed."
user_message_id = "Nama branch atau tag yang terlihat seperti ID objek tidak diizinkan."
cause = "A push named a ref whose branch or tag name (for other refs: the name after refs/) is 40 or 64 hexadecimal digits. git resolves such a name as an object id before it looks at refs, so `git checkout <name>` or a merge request against it would silently use a commit instead of the ref."
diagnosis = "The log event carries `reason=object_id_like` and `len` (40 or 64); the push was refused as a whole before git ran (the refusal is in-band: `ng <ref> FG-GIT-0011 ...`, see `denied_refs`)."
fix = "Rename the branch or tag (e.g. add a prefix such as `fix-`) and push again."
test = "a_hex_like_ref_name_is_ambiguous"
# ── end M1 phase 9 MR4 ─────────────────────────────────────────────────

# ── M1 phase 9 MR2: recording an applied push ─────────────────────────
[[error]]
code = "FG-GIT-0012"
name = "PushRecordFailed"
http_status = 500
severity = "alert"
user_message_ja = "プッシュは反映されましたが、その記録を保存できませんでした。問い合わせ番号を添えて管理者に連絡してください。"
user_message_en = "The push was applied, but its record could not be saved. Contact the administrator with the request ID."
user_message_id = "Push sudah diterapkan, tetapi catatannya tidak dapat disimpan. Hubungi administrator dengan menyertakan ID permintaan."
cause = "git updated the refs of a push (outside any database transaction, ADR-0008), but the `repository.pushed` audit row and event could not be written afterwards (reason `record_failed`: forge_db::repositories::record_push failed on every attempt — the database was unreachable or slow, see `cause_code`). The repository is correct; only the audit trail and the integration feed (kanflow, webhooks) miss this push until it is replayed. Also: `forge admin repo record-push --from-log` could not use the log it was given (reason `push_log_invalid` with `field`, `push_log_empty`, `push_log_unreadable`, `push_log_too_large`): the push is still not recorded."
diagnosis = "The log event carries `reason`, `repo_id`, `refs` (updates in the push), `attempts`, `cause_code` (the code of the last failure: FG-DB-0001 unreachable, FG-DB-0002 query failed or timed out, FG-DB-0010 the record was refused) and the push's `request_id`. The same request id has one earlier `event=forge.git.push_applied` line (info) with the full ref list in `push`: that line is the replay input. Check the database first (forge doctor, runbook db-unavailable). For push_log_*: `field` names the part of the line that did not parse (the value is not logged), with `line`; `field=project_id` / `user_id` (with `push`, the push's position in the file) means the line names a repository of another project or a pusher that does not exist — the replay checks every push against the database before the first write and writes nothing then."
fix = "Once the database is healthy, replay the push from its log line as an approved runbook step: extract the `forge.git.push_applied` line(s) of the request id into a file and run `forge admin repo record-push --from-log <file>`. The replay is idempotent (the dedup key is built from the logged request id and the updates): a push that was in fact recorded is reported as already recorded. Never write audit rows or events by hand. Since M1 phase 9 MR4 a push logs two `forge.git.push_applied` lines: `stage=minimal` as soon as git exited (kinds from the zero sides, no commits) and `stage=final` (kinds and commits) — replay the `final` one when it exists, else the minimal one (same dedup key). `reason=reconcile_failed` (with `source`, `commands` = every `ref old new` of the push, `cause_code`): git's answer was not readable (or git failed / was killed) and the repository could not be read either, so forge does not know which refs changed — compare `git --git-dir=<path> for-each-ref` with `commands` (read only) and write the push_applied line for the applied ones before replaying."
runbook = "push-record-failed"
test = "a_push_that_cannot_be_recorded_is_push_record_failed"
# ── end M1 phase 9 MR2 ─────────────────────────────────────────────────

[[error]]
code = "FG-GIT-0013"
name = "GitRequestTooLarge"
http_status = 413
severity = "info"
user_message_ja = "Git の要求が大きすぎます。"
user_message_en = "The Git request is too large."
user_message_id = "Permintaan Git terlalu besar."
cause = "A Smart HTTP request body went over a forge limit: the decompressed size of a gzip request body (`Content-Encoding: gzip`), or a body or command-list limit of the route. Decoding stops at the limit, so a compressed bomb never expands past it."
diagnosis = "The log event carries `limit` (which limit: `gzip_decompressed`, `request_body` — the raw body of an upload-pack request over `git.http.fetch_request_max_bytes`, `command_section` — a push's command list over 1 MiB, `push_body` — a push body, raw or decompressed, over `git.http.push_max_bytes` + 1 MiB; git's own `receive.maxInputSize` refuses an oversized pack in-band as `unpack` error), `max_bytes` and the route context (`service`). `limit=refused_push_drain` appears only as `drain_error` on a refused push (forge stopped reading the body of a push it had refused after 64 MiB). A legitimate client hitting it usually means a fetch negotiation with very many haves/wants (huge ref counts) or a push over the push size limit."
fix = "Nothing to fix for a hostile or broken client. For a legitimate one, check the repository's ref count; raise the limit (configuration `git.http.*`, M1 phase 9 MR3/MR4) only with that evidence."
test = "gzip_bomb_stops_at_cap"

[[error]]
code = "FG-GIT-0014"
name = "GitProtocolInvalid"
http_status = 400
severity = "info"
user_message_ja = "Git のプロトコルとして正しくない要求です。"
user_message_en = "The request is not valid for the Git protocol."
user_message_id = "Permintaan tidak valid untuk protokol Git."
cause = "A Smart HTTP request broke the Git wire protocol before git was started, or forge refused a protocol feature or an object the request wants (an object no ref reaches: removed by a force push or a deleted branch). git itself never saw the bytes. The want refusals reach the client in-band (HTTP 200 with an `ERR` packet), so git prints `remote error:` with this message and the request id."
diagnosis = "The log event carries `reason`: `pkt_line` (with `detail`: `length_reserved` for 0001-0003 where not allowed, `length_too_large` over 65520, `non_hex`, `truncated`, `bad_sideband`), `gzip` (the gzip body is corrupt, truncated, or has data after its end), `content_type` (wrong or missing request Content-Type for the service), `content_encoding` (a request Content-Encoding other than gzip or identity), `want_invalid` (an upload-pack `want` line that is not `want <40 or 64 lower-case hex>`), `command_unsupported` (a protocol v2 command other than `ls-refs` / `fetch`, with `command`), `filter_unsupported` (a `filter` naming `sparse`, e.g. `sparse:oid=<blob>`, which would read a blob by id), `deepen_not_hidden` (a `deepen-not` naming a hidden merge request ref `refs/merge-requests/…`, M3 R1b: git would resolve it on the server), `too_many_wants` (more non-commit wants than `git.http.max_object_wants`, with `objects`, `max_object_wants`), `want_unreachable` (an upload-pack request wants an object that no ref reaches — ADR-0007 option (a): forge checks every `want` before upload-pack starts and answers with an in-band `ERR` packet; `wants`, `unreachable`, `commits`, `objects` count them, `first_unreachable` is the first such id, `walked` the objects the walk read, `check_ms` the cost of the check), `too_many_commands` (a push with more ref updates than the limit, 1000; `max_commands`), `report_status_required` (a push client without the report-status capability: forge answers refusals in that report), `push_cert` (signed pushes are refused), and for receive-pack (M1 phase 9 MR4, `service=git-receive-pack`): `command_invalid` (with `detail`: `shape`, `object_id` — not the negotiated object format, `unchanged_ref` — old and new equal or both zero, `ref_bytes` — a ref name with control characters, spaces or invalid UTF-8, `capabilities_bytes`, `capabilities_not_first` — capabilities on a later command, `shallow_id`, `special_packet`, `data_after_empty_section` — bytes after git's empty probe request), `capability_unsupported` (with `capability`: a capability forge's receive-pack does not advertise, e.g. `push-options`, `side-band`, an unknown `object-format`), `duplicate_ref` (the same ref twice in one push), `shallow_misplaced` (a `shallow` line after the first command), `git_refused` (git refused a push and its own words — an `unpack` error, an `ng` reason outside git's short ones, a fatal side-band message — were replaced for the client by this code and the request id; the originals are in `git_messages`, e.g. fsck findings such as `missingEmail`). Clients are normally real git; frequent occurrences from one address point at a scanner or a broken proxy that alters bodies."
fix = "Nothing to fix server-side for a broken or hostile client. A git client that hits `report_status_required` or `push_cert` needs a normal `git push` (no `--signed`). A proxy that rewrites bodies must pass them through unchanged."
test = "pkt_line_rejects_invalid_lengths"

[[error]]
code = "FG-GIT-0015"
name = "GitClientDisconnected"
http_status = 499
severity = "info"
user_message_ja = "接続が途中で切れたため、Git の処理を中止しました。"
user_message_en = "The connection was closed before the Git operation finished; it was stopped."
user_message_id = "Koneksi terputus sebelum operasi Git selesai; operasi dihentikan."
cause = "The client went away (or the request was cancelled) while a streaming git subprocess was running; forge killed git together with its helpers (process group / Job Object) and reaped it. The user never sees this response; the code exists for the log."
diagnosis = "The log event carries `subcommand`, `reason` (`client_disconnected` when the HTTP layer noticed, `dropped` when the request future was cancelled), `bytes_in`, `bytes_out` and `duration_ms`; `phase=request_body` (no git was started: the client went away while forge read the request body). Logged with the request id and `route`, `project_id`, `repo_id` by forge-web. Many for one client at the same byte counts point at a proxy timeout or a client-side limit; spread across clients, at network trouble."
fix = "Nothing for an isolated case. For repeated ones, compare `duration_ms` with the proxy's timeouts (reverse proxy read/send timeout) and the client's `http.lowSpeedTime`. A receive-pack is killed this way only while its request body is still arriving (`phase=request_body`, route `receive_pack`, M1 phase 9 MR4): no ref has changed then; once the body is complete receive-pack runs to its end even if the client goes away. See runbook smart-http for a stale `.lock` file."
runbook = "smart-http"
test = "client_disconnect_kills_git_and_is_git_client_disconnected"

# ── M3 R5 review round 5: the commits a push introduced ───────────────
[[error]]
code = "FG-GIT-0016"
name = "PushCommitsIncomplete"
http_status = 500
severity = "warn"
user_message_ja = "プッシュは反映されましたが、プッシュしたコミットの一覧を最後まで記録できませんでした。問い合わせ番号を添えて管理者に連絡してください。"
user_message_en = "The push was applied, but the list of the commits it brought could not be recorded in full. Contact the administrator with the request ID."
user_message_id = "Push sudah diterapkan, tetapi daftar commit yang dibawanya tidak dapat dicatat seluruhnya. Hubungi administrator dengan menyertakan ID permintaan."
cause = "After an applied push, forge lists the commits it introduced (every commit no ref reached before the push, against a snapshot of the ref tips read before receive-pack started; ADR-0024 §8.3) to write one `push_commits` row per commit for the committer rule. The listing stopped early or could not run: `reason=cap` (more than 20 000 new commits, forge_core::MAX_PUSHED_COMMITS), `deadline` (the 30 s bound), `snapshot_failed` (the ref snapshot before the push failed, see `cause_code`), `git_failed` (rev-list failed, see `cause_code`), `record_fallback` (the record attempts with the rows failed or timed out — under database load — and the final attempt wrote the audit row without them; `dropped` counts the rows not written). The push and its audit row are fine; the audit row carries `push_commits_incomplete: true` and the commits not listed have no row, so a merge request whose range holds one has unknown committers (`committers_unknown`, `push_record_missing`) and counts no approval. Also logged by the merge job (`event=forge.review.merge_commit_unattributed`, `reason=merge_pushers_unknown:<why>` with `merge_id`): a merge or squash commit is attributed to the requester and every pusher of the merged range, and when those pushers cannot be told (`push_record_missing`, `range_too_long`, `git_failed`, `db_failed`, `deadline`, `merge_lock_lost`) the merge commit gets no row at all (fail closed). The user never sees this code: the push or the merge itself succeeded."
diagnosis = "One warn event per push with `error_code`, `request_id` (the push's), `reason`, `listed` (rows written), `refs` (refs in the snapshot), `listing_ms`, `repo_id` (`record_fallback`: `dropped`, `attempts`), and `cause_code` for snapshot_failed / git_failed. The same request id's `repository.pushed` audit row has `push_commits_incomplete: true`. Every push also logs `event=forge.git.push_commits_listed` (info) with `refs`, `listed`, `listing_ms`: rising `listing_ms` with `refs` points at a repository with very many refs."
fix = "Nothing is wrong with the repository. A merge request blocked by it (merge-blocked runbook, `committers_unknown`) is unblocked by giving the commits new ids — the author amends or runs `git rebase --force-rebase` and pushes (a plain push of the same commits writes no row: they are no longer new). For an import or a huge push whose pushers are known, an administrator may backfill rows with the approved procedure in runbook merge-blocked."
runbook = "merge-blocked"
test = "an_incomplete_listing_logs_one_warn_with_its_reason"

# ── M3 R6: the direct-push ban of a protected branch ──────────────────
[[error]]
code = "FG-GIT-0017"
name = "ProtectedRefDirectPushForbidden"
http_status = 403
severity = "info"
user_message_ja = "このブランチには直接 push できません。マージリクエストを作成してマージしてください。"
user_message_en = "This branch cannot be pushed to directly. Open a merge request and merge it."
user_message_id = "Branch ini tidak dapat di-push secara langsung. Buat merge request lalu lakukan merge."
cause = "The branch is protected and a matching rule's merge rule forbids direct pushes (`protected_ref_merge_rules.direct_push_forbidden`, M3 R6, ADR-0024 §4.3, §12): a push may neither create nor move it — for every caller, administrators included (like force pushes and deletions of a protected ref). Merging a merge request is not affected (`MergeRequestMerge` does not read the ban). The whole push was refused in-band before git ran (no ref changed)."
diagnosis = "The log event carries `action=RepoPush`, `reason=direct_push_forbidden` and `protection` (the protection's minimum push role); on a Smart HTTP push also `refs`, `denied_refs`, `denied_codes`. Which rule bans it (read-only): GET /api/v1/projects/<id>/protected-refs (the rules with their `merge_rule`)."
fix = "Push to a feature branch, open a merge request and merge it. A Maintainer (Owner for an Owner-level protection) lifts the ban (`gstn merge-rule set --project <id> --rule-id <n> --direct-push-forbidden false`) or removes it (`gstn merge-rule remove`). When a broken CODEOWNERS also blocks the fix's merge request, suspend CODEOWNERS enforcement instead (runbook codeowners)."
runbook = "merge-blocked"
test = "a_direct_push_to_a_branch_with_the_ban_is_refused"

# ── M3 O3: repository maintenance (gc / pack-refs / commit-graph / fsck) ─
[[error]]
code = "FG-GIT-0018"
name = "RepositoryMaintenanceFailed"
http_status = 500
severity = "warn"
user_message_ja = "リポジトリの定期の保守に失敗しました。問い合わせ番号を添えて管理者に連絡してください。"
user_message_en = "The scheduled maintenance of the repository failed. Contact the administrator with the request ID."
user_message_id = "Pemeliharaan terjadwal repositori gagal. Hubungi administrator dengan menyertakan ID permintaan."
cause = "A step of the `repository.maintain` job (M3 O3, ADR-0024 \"実装で決めたこと（O3）\") failed: `git gc --cruft --prune=<grace>` (with `-c gc.packRefs=false`, bitmaps, no commit-graph), `git pack-refs --all` (under the merge lock), `git commit-graph write --reachable`, or the object / ref counts. git exited non-zero or printed output forge cannot read (`reason=fsck_unusable`: fsck exit 128 because git cannot open the repository at all — not a repository, dubious ownership — which is not a finding about the objects); nothing a user did. A timeout of a step stays FG-GIT-0002 (`step`, the step's process tree killed) and no free git slot FG-GIT-0004. The repository keeps working (clone, push, merge do not depend on maintenance), but unreferenced objects (trial merges, superseded merge commits, force-pushed history) are not pruned and packs are not consolidated while it fails. doctor `repositories.maintenance` turns this into an alert after two consecutive failures of one repository (`reason=failing`), or when a repository is past its due time by more than one interval (`reason=overdue`), when no run succeeded for twice the interval (`reason=no_recent_success`: a repository skipped every night — a push or another gc always in progress — is never `failed` nor overdue), or when a row is still `running` past the job lease (`reason=stale_running`: the run crashed and was not reaped yet; the scheduler records such a run as `failed` with FG-DB-0007 and counts it)."
diagnosis = "One warn event `forge.git.maintenance_completed` with `outcome=failed`, `error_code`, `request_id` (the job's), `repo_id`, `step` (`gc`, `pack_refs`, `commit_graph`, `counts`), `exit_code` and the redacted head of git's `stderr`; `reason=unexpected_output` (with `subcommand`) when `count-objects -v` / `for-each-ref` printed something forge cannot read. The ledger row (read-only): `SELECT repo_id, outcome, error_code, failures, last_started_at, last_finished_at, next_due_at FROM forge.repository_maintenance WHERE repo_id = <id>`. `forge doctor` `repositories.maintenance` lists failing and overdue repositories. Reproduce read-only with `git -C <path from forge admin repo-path> count-objects -v` and `git fsck --connectivity-only --no-dangling`."
fix = "Act on git's stderr: disk full or permissions on the storage root (runbook repo-storage), a stale lock file (`gc.pid` older than 12 h is ignored by git; a `packed-refs.lock` or `<ref>.lock` older than the longest push needs approval to remove — runbook repo-maintenance), or corruption (fsck → FG-GIT-0019). Then run the maintenance again: `forge admin repo maintain <repo_id>` (enqueues one job)."
runbook = "repo-maintenance"
test = "a_failing_gc_is_repository_maintenance_failed"

[[error]]
code = "FG-GIT-0019"
name = "RepositoryCorrupt"
http_status = 500
severity = "alert"
user_message_ja = "リポジトリの整合性の確認で問題が見つかりました。問い合わせ番号を添えて管理者に連絡してください。"
user_message_en = "The integrity check of the repository found a problem. Contact the administrator with the request ID."
user_message_id = "Pemeriksaan integritas repositori menemukan masalah. Hubungi administrator dengan menyertakan ID permintaan."
cause = "`git fsck` of the maintenance job (M3 O3: `--connectivity-only` with every run, a full check once per `maintenance.fsck_interval_days`) exited non-zero: an object a ref (or a merge request version ref) reaches is missing or unreadable, or (full) an object is malformed. Clones of the affected history, merges and the browse API can fail on that object. Never caused by a user action alone: storage (disk, file system, a restore that missed files), a process killed mid-write outside forge's own steps, or a manual change in the bare repository."
diagnosis = "One alert event `forge.git.maintenance_completed` with `outcome=corrupt`, `error_code`, `repo_id`, `mode` (`connectivity` / `full`), `exit_code`, `findings` (the number of lines fsck printed), `first_finding` and the head of `stdout` / `stderr` (object ids and ref names only, never content). The ledger row has `outcome = 'corrupt'`, `error_code = 'FG-GIT-0019'`; doctor `repositories.integrity` lists every repository whose last fsck failed. Confirm read-only: `git -C <path> fsck --connectivity-only --no-dangling` (and `--full` for a malformed object), `git -C <path> cat-file -t <id>` for each finding."
fix = "Do not run gc or prune on the repository (it would drop what may still be recoverable) — the maintenance job itself does not prune a repository whose fsck failed. Follow runbook repo-maintenance: find the objects in a clone (developers' clones, the GitLab mirror, the last backup) and bring them back with an approved step; then run `forge admin repo maintain <repo_id>` and check that `repositories.integrity` is clean."
runbook = "repo-maintenance"
test = "fsck_reports_corruption"

[[error]]
code = "FG-GIT-0020"
name = "RepositoryRefLockStale"
http_status = 500
severity = "alert"
user_message_ja = "リポジトリの ref のロックが残っています。問い合わせ番号を添えて管理者に連絡してください。"
user_message_en = "A ref lock of the repository was left behind. Contact the administrator with the request ID."
user_message_id = "Kunci ref repositori tertinggal. Hubungi administrator dengan menyertakan ID permintaan."
cause = "`packed-refs.lock` exists in a repository and nothing is writing it: a git that held it was killed without its signal handlers running (SIGKILL, a Windows TerminateProcess, a host crash). While it stays, every push that deletes a packed ref (a branch or tag that pack-refs packed, a version ref purge) and every `update-ref` that needs it fails after the 10 s wait (`core.packedRefsTimeout`), and the maintenance's pack-refs fails too. The maintenance removes the lock its own killed pack-refs left (only when it is not older than the step, under the merge lock); a lock older than the step is someone else's and is left for a person (M3 O3 review)."
diagnosis = "Two sources: the maintenance job (`event=forge.git.maintenance_lock_left`, error level, `repo_id`, `age_secs`, `request_id` of the job) after a failed pack-refs found a lock older than its step; `forge doctor` `repositories.stale_locks` found `packed-refs.lock` older than 10 minutes (`repositories`, `max_age_secs`, `repo_ids`, `checked`, `truncated`). Read-only: `forge admin repo-path <repo_id> --storage-root <root>`, `ls -la <path>/packed-refs.lock` (time), and whether a git runs on that path (`pgrep -af 'git.*<repo_id>.git'` / Task Manager)."
fix = "When no git runs on the repository and the lock is older than the longest push (`git.http.timeout_ms`, default 1 h): [MUTATING — needs approval] move it aside (`mv <path>/packed-refs.lock <path>/packed-refs.lock.stale-<date>`; rollback: move it back), then `git --git-dir=<path> show-ref | head` and `forge admin repo maintain <repo_id>`. Never remove a lock while a git process on that repository is running (runbook repo-maintenance)."
runbook = "repo-maintenance"
test = "a_stale_packed_refs_lock_is_reported"

# ── M3 X8: push checks (large files, secrets) in the pre-receive hook ──
[[error]]
code = "FG-GIT-0021"
name = "PushBlobTooLarge"
http_status = 413
severity = "info"
user_message_ja = "プッシュに上限より大きいファイルが含まれていたため、プッシュ全体を拒否しました。ファイルを履歴から取り除いてからもう一度プッシュしてください。"
user_message_en = "The push contained a file larger than the limit, so the whole push was refused. Remove the file from the history and push again."
user_message_id = "Push berisi berkas yang lebih besar dari batas, sehingga seluruh push ditolak. Hapus berkas itu dari riwayat lalu push lagi."
cause = "The pre-receive hook (`forge hook pre-receive`, M3 X8, ADR-0008 amendment X8) found a blob larger than `git.http.push_max_blob_bytes` (default 100 MiB) among the objects the push brings. The size check reads every object git received for the push (the quarantine's own object directory, streamed: `cat-file --batch-all-objects`), so it is complete whatever the push contains — a blob only an annotated tag names, or one hidden behind padding that stops the secret scan early, is sized all the same; a size check that cannot finish refuses the push (FG-GIT-0023 `size_check_failed`). git refused the whole push (`ng <ref> pre-receive hook declined` for every ref); the quarantined objects are discarded, no ref changed. A blob already in the repository never trips the check."
diagnosis = "The pusher's terminal shows `remote: FG-GIT-0021 …` with one line per file: its path, its size, the limit and the commit that adds it (never the content). One info log line with `error_code`, `request_id` and in `context`: `event=forge.git.push_checked`, `verdict=refused`, `findings`, `rules`, `first_rule=large_blob`, `first_path`, `first_blob`, `first_commit`, `objects`, `repo_id`. Read-only on the pusher's side: `git rev-list --objects <commit> --not --remotes | git cat-file --batch-check='%(objectsize) %(rest)' | sort -n | tail`."
fix = "The pusher removes the file from the commits not yet pushed (`git rm --cached <path>` and `git commit --amend`, or `git rebase -i` / `git filter-repo` for an older commit) and pushes again; large binary content belongs in an artifact store, not in git. When the file is legitimate, an administrator raises `git.http.push_max_blob_bytes` (configuration, restart) — runbook push-checks."
runbook = "push-checks"
test = "a_push_with_a_large_file_is_refused_with_fg_git_0021"

[[error]]
code = "FG-GIT-0022"
name = "PushSecretDetected"
http_status = 422
severity = "warn"
user_message_ja = "プッシュに秘密情報（鍵やトークン）らしい内容が含まれていたため、プッシュ全体を拒否しました。秘密を履歴から取り除き、漏れた可能性のある秘密は失効させてください。"
user_message_en = "The push contained what looks like a secret (a key or a token), so the whole push was refused. Remove it from the history and revoke any secret that may have leaked."
user_message_id = "Push berisi sesuatu yang tampak seperti rahasia (kunci atau token), sehingga seluruh push ditolak. Hapus dari riwayat dan cabut rahasia yang mungkin bocor."
cause = "The pre-receive hook (M3 X8) found a high-confidence secret pattern in a text blob the push brings: `private_key` (a PEM / OpenSSH / PGP private key header), `aws_access_key_id`, `github_token`, `gitlab_token`, `slack_token`, `google_api_key`, `gitstation_token` (`fgp_` / `gss_`) or `gitstation_webhook_secret` (`whsec_`). Placeholder bodies (few distinct characters, `EXAMPLE`) do not match; a file containing the marker `forge:allow-secret` is a reviewed false positive and is accepted (counted as `allowed`; serve logs each waiver as `forge.git.push_check_waived` with `rule`, `path`, `blob`). Blobs above 1 MiB and binary blobs (a NUL in the first 8000 bytes) are not scanned for secrets. git refused the whole push; the quarantined objects are discarded, no ref changed — but the secret has left the pusher's machine."
diagnosis = "The pusher sees `remote: FG-GIT-0022 …` with one line per finding: the rule, the path and the commit (never the matched value). One warn log line with `error_code`, `request_id` and in `context`: `event=forge.git.push_checked`, `verdict=refused`, `findings`, `rules`, `first_rule`, `first_path`, `first_blob`, `first_commit`, `objects`, `bytes_scanned`, `allowed`, `repo_id` — the value is in no log line."
fix = "Treat the secret as leaked if it was real: revoke / rotate it first (runbook secret-removal, step 1). Then remove it from the unpushed commits (`git commit --amend`, `git rebase -i`, `git filter-repo --replace-text`) and push again. For a synthetic test fixture, add the marker `forge:allow-secret` to the file (a comment line) — the reviewer sees it in the merge request. Runbook push-checks."
runbook = "push-checks"
test = "a_push_with_a_private_key_is_refused_with_fg_git_0022"

[[error]]
code = "FG-GIT-0023"
name = "PushCheckFailed"
http_status = 500
severity = "alert"
user_message_ja = "プッシュの検査を実行できなかったため、プッシュを拒否しました。問い合わせ番号を添えて管理者に連絡してください。"
user_message_en = "The push checks could not run, so the push was refused. Contact the administrator with the request ID."
user_message_id = "Pemeriksaan push tidak dapat dijalankan, sehingga push ditolak. Hubungi administrator dengan menyertakan ID permintaan."
cause = "The push checks (M3 X8) did not complete as designed. In the hook (`forge hook pre-receive`; the push is refused — fail closed): `reason=env_missing` (no `FORGE_PUSH_CHECK_DIR` / run directory), `policy_unreadable` / `policy_invalid` (the run's policy file written by `forge serve`), `storage` (the repository path from the policy), `quarantine_invalid` (git's `GIT_OBJECT_DIRECTORY` / `GIT_ALTERNATE_OBJECT_DIRECTORIES` are not the repository's quarantine), `stdin_invalid` (git's update lines), `git_failed` (rev-list / cat-file / log failed: `cause_code`), `size_check_failed` (the complete size check of the received objects could not finish — `detail` spawn / git / read / unreadable, `cause_code` FG-GIT-0002 for its 120 s bound; never let through), `result_write` (the result file). In `forge serve` after receive-pack exited: `hook_not_run` (git applied refs but no result of this push's hook exists — the hook was skipped, e.g. the hooks directory was replaced or the binary was not executable; the refs were updated unchecked: an alert), `hook_no_result` (git reported `pre-receive hook declined` without a result: the hook crashed or could not start, e.g. `FORGE_PUSH_CHECK_EXE` not runnable), `hook_unknown` (no result, and the repository could not be read to say whether refs changed — treat as `hook_not_run`), `result_invalid` (unreadable result or another run's nonce), `run_dir` (the run directory could not be created or removed); at start-up `exe_unknown` / `exe_unusable` (`forge serve` could not find its own binary, or its path cannot be run by the hook script: the server does not start). A hooks directory forge did not write (`FG-GIT-0001 reason=hooks_dir`: `push_hook_missing`, `push_hook_mismatch`, `push_hook_not_executable`, `unexpected_entry`) also stops the start, and refuses a push when it changes later. Timeouts and caps are not this code: they make the scan incomplete (FG-GIT-0024)."
diagnosis = "In `forge serve`'s log: one alert event with `error_code=FG-GIT-0023`, `request_id`, `reason`, `repo_id`, `applied` (refs git updated), and the hook's own `detail` / `cause_code` when it wrote a failed result. The pusher saw `remote: FG-GIT-0023 … (request_id: …)`. Check read-only: the hook script `<storage root>/push-hooks/pre-receive` (exactly the generated three lines, mode 0700), that `forge` (the serve binary, `FORGE_PUSH_CHECK_EXE`) runs `forge hook pre-receive` (it prints FG-GIT-0023 `env_missing` without the run directory), and `<storage root>/push-checks/` for stale run directories."
fix = "Follow runbook push-checks: fix the cause named by `reason` (restore the hook script by moving the directory aside and letting forge regenerate it, redeploy a binary that runs, fix permissions of the storage root), then ask the pusher to push again. For `hook_not_run`, the pushed refs were not checked: run the checks by hand on the push's range (runbook push-checks, \"unchecked push\") and treat a finding like FG-GIT-0021 / FG-GIT-0022."
runbook = "push-checks"
test = "a_hook_without_its_policy_fails_closed"

[[error]]
code = "FG-GIT-0024"
name = "PushCheckIncomplete"
http_status = 500
severity = "warn"
user_message_ja = "プッシュは反映されましたが、大きすぎるため一部の内容を検査できませんでした。"
user_message_en = "The push was applied, but part of it was too large to be checked."
user_message_id = "Push sudah diterapkan, tetapi sebagian isinya terlalu besar untuk diperiksa."
cause = "The push checks (M3 X8) stopped at a bound and let the push through (fail open with a warn, ADR-0008 amendment X8): `reason=objects_cap` (more than 500 000 new objects, or the object list did not fit its output cap), `bytes_cap` (more than 256 MiB of text blobs to scan for secrets), `deadline` (the 60 s bound of the secret scan), `large_blob_unscanned` (a text blob over 1 MiB and under the size limit was not scanned for secrets; `skipped_large` counts them). Binary blobs are counted (`skipped_binary`) but do not make it incomplete: the rules are text patterns. Only the secret scan fails open: the size check is always complete (or the push is refused, FG-GIT-0023). A finding made before the bound still refuses the push (FG-GIT-0021 / 0022). Typical for an initial import of a large repository."
diagnosis = "One warn log line with `error_code=FG-GIT-0024`, `request_id` and in `context`: `event=forge.git.push_checked`, `verdict=accepted`, `incomplete` (the reason), `objects`, `pack_objects`, `blobs_scanned`, `bytes_scanned`, `skipped_large`, `skipped_binary`, `repo_id`. A complete accepted check logs the info event `forge.git.push_checked` instead. The pusher saw `remote: FG-GIT-0024 …`."
fix = "Nothing is broken. If the push may hold secrets (an import from outside), scan the range by hand (runbook push-checks, \"unchecked push\"). Splitting a huge initial push into several pushes of older history first keeps each one within the bounds."
runbook = "push-checks"
test = "a_scan_past_its_byte_cap_is_incomplete_and_accepted"

# --- WEB: the HTTP layer (forge-web) ----------------------------------------

[[error]]
code = "FG-WEB-0001"
name = "RouteNotFound"
http_status = 404
severity = "info"
user_message_ja = "指定された URL は存在しません。"
user_message_en = "The requested URL does not exist."
user_message_id = "URL yang diminta tidak ada."
cause = "No registered route matches the request path: no fixed route, and the dispatcher (ADR-0015) refused the raw path by its string rules or found no scoped route for its word and method."
diagnosis = "The `context` field of the log event contains `method=`, `path=` (the raw path, cut to 256 characters with control and invisible characters escaped — `log_safe_path`), `reason=` and `part=`. `reason=path_rejected`: the path breaks a string rule; `part` says where (`path`, `namespace`, `tail`, `git`, `query`, `instance`) and `rule` which rule (e.g. `empty_segment`, `dot_git_placement`, `malformed_escape`, `invisible`, `too_long`). `reason=unknown_route`: the word is not served — `part=word` (an unknown word after `/-/`), `part=reserved_top_level` (`/api/…` and the other reserved top-level names), `part=instance`, `part=method`, or `part=route` with `route=` (a known word with no route for this method yet, e.g. `raw`, `archive`). (`info/refs` without exactly one known `service` is FG-WEB-0007 since M1 phase 9.) Compare with `Git/docs/authz/routes.generated.json` (scoped routes) and `Git/docs/api/openapi.json` (fixed routes), and replay the path against `tests/fixtures/url-vectors.json`."
fix = "Use a documented route; for a client, check the API version prefix (/api/v1)."
test = "unknown_route_is_route_not_found"

[[error]]
code = "FG-WEB-0002"
name = "RequestTimeout"
http_status = 503
severity = "warn"
user_message_ja = "処理が時間内に終わりませんでした。しばらくしてから再度お試しください。"
user_message_en = "The request did not finish in time. Try again later."
user_message_id = "Permintaan tidak selesai tepat waktu. Coba lagi nanti."
cause = "A request exceeded the server's request timeout and was cancelled."
diagnosis = "The `context` field of the log event contains `method=`, `path=` and `timeout_ms=`. Find the slow dependency in the same request_id's events (DB, git, LLM). `operation=git_request_body` (with `kind=idle|total`, `bytes_in`; route `upload_pack`): a Smart HTTP request body arrived too slowly (`kind=idle`: `git.http.idle_timeout_ms`; `kind=total`: the whole body within `git.http.body_timeout_ms`, default 5 min); git POSTs are bounded by `git.http.timeout_ms` instead of the request timeout (runbook smart-http). For a push (route `receive_pack`) the command list must arrive within `body_timeout_ms`, the pack within `git.http.timeout_ms`; a pack that stops arriving kills receive-pack (no ref changed, FG-GIT-0015 `phase=request_body` follows). `operation=response_write` (with `kind=idle`, `peer`, `idle_ms`; logged by the connection loop with a connection-level request_id): the client stopped reading a response for `server.write_idle_timeout_ms` (default 60 s) and the connection was closed; the response is lost, a git stream that keeps sending is never idle (runbook connections). `operation=request_read` (with `kind=idle`, `peer`, `idle_ms`): a request body delivered nothing for `server.read_idle_timeout_ms` (default 60 s, never below `git.http.idle_timeout_ms`) while the handler waited for it; the read fails (a handler busy elsewhere is not affected). For a JSON body route (phase 8b) `operation=request_read` carries `bytes_in` and a `kind`: `idle` (the same idle timeout), `total` (with `timeout_ms`: the whole body did not arrive within `server.body_read_timeout_ms`, default 10 s, however steadily it trickled — a slow client or a deliberately slow sender), or `aborted` (the client went away or broke the HTTP framing while sending; the read error is in `source`). In every case nothing was loaded. `operation=protection_load`: a push's protected-ref rules could not be read within the lookup timeout (database slow; the push was refused before git ran). `operation=project_page` / `group_page`: one list page scan (`GET /api/v1/projects` / `/groups`, up to 1001 rows in one statement) did not answer within the lookup timeout — check the database (FG-DB-0001 in the same request_id) and the number of projects / groups; the scan budget is 1000 rows per page (plan option L1, switch to an SQL superset past ~10k)."
fix = "Fix the slow dependency; raise the request timeout only for routes that legitimately take long."
test = "slow_handler_is_request_timeout"

[[error]]
code = "FG-SYS-0004"
name = "ServerBindFailed"
http_status = 500
severity = "alert"
user_message_ja = "サーバーを起動できませんでした。管理者に連絡してください。"
user_message_en = "The server could not start. Contact the administrator."
user_message_id = "Server tidak dapat dijalankan. Hubungi administrator."
cause = "forge serve could not bind its listen address (address in use, permission denied for a privileged port, or an invalid address)."
diagnosis = "The `context` field of the log event contains `bind=<address>`; the OS error is in `source`. Check what holds the port (`ss -ltnp` / `netstat -ano`)."
fix = "Stop the other process, choose another port, or run behind the reverse proxy on an unprivileged port."
runbook = "server-start-failed"
test = "bind_to_an_occupied_port_is_server_bind_failed"

[[error]]
code = "FG-WEB-0003"
name = "MethodNotAllowed"
http_status = 405
severity = "info"
user_message_ja = "この URL ではその操作（メソッド）は使えません。"
user_message_en = "This method is not allowed for this URL."
user_message_id = "Metode ini tidak diizinkan untuk URL ini."
cause = "The path is registered, but not for the request's HTTP method."
diagnosis = "The `context` field contains `method=` and `path=`; the response `Allow` header lists the registered methods. Compare with `Git/docs/api/openapi.json`."
fix = "Use one of the methods in the `Allow` header."
test = "wrong_method_on_a_registered_path_is_method_not_allowed"

[[error]]
code = "FG-WEB-0004"
name = "RouteRegistryInvalid"
http_status = 500
severity = "alert"
user_message_ja = "サーバーの設定に問題があり、起動できませんでした。管理者に連絡してください。"
user_message_en = "The server could not start because of a configuration problem. Contact the administrator."
user_message_id = "Server tidak dapat dijalankan karena masalah konfigurasi. Hubungi administrator."
cause = "The route registry is inconsistent: a duplicate method and path, or a path that is empty, lacks the leading '/', or has an empty segment. Detected at startup, before any request is served (a programming error in a release)."
diagnosis = "The `context` field contains `reason=` and `routes=`. Look at `app::registry()` in forge-web for the listed routes."
fix = "Fix the registration in forge-web and release again; nothing to change on the server."
runbook = "server-start-failed"
test = "invalid_or_duplicate_routes_are_a_startup_error"

[[error]]
code = "FG-WEB-0005"
name = "ReadinessTimeout"
http_status = 503
severity = "warn"
user_message_ja = "サーバーの準備ができていません。しばらくしてから再度お試しください。"
user_message_en = "The server is not ready. Try again later."
user_message_id = "Server belum siap. Coba lagi nanti."
cause = "A readiness probe (GET /readyz) did not answer within its client-side timeout, so the dependency it checks (named by `probe`, e.g. database) is treated as unavailable."
diagnosis = "The log event carries `probe` and `timeout_ms`. Run `forge doctor` on the host to check the same dependency without the HTTP path; for the database see the db-unavailable runbook (a half-open connection or an overloaded server does not answer)."
fix = "Restore the dependency named by `probe`; if it is healthy but slow, look at its load. The readiness timeout is deliberately short so load balancers stop routing to a stuck instance."
test = "readyz_probe_is_bounded_by_its_timeout"

[[error]]
code = "FG-WEB-0006"
name = "RequestInvalid"
http_status = 400
severity = "info"
user_message_ja = "リクエストの形式が正しくありません。API の説明（docs/api/openapi.json）を確認してください。"
user_message_en = "The request is not valid. Check the API description (docs/api/openapi.json)."
user_message_id = "Permintaan tidak valid. Periksa deskripsi API (docs/api/openapi.json)."
cause = "The request's shape is wrong, decided from the request alone (after authentication, before any lookup, so it says nothing about any resource): a JSON body that is not well-formed, has a field the route does not know (bodies are strict: unknown fields are refused), lacks a required field or has a value of the wrong type; a body route called without `Content-Type: application/json`; a path or query parameter that is not syntactically valid (`{id}` not a plain positive decimal, `path=` missing, repeated or malformed); an opaque list cursor that does not verify (tampered, truncated, from another key or another list)."
diagnosis = "The log event carries `reason`: `json_syntax` (with `line`, `column`), `unknown_field` / `missing_field` (with `field`, the field's name only), `type` (with `line`, `column`: a value of the wrong type; the value is never logged), `content_type` (with `content_type`, the media type as sent, cut to 64 characters), `param_invalid` (with `param` and `rule`, e.g. `param=id rule=not_positive_decimal`, `param=path rule=missing|repeated|malformed|invalid`), `cursor_invalid` (with `rule`: `too_long`, `encoding`, `truncated`, `version`, `kid` (a key id not in `api.cursor_keys_file`: rotated out, or a cursor from another installation), `tag` (tampered, or minted for another list or caller), `expired` (a genuine cursor older than `api.cursor_max_age_s`, default 24 h: a client that resumed a listing too late — not an attack; restart without the cursor)), plus `action` and `route`. History pages (M2 MR8, `GET …/repository/commits`): `cursor_invalid rule=payload` (not a cursor a page handed out: wrong shape, ids that are not full lower-case hex, a skip outside 1..=100000) and `rule=anchor` (a well-formed cursor whose last commit is not where it says in this path's history: it was minted for another path, or forged); `param=limit rule=not_positive_decimal|out_of_range`, `param=oid rule=not_object_id` (`commits/{oid}` wants a full 40 / 64-digit commit id), `param=query rule=unknown_parameter`. Request bodies, parameter values and cursors are never logged. Compare the request with the operation's schema in `Git/docs/api/openapi.json` (`requestBody`, `parameters`). Lists (`GET /api/v1/projects`, `/api/v1/groups`, M1 phase 8b MR7b): `param=limit rule=out_of_range` (not a plain decimal in 1..=100) or `rule=repeated`, `param=cursor rule=repeated|empty`, `param=query rule=unknown_parameter` (only `limit` and `cursor` exist), and `cursor_invalid rule=payload` (the cursor verified but does not hold one positive id — a build mismatch, report it); `rule=tag` also covers a cursor used by another caller or on the other list. M3 R1a merge requests: `param=source_branch|target_branch rule=not_a_branch|source_equals_target|invalid_ref_name` (the route, before any lookup), `param=title rule=empty|too_long|control_character`, `param=description rule=too_long|control_character` (forge-review), `param=state rule=unknown_value`, `param=before rule=not_positive_decimal`, `param=limit rule=out_of_range` (the list); with `constraint=` it is a table CHECK of forge.merge_requests that refused the value (forge_db::review, the backstop of those rules)."
fix = "Correct the client's request to the documented schema. For `cursor_invalid`: restart the listing without a cursor (a history cursor belongs to the path it was made for; cursors are opaque, bound to one list and one caller, and expire when their key is rotated out). For `content_type`: send `Content-Type: application/json`."
test = "request_body_validation_is_request_invalid"

[[error]]
code = "FG-WEB-0009"
name = "RequestTooLarge"
http_status = 413
severity = "info"
user_message_ja = "リクエストの本文が大きすぎます。"
user_message_en = "The request body is too large."
user_message_id = "Isi permintaan terlalu besar."
cause = "A request body exceeded the route's limit (at most 64 KiB for an API route with a JSON body; never above `body_limit_bytes`, 1 MiB). Refused from `Content-Length` before reading, or as soon as the streamed body passes the limit; nothing was loaded or changed. Smart HTTP bodies have their own limits (FG-GIT-0013)."
diagnosis = "The log event carries `limit_bytes`, `route`, `action` and `declared` (`true` when `Content-Length` already exceeded the limit, `false` when the body grew past it while streaming). The body is never logged."
fix = "Send a smaller body (split the change into several requests). The per-route limits are part of the API description (`x-forge-max-body-bytes` in `Git/docs/api/openapi.json`)."
test = "oversized_request_body_is_request_too_large"

[[error]]
code = "FG-WEB-0010"
name = "RateLimited"
http_status = 429
severity = "info"
user_message_ja = "短い間に要求が多すぎます。少し待ってからもう一度お試しください。"
user_message_en = "Too many requests in a short time. Wait a moment and try again."
user_message_id = "Terlalu banyak permintaan dalam waktu singkat. Tunggu sebentar lalu coba lagi."
cause = "A rate-limited route was requested more often than its limit from one connection peer (ADR-0021 §3): `GET /-/auth/login` allows 20 starts and `GET /-/auth/callback` 20 callbacks per peer per minute, each with its own counter (an IPv6 peer counts as its /64), so nobody can flood the identity provider's authorization or token endpoint through GitStation. `GET /api/v1/namespaces/resolve?prefix=true` (M2 MR6, the SPA's rescue of GitHub-shaped URLs, ADR-0015) allows 60 requests per signed-in user per minute (`route=resolve_prefix`; one request resolves every leading prefix of the path), checked after the path is validated and the token scope decided, before any lookup. `GET /api/v1/users?search=` allows 120 searches per signed-in user per minute (`route=user_search`). A refused callback also clears the state cookie, so the user starts the sign-in again. The peer is the TCP peer address until the proxy layout is decided (ADR-0019 open question). Nothing was done; the answer carries `Retry-After`. M3 I1c: `GET /api/v1/integrations/{id}/events` and `…/events/cursor` allow one read in flight per integration (per process); a concurrent one is refused at once with `reason=feed_read_in_flight` and `Retry-After: 1` (the consumer retries; nothing was read). M4 C5: a job's log (`GET …/pipelines/{pipeline_id}/jobs/{job_id}/log`) and a pipeline's diagnosis (`GET …/pipelines/{pipeline_id}/diagnosis`) allow 120 reads per caller per minute together (`route=ci_output`) and 2 running per caller at once (`route=ci_output reason=in_flight`, `Retry-After: 1`), checked after the decision on the project and before any lookup (each may measure the default branch's tip with git and read a 1 MiB page)."
diagnosis = "The log event carries `route` (`login`, `callback`, `resolve_prefix` or `user_search`), `limit` and `window_s` (never the address, which is personal data; `resolve_prefix` and `user_search` also `retry_after_s`). The per-caller limits are tested by `prefix_resolution_is_rate_limited_per_caller` and `the_user_search_is_rate_limited_per_caller` (forge-web). Many 429 behind a reverse proxy mean every user shares the proxy's peer address — the open question of ADR-0019. The feed's refusal carries `reason=feed_read_in_flight`, `integration_id` and `retry_after_s=1` (test `a_second_concurrent_read_of_the_same_integration_is_429`); many of them mean the consumer polls in parallel (runbook integration-feed-lag). `route=ci_output` (with `reason=in_flight` for the concurrency cap; test `the_ci_output_reads_are_capped_per_caller`): one user or agent pages logs in a loop or in parallel — find the user in the same request_id's events (runbook checks-reporting, H)."
fix = "Wait `Retry-After` seconds. If a proxy in front of GitStation makes every user one peer, record it in the incident record and decide the client-address source (ADR-0019 open question) before raising the limit."
test = "login_start_is_rate_limited_per_peer"

[[error]]
code = "FG-WEB-0007"
name = "SmartHttpServiceUnsupported"
http_status = 400
severity = "info"
user_message_ja = "Git のサービスの指定が正しくありません。git-upload-pack か git-receive-pack を 1 つだけ指定してください。"
user_message_en = "The Git service is not supported. Request exactly one of git-upload-pack or git-receive-pack."
user_message_id = "Layanan Git tidak didukung. Minta tepat satu dari git-upload-pack atau git-receive-pack."
cause = "A Smart HTTP advertisement request (`GET {path}.git/info/refs`) did not carry exactly one `service` query parameter whose value is `git-upload-pack` or `git-receive-pack` (byte for byte, no decoding, no case folding; ADR-0015 step 3). Decided from the string alone, before authentication and before any lookup, so it says nothing about the path. Dumb HTTP clients (no `service`) get this too: forge serves Smart HTTP only."
diagnosis = "The log event carries `reason=service_unsupported`, `part=query` and `rule`: `missing` (no `service` key: a dumb-HTTP client or a scanner), `duplicate` (two `service` keys), `unknown` (another value, e.g. `git-upload-archive`, an encoded or upper-case one). `path=` is the raw path cut by `log_safe_path`."
fix = "Use a git client (git >= 2.0 speaks Smart HTTP); the remote URL is `https://<host>/<namespace>/<project>.git`. Nothing to fix on the server."
test = "info_refs_needs_exactly_one_known_service"

[[error]]
code = "FG-WEB-0008"
name = "ServerBusy"
http_status = 503
severity = "warn"
user_message_ja = "サーバーが混み合っています。しばらくしてから再度お試しください。"
user_message_en = "The server is busy. Try again later."
user_message_id = "Server sedang sibuk. Coba lagi nanti."
cause = "A new connection was refused before any request was read, because the server already holds `server.max_connections` open connections, or `server.max_connections_per_peer` from the same socket peer address. The client gets this 503 with `Retry-After` and the connection is closed. A list request (`GET /api/v1/projects` / `/groups`) is refused the same way (503 with `Retry-After: 1`, the connection stays open) when `api.list_max_concurrent` list scans already run, or `api.list_max_concurrent_per_principal` for the same user."
diagnosis = "The log event carries `reason` (`connection_limit`: the whole server is full; `peer_limit`: one peer holds its share), `peer` (the socket peer IP; behind a reverse proxy this is the proxy; an IPv6 peer is counted by its /64 prefix, so all addresses of one /64 share the cap, while `peer` in the log is the actual address of the refused connection), `reason=summary` (a line written after the flood stopped or at shutdown: only `suppressed`, the refusals not logged one by one), `limit`, `open` (connections held right now) and `suppressed` (refusals since the previous log line: at most one line per second is written). A refusal is logged once, at the accept loop, with a connection-level request_id (also in the response body). Many `peer_limit` refusals for one `peer`: a client or script opens too many connections, or connections are held open (slow readers are closed by `server.write_idle_timeout_ms`, idle keep-alive by `server.header_read_timeout_ms`, old ones by `server.keep_alive_max_ms`); when `peer` is the reverse proxy, the cap counts all its clients together and is too low for the proxy. `connection_limit` while no peer dominates: real load, or many slow clients. `operation=response_write` on FG-WEB-0002 is the related event for a client that stopped reading. `reason=list_concurrency` (from a list route, with `scope=global|principal` and `max`; request_id of the refused request; logged once per refusal): every list request scans up to 1001 rows whatever `limit` is, so the number running at once is capped. `scope=principal`: one user (script, UI polling) keeps more than `api.list_max_concurrent_per_principal` (default 2) lists running — find the user in the same request_id's events; `scope=global`: `api.list_max_concurrent` (default 16) are running, which usually means the scans are slow — look for `FG-WEB-0002 operation=project_page|group_page` (a slow database or very many projects / groups) before raising the cap."
fix = "Find the peer holding connections (runbook connections); stop the misbehaving client, or raise `server.max_connections_per_peer` / `server.max_connections` (keep per-peer at most the total) and restart. For a reverse proxy raise the per-peer cap to the proxy's expected concurrency. For `reason=list_concurrency` fix the slow scan or the polling client first (runbook connections); raise `api.list_max_concurrent` / `api.list_max_concurrent_per_principal` (per-user at most the total) only when the database has room, and restart."
runbook = "connections"
test = "connections_over_the_per_peer_cap_get_503"

[[error]]
code = "FG-SYS-0005"
name = "ServeFailed"
http_status = 500
severity = "alert"
user_message_ja = "サーバーが停止しました。管理者に連絡してください。"
user_message_en = "The server stopped. Contact the administrator."
user_message_id = "Server berhenti. Hubungi administrator."
cause = "forge serve (or another command that needs the async runtime, such as forge db) could not build its runtime, the connection limiter failed (a programming error), or graceful shutdown exceeded its deadline. Accept errors on the listener are FG-SYS-0007."
diagnosis = "The `context` field contains `operation=` (`build_runtime`, `connection_limit`, `shutdown_deadline`; the latter with `grace_ms=`; `push_tasks_pending` with `running`, `wait_ms`: pushes whose receive-pack or record still ran when `forge serve` stopped waiting — check their refs and records by request id, runbook smart-http; M3 R4 merge tasks of `forge serve`, runbook merge-execution (sections 照合（reconciliation）の動き and Escalate): `merge_task_exited` with `task=merge_runner|merge_reconcile`, `panicked`, `cancelled` — a supervised task ended without a stop request and is restarted after a 1–30 s backoff; `merge_supervisor_exited` — a supervisor itself panicked (seen at shutdown); `merge_task_pending` with `task`, `wait_ms` — a merge task did not stop in time at shutdown; `reason=reconcile_pass_timeout` with `operation=merge_reconcile` — one reconciliation pass ran past 50 s; `reason=reconcile_attempt_timeout` with `merge_id` — settling one attempt ran past 20 s, it goes to the back of the next scan); the OS error is in `source`. Check file-descriptor limits (`ulimit -n`), memory, and the system log around the time."
fix = "Address the resource problem (descriptors, memory) and restart; for shutdown_deadline find the long-running requests in the access log."
runbook = "server-start-failed"
test = "serve_failures_have_their_own_code"

[[error]]
code = "FG-SYS-0006"
name = "SignalHandlerUnavailable"
http_status = 500
severity = "warn"
user_message_ja = "サーバーの停止の仕組みを準備できませんでした。管理者に連絡してください。"
user_message_en = "The server could not set up its shutdown handling. Contact the administrator."
user_message_id = "Server tidak dapat menyiapkan penanganan penghentian. Hubungi administrator."
cause = "forge serve could not register a signal handler (SIGINT / SIGTERM). The server keeps running, but a stop request ends it without draining in-flight requests."
diagnosis = "The `context` field contains `signal=`; the OS error is in `source`. Usually a restricted container or seccomp profile."
fix = "Allow signal handling in the runtime environment; until then stop the service during a quiet period."
test = "signal_handler_failure_is_logged_with_a_code"

[[error]]
code = "FG-SYS-0007"
name = "AcceptFailed"
http_status = 503
severity = "warn"
user_message_ja = "サーバーが混み合っています。しばらくしてから再度お試しください。"
user_message_en = "The server is busy. Try again later."
user_message_id = "Server sedang sibuk. Coba lagi nanti."
cause = "Accepting a TCP connection failed (usually out of file descriptors). The server keeps running and retries after a short pause."
diagnosis = "The `context` field contains `operation=accept`; the OS error is in `source`. Check `ulimit -n` / `LimitNOFILE` against the connection limit and the number of open connections (`ss -s`)."
fix = "Raise the file-descriptor limit above the connection limit, or lower the connection limit."
test = "accept_failure_has_its_own_code"

[[error]]
code = "FG-SYS-0008"
name = "BackupFailed"
http_status = 500
severity = "alert"
user_message_ja = "バックアップに失敗しました。問い合わせ番号を添えて管理者に連絡してください。"
user_message_en = "The backup failed. Contact the administrator with the request ID."
user_message_id = "Pencadangan gagal. Hubungi administrator dengan menyertakan ID permintaan."
cause = "`forge backup` (M3 O1, ADR-0019 Amendment plan 11 P1, runbook backup-restore) did not write a complete generation, or `forge doctor` found the last success too old. `reason`: `not_configured` (`backup.dir` or `backup.key_file` is not set), `insecure_permissions` (the backup directory or the state copy directory is reachable by group or others, is not owned by the forge account, or is a symlink; `path`, `mode`), `key_inside_backup` (the key file or the state copy directory lies inside `backup.dir`: a stolen backup would carry its own key or its own state copy), `backup_running` (`<backup.dir>/.lock` exists: another `forge backup` runs, or one was killed — see the runbook), `db_tool_missing` (the pgBackRest binary `backup.pgbackrest_bin` does not exist), `db_backup_failed` (pgBackRest exited non-zero; `exit_code`, the redacted head of `stderr`), `db_backup_timeout` (pgBackRest ran past `backup.db_timeout_secs`; its process was killed), `db_backup_unexpected` (`pgbackrest info` names no backup that was not there before the run), `repository_copy_failed` (reading a repository or writing the archive failed; `repo_id`, `operation`), `repository_copy_inconsistent` (`git fsck --connectivity-only` of the copied repository failed three times: a maintenance gc replaced packs while it was copied), `repository_copy_timeout` (the copy ran past `backup.repo_timeout_secs`; `detail=maintenance_lock_held` when the repository's maintenance held the lock `repo_maint:<repo_id>` for all of it), `storage_io` (creating, renaming or rotating a generation failed; `operation`), and from doctor `never` (no complete generation in `backup.dir`) / `overdue` (the newest is older than `backup.max_age_hours`). A wrong key file is FG-SYS-0002 `config_key=backup.key_file`. The database step runs first: when a later step fails, pgBackRest holds a database backup that no forge generation lists (it expires with the pgBackRest retention). A failed run leaves `<generation>.partial`; the next run removes it."
diagnosis = "Filter logs by error_code=FG-SYS-0008: `reason`, `generation`, `request_id`, and per reason `path` / `mode`, `exit_code` / `stderr`, `repo_id` / `operation`. `forge doctor` (`backup.last_success`, `backup.state_copy`) shows the newest generation and its age. List the generations: `ls -l <backup.dir>` (complete ones hold manifest.json; `*.partial` are failed runs). pgBackRest: `pgbackrest --stanza=<stanza> info` and its own log (`/var/log/pgbackrest`)."
fix = "Follow runbook backup-restore: fix the cause (chmod 0700 the directories and 0600 the key file, chown them to the forge account, move the key file and the state copy outside backup.dir, remove a stale .lock after checking no forge backup runs, fix pgBackRest per its log), then run `forge backup` again and check `forge doctor` backup.last_success is ok. Never widen the permissions to make it pass: the backup holds token hashes, user data and every repository."
runbook = "backup-restore"
test = "wide_permission_storage_is_refused"

[[error]]
code = "FG-SYS-0009"
name = "RestoreVerificationFailed"
http_status = 500
severity = "alert"
user_message_ja = "復元の検証に失敗しました。問い合わせ番号を添えて管理者に連絡してください。"
user_message_en = "The restore could not be verified. Contact the administrator with the request ID."
user_message_id = "Pemulihan tidak dapat diverifikasi. Hubungi administrator dengan menyertakan ID permintaan."
cause = "`forge restore verify` / `forge restore finish` (M3 O1, runbook backup-restore) found the restored database and repositories inconsistent, or a restore step could not run. Findings (`findings` = the kinds found, a count per kind in `<kind>`): `repository_missing` (a ready repository row has no directory), `repository_corrupt` (`git fsck --connectivity-only` failed: FG-GIT-0019 is logged with it), `version_ref_missing` / `version_ref_mismatch` (a `merge_request_versions` row names a commit that `refs/merge-requests/<iid>/v<n>` does not hold: the repositories are older than the database), `purged_ref_present` (a version whose refs the database says were purged — secret removal — still has its ref), and the database-behind findings `version_ref_unknown` (a version ref without its row) and `repository_unknown` (a repository directory without a row): the database is older than the repositories (a database-only restore). Other `reason`s: `restore_pending` (`forge serve` / `forge worker` refuse to start while `<storage.root>/.forge-restore-pending` exists: a restore was begun and not finished), `not_in_restore` (`forge restore repositories` / `finish` without `forge restore begin`), `generation_missing` (no complete generation of that name), `archive_corrupt` (decryption or the archive's structure failed: a wrong key, a truncated or altered file, an archive of another generation; `detail=manifest_mac`: manifest.json does not match its manifest.mac), `restore_timeout` (`forge restore repositories` ran past `backup.repo_timeout_secs`), `target_exists` (`forge restore repositories` found a repository directory and `--replace` was not given). Without a usable state copy `finish` does not fail: it removes every administrator flag and lists the users."
diagnosis = "Filter logs by error_code=FG-SYS-0009: `reason` or `findings`, the per-kind counts and `first` (the first finding: kind, `repo_id`, ref). Re-run `forge restore verify` (read-only) for the full list. Compare the restored generation's manifest.json `db.completed_at` with the pgBackRest backup label that was restored (`pgbackrest info`)."
fix = "Follow runbook backup-restore. Repositories older than the database: restore the repositories of the same generation (`forge restore repositories --generation <g> --replace`). Database older than the repositories: decide with the runbook's table — `forge restore finish --accept-db-behind` keeps the newer repositories and lists what the database does not know. A corrupt repository: restore it from an older generation or follow repo-maintenance. Never delete the marker by hand to start forge serve: `forge restore finish` revokes every credential and re-applies the removed permissions first."
runbook = "backup-restore"
test = "a_database_behind_the_repositories_is_detected"

# ── DB ───────────────────────────────────────────────────────────────────
# FG-DB-0003 / 0004: migrations (ADR-0014);
# FG-DB-0005: the Outbox sequencer lag (ADR-0016 §7, defined below);
# FG-DB-0006..0008, 0010..0015 are taken by ADR-0016 / ADR-0018 (registered
# with the phase that raises them); FG-DB-0009: append-only guards (ADR-0018).

[[error]]
code = "FG-DB-0001"
name = "DbUnavailable"
http_status = 503
severity = "alert"
user_message_ja = "データベースに接続できません。しばらくしてから再度お試しください。解決しない場合は管理者に連絡してください。"
user_message_en = "The database is unavailable. Try again later; if it persists, contact the administrator."
user_message_id = "Basis data tidak tersedia. Coba lagi nanti; jika masih berlanjut, hubungi administrator."
cause = "forge has no usable database connection — at startup or for a later statement: the server refused it or did not answer within database.connect_timeout_ms, authentication or TLS failed, the server is older than PostgreSQL 16, the pool had no free connection within database.acquire_timeout_ms, the connection was lost, or the server is shutting down or out of connection slots."
diagnosis = "The log event carries `reason` (connect_refused, connect_timeout (forge's own timer: with `timeout_ms` and `timeout_key`), auth_failed, server_rejected, tls, version, acquire_timeout, pool_closed, connection_lost, server_shutdown, too_many_connections, read_only (25006: standby or recovery), resource_exhausted (class 53: disk full, out of memory), server_fault (classes 58 / XX), ping_timeout (the readiness round trip did not answer within database.acquire_timeout_ms), operation_timeout (a multi-statement operation such as a doctor check or a migration bookkeeping step exceeded its client-side bound; see `operation` and `timeout_ms`), driver), `pool` (write or read, for readiness failures), `target` (host:port/dbname — never the password) or `query`, and for server errors `sqlstate` and `db_message`; transport errors are in `source`. In development run `docker compose -f ops/dev/compose.yml ps`; in production `pg_isready -h <host> -p <port>`, and read the PostgreSQL server log for the same time."
fix = "Start or repair the database server; correct database.url, database.password_file or the TLS settings; if acquire_timeout repeats under load, find long-held connections or raise database.write_max_connections / database.read_max_connections (forge doctor db.connections checks the budget)."
runbook = "db-unavailable"
test = "connect_to_a_closed_port_is_db_unavailable_within_the_connect_timeout"

[[error]]
code = "FG-DB-0002"
name = "DbQueryFailed"
http_status = 500
severity = "warn"
user_message_ja = "データベースの処理に失敗しました。管理者に連絡してください。"
user_message_en = "A database operation failed. Contact the administrator."
user_message_id = "Operasi basis data gagal. Hubungi administrator."
cause = "A statement failed on a working connection: it exceeded database.statement_timeout_ms (SQLSTATE 57014) or database.lock_timeout_ms (55P03), lost a serialization race (40001) or a deadlock (40P01), violated a constraint (23xxx), found no row where one must exist, or the server reported another error. (A lost connection is FG-DB-0001.)"
diagnosis = "The log event carries `query` (a static name of the statement — never its SQL text or parameters), `reason` (statement_timeout, lock_timeout, serialization, deadlock, constraint with `constraint` / `table`, row_not_found, change_timeout (a ChangeTx exceeded its 30 s deadline from begin to commit and was rolled back; see `timeout_ms`), subtree_unstable (a namespace move kept finding new children below its subtree while locking it, D5), tombstone_changed (a tombstone release found the tombstone changed — its target purged — after taking its path lock); deadlock, serialization, subtree_unstable and tombstone_changed carry `retryable=true`: the transaction was rolled back and the whole request may be retried, commit_outcome_unknown (COMMIT of a change did not answer within 10 s: the change may or may not be durable — check forge.audit_log for its request_id before retrying), rollback_timeout / a failed `change.rollback` (logged at warn after a dedup hit: the change itself is still Deduped, the connection may be unhealthy), write_on_read_pool (25006 on the read pool: a write was sent to the read-only forge_ro pool — a bug, never retried), permission_denied (42501: the role lacks the privilege — a bug or a missing GRANT, never retried), idle_in_transaction_timeout (25P03: the caller left a transaction idle; the session was ended — a caller bug), server_error, client_error — e.g. a decode error) and `sqlstate`. Row values are never logged: for classes 22 / 23 the server message is dropped. For timeouts, look for long-running or blocking sessions in pg_stat_activity and pg_locks at that time; look up other SQLSTATEs in the PostgreSQL documentation. M3 R1a: `reason=merge_request_changed_concurrently` (`retryable=true`, with `iid`; forge-review reopen): the merge request was closed, reopened or retargeted between the branch check and the transaction's lock three times in a row — retry the request."
fix = "For timeouts remove the blocking session or fix the slow plan (EXPLAIN); serialization, deadlock, subtree_unstable and tombstone_changed (`retryable=true`) are safe to retry; commit_outcome_unknown is never retried blindly — look up the request_id in forge.audit_log first (a change without a dedup_key would be applied twice); for constraint and other states fix the caller named by `query`."
runbook = "db-unavailable"
test = "a_slow_statement_is_db_query_failed_with_sqlstate_57014"

[[error]]
code = "FG-DB-0003"
name = "MigrationFailed"
http_status = 500
severity = "alert"
user_message_ja = "データベースの更新に失敗しました。管理者に連絡してください。"
user_message_en = "The database upgrade failed. Contact the administrator."
user_message_id = "Pembaruan basis data gagal. Hubungi administrator."
cause = "forge db migrate could not apply a migration: its SQL failed (the transaction was rolled back, so the version is not recorded), another migration run held the lock past database.lock_timeout_ms, or the migration files could not be read."
diagnosis = "The log event carries `version` (the failing migration, when known), `reason` (sql_failed — 55P03 here means a DDL lock wait exceeded database.lock_timeout_ms on a busy table; locked — another run holds the migration lock; timeout — the whole run exceeded (pending + 1) × database.migrate_statement_timeout_ms on the client, see `timeout_ms`; source; driver) and for SQL errors `sqlstate` / `db_message` (data-free states only). `forge db status` shows what is applied and pending; nothing is half-applied because each migration runs in one transaction (except files marked `-- no-transaction`, which must be single idempotent statements — ADR-0014)."
fix = "Fix the migration in a new release (an applied migration is never edited — ADR-0014), or wait for the other run (locked) and retry `forge db migrate`."
runbook = "db-migration"
test = "a_failing_migration_is_migration_failed_and_leaves_no_partial_version"

[[error]]
code = "FG-DB-0004"
name = "SchemaIncompatible"
http_status = 500
severity = "alert"
user_message_ja = "サーバーとデータベースの版が一致しません。管理者に連絡してください。"
user_message_en = "The server and the database schema do not match. Contact the administrator."
user_message_id = "Versi server dan skema basis data tidak cocok. Hubungi administrator."
cause = "The database schema does not match the migrations built into this forge binary, so the server refuses to start (or forge db migrate refuses to run): migrations are pending, the database has migrations this binary does not know (it is newer — e.g. after rolling the binary back), an applied migration was edited, or an earlier run left a migration marked unsuccessful."
diagnosis = "The log event carries `reason` (pending, db_ahead, checksum_mismatch, dirty) and `versions` (the affected migration versions). `forge db status` lists applied, pending and unknown versions without changing anything."
fix = "pending: run `forge db migrate` (an approved runbook step). db_ahead: deploy the binary that matches the database (migrations are forward-only). checksum_mismatch / dirty: never edit an applied migration — restore the original file from version control and release a new migration instead."
runbook = "db-migration"
test = "pending_migrations_are_schema_incompatible"

# ── C4: the outbox sequencer (ADR-0016 §7, ADR-0018 §3) ──────────────────
[[error]]
code = "FG-DB-0005"
name = "OutboxSequencerLag"
http_status = 500
severity = "alert"
user_message_ja = "更新の通知が遅れています。管理者に連絡してください。"
user_message_en = "Change notifications are delayed. Contact the administrator."
user_message_id = "Notifikasi perubahan tertunda. Hubungi administrator."
cause = "Committed rows wait for their sequence number and the sequencer has not run for more than 30 seconds: forge.events rows (or, while audit sequencing is enabled, forge.audit_log rows) have seq IS NULL and forge.event_feed_state.sequencer_heartbeat is older than 30 s or missing. No `forge worker` is running, it cannot reach the database, or every forge.assign_seq call fails. Until it recovers, subscribers, the integration feed and webhooks see nothing new; nothing is lost (the rows wait)."
diagnosis = "forge doctor (`outbox.sequencer_lag`, `outbox.unsequenced_count`) reports it with `unsequenced_count` (events plus counted audit rows), `unsequenced_events`, `unsequenced_audit` (`off` while audit sequencing is intentionally off: those rows are not counted), `heartbeat_age_ms` (`none` = the sequencer never ran in this database) and `lock_holder_pid` (the session holding the sequencer's advisory lock, `none` if nobody does). Check that a `forge worker` process runs (systemctl status forge-worker) and read its log: a failure is logged when a streak starts, when its code or its operation / query / reason changes, and again every 60 s while it persists, with `context` containing `task=sequencer`, `failures` (the streak length) and `retry_in_ms`, all lines of one streak sharing a request_id, under the failing call's own error_code (FG-DB-0001: database unreachable; FG-DB-0002 query=sequencer.assign_seq with reason lock_timeout: another session holds the lock — see lock_holder_pid in pg_stat_activity; FG-DB-0009: a guard refused the numbering); `forge.worker.task_recovered` marks the end of a streak."
fix = "Start or restart `forge worker` (an approved runbook step in production); fix the failure its log names. A session that holds the advisory lock for long (lock_holder_pid) is ended only after review. Never number rows by hand: only forge.assign_seq may set seq."
runbook = "outbox-sequencer-lag"
test = "a_stale_sequencer_with_a_backlog_is_outbox_sequencer_lag"
# ── end C4 ───────────────────────────────────────────────────────────────

# ── C6: the job queue (ADR-0016 §7) ──────────────────────────────────────
[[error]]
code = "FG-DB-0006"
name = "JobDeadLettered"
http_status = 500
severity = "alert"
user_message_ja = "バックグラウンドの処理が完了できませんでした。管理者に連絡してください。"
user_message_en = "A background task could not be completed. Contact the administrator."
user_message_id = "Tugas latar belakang tidak dapat diselesaikan. Hubungi administrator."
cause = "An internal job in forge.jobs died: its work is not done until it is enqueued again. reason=attempts_exhausted: its handler failed max_attempts times; permanent_failure: the handler reported a failure that can never succeed (dead at the first such failure); lease_expired: its last lease expired (worker crashed, run cancelled, hung) with the attempts used up; dead_lettered (forge doctor jobs.dead): a job died within the last 24 h. (Jobs piling up or a reaper that does not run is FG-DB-0017.)"
diagnosis = "The event carries `reason`, `job_id`, `kind`, `attempts`, `last_error_code` (the code of the last failure; FG-DB-0007 = its lease expired) and `origin_request_id` (the request or event that enqueued it — search the logs for it to follow request → event → job). The job runner logs the cause first, under its own error_code with `job_id` / `kind` / `attempt`, then this event, both with the origin request_id. forge doctor adds `dead_recent` (dead within 24 h, capped). last_error_code FG-SYS-0001 is a runner-side failure; its reason is in last_error: job_panicked (the handler panicked — a bug, see internal-error), job_cancelled (its task was cancelled outside the runner), no_handler (the claimed kind has no handler in this build — normally impossible, since a runner claims only its own kinds; it goes with FG-DB-0017 reason=queue_wait for that kind on other workers). Read the row (read-only): SELECT id, kind, state, attempts, max_attempts, last_error_code, last_error, origin_request_id, created_at, finished_at FROM forge.jobs WHERE id = <job_id>; run `forge doctor --json` (jobs.dead)."
fix = "Fix the cause named by last_error_code (its own runbook), then have the work redone by the command that owns the kind: a dead job does not hold its dedup_key, so enqueueing the same work again creates a new job (never edit forge.jobs by hand outside an approved runbook step)."
runbook = "job-dead-lettered"
test = "a_job_that_fails_max_attempts_times_is_dead_and_reported"

[[error]]
code = "FG-DB-0007"
name = "JobLeaseExpired"
http_status = 500
severity = "warn"
user_message_ja = "バックグラウンドの処理をやり直しています。"
user_message_en = "A background task is being retried."
user_message_id = "Tugas latar belakang sedang dicoba ulang."
cause = "A job's run or lease ended before its result was recorded normally. reason=lease_expired: the reaper found a running job past lease_until (= claim + timeout_ms + 30 s: the worker crashed, was killed, or its run was cancelled) and queued it again after the backoff; fenced: a worker tried to record a result (or release the job) for a lease it no longer holds (reaped and re-claimed) — the result was discarded and the newer one kept; execution_timeout: the handler ran longer than the job's timeout_ms and was aborted (retried after the backoff; kept under this code because it is the runner ending the lease early); abort_pending: an aborted handler (after its timeout or a stop) did not end within 5 s (it blocks without awaiting) — followed by left_leased; released_on_shutdown: forge worker stopped while the job ran, the handler was aborted after the 10 s grace and the job was handed back (queued, ready now, the attempt not counted); left_leased (`after` = execution_timeout or shutdown): the aborted handler did not end, so the job keeps its lease and only the reaper makes it claimable after the lease expires — the old run never overlaps the next attempt; release_timeout: the hand-back at shutdown did not answer in 5 s — its outcome is unknown: it may still apply later (fenced; the handler has ended) or the lease expires. Jobs run at least once: a handler may run again after this."
diagnosis = "The event carries `reason`, `job_id`, `kind`, `worker_id` (the lease holder: `w<pid>-<random>` of a forge worker process), `attempt`, `origin_request_id`, and for execution_timeout `timeout_ms`, for abort_pending `wait_ms`; its request_id is the job's origin request id. Look for the worker's own log around the time (a restart, `forge.worker.stopped`, a crash) and for the same job_id's earlier lines. Several lease_expired or released_on_shutdown lines after a worker restart are expected (one per job that was running). Repeated execution_timeout or abort_pending for one kind means its timeout is too short or the handler hangs on an external call without a timeout. A timeout whose handler does not end logs execution_timeout, then abort_pending, then left_leased; a stop whose handler does not end logs abort_pending, then left_leased (after=shutdown). A stop waits at most about 20 s for the job runner (10 s grace + 5 s abort wait + 5 s hand-back)."
fix = "Usually none: the job is retried. Repeated for one kind: fix the handler (an unbounded or blocking wait) or raise that kind's timeout in code. A job that keeps expiring ends as FG-DB-0006 when its attempts are used up."
test = "a_stale_worker_is_fenced_and_the_newer_result_is_kept"

[[error]]
code = "FG-DB-0017"
name = "JobQueueBacklog"
http_status = 500
severity = "alert"
user_message_ja = "バックグラウンドの処理が滞っています。管理者に連絡してください。"
user_message_en = "Background tasks are backed up. Contact the administrator."
user_message_id = "Tugas latar belakang menumpuk. Hubungi administrator."
cause = "forge doctor found the job queue not being worked off. reason=queue_wait: the oldest ready job of a kind waits longer than 10 min — no forge worker runs, or the running build has no handler for the kind, or one long job blocks the worker (one job at a time per worker); queue_depth: more than 1000 ready jobs of one kind — a caller enqueues one job per item (the queue is meant for internal work, never one job per edge device; fleet-wide work is one job that walks its targets); reaper_behind (jobs.expired_leases): a lease expired more than 60 s ago and is still running — no forge worker runs its reaper (it runs every 30 s)."
diagnosis = "forge doctor (`jobs.queue_depth`, `jobs.expired_leases`) reports `reason`, `kind`, and for queue_depth / queue_wait `ready` (per kind, capped at 100000+) and `oldest_wait_ms`; for reaper_behind `expired_leases` (capped), `job_id`, `worker_id`, `attempt` and `expired_ms`. Check that a `forge worker` process runs (systemctl status forge-worker) and read its startup line `forge.worker.jobs` (`job_kinds` = registered handlers) and its failures (`task=job_runner` / `task=job_reaper`). Read-only: SELECT kind, count(*), min(run_after) FROM forge.jobs WHERE state = 'queued' AND run_after <= now() GROUP BY kind;"
fix = "queue_wait / reaper_behind: start `forge worker` (an approved runbook step) or deploy the build that has the kind's handler; queue_depth: find the caller that enqueues per-item jobs and make it one job that walks its items. Never move rows between states by hand."
runbook = "job-queue-backlog"
test = "a_deep_or_waiting_queue_is_reported_per_kind"
# ── end C6 ───────────────────────────────────────────────────────────────
# ── C5: event subscribers (ADR-0016 §7) ───────────────────────────────────
# ── D2: membership data that breaks a schema invariant ──────────────────
[[error]]
code = "FG-DB-0018"
name = "MembershipDataInvalid"
http_status = 500
severity = "alert"
user_message_ja = "所属の情報を読み取れませんでした。問い合わせ番号を添えて管理者に連絡してください。"
user_message_en = "The membership data could not be read. Contact the administrator with the request ID."
user_message_id = "Data keanggotaan tidak dapat dibaca. Hubungi administrator dengan menyertakan ID permintaan."
cause = "Loading a user's roles (forge_db::roles, the one role computation of ADR-0010), or a group or project member change reading the member's direct role (forge_db::groups and forge_db::projects add_member / change_member / remove_member, since D3 MR2 and D4 MR4), found membership or namespace rows that the schema and the forge-db commands never write: the parent chain of a namespace is longer than 20 steps (a cycle in namespaces.parent_id, or a depth the CHECK should have refused), or a group_members.role / project_members.role outside the five roles. The data was changed outside forge-db (a manual change, a restored dump, a disabled trigger or constraint). No role is returned, so the request is refused rather than decided on a partial role."
diagnosis = "The log event carries `reason` (namespace_chain_too_deep or unknown_role), `resource` (group / namespace / project) and `id` (the group, namespace or project id the load started from), `user` (the user id whose roles were loaded) and, for unknown_role, `raw` (the stored value). Read the chain read-only: WITH RECURSIVE c(id, parent_id, step) AS (SELECT id, parent_id, 1 FROM forge.namespaces WHERE id = <id> UNION ALL SELECT n.id, n.parent_id, c.step + 1 FROM forge.namespaces n JOIN c ON n.id = c.parent_id WHERE c.step < 25) SELECT * FROM c; a repeated id is a cycle. For unknown_role: SELECT group_id, user_id, role FROM forge.group_members WHERE role NOT IN ('guest','reporter','developer','maintainer','owner'); then check pg_constraint for group_members_role and forge_audit.ddl_audit for who dropped or altered it."
fix = "Restore the rows from the audit log (forge.audit_log group.* / member.* rows) or a backup through an approved runbook step; restore the dropped constraint or trigger. Never patch the rows by hand without approval."
runbook = "membership-data"
test = "a_namespace_chain_beyond_the_cap_is_membership_data_invalid"
# ── end D2 ──────────────────────────────────────────────────────────────

# ── D3: credential data that breaks a schema invariant ─────────────────
[[error]]
code = "FG-DB-0019"
name = "CredentialDataInvalid"
http_status = 500
severity = "alert"
user_message_ja = "認証情報を読み取れませんでした。問い合わせ番号を添えて管理者に連絡してください。"
user_message_en = "The credential data could not be read. Contact the administrator with the request ID."
user_message_id = "Data kredensial tidak dapat dibaca. Hubungi administrator dengan menyertakan ID permintaan."
cause = "Authenticating a personal access token (forge_db::tokens) found a tokens row that the schema and the forge-db commands never write: a scope name this build does not know, or a secret_sha256 that is not 32 bytes. The data was changed outside forge-db (a manual change, a restored dump, a disabled constraint) or by a newer build. The token is not accepted: the request is refused rather than decided on partial scopes."
diagnosis = "The log event carries `reason` (unknown_scope or bad_hash), `token_id` and `public_id` (never a secret or hash) and, for unknown_scope, `raw` (the stored scope). Read read-only on the write role: SELECT id, user_id, public_id, scopes FROM forge.tokens WHERE id = <token_id>; then check pg_constraint for tokens_scopes_known and forge_audit.ddl_audit for who changed the constraint, and forge.audit_log token.* rows for the history."
fix = "Revoke the token through an approved runbook step (forge admin token revoke) and issue a new one; restore a dropped constraint from the migration. Never edit the row by hand without approval."
runbook = "credential-data"
test = "an_unknown_stored_scope_is_credential_data_invalid"
# ── end D3 ──────────────────────────────────────────────────────────────

# ── D4 MR5: protected ref rules that break a schema invariant ──────────
[[error]]
code = "FG-DB-0020"
name = "ProtectedRefDataInvalid"
http_status = 500
severity = "alert"
user_message_ja = "保護ブランチの規則を読み取れませんでした。問い合わせ番号を添えて管理者に連絡してください。"
user_message_en = "The protected branch rules could not be read. Contact the administrator with the request ID."
user_message_id = "Aturan branch terlindungi tidak dapat dibaca. Hubungi administrator dengan menyertakan ID permintaan."
cause = "Reading a project's protected ref rules (forge_db::protected_refs: levels_for, which feeds RefProtection::effective and the push policy snapshot, or a rule change reading the existing rules) found rows that the forge-db commands never write: more than 100 rules in one project (the cap is enforced by the application only), a pattern that RefPattern::parse refuses (the database CHECKs hold only the prefix and the length), or a push_min_role outside developer / maintainer / owner. The data was changed outside forge-db (a manual change, a restored dump, a dropped constraint). No rule is skipped: the push or the rule change is refused rather than decided on a partial rule set (skipping a rule could loosen protection)."
diagnosis = "The log event carries `reason` (too_many_stored_rules with `project_id`, stored_pattern_invalid or stored_push_min_role_invalid with `protected_ref_id`); the pattern is not logged. Read read-only on the write role: SELECT id, project_id, pattern, push_min_role FROM forge.protected_refs WHERE project_id = <project_id> (or id = <protected_ref_id>) ORDER BY id; check pg_constraint for protected_refs_push_min_role, and forge_audit.ddl_audit and the forge.audit_log protected_ref.* rows for who changed what."
fix = "Through an approved runbook step, delete the rows that break the rules (forge_db::protected_refs::delete keeps the audit trail) or restore them from the audit log / a backup; restore a dropped constraint from the migration. Never edit the rows by hand without approval."
runbook = "protected-ref-data"
test = "a_stored_rule_this_build_cannot_read_is_protected_ref_data_invalid"
# ── end D4 MR5 ─────────────────────────────────────────────────────────

[[error]]
code = "FG-DB-0008"
name = "SubscriberLag"
http_status = 500
severity = "alert"
user_message_ja = "更新の処理が遅れています。管理者に連絡してください。"
user_message_en = "Processing of changes is delayed. Contact the administrator."
user_message_id = "Pemrosesan perubahan tertunda. Hubungi administrator."
cause = "An internal event subscriber (forge.event_subscribers, run by `forge worker`) does not keep up with the outbox. reason=stuck: an `ordered` subscriber failed 5 times in a row on the same event and stops there (it is retried with backoff but never skips on its own). reason=fanout_limit: handling the event would derive more than 100 events from one root event or go deeper than 8 levels (a subscriber loop) — an `ordered` subscriber stops, an `independent` one quarantines the event. reason=quarantined: an `independent` subscriber failed 5 times on an event and moved it to forge.subscriber_dead_letters (the event is skipped for that subscriber). reason=behind: events wait for the subscriber and the oldest one was numbered more than 60 s ago (no worker runs, the worker cannot reach the database, or the subscriber is slow). reason=retention_overrun arrives with retention (step C7). Until it recovers, what the subscriber feeds (notifications, webhooks, kanflow sync) lags; nothing is lost except quarantined events."
diagnosis = "The event carries `reason`, `subscriber`, `seq` (the source event), `event_type`, `lag_events` (high_seq − last_seq) and, for stuck / quarantined, `last_error_code` (the handler's failure) and `failures`; for fanout_limit `limit` (per_root / depth). Its request_id is the source event's request_id, so `request_id` leads back to the HTTP request that caused the event. forge doctor reports `subscribers.lag` (stuck / behind, with `oldest_pending_age_ms`) and `subscribers.dead_letters` (quarantined in the last 24 h; `count_24h`, `newest_seq`). Read the worker log for the handler's own failures (`task=subscribers`, `subscriber=`, the handler's error_code) and query `SELECT * FROM forge.event_subscribers` / `forge.subscriber_dead_letters` on the read pool."
fix = "Fix the failure the handler reports (last_error_code) and let the worker retry: a stuck ordered subscriber resumes by itself once the handler succeeds. Skipping an event an ordered subscriber can never process needs `forge admin subscriber skip`, which is not yet implemented (design in runbook subscriber-lag step 4): until then escalate to the developers, who fix the handler (or the event) so it succeeds. fanout_limit: fix the subscriber that derives too many events (or a loop). behind: start / restart `forge worker`. Quarantined events are kept 30 days for inspection."
runbook = "subscriber-lag"
test = "an_ordered_subscriber_stops_after_five_failures"
# ── end C5 ───────────────────────────────────────────────────────────────

[[error]]
code = "FG-DB-0009"
name = "AppendOnlyViolation"
http_status = 500
severity = "alert"
user_message_ja = "データの保護の仕組みが働きました。管理者に連絡してください。"
user_message_en = "A data protection safeguard was triggered. Contact the administrator."
user_message_id = "Pengaman perlindungan data terpicu. Hubungi administrator."
cause = "An append-only safeguard of the database (ADR-0018) failed: a guard trigger rejected an UPDATE, DELETE or TRUNCATE of an append-only table, a change of a revoked web session's revoked_at / revoked_reason (trigger web_sessions_revocation_final, M2 MR3: a revocation is final), or a forward-only change of forge.repositories (state moves only provisioning -> ready and ready_at is set once, and a repository enters purging only when its project is pending deletion with purge_after passed; trigger repositories_state_forward, steps D4 and D5) (SQLSTATE XF001 — a bug or a manual change), forge doctor found a guard missing or weakened (the audit trigger of a state table, a role attribute, a login holding an extra role, the owner of schema forge_audit or a log table, a guard trigger or event trigger missing, extra, re-pointed or not enabled ALWAYS, a guard function's owner, body or privileges, the bootstrap version), or a membership of a forge role is not one of the fixed ones or of database.privileged_members (or carries ADMIN OPTION), or — once the first schema migration is recorded — a migrated table is missing, owned by someone other than forge_owner or has a rule or row security, a guard trigger or guard function of forge.events / forge.audit_log / forge.event_feed_state differs from the shipped one, a table privilege of the migrated schema differs, or the DDL log has a change that neither a bootstrap run nor a migration explains and nobody acknowledged."
diagnosis = "The event carries `reason`: rejected (with `query`, `sqlstate=XF001` and `db_message` naming the operation and table), guard_missing (with `guard`: bootstrap_version (`found` / `expected`), role_attributes (`role`), role_separation (`role`, `member_of`), object_owner (`object`: database, schema public, schema forge_audit, a log table, or an extension in forge_audit), log_triggers / event_triggers (`trigger`), audited_trigger (`table`, `detail`: the audit trigger forge.audited_change_present of a state table against tables.toml — table_missing, id_column (not an integer column, `column`), ledger_column (a ledger column the table lacks, `column`), missing, extra (a second trigger on the function), name, not_deferred_constraint, not_always, when, events, arguments, update_of (not every column but unaudited_columns: a column was added without re-creating the trigger)), function_owner / function_body / function_privilege (`function`, `role`), migration_records (`version`: a db.migrate audit row for a version this binary does not ship, a second row for a version, or guarded_changes that differ from the file), db_settings (`role`, or * for a database-wide default, `scope=every_database` for a role-wide setting on a bootstrap role: a session default other than the three login search_paths of the bootstrap), privileges (`object`: the database, a schema, a log table, forge._sqlx_migrations, a table of the migrated schema such as forge.events, or the default privileges of forge_owner / forge_seq / forge_purge — its ACL differs from the shipped one; detail=audited_table_unlisted: a tables.toml audited table that this build's doctor does not list with its exact ACL — a build defect, fix src/bootstrap/schema.rs; `grants` in the log lists what was found)), unexpected_ddl (`count`, `first_id`: rows of forge_audit.ddl_audit_status() with expected = false and no acknowledgement), role_membership_changed (with `unexpected` / `missing` as member->role; role names are in the log only, not in forge doctor output). Run `forge doctor --json` (read-only) and compare the db.bootstrap check with ops/db/bootstrap/; read forge_audit.ddl_audit for the time of the change."
fix = "rejected: find the caller named by `query` — append-only tables are changed only by their owning functions. guard_missing: re-run 03-database-objects.sql (an approved runbook step; it recreates every guard trigger, event trigger, function and privilege) or 01-cluster-roles.sql for role attributes. role_membership_changed: revoke the unexpected membership, or add role:member to database.privileged_members after review."
runbook = "append-only-violation"
test = "an_update_of_an_append_only_table_is_append_only_violation"

[[error]]
code = "FG-DB-0010"
name = "ChangeRejected"
http_status = 500
severity = "warn"
user_message_ja = "変更を保存できませんでした。管理者に連絡してください。"
user_message_en = "The change could not be saved. Contact the administrator."
user_message_id = "Perubahan tidak dapat disimpan. Hubungi administrator."
cause = "A typed command built a change that forge refuses before it reaches the database (ADR-0016 §6): more than 100 events in one change record, an event from an anonymous actor (events always name who acted), events on a change whose outcome is not succeeded, an event of another project than the audited one, an act-as credential that differs from the request's credential, an integer outside ±2^53−1 in the details of a succeeded change or in a payload (the sealed JSON must read back exactly), details / payload over their stored bound, or a dedup_key that is not `<prefix>:<part>[:<part>…]` (^[a-z][a-z_]*(:[0-9a-z_-]{1,64}){1,4}$, at most 200 characters; event types are the registered `EventType` enum and cannot be malformed). This is a bug in the command that built it. Also (M1 phase 9 MR2): forge_db::repositories::record_push was given a push record that git cannot have applied (reason `invalid_push_record`, see PushRecord::check) — a bug in the caller."
diagnosis = "The event carries `reason` (too_many_events with `count`, anonymous_event, events_on_unsuccessful, event_scope_mismatch (an event whose project_id differs from the audit row's: a project event needs an audit row naming the same project, an audit row without a project publishes only instance-wide events, ADR-0016 Amendment D4), audit_scope_mismatch (an audit row on resource `project` whose project_id is not its resource_id: the event scope rule relies on it), credential_mismatch, unsafe_number with `field` = details | payload, field_too_long with `field` = details | payload, measured as the table CHECKs measure them, invalid_dedup_key with `event_type` — or with `prefix` when `DedupKey::new` refused it) and `action` (the audit action of the change). Nothing was written: the transaction was rolled back. Client-supplied values are never a reason: actor_label, user_agent, act_as_claimed, via_assertion_id and effective_scope are cut to their bounds and stripped of control and invisible characters, and the details of an unsuccessful change that do not fit become `{\"details_dropped\": \"too_long\" | \"unsafe_number\"}`, so a refusal is always audited. invalid_push_record carries `rule` (no_updates, too_many_updates, duplicate_ref, mixed_hash_length, unchanged_ref, kind_mismatch, delete_with_commits, too_many_commits, total_commits, object_id): fix the caller that built the record (forge-web's push path) or the replayed log line."
fix = "Fix the command named by `action`: emit one aggregate event instead of many, give the change a non-anonymous actor, publish events only for a succeeded change and for the audited project, pass large ids as strings, or keep the field within its bound. Build dedup_key with `DedupKey::new` from server-side ids, hashes and fixed words only (it is unique instance-wide)."
test = "a_change_with_too_many_events_is_rejected_before_writing"

# ── C8: the audit seal (ADR-0018 §4) ─────────────────────────────────────
[[error]]
code = "FG-DB-0011"
name = "AuditSealMismatch"
http_status = 500
severity = "alert"
user_message_ja = "監査ログの封印の検証に失敗しました。管理者に連絡してください。"
user_message_en = "The audit log seal could not be verified. Contact the administrator."
user_message_id = "Segel log audit tidak dapat diverifikasi. Hubungi administrator."
cause = "The audit log no longer matches its seals (forge.audit_seal, ADR-0018 §4), or a range to seal is not contiguous: a sealed column of a sealed audit row was changed (recompute), a seal row's own fields (including kind and key_id) no longer give its seal_sha256 or name an unknown hash_version (recompute), its range does not continue the previous seal, or the feed state no longer matches the seals (chain), the HMAC does not match the key named by key_id or that key is not in audit.seal_keys_file (hmac), or rows of a range are missing — sealed rows deleted, or the audit.seal job found a hole in the numbers it was about to seal (gap). Only the database owner or a superuser can do this past the guards (or a sequencer bug, for gap), so treat it as possible tampering until explained. The sink reasons (sink_mismatch, sink_missing, db_behind_sink) arrive with the seal sink in step C9."
diagnosis = "The event carries `reason` (recompute, chain, hmac, gap), `detail` (recompute: rows_sha256 | seal_sha256 | hash_version | kind; chain: prev_seal_sha256 | first_seq, or from the audit.seal job feed_state_missing (forge.event_feed_state gone while rows are numbered) | audit_high_below_seal (audit_high_seq below the last sealed seq, with `last_sealed_seq` / `audit_high_seq`); hmac: mismatch | unknown_key_id; gap: missing_rows), `seal_id` (absent for a gap found while sealing), `first_seq` / `last_seq` (the seal's range), and for gap `missing_seq` (the first missing number) and for hmac `key_id`. It comes from forge doctor audit.seal_verify (the seals of the last 24 hours by sealed_at, read-only) or from the audit.seal task of forge worker (gap, feed_state_missing, audit_high_below_seal: nothing was sealed; logged once per failure streak with `task=audit_seal` and the streak's request_id). Compare the range with forge_audit.ddl_audit and the PostgreSQL log for the time of the change; `SELECT id, kind, key_id, first_seq, last_seq, sealed_at, shipped_at FROM forge.audit_seal WHERE id = <seal_id>` (read-only)."
fix = "Never re-seal or edit seals to make the alert go away. Follow the runbook: preserve the evidence, find who changed the rows (the database owner or a superuser), and restore the rows from a backup if needed. hmac with unknown_key_id: the key file lost a key that signed seals — put the retired key back (keys are only ever added). gap while sealing: sealing stops until the missing rows are explained."
runbook = "audit-seal-mismatch"
test = "a_tampered_sealed_column_is_audit_seal_mismatch_recompute"
# ── end C8 ───────────────────────────────────────────────────────────────

[[error]]
code = "FG-DB-0013"
name = "AuditMissing"
http_status = 500
severity = "alert"
user_message_ja = "変更の記録に失敗したため、変更を取り消しました。管理者に連絡してください。"
user_message_en = "The change was undone because it could not be recorded. Contact the administrator."
user_message_id = "Perubahan dibatalkan karena tidak dapat dicatat. Hubungi administrator."
cause = "A transaction tried to commit a domain event (forge.events) without an audit row (forge.audit_log) in the same transaction, and the deferred constraint trigger refused the commit (SQLSTATE XF002, ADR-0016 §1). Every state change goes through forge-db's ChangeTx, which writes both; reaching this means a write bypassed ChangeTx (a bug or a manual change). Derived events (caused_by_seq set) are written by subscribers through DerivedTx without an audit row; their own checks (also XF002) refuse an event whose lineage does not follow its origin (derived_lineage), whose origin is at the depth limit 8 (derived_depth), whose root already has 100 derived events (derived_fanout), or that commits without a subscriber advancing to its origin in the same transaction (derived_progress). The same XF002 (reason audited_change) refuses an insert, update or delete of a state table (tables.toml kind = audited, trigger forge.audited_change_present) without a succeeded audit row for that resource in the transaction."
diagnosis = "The event carries `query` (the statement that committed, or the insert when the transaction ran SET CONSTRAINTS IMMEDIATE, or the derived insert for the lineage checks), `reason` (no_audit_row, or derived_lineage / derived_depth / derived_fanout / derived_progress, audited_change or audited_change_config, also in `constraint`; M3 I1b: work_item_link_unaudited (constraint merge_request_work_items_audited: a person's work item link or its end without a work_item.* audit row naming that work item, or an unbinding's end without integration.unbound, in its transaction) and derived_work_item_link (constraint merge_request_work_items_derived: a detected link written outside the work-item-sync subscriber's step; counted against the event like the other derived_* refusals); xf002_unknown: a CONSTRAINT name this build does not know — a newer or changed trigger, read `constraint` and `db_message`), `sqlstate=XF002` and `db_message` (names the origin or root seq). Find the writer: the root gate db-write-boundary forbids writes outside forge-db; inside forge-db every insert into forge.events must come from ChangeTx::commit. reason=audited_change: a write to a state table (tables.toml kind = audited; the table is in `table`) had no succeeded audit row for the same resource (resource_type / resource_id as the ledger's audit_resource / audit_id_column name them) in its transaction; inside forge-db every write to that table must come from its typed command through ChangeTx. reason=audited_change_config: the trigger itself does not match the ledger (wrong argument count, or the id column holds a non-integer) — a schema defect, not a bypass; forge doctor reports it as FG-DB-0009 guard=audited_trigger. forge_audit.ddl_audit shows whether the trigger was changed recently. A subscriber's refused COMMIT (`subscriber` set, reason derived_*) is counted against its event in a fresh transaction that waits up to 5 s for the subscriber's row; `counted=false` means it was not counted, `not_counted` says why (row_held: another worker held the row past the wait; disabled; moved: the cursor moved meanwhile) — the next step meets the event again."
fix = "Route the write through ChangeTx (forge-db typed command). Never disable the trigger; the change was rolled back and can be retried once fixed."
runbook = "append-only-violation"
test = "an_event_without_an_audit_row_cannot_commit"

# ── C8: the audit seal backlog (ADR-0018 §4) ─────────────────────────────

[[error]]
code = "FG-DB-0014"
name = "FeedEpochChanged"
http_status = 500
severity = "warn"
user_message_ja = "イベントの履歴の世代を作り直しました。連携先は履歴を取り直します。"
user_message_en = "The event feed's epoch was rotated. Integrations resync their feed."
user_message_id = "Epoch feed perubahan telah diperbarui. Integrasi akan menyinkronkan ulang feed-nya."
cause = "The event feed's `epoch` (forge.event_feed_state) was rotated, so every integration's cursor answers 410 `epoch_mismatch` and the consumers resync (ADR-0016 §7, ADR-0018 §5). In M3 only by hand: `forge admin events new-epoch` (`reason=manual`) after the database was restored from a backup or rebuilt in the same cluster, an approved step of the restore runbook (forge_maint runs forge.feed_new_epoch, owned by forge_seq, which writes the `feed.epoch_rotated` audit row). The automatic detection of a rollback (system_identifier, timeline, the seal sink) comes with C9. Logged at warn by the command."
diagnosis = "The log event carries `reason` (`manual`), `old_epoch` and `new_epoch`. SELECT epoch, epoch_rotated_at, high_seq FROM forge.event_feed_state; the audit row: SELECT occurred_at, details FROM forge.audit_log WHERE action = 'feed.epoch_rotated' ORDER BY id DESC LIMIT 5."
fix = "Expected after a restore: nothing to do, the consumers resync after their 410 (runbook integration-feed-lag). Unexpected: find who ran it from the audit row and the maintenance login's logs."
runbook = "integration-feed-lag"
test = "new_epoch_rotates_the_feed_epoch"
[[error]]
code = "FG-DB-0015"
name = "AuditSealBacklog"
http_status = 500
severity = "alert"
user_message_ja = "監査ログの封印が遅れています。管理者に連絡してください。"
user_message_en = "Sealing of the audit log is delayed. Contact the administrator."
user_message_id = "Penyegelan log audit tertunda. Hubungi administrator."
cause = "An audit row older than 5 minutes is not covered by a seal (ADR-0018 §4): forge worker is not running (it does not start without audit.seal_keys_file: FG-SYS-0002 reason=missing) or its audit_seal task keeps failing (for example FG-DB-0011 reason=gap, or FG-SYS-0001 operation=seal.v1 for a row hash version 1 cannot read), or audit rows wait for their number because audit sequencing is off (a fresh installation before the first sink comparison of step C9, or a rollback detected and a seal resync pending — then this alert is expected until the runbook's resync step)."
diagnosis = "forge doctor audit.seal_backlog reports it with `oldest_age_s` (age of the oldest unsealed row), `last_sealed_seq` (`none` = nothing sealed yet), `audit_high_seq`, `unsealed_numbered` (numbered rows after the last seal, capped at 100000+), `unsequenced` (rows still waiting for a number) and `audit_sequencing` (on / off). unsequenced > 0 with audit_sequencing=off: numbering is stopped — see runbook audit-seal-mismatch (resync) or wait for the first sink comparison. unsealed_numbered > 0: read the forge worker log for task=audit_seal (its error_code names the failure; logged once per failure streak with a request_id)."
fix = "Start or repair forge worker and its audit.seal_keys_file; fix the failure its log names (FG-DB-0011 reason=gap: follow audit-seal-mismatch first). Never insert seals by hand."
runbook = "audit-seal-backlog"
test = "an_old_unsealed_row_is_audit_seal_backlog"
# ── end C8 ───────────────────────────────────────────────────────────────
# ── M1 phase 8 MR3: namespace rows the resolver cannot read ────────────
[[error]]
code = "FG-DB-0021"
name = "NamespaceDataInvalid"
http_status = 500
severity = "alert"
user_message_ja = "名前空間の情報を読み取れませんでした。問い合わせ番号を添えて管理者に連絡してください。"
user_message_en = "The namespace data could not be read. Contact the administrator with the request ID."
user_message_id = "Data namespace tidak dapat dibaca. Hubungi administrator dengan menyertakan ID permintaan."
cause = "Resolving a path or loading a project's access facts (forge_db::resolve, the NamespaceResolver / ProjectAccessLoader that the web dispatcher uses, ADR-0015) found namespace, tombstone or project rows that the schema and the forge-db commands never write: reason=stored_path_invalid — the current path of a moved tombstone's target, rebuilt from its segments and confirmed against forge.namespaces.full_path, does not pass NamespacePath::parse (a segment outside the naming rules, more than 20 levels or longer than 255 characters: a CHECK was dropped); unknown_namespace_kind / unknown_tombstone_kind / unknown_visibility — a stored kind or visibility outside its CHECK; moved_path_unconfirmed — a moved tombstone's target namespace still exists but its current path, rebuilt from its segments, matches no live path with its id (its stored full_path disagrees with its segments: a subtree rewrite missed a row); only a purged target (namespace_id NULL) makes a moved tombstone deleted; namespace_without_project — a kind = 'project' namespace whose projects row is missing; project_without_namespace — a projects row with no kind = 'project' namespace; loading a project by id only (GET /api/v1/projects/{id}, M1 phase 8 MR5): project_path_unconfirmed — the project namespace's stored full_path disagrees with its segments joined up the parent chain, stored_path_invalid with a project_id — that full_path does not pass NamespacePath::parse, project_without_repository — a projects row with no forge.repositories row. The data was changed outside forge-db (a manual change, a restored dump, a dropped constraint or a purge that left half of the 1:1:1). The request is refused rather than answered from a guess (no redirect to a path that may not be the target's, no access decided on a partial row). Since M1 phase 9 MR3 the path resolution reads the project's repository too (Smart HTTP): project_without_repository and unknown_repository_state (a stored state outside its CHECK) also come from resolving a project path. The list page scans (forge_db::lists, `GET /api/v1/projects` / `/groups`, M1 phase 8b) read each scanned row the same way: a project row gives the same reasons as a project loaded by id; a group row gives group_without_namespace (a groups row without its group namespace), group_path_unconfirmed (its stored full_path disagrees with its segments) or stored_path_invalid — one damaged row fails the whole page, never a silently shorter one."
diagnosis = "Since M1 phase 8b MR7a also from the group loader (forge_db::groups::load, `GET|PATCH /api/v1/groups/{id}`: group_without_namespace, group_path_unconfirmed, group_parent_not_group, stored_path_invalid, with `group_id`), the project-parent loader (forge_db::resolve::load_parent, `POST /api/v1/projects`: unknown_namespace_kind with `namespace_id` and `raw`) and the project update lock (unknown_visibility with `project_id`). The log event carries `reason` and the ids: `namespace_id` (the resolved or moved-to namespace), `tombstone_id` for a moved tombstone (stored_path_invalid, moved_path_unconfirmed, unknown_tombstone_kind), `project_id`, and for unknown_* `raw` (the stored value, at most 32 characters); for stored_path_invalid `rule` (the NamespacePath::parse reason: charset, too_deep, path_too_long, …) — the path itself is not logged. Read read-only: SELECT id, parent_id, kind, owner_id, segment, full_path, depth FROM forge.namespaces WHERE id = <namespace_id>; for moved_path_unconfirmed walk its parents (the FG-DB-0018 diagnosis query) and compare the joined segments with full_path; SELECT * FROM forge.namespace_tombstones WHERE id = <tombstone_id>; SELECT id, visibility, deleted_at FROM forge.projects WHERE id = <project_id>; SELECT id, project_id, state FROM forge.repositories WHERE project_id = <project_id> (project_without_repository, unknown_repository_state); for project_path_unconfirmed compare the namespace's joined segments with its full_path as for moved_path_unconfirmed; then check pg_constraint for namespaces_segment / namespaces_kind / namespace_tombstones_kind / projects_visibility / repositories_state and forge_audit.ddl_audit for who dropped or altered it, and forge.audit_log for the history of the rows. From a list page the event carries `group_id` (group rows) or `project_id`; read the namespace with SELECT id, parent_id, kind, owner_id, segment, full_path FROM forge.namespaces WHERE kind = 'group' AND owner_id = <group_id>."
fix = "Restore the rows from the audit log or a backup through an approved runbook step; restore a dropped constraint from the migration. Never patch the rows by hand without approval."
runbook = "namespace-data"
test = "a_moved_target_path_that_does_not_parse_is_namespace_data_invalid"
# ── end M1 phase 8 MR3 ─────────────────────────────────────────────────

# ── M3 C1: check run rows this build cannot read ────────────────────────
[[error]]
code = "FG-DB-0022"
name = "CheckRunDataInvalid"
http_status = 500
severity = "alert"
user_message_ja = "チェックの結果を読み取れませんでした。問い合わせ番号を添えて管理者に連絡してください。"
user_message_en = "The check results could not be read. Contact the administrator with the request ID."
user_message_id = "Hasil pemeriksaan tidak dapat dibaca. Hubungi administrator dengan menyertakan ID permintaan."
cause = "Reading the check runs of a commit (forge_db::checks: the merge status through `CheckResultsSource`, the merge gate inside the merge request's transaction, `GET /api/v1/projects/{id}/commits/{sha}/checks`, or a report locking its run) found rows the forge-db commands never write: `reason=too_many_stored_runs` — more than 100 runs on one commit of one project (the cap is enforced by the application, FG-REVIEW-0021); `stored_name_invalid` — a name `CheckName::parse` refuses; `stored_status_invalid` — a status / conclusion pair outside the CHECKs (a conclusion without `completed`, or the reverse); `stored_annotation_invalid` — an annotation's level or line range outside its CHECK. The data was changed outside forge-db (a manual change, a restored dump, a dropped constraint). No run is skipped: a merge is refused and a status read fails rather than deciding on a partial set (skipping a run could turn a failure into `required_check_missing`, or the reverse)."
diagnosis = "The log event carries `reason`, `project_id` and `head_sha` (and `check_run_id` for a row); the name, summary and annotation text are not logged. Read read-only: SELECT id, name, status, conclusion, completed_at, revision FROM forge.check_runs WHERE project_id = <project_id> AND head_sha = '<head_sha>' ORDER BY id; SELECT count(*) FROM forge.check_runs WHERE project_id = <project_id> AND head_sha = '<head_sha>'; check pg_constraint for check_runs_name / check_runs_status / check_runs_conclusion_when_completed / check_annotations_level, and forge_audit.ddl_audit and the forge.audit_log `check_run.reported` / `check.completed` rows for who changed what."
fix = "Through an approved runbook step, delete the rows that break the rules (the reporter reports again; the audit log keeps every report) or restore them from a backup; restore a dropped constraint from the migration. Never edit the rows by hand without approval."
runbook = "checks-reporting"
test = "a_stored_run_this_build_cannot_read_is_check_run_data_invalid"
# ── end M3 C1 ──────────────────────────────────────────────────────────

# ── M1 gstn core: client-side codes (area CLI; http_status is the nominal class) ──
[[error]]
code = "FG-CLI-0001"
name = "CliUsageInvalid"
http_status = 400
severity = "info"
user_message_ja = "コマンドの使い方が正しくありません。`gstn help` を確認してください。"
user_message_en = "The command was used incorrectly. Check `gstn help`."
user_message_id = "Perintah digunakan dengan tidak benar. Periksa `gstn help`."
cause = "A `gstn` command line was rejected before any request was sent: an unknown command, a missing or conflicting argument, a malformed `--field k=v`, an unreadable `--input` file, a path that is not a path on the configured host, or `auth login` without `--with-token` (gstn never prompts, plan 01 §3.11 C-4)."
diagnosis = "The error is printed on stderr with `reason` in the detail line. Compare with `gstn help --json` (all commands and arguments) and `gstn schema <command>`."
fix = "Correct the command line; exit code 2."
test = "cli_usage_errors_exit_2"

[[error]]
code = "FG-CLI-0002"
name = "CliNotLoggedIn"
http_status = 401
severity = "info"
user_message_ja = "ログインしていません。`gstn auth login --with-token` を実行してください。"
user_message_en = "You are not logged in. Run `gstn auth login --with-token`."
user_message_id = "Anda belum masuk. Jalankan `gstn auth login --with-token`."
cause = "No token is stored for the configured host (and GSTN_TOKEN is not set), or the credential store holding it could not be read."
diagnosis = "`gstn auth status --json` shows the host and whether a token exists (never the token). A credential store that exists but fails is reported as a warning on stderr before this error."
fix = "Issue a token in the GitStation web UI and run `gstn auth login --with-token < token-file`; exit code 3."
test = "not_logged_in_exits_3"

[[error]]
code = "FG-CLI-0003"
name = "CliServerUnreachable"
http_status = 503
severity = "warn"
user_message_ja = "GitStation サーバーに接続できません。しばらくしてからもう一度試してください。"
user_message_en = "The GitStation server could not be reached. Try again shortly."
user_message_id = "Server GitStation tidak dapat dihubungi. Coba lagi sebentar lagi."
cause = "A request failed before an HTTP response was read: DNS, connection refused, timeout (connect or total), or a TLS failure (certificate not trusted, hostname mismatch). Retryable."
diagnosis = "The detail line carries `reason` (`connect`, `timeout`, `tls`, `other`) and the host. For `tls` the CA bundle is the cause: the system store is used plus `ca_file` in config.toml / `GSTN_CA_FILE`. Check `forge doctor` on the server and the reverse proxy."
fix = "Fix the network or certificate path; retry. Exit code 6 (`retryable: true` in the JSON error)."
test = "unreachable_server_exits_6_and_is_retryable"

[[error]]
code = "FG-CLI-0004"
name = "CliResponseInvalid"
http_status = 502
severity = "warn"
user_message_ja = "サーバーの応答を解釈できませんでした。サーバーの版を確認してください。"
user_message_en = "The server response could not be understood. Check the server version."
user_message_id = "Respons server tidak dapat dipahami. Periksa versi server."
cause = "The server answered with a body that is not the API v1 shape (not JSON, an error body without `error_code`, an unexpected redirect, a body above the size limit, a repeated pagination cursor) — typically a proxy page or a server of another version."
diagnosis = "The detail line carries `reason` and the HTTP status. Fetch the same path with `gstn api GET /healthz` and compare with docs/api/openapi.json of the server's version."
fix = "Point `host` at the GitStation server itself (not a login page or proxy); upgrade gstn or the server to matching versions. Exit code 1."
test = "non_api_response_is_response_invalid"

[[error]]
code = "FG-CLI-0005"
name = "CliConfigInvalid"
http_status = 400
severity = "info"
user_message_ja = "gstn の設定が正しくありません。設定ファイルと環境変数を確認してください。"
user_message_en = "The gstn configuration is invalid. Check the config file and environment."
user_message_id = "Konfigurasi gstn tidak valid. Periksa file konfigurasi dan variabel lingkungan."
cause = "config.toml or a GSTN_* variable is unreadable or invalid, no host is configured, the host is not an https URL (http is allowed only for loopback, or with `allow_http = true`), or the CA bundle file is unreadable. Also `gstn mcp` when the agent tools manifest built into gstn (docs/api/agent-tools.toml) is invalid (`config_key=agent_tools reason=invalid`): a build defect the parity gate in forge-client stops first; nothing is served — use a gstn built from a commit whose tests pass."
diagnosis = "The detail line carries `config_key` and `reason` (`missing`, `invalid`, `unreadable`, `insecure_scheme`). The token is never sent over a plain-http host."
fix = "Set `host` in config.toml (`gstn` prints the path in the detail) or pass `--host`; exit code 2."
test = "config_without_host_is_config_invalid"

[[error]]
code = "FG-CLI-0006"
name = "CliCredentialStoreFailed"
http_status = 500
severity = "warn"
user_message_ja = "トークンを保存できませんでした。保存先の権限を確認してください。"
user_message_en = "The token could not be stored. Check the permissions of the storage location."
user_message_id = "Token tidak dapat disimpan. Periksa izin lokasi penyimpanan."
cause = "Neither the OS credential store (Windows Credential Manager, Linux Secret Service) nor the 0600 file fallback accepted the token."
diagnosis = "The detail line carries `backend` and `reason`. Linux without a Secret Service (no desktop session, headless) falls back to the file; this code means the file failed too (directory not writable, mode could not be set)."
fix = "Make the config directory writable (GSTN_CONFIG_DIR) or start a Secret Service; exit code 1."
test = "credential_file_failure_is_credential_store_failed"

# ── end gstn core ──

[[error]]
code = "FG-CLI-0007"
name = "CliOutputFailed"
http_status = 500
severity = "warn"
user_message_ja = "出力を書き込めませんでした。出力先が閉じられていないか確認してください。"
user_message_en = "The output could not be written. Check that the output is not closed."
user_message_id = "Output tidak dapat ditulis. Pastikan tujuan output tidak tertutup."
cause = "Writing to standard output or standard error failed (a closed pipe, a full disk, a redirected file that cannot be written) after the command ran. Also `gstn doc fmt` (plan 13 stage 2) failing to write a formatted document (`stream=file reason=write_failed`): it writes a new temporary file beside the document and renames it over the document, so a document is never half written; the temporary file is removed on failure. `reason=file_changed_while_formatting`: the document's length or time of change differs from when it was read (someone edited it meanwhile); it is left as it is — run gstn doc fmt again."
diagnosis = "The detail line carries `stream` (stdout, stderr, or file for `gstn doc fmt`) and the OS error kind. A command that changes state (`auth login`, `auth logout`, `api` with a body) has already done its work when this code appears: check with `gstn auth status`."
fix = "Fix the redirection or the reader of the pipe and run the read-only command again; exit code 1."
test = "closed_stdout_is_output_failed"

[[error]]
code = "FG-CLI-0008"
name = "CliWaitTimedOut"
http_status = 504
severity = "info"
user_message_ja = "待ち時間内に処理が終わりませんでした。処理はサーバーで続いています。しばらくしてから状態を確認してください。"
user_message_en = "The operation did not finish within the wait time. It continues on the server; check its status later."
user_message_id = "Operasi tidak selesai dalam waktu tunggu. Operasi tetap berjalan di server; periksa statusnya nanti."
cause = "`gstn … --wait` (M3 R4: `gstn mr merge --wait`, `gstn mr merge-status --wait`) polled the server until `--wait-timeout` passed and the operation was still not final (a merge still `queued`, `prepared` or `executing`). Nothing was cancelled: the server's job goes on. Retryable (exit code 6)."
diagnosis = "The detail line carries `reason=merge_not_final` and the last `state`. Read the attempt with `gstn mr merge-status --project ID --iid N --json`; an attempt that stays `executing` is runbook merge-execution."
fix = "Run `gstn mr merge-status --project ID --iid N --wait` again (or with a longer `--wait-timeout`)."
test = "merge_wait_that_times_out_is_retryable"

[[error]]
code = "FG-CLI-0009"
name = "CliInputFailed"
http_status = 500
severity = "info"
user_message_ja = "入力を読めませんでした。gstn を起動したプログラム（AI エージェントの MCP クライアントなど）を確かめてください。"
user_message_en = "The input could not be read. Check the program that started gstn (an AI agent's MCP client, for example)."
user_message_id = "Masukan tidak dapat dibaca. Periksa program yang menjalankan gstn (misalnya klien MCP agen AI)."
cause = "`gstn mcp` (M3 X5) reads JSON-RPC messages from stdin and the read failed with an I/O error other than the end of input (a closed pipe or an unexpected end of file end the server cleanly with exit 0). The MCP client's transport broke: the process that started gstn went away abnormally, or stdin is something unreadable. Nothing on the server is affected. Also `gstn doc fmt` / `gstn doc lint` (plan 13 stage 2, local only) when the working tree cannot be read: `reason=cwd_unreadable` (the current directory), `reason=git_ls_files_failed` (`git ls-files` in the repository's root is not runnable, fails, or passes its 30 s limit: git_not_runnable, exit <n>, git_timeout), or `reason=file_unreadable` (a listed document or type definition cannot be opened or read; a file deleted from the working tree is passed over, not an error)."
diagnosis = "The detail line carries `reason=stdin_unreadable` and `kind` (the I/O error kind); for gstn doc, the reason above and `kind`: run `git ls-files` in the repository yourself and check the file's permissions. Look at the MCP client's own log for why its pipe failed; run `gstn mcp < /dev/null` to see that gstn itself starts and ends cleanly."
fix = "Restart the MCP client. If it keeps failing, check that the client starts gstn with a pipe on stdin (stdio transport), not a terminal or a file it closes."
test = "a_broken_input_is_an_input_failure"

# ── M3 R1a: merge requests (area REVIEW, ADR-0024; numbers in registration order, plan 11 §11.4) ──
[[error]]
code = "FG-REVIEW-0001"
name = "DuplicateOpenMergeRequest"
http_status = 409
severity = "info"
user_message_ja = "同じブランチどうしの開いているマージリクエストがすでにあります。既存のマージリクエストを使ってください。"
user_message_en = "An open merge request for the same source and target branches already exists. Use the existing merge request."
user_message_id = "Merge request terbuka untuk branch sumber dan tujuan yang sama sudah ada. Gunakan merge request yang sudah ada."
cause = "A merge request was to be opened (`POST /api/v1/projects/{id}/merge-requests`), reopened (`POST …/merge-requests/{iid}/reopen`) or retargeted (`PATCH …/merge-requests/{iid}` with `target_branch`) while another merge request of the same project with the same source and target branch is open (ADR-0024 §1: at most one open merge request per (project, source, target)). forge_db::review checks it under the project row lock; the partial unique index merge_requests_one_open is the database backstop. Nothing was written."
diagnosis = "The log event carries `reason=open_exists` (the check under the lock, with `existing_iid`) or `reason=unique_index` (the backstop), `project_id` and `action` (`merge_request.opened` / `merge_request.reopened` / `merge_request.updated`); branch names are not logged. List the open merge requests with `GET /api/v1/projects/{id}/merge-requests?state=open` (`gstn mr list --project ID`). The event also carries `user_id` (who asked)."
fix = "Use (or close) the existing open merge request for those branches; then open or reopen the other one."
test = "a_second_open_merge_request_for_the_same_branches_is_refused"

# ── M3 R1b: merge request versions (ADR-0024 §2; registration order) ──
[[error]]
code = "FG-REVIEW-0002"
name = "PurgePreconditionFailed"
http_status = 409
severity = "info"
user_message_ja = "このマージリクエストの状態では版の参照を削除・再オープンできません。先にマージリクエストをクローズするか、ソースブランチを書き換えてください。"
user_message_en = "The merge request's state does not allow this: close the merge request or rewrite its source branch first."
user_message_id = "Status merge request tidak mengizinkan ini: tutup merge request atau tulis ulang branch sumbernya terlebih dahulu."
cause = "Either an administrator asked to purge the hidden version refs of an open merge request whose current head is one of the versions to purge (`POST /api/v1/projects/{id}/merge-requests/{iid}/version-refs/purge`, `reason=purge_requires_closed_or_rewritten`: the next version job would bring the same commit back as the head), or a merge request whose version refs were purged was to be reopened while its source branch still points at a purged commit (`POST …/merge-requests/{iid}/reopen`, `reason=reopen_at_purged_head`; ADR-0024 closing table #43). A state refusal, not a permission one: nothing was written and no ref was touched."
diagnosis = "The log event carries `reason`, `project_id`, `iid` and `merge_request_id` (and `version` for the purged head). Read the merge request (`gstn mr view IID --project ID`): `state` and `head_sha`. Runbook `secret-removal` lists the order of the steps."
fix = "Close the merge request (or force-push the source branch without the secret, which adds a new version), then purge again; to reopen a purged merge request, first move the source branch away from the purged commit."
test = "purge_of_an_open_merge_requests_current_head_is_refused"
runbook = "secret-removal"

[[error]]
code = "FG-REVIEW-0003"
name = "MergeabilityNotChecked"
http_status = 500
severity = "warn"
user_message_ja = "マージできるかをまだ確かめられていません。しばらくしてからもう一度確認してください。"
user_message_en = "Whether this merge request can be merged has not been checked yet. Check again later."
user_message_id = "Apakah merge request ini dapat digabungkan belum diperiksa. Periksa lagi nanti."
cause = "A merge request's mergeability (ADR-0024 §3, M3 R2) is not being decided as it should. reason=job_failed: the mergeability job failed for good (its last attempt, or a failure that can never succeed) before it stored a result; the row was set to check_failed reason=job_failed. reason=job_stale: a row stayed `checking` longer than the job's time limit with no queued or running job (the worker crashed, the run hit its timeout and the job died, or the job row was removed); the worker's periodic sweep set it to check_failed reason=job_stale. reason=fanout_deferred: one push to a target branch had more open merge requests than review.mergeability_fanout_max and more than the deferral cap (5 000): the rest kept their old status; the periodic sweep and the API's staleness rule cover them. Never a user request's failure: logged by the worker (and reported by forge doctor review.mergeability)."
diagnosis = "The event `forge.review.mergeability_not_checked` carries `reason`, `merge_request_id`, `check_seq` (job_failed / job_stale) or `project_id`, `targets`, `skipped` (fanout_deferred), and the request_id of the job or the push. For job_failed, the job runner logged the cause just before, under its own error_code with the same request_id (`job_id`, `kind=merge_request.mergeability`). Read the row (read-only): SELECT merge_request_id, status, reason, check_seq, checked_head_sha, checked_target_sha, updated_at FROM forge.merge_request_mergeability WHERE merge_request_id = <id>; and the jobs: SELECT id, state, attempts, last_error_code FROM forge.jobs WHERE kind = 'merge_request.mergeability' AND dedup_key LIKE 'mr_mergeability:<id>:%' ORDER BY id DESC LIMIT 5. Run `forge doctor --json` (review.mergeability)."
fix = "Fix the cause the job's own error code names (its runbook). The merge request is checked again by its next push, retarget or reopen, and the worker's sweep re-requests rows that are `unchecked` with no live job; a check_failed row blocks merging (mergeability_unknown) until then. Never edit forge.merge_request_mergeability by hand outside an approved runbook step."
runbook = "merge-request-mergeability"
test = "a_stale_checking_row_is_reaped_as_job_stale"

# ── M3 R3: merge request discussions (ADR-0024 §12; registration order) ──
[[error]]
code = "FG-REVIEW-0004"
name = "DiscussionPositionInvalid"
http_status = 422
severity = "info"
user_message_ja = "コメントの位置がこの版の差分にありません。差分を表示し直して、変更された行を選んでください。"
user_message_en = "The comment's position is not in this version's diff. Reload the diff and choose a changed line."
user_message_id = "Posisi komentar tidak ada dalam diff versi ini. Muat ulang diff dan pilih baris yang berubah."
cause = "An inline discussion was to be started (`POST /api/v1/projects/{id}/merge-requests/{iid}/discussions` with a `position`) on a place that is not in the named version's diff (`merge_base_sha..head_sha`, ADR-0024 R2): reason=version_unknown (the merge request has no such version), version_purged (its refs were removed, secret removal), version_base_pending (the version job has not recorded its bases yet), path_not_in_diff (no file of the diff has that path on that side), diff_truncated (the path is not among the files listed and the diff was cut by a cap, so it cannot be shown to be there), no_patch (the file is binary or its patch was left out by a size cap: it has no lines to comment on) or line_out_of_range (the line is in no hunk of the file on that side). Nothing was written."
diagnosis = "The log event carries `reason`, `project_id`, `iid`, `version`, `side` and `line` (never the path or the body). List the versions (`gstn mr versions IID --project ID`) and show the version's diff (`gstn mr diff IID --project ID --version N --patch`): the hunk headers `@@ -a,b +c,d @@` give the commentable lines (old side a..a+b-1, new side c..c+d-1)."
fix = "Start the discussion on a line inside a hunk of a listed file of an existing, unpurged version (or start a general discussion without a position)."
test = "an_inline_discussion_outside_the_diff_is_refused"

[[error]]
code = "FG-REVIEW-0005"
name = "DiscussionLimitReached"
http_status = 409
severity = "info"
user_message_ja = "このマージリクエストのスレッドかコメントが上限に達しました。既存のスレッドで続けるか、新しいマージリクエストに分けてください。"
user_message_en = "This merge request has reached its limit of discussions or comments. Continue in an existing discussion, or split the work into a new merge request."
user_message_id = "Merge request ini telah mencapai batas diskusi atau komentar. Lanjutkan di diskusi yang ada, atau pisahkan pekerjaan ke merge request baru."
cause = "A discussion was to be started or a note added (`POST /api/v1/projects/{id}/merge-requests/{iid}/discussions`, `…/discussions/{discussion_id}/notes`) while the merge request already holds the most the server keeps (M3 R3 review): reason=discussions_per_merge_request (500 discussions), notes_per_merge_request (5 000 notes) or notes_per_discussion (200 notes in one discussion). The counts are taken under the merge request's row lock, so concurrent writers cannot pass the cap. The caps equal the list's caps, so a list never leaves anything out. Nothing was written."
diagnosis = "The log event carries `reason`, `limit`, `project_id`, `iid` and `merge_request_id` (and `discussion_id` for notes_per_discussion). Count read-only: SELECT count(*) FROM forge.merge_request_discussions WHERE merge_request_id = <id>; SELECT discussion_id, count(*) FROM forge.merge_request_notes WHERE merge_request_id = <id> GROUP BY discussion_id ORDER BY 2 DESC LIMIT 5."
fix = "Continue in an existing discussion (or resolve and summarize), or split the work into a new merge request. The caps are constants (forge_db::review::MAX_DISCUSSIONS / MAX_NOTES / MAX_NOTES_PER_DISCUSSION); raising them is a code change that must raise the list's caps together."
test = "a_full_discussion_or_merge_request_refuses_more"

# ── M3 R4: merge execution (ADR-0024 §4; registration order) ──
[[error]]
code = "FG-REVIEW-0006"
name = "MergeRequestConflict"
http_status = 409
severity = "info"
user_message_ja = "マージの直前の確認で、ソースブランチとターゲットブランチが衝突していました。衝突を解消して push し直してから、もう一度マージしてください。"
user_message_en = "When the merge was about to run, the source and target branches conflicted. Resolve the conflict, push again, then merge again."
user_message_id = "Saat merge akan dijalankan, branch sumber dan tujuan berkonflik. Selesaikan konflik, push lagi, lalu merge lagi."
cause = "The merge job (M3 R4, ADR-0024 §4.2 step 4) computed the trial merge of the merge request's head into the target's live tip under the repository's merge lock (`git merge-tree --write-tree`, never the stored mergeability status) and it conflicted: the target moved since the last mergeability check, or the check was stale. The merge attempt was set to `superseded`; no commit was made and no ref moved."
diagnosis = "The job's log event `forge.review.merge_completed` carries `outcome=superseded`, `error_code=FG-REVIEW-0006`, `merge_id`, `merge_request_id`, `head_sha`, `target_sha`, `conflict_files` (count) and `files_truncated` (paths stay out of the event). Read the attempt: SELECT id, state, reason, error_code, head_sha, expected_old FROM forge.merge_request_merges WHERE id = <merge_id>; `gstn mr merge-status --project ID --iid N` shows the same. `gstn mr mergeability` shows the conflicted paths once the next check ran."
fix = "Merge the target into the source branch (or rebase it), resolve the conflicts, push, and ask for the merge again with the new head."
test = "a_merge_whose_trial_merge_conflicts_is_superseded"

[[error]]
code = "FG-REVIEW-0007"
name = "MergeBlocked"
http_status = 409
severity = "info"
user_message_ja = "このマージリクエストはまだマージできません。止めている理由を確認してください。"
user_message_en = "This merge request cannot be merged yet. Check what is blocking it."
user_message_id = "Merge request ini belum dapat digabungkan. Periksa apa yang memblokirnya."
cause = "evaluate_merge() (ADR-0024 §7) returned at least one blocking reason, at the merge request (`POST /api/v1/projects/{id}/merge-requests/{iid}/merge`, nothing written) or again inside the merge job under the lock (the attempt was set to `superseded`, no ref moved). The reasons M3 R4 knows: not_open, draft, merge_in_progress, source_branch_missing, mergeability_unknown (the stored check is not a decision for the live head and target tip; a new check was requested), conflict (the stored check found a conflict), ff_not_possible (fast_forward and the target is not an ancestor of the head), nothing_to_merge (fast_forward and the target is already at the head: there is nothing to merge). Approvals, CODEOWNERS, required checks and discussions join with R5 / R6."
diagnosis = "The log event carries `reasons` (the names, in the fixed order of ADR-0024 §7), `merge_request_id`, `head_sha` and, inside the job, `merge_id`. The HTTP answer's request_id finds the line. `gstn mr view` / `gstn mr mergeability` show the state, draft flag and the check."
fix = "Remove the first reason: mark the merge request ready, wait for the mergeability check (a request with mergeability_unknown queued one), resolve the conflict, or choose the merge_commit / squash method; then merge again."
test = "a_merge_request_that_is_not_ready_is_refused_with_its_reasons"

[[error]]
code = "FG-REVIEW-0008"
name = "HeadChanged"
http_status = 409
severity = "info"
user_message_ja = "マージリクエストかターゲットブランチが、確認した後に更新されました。最新の内容を確認してから、もう一度マージしてください。"
user_message_en = "The merge request or its target branch changed after you looked. Review the latest changes, then merge again."
user_message_id = "Merge request atau branch tujuannya berubah setelah Anda melihatnya. Tinjau perubahan terbaru, lalu merge lagi."
cause = "A merge saw a head or a target tip other than the one it was decided for (ADR-0024 §4.2): reason=stale_view (the request's `sha` is not the merge request's current head: the requester did not see this version; nothing written), source_moved (the source branch's tip, or the merge request's recorded head, moved away from the requested head between the request and the job's check under the lock), target_moved (someone pushed to the target between the job's trial merge and its `update-ref`: the compare-and-swap lost). In the job the attempt was set to `superseded`; the target ref never moved for this attempt. Not an alert: a busy branch."
diagnosis = "The log event carries `reason`, `expected` and `actual` (SHAs), `merge_request_id` and in the job `merge_id`; for target_moved also `forge.review.merge_completed outcome=superseded`. Read the attempt: SELECT state, reason, expected_old, new_sha FROM forge.merge_request_merges WHERE id = <merge_id>."
fix = "Look at the merge request's latest head (`gstn mr view`) and merge again with that `sha`; for target_moved simply merge again (a new trial merge on the new target)."
test = "a_concurrent_push_to_the_target_loses_the_compare_and_swap"

[[error]]
code = "FG-REVIEW-0009"
name = "MergeExecutionFailed"
http_status = 500
severity = "alert"
user_message_ja = "マージの実行中に問題が起きました。問い合わせ番号を添えて管理者に連絡してください。"
user_message_en = "A problem occurred while the merge was running. Contact the administrator with the request ID."
user_message_id = "Terjadi masalah saat merge dijalankan. Hubungi administrator dengan menyertakan ID permintaan."
cause = "The merge job could not finish a merge whose ref may have moved (ADR-0024 §4.2 steps 7, 9 and the reconciliation): reason=update_ref_failed (`git update-ref` failed although the target was still at `expected_old` and no `<ref>.lock` existed, or the ref could not be read back, or git timed out), record_failed (the ref moved and `forge.review.merge_applied` was logged, but the `merged` transaction failed), ref_state_unknown (the reconciliation found an `executing` attempt whose target is neither `new_sha` (or a descendant) nor `expected_old`: the attempt was set to `failed` for a person). Review round 1: merge_request_not_open (the ref moved but the merge request is no longer open, a broken invariant: the attempt was set to `failed` in the record transaction), reconcile_overdue (`forge doctor review.merges`: live attempts are past the reconciliation's bound plus 3 minutes, so forge serve's reconciliation is not running or fails every pass; see FG-SYS-0005 merge_task_exited and the `forge.serve.merge_reconcile_pass` heartbeat). For update_ref_failed and record_failed the attempt stays `executing`: the job's retry and the reconciliation (forge serve, every minute, after the update-ref timeout plus the grace) finish it by asking git."
diagnosis = "Runbook merge-execution. The event carries `reason`, `merge_id`, `merge_request_id`, `repo_id`, `target`, `expected_old`, `new_sha`. Find the job's lines by its request_id; `forge.review.merge_applied` with the same `merge_id` means the ref moved. Read (read-only): SELECT id, state, reason, error_code, expected_old, new_sha, executing_at FROM forge.merge_request_merges WHERE id = <merge_id>; and the target tip: git --git-dir <repo> rev-parse <target>."
fix = "Follow runbook merge-execution: never edit the row by hand. For record_failed / update_ref_failed wait for the reconciliation (it records `applied` when the tip is `new_sha` or its descendant, `superseded` when it is `expected_old`); for ref_state_unknown a person compares the tip with `new_sha` and decides (approved runbook step)."
runbook = "merge-execution"
test = "an_executing_merge_whose_ref_state_is_unknown_is_failed"

[[error]]
code = "FG-REVIEW-0010"
name = "MergeMethodNotAllowed"
http_status = 409
severity = "info"
user_message_ja = "このプロジェクトでは、その方法でマージできません。許可された方法（マージコミットかスカッシュ）を選んでください。"
user_message_en = "This project does not allow that merge method. Choose an allowed method (merge commit or squash)."
user_message_id = "Proyek ini tidak mengizinkan metode merge tersebut. Pilih metode yang diizinkan (merge commit atau squash)."
cause = "A merge asked for a method the project's merge settings do not allow (ADR-0024 §4.1; M3 R4 uses the defaults of ADR-0024: merge_commit and squash allowed, default merge_commit; fast_forward is not allowed until a project setting allows it). Nothing was written."
diagnosis = "The log event carries `method`, `allowed` and `merge_request_id`."
fix = "Merge with merge_commit or squash (`gstn mr merge --method merge_commit|squash`), or omit the method to use the default."
test = "a_merge_method_the_project_does_not_allow_is_refused"

[[error]]
code = "FG-REVIEW-0011"
name = "MergeInProgress"
http_status = 409
severity = "info"
user_message_ja = "このマージリクエストはマージを実行中です。終わるまで待ってから確認してください。"
user_message_en = "This merge request is being merged. Wait for it to finish, then check again."
user_message_id = "Merge request ini sedang digabungkan. Tunggu hingga selesai, lalu periksa lagi."
cause = "A second merge, a close, a retarget or a draft toggle reached a merge request that has a merge attempt in progress (`queued`, `prepared` or `executing` in forge.merge_request_merges; ADR-0024 §4.2). At most one attempt per merge request is live (checked under the merge request's row lock; the partial unique index merge_request_merges_one_live is the backstop). Nothing was written."
diagnosis = "The log event carries `merge_request_id`, `merge_id` (the live attempt), `state` and `action`. `gstn mr merge-status --project ID --iid N` shows the attempt; an attempt that stays `executing` is runbook merge-execution."
fix = "Wait for the merge to finish (`gstn mr merge-status --wait`); if it was superseded, merge again."
test = "two_merges_of_one_merge_request_at_once_let_exactly_one_win"

# ── M3 R4 review round 1 (registration order) ──
[[error]]
code = "FG-REVIEW-0012"
name = "MergeIdentityInvalid"
http_status = 422
severity = "info"
user_message_ja = "アカウントのメールアドレスがコミットの作成者として使えない形式です。管理者にメールアドレスの修正を依頼してから、もう一度マージしてください。"
user_message_en = "The account's e-mail address cannot be used as a commit author. Ask the administrator to fix the e-mail address, then merge again."
user_message_id = "Alamat e-mail akun tidak dapat digunakan sebagai penulis commit. Minta administrator memperbaiki alamat e-mail, lalu merge lagi."
cause = "The merge job builds the merge or squash commit's author and committer from the database (ADR-0024 §4.1) and an account's e-mail is one git would misread: it holds a control character (newline, NUL), `<` or `>`, or nothing but git's end \"crud\" (blanks, `.` `,` `:` `;` `\"` `\\` `'`). Display names are normalised instead (those characters dropped; a name with nothing left falls back to the username), so only the e-mail is refused. The attempt was set to `superseded`; no commit was written and no ref moved."
diagnosis = "The job's `forge.review.merge_completed outcome=superseded error_code=FG-REVIEW-0012` carries `field=email` (or `name` when even the username leaves nothing), `rule=control_character|angle_bracket|empty` and `user_id`; the value is never logged. Read the account (read-only): SELECT id, username, email FROM forge.users WHERE id = <user_id>; the merge's author is the requester (and, for a squash, the merge request's author)."
fix = "Correct the account's e-mail (the identity provider's attribute, then a new sign-in, or the administrator's account tools) and merge again."
test = "a_merge_identity_with_a_bad_email_is_refused"

# ── M3 R5: approvals, approval rules and CODEOWNERS (registration order) ──
[[error]]
code = "FG-REVIEW-0013"
name = "SelfApprovalRefused"
http_status = 403
severity = "info"
user_message_ja = "自分のマージリクエストは承認できません。ほかのレビュアーに承認を依頼してください。"
user_message_en = "You cannot approve your own merge request. Ask another reviewer to approve it."
user_message_id = "Anda tidak dapat menyetujui merge request Anda sendiri. Minta peninjau lain untuk menyetujuinya."
cause = "The author of a merge request asked to approve it (ADR-0024 §8.3, §12; ADR-0017 §2.6). authorize() refuses `MergeRequestApprove` when the caller is the author, administrators included (no exception). Nothing was written."
diagnosis = "The log event carries `action=MergeRequestApprove`, `reason=self_approval` and the request_id; the merge request's author is the caller (SELECT author_id FROM forge.merge_requests WHERE project_id = <project_id> AND iid = <iid>)."
fix = "Ask another Developer (or higher) of the project to approve. A committer's approval is accepted but not counted (`uncounted_reason=committer`, runbook merge-blocked)."
test = "the_author_cannot_approve_their_own_merge_request"

[[error]]
code = "FG-REVIEW-0014"
name = "CodeownersInvalid"
http_status = 422
severity = "warn"
user_message_ja = "対象のブランチの CODEOWNERS ファイルを読めないため、マージできません。CODEOWNERS を直すよう管理者に依頼してください。"
user_message_en = "The target branch's CODEOWNERS file cannot be read, so the merge request cannot be merged. Ask a maintainer to fix CODEOWNERS."
user_message_id = "File CODEOWNERS pada branch target tidak dapat dibaca, sehingga merge request tidak dapat di-merge. Minta maintainer untuk memperbaiki CODEOWNERS."
cause = "The CODEOWNERS file on the merge request's target branch tip (`.forge/CODEOWNERS`, else `CODEOWNERS`; ADR-0024 §9) could not be used: reason=syntax (a line is not `<pattern> <owner>…`), owner_syntax (an owner is not `@username` or `@group/path`), unsupported (a section `[Section]`, an optional section `^[…]`, an e-mail owner or a negation `!`: refused, never ignored), pattern_invalid (an empty or malformed glob, a `***`, more than 16 wildcards, `//` at either end, a control character other than the tab, a Unicode format character, a combining mark, a Hangul filler, the Braille blank, a variation selector or a non-ASCII blank outside a comment), unknown_owner (no active user and no group of that name: missing and disabled answer alike), too_large (over 64 KiB), too_many_lines (over 1 000 lines), line_too_long (over 4 KiB), not_utf8, read_failed (git could not read the file, or the evaluation's read budget ran out: the event carries `git_error_code`), match_budget (matching the changed paths took more than 5 s: fail closed), match_failed (the matching task failed: the event carries `join_error`). The merge is blocked with `codeowners_invalid{line, reason}` (fail closed: an unreadable file never means \"no owners\"). Logged once per evaluation at warn."
diagnosis = "Runbook codeowners. The event `forge.review.codeowners_invalid` carries `line` (1-based; 0 for the whole file), `reason`, `path` (which file), `target_sha` and `merge_request_id`. Read the file at that commit (read-only): git --git-dir <repo> show <target_sha>:<path> | sed -n '<line>p'."
fix = "Fix the CODEOWNERS file on the target branch (runbook codeowners). When the fix itself cannot merge, a Maintainer whose role is at least every protection of the project suspends CODEOWNERS enforcement for at most 24 hours (`gstn codeowners-enforcement suspend --project <id> --for <minutes>`, an approved runbook step; it comes back by itself at the expiry), merges the fix, and enforces it again. The merge requests are evaluated again on their next merge or status request."
runbook = "codeowners"
test = "a_codeowners_file_with_an_unknown_owner_blocks_the_merge"

[[error]]
code = "FG-REVIEW-0015"
name = "ApprovalLimitReached"
http_status = 409
severity = "info"
user_message_ja = "このマージリクエストの承認の数が上限に達しています。既存の承認を確認してください。"
user_message_en = "This merge request has reached the limit on approvals. Check the existing approvals."
user_message_id = "Merge request ini telah mencapai batas jumlah persetujuan. Periksa persetujuan yang ada."
cause = "An approval would make more than 50 live approvals on one merge request (M3 R5). The cap keeps the revocation of a new head within one change's 100 events (one `merge_request.unapproved` per approval) and the evaluation bounded; it is checked under the merge request's row lock. Nothing was written."
diagnosis = "The log event carries `reason=approvals_per_merge_request`, `limit`, `merge_request_id`. Count (read-only): SELECT count(*) FROM forge.merge_request_approvals WHERE merge_request_id = <id> AND revoked_at IS NULL."
fix = "Approvals beyond the rules' needs add nothing; ask approvers who are not needed to withdraw (`gstn mr unapprove`), or push a new commit (which clears the approvals)."
test = "an_approval_past_the_cap_is_refused"

# ── M3 R6: merge conditions ───────────────────────────────────────────
[[error]]
code = "FG-REVIEW-0016"
name = "RequiredCheckNamespaceNotAllowed"
http_status = 422
severity = "info"
user_message_ja = "このチェックは必須にできません。必須にできるのは ci/・kanflow/・forge/ のチェックだけです。"
user_message_en = "This check cannot be required. Only checks under ci/, kanflow/ or forge/ can be required."
user_message_id = "Pemeriksaan ini tidak dapat diwajibkan. Hanya pemeriksaan di bawah ci/, kanflow/, atau forge/ yang dapat diwajibkan."
cause = "A protected ref's merge rule named a required check in a namespace a person can write (`ext/`; ADR-0024 §10, M3 R6): a check a person can report must never satisfy a merge condition, so only the namespaces of service accounts and of forge itself (`ci/`, `kanflow/`, `forge/`) can be required. Nothing was written."
diagnosis = "The log event carries `reason=namespace_not_allowed`, `namespace` and `check` (the refused name), with `action=ProtectedRefManage`."
fix = "Require the check under the namespace of the service account that reports it (for example `ci/gates`), or leave it optional."
runbook = "merge-blocked"
test = "an_ext_check_cannot_be_required"

# ── U2: the merge settings screen (optimistic concurrency) ───────────────
[[error]]
code = "FG-REVIEW-0017"
name = "MergeSettingsChanged"
http_status = 409
severity = "info"
user_message_ja = "マージの設定は、表示した後に変更されました。最新の設定を読み直してから、もう一度保存してください。"
user_message_en = "The merge settings changed after you opened them. Reload the latest settings, then save again."
user_message_id = "Pengaturan merge berubah setelah Anda membukanya. Muat ulang pengaturan terbaru, lalu simpan lagi."
cause = "`PUT /api/v1/projects/{id}/merge-settings` carried an `expected_updated_at` (the `updated_at` the caller read; `null` for the defaults, never stored) other than the settings' `updated_at` as locked in the write transaction (U2): someone changed the settings or the CODEOWNERS switch in between (the expiry worker's restore of a suspension counts too). The write is refused instead of silently replacing the other change. Nothing was written. Not an alert: two people editing at once."
diagnosis = "The log event carries `reason=stale_settings`, `expected` and `actual` (the two `updated_at` values, `none` for the defaults) and `project_id`, with `action=MergeSettingsManage`. The change in between is the newest audit row: SELECT action, actor_user_id, occurred_at FROM forge.audit_log WHERE resource_type = 'project' AND resource_id = <project_id> AND action LIKE 'merge_settings.%' ORDER BY id DESC LIMIT 5."
fix = "Read the settings again (`gstn merge-settings show --project <id>`, or reload the screen), check the other change, and save again with the new `updated_at` (`gstn merge-settings set` reads it by itself)."
test = "stale_merge_settings_put_is_409"

# ── M3 I1a: integrations and project bindings (plan 11 §5 I1, 02 §9, §11.3) ──
[[error]]
code = "FG-INT-0012"
name = "IntegrationLimitReached"
http_status = 409
severity = "info"
user_message_ja = "上限（連携に結びつけるプロジェクトは 200、プロジェクトの Webhook は 20）に達しました。使っていないものを外してから、もう一度試してください。"
user_message_en = "The limit is reached (200 projects per integration, 20 webhooks per project). Remove one that is no longer needed, then try again."
user_message_id = "Batas tercapai (200 proyek per integrasi, 20 webhook per proyek). Hapus yang tidak lagi diperlukan, lalu coba lagi."
cause = "`PUT /api/v1/projects/{id}/integration-bindings/{integration_id}` would bind a 201st project to one integration (ADR-0016 §1, §7: at most 200 bindings per integration, because the event feed decides every bound project on every read). The count is taken under the integration's row lock, so two binds at once cannot both pass. Nothing was written. M3 I2: `POST /api/v1/projects/{id}/webhooks` past 20 webhooks of one project (`reason=webhook_limit`, `limit` 20, counted under a per-project lock)."
diagnosis = "The log event carries `reason=binding_limit`, `limit` (200), `integration_id` and `project_id`, with `action=IntegrationBindingManage` (webhooks: `reason=webhook_limit`, `project_id`, `action=WebhookManage`; `gstn webhook list --project <id>`). Count the bindings: SELECT count(*) FROM forge.integration_bindings WHERE integration_id = <integration_id>; `GET /api/v1/admin/integrations/{integration_id}/bindings` lists them (administrators)."
fix = "Unbind projects the integration no longer needs (`DELETE /api/v1/projects/{id}/integration-bindings/{integration_id}`, a Maintainer of that project), or split the work over a second integration with its own service account (runbook integrations). The limit is fixed in code (forge-db `integrations::MAX_BINDINGS`)."
runbook = "integrations"
test = "binding_limit_200_is_int_0012"

[[error]]
code = "FG-INT-0016"
name = "BindingConflict"
http_status = 409
severity = "info"
user_message_ja = "このリポジトリの結びつけは、今の結びつけと両立しません。コードを持つリポジトリは 1 つの kanflow のプロジェクトにだけ結べます。先に今の結びつけを解除するか、設定を見直してください。"
user_message_en = "This binding conflicts with the repository's current bindings: a repository with code is bound to one kanflow project only. Remove the current binding first, or check the setting."
user_message_id = "Ikatan ini bertentangan dengan ikatan repositori saat ini: repositori berisi kode hanya dapat diikat ke satu proyek kanflow. Lepaskan ikatan saat ini terlebih dahulu, atau periksa pengaturannya."
cause = "A bind or a binding change broke the binding rules of a forge project (M3 X3, plan 03 §7.1, 02 §2: `PBI-123` must resolve in one kanflow project): a binding that resolves work items (`resolves_work_items = true`, a repository with code) is its project's only binding (partial unique index `integration_bindings_one_resolving_per_project`; \"only\" is checked by the command under the project row lock); a binding that does not resolve (a shared spec repository) may be one of several of its project but never next to a resolving one; one kanflow project once per (integration, project) (`integration_bindings_one_per_external_project`); and a binding's `resolves_work_items` only goes from false to true (true to false would leave the work item links I1b made). The binding is not moved or changed silently. Nothing was written."
diagnosis = "The log event carries `reason` — `bound_to_other_integration` / `bound_to_other_external_project` (the project has a resolving binding), `shared_bindings_present` (a resolving bind or change while other bindings exist), `bound_with_other_setting` (this kanflow project is bound with the other setting), `resolution_fixed` (a change from resolving to shared) — with `project_id`, `integration_id` (the requested one) and `bound_integration_id`, and `action=IntegrationBindingManage`; never the kanflow project ids. `GET /api/v1/projects/{id}/integration-bindings` shows the project's bindings; `GET /api/v1/integrations/{id}/bindings?kanflow_project_id=` a kanflow project's."
fix = "If the repository with code really moves to another kanflow project, remove its binding first (`DELETE /api/v1/integrations/{id}/bindings/{binding_id}` or `DELETE /api/v1/projects/{id}/integration-bindings/{integration_id}`), then bind it again (runbook integrations). A shared spec repository is bound with `settings.resolves_work_items: false`; to make it the code repository of one kanflow project, remove its other bindings, then `PATCH …/bindings/{binding_id}` with `true`. To stop resolving, remove the binding and bind it again as shared. Binding the same repository to the same kanflow project with the same setting again is not an error (it answers `unchanged`)."
runbook = "integrations"
test = "binding_second_kanflow_project_is_refused"

# ── M3 I1a review: a stopped integration or account gains no binding ──
[[error]]
code = "FG-INT-0017"
name = "IntegrationDisabled"
http_status = 409
severity = "info"
user_message_ja = "この連携は今は使えません（連携かそのサービスアカウントが無効です）。管理者に連絡してください。"
user_message_en = "This integration cannot be used now (the integration or its service account is disabled). Contact the administrator."
user_message_id = "Integrasi ini tidak dapat digunakan sekarang (integrasi atau akun layanannya dinonaktifkan). Hubungi administrator."
cause = "A bind named an integration that is disabled (`integrations.enabled = false`: an administrator stopped it, runbook integrations C) or whose service account is disabled (I1a review: a bind grants that account a Reporter membership, so a stopped integration must not gain projects, and a disabled account must not collect memberships that come alive when it is enabled again). Both are read under the integration's row lock and the account's row lock (FOR SHARE), so a disable that commits first is seen. Nothing was written. Unbinding still works for a disabled integration (it only takes access away)."
diagnosis = "The log event carries `reason` (`integration_disabled` or `service_account_disabled`), `integration_id`, `service_account_id` and `project_id`, with `action=IntegrationBindingManage`. `gstn admin integration view <integration_id> --json` shows `enabled` and the service account; `gstn admin service-account view <service_account_id>` shows its `state`."
fix = "If the stop was intended, nothing to do. Otherwise, after checking why it was stopped (runbook integrations, service-accounts), an administrator enables the integration again in the browser session (`PATCH /api/v1/admin/integrations/{id}` with `enabled: true`) or enables its service account; then bind again."
runbook = "integrations"
test = "binding_a_disabled_integration_is_refused"
# ── M3 I1b: work item links (plan 02 §2, ADR-0016 Amendment I1b) ──
[[error]]
code = "FG-INT-0018"
name = "WorkItemProjectNotBound"
http_status = 409
severity = "info"
user_message_ja = "このプロジェクトは連携先（kanflow）のプロジェクトに結びついていないので、作業項目をリンクできません。先にプロジェクトを結びつけてください。"
user_message_en = "This project is not bound to a project of an integration (kanflow), so work items cannot be linked. Bind the project first."
user_message_id = "Proyek ini tidak terikat ke proyek integrasi (kanflow), sehingga item kerja tidak dapat ditautkan. Ikat proyek terlebih dahulu."
cause = "`PUT` or `DELETE /api/v1/projects/{id}/merge-requests/{iid}/work-items/{ref}` named a project without an integration binding (`forge.integration_bindings` has no row for it). `PBI-123` is numbered per kanflow project, so without the binding forge cannot tell which work item is meant (02 §2). Nothing was written. Detection (`work-item-sync`) links nothing in such a project either, without an error. M3 X5: `GET /api/v1/projects/{id}/context/work-item?ref=` (the context API) answers the same for a project without a binding: which kanflow project the reference belongs to is the binding's."
diagnosis = "The log event carries `reason=project_not_bound` and `project_id`, with `action=WorkItemLink`. `GET /api/v1/projects/{id}/integration-bindings` (or `gstn integration-binding list --project <id>`) shows the project's binding. From the context API the event carries `route=context_work_item` instead (action ContextRead)."
fix = "A Maintainer binds the project to its kanflow project (`PUT /api/v1/projects/{id}/integration-bindings/{integration_id}`, runbook integrations), then links again. Merge requests that existed before the binding are linked by detection at their next event (an edit, a push, a comment)."
runbook = "integrations"
test = "manual_link_on_an_unbound_project_is_int_0018"

[[error]]
code = "FG-INT-0019"
name = "WorkItemLinkLimitReached"
http_status = 409
severity = "info"
user_message_ja = "このマージリクエストに手動でリンクできる作業項目の上限に達しました。要らないリンクを外してから、もう一度試してください。"
user_message_en = "This merge request has the maximum number of manually linked work items. Unlink one it no longer needs, then try again."
user_message_id = "Permintaan merge ini sudah memiliki jumlah maksimum item kerja yang ditautkan secara manual. Lepaskan tautan yang tidak diperlukan, lalu coba lagi."
cause = "`PUT /api/v1/projects/{id}/merge-requests/{iid}/work-items/{ref}` would give a merge request a 51st open manual link (forge-db `work_items::MAX_MANUAL_LINKS`; detected links are bounded separately at 20). Counted under the merge request's row lock. Nothing was written."
diagnosis = "The log event carries `reason=manual_link_limit`, `limit` (50), `project_id` and `merge_request_id`, with `action=WorkItemLink`. `GET /api/v1/projects/{id}/merge-requests/{iid}/work-items` lists the links (`unlinked_at` null = open, `source` manual / auto)."
fix = "Unlink work items the merge request no longer needs (`DELETE …/work-items/{ref}`), or split the change into several merge requests. The limit is fixed in code."
runbook = "integrations"
test = "manual_links_past_the_limit_are_int_0019"
[[error]]
code = "FG-INT-0006"
name = "ActAsTargetInvalid"
http_status = 403
severity = "info"
user_message_ja = "指定された利用者として操作できません。連携の設定を確かめてください。"
user_message_en = "The request cannot act for the named user. Check the integration's settings."
user_message_id = "Permintaan ini tidak dapat bertindak atas nama pengguna yang disebut. Periksa pengaturan integrasi."
cause = "A service account (kanflow) named a person to act for with `Forge-Act-As` (ADR-0025 §1) and forge did not resolve it to exactly one active person: the value is not `user:<id>` or `employee:<number>` (or is empty, padded, holds a comma, or is sent twice), names an e-mail address (never a link to a user, ADR-0021), names nobody (also a person who never signed in to forge), names a service account (itself included) or a bot, names a disabled user, or the employee number matched more than one row (the unique index was broken or dropped: forge fails closed and acts for nobody). The answer is the same for every reason. Nothing was read or written. A lack of permission after the person is resolved is not this code (FG-AUTH-0003, FG-REPO-0005, FG-REVIEW-0013)."
diagnosis = "The log line `forge.auth.act_as` carries `reason` (missing_value, malformed, multiple_headers, email_form, unknown, ambiguous, not_human, disabled), `actor.via` (the service account), `integration_id` and `credential_public_id`; never the header's value or an employee number. `ambiguous` is data corruption: SELECT indexdef FROM pg_indexes WHERE indexname = 'users_employee_number'. Many unknown in a short time (more than 60 a minute per service account answers FG-WEB-0010) mean a misconfigured kanflow or probing."
fix = "Follow runbook act-as: check kanflow's mapping (it should send the claim's sub.user_id as `user:<id>` for writes and the employee number only for reads), whether the person has signed in to forge once, and whether the account is disabled. For `ambiguous`, restore the unique index users_employee_number and resolve the duplicate (approved runbook step); act-as stays refused for that number until then."
runbook = "act-as"
test = "act_as_email_form_is_refused"


# ── M3 N1: e-mail notifications (plan 11 §5 N1, ADR-0016 Amendment N1) ──
[[error]]
code = "FG-INT-0015"
name = "SmtpUnavailable"
http_status = 502
severity = "warn"
user_message_ja = "メールを送れませんでした。しばらくしてから、もう一度お試しください。続く場合は管理者に連絡してください。"
user_message_en = "The e-mail could not be sent. Try again later; if it keeps happening, contact the administrator."
user_message_id = "E-mail tidak dapat dikirim. Coba lagi nanti; jika terus terjadi, hubungi administrator."
cause = "The `notification.send` job could not hand a notification to the internal SMTP relay (`notify.smtp_host`). `reason=connect_failed` (refused, unreachable, or not answered within `notify.connect_timeout_ms`), `tls_failed` (STARTTLS refused or the relay's certificate is not signed by `notify.smtp_ca_file`), `auth_failed` (the relay refused the login), `timeout` (a step took longer than `notify.send_timeout_ms` before the message was handed over), `connection_lost` (the relay closed or broke the connection mid-conversation, before the message was handed over), `rejected_temporary` (a 4xx reply: greylisting, a full queue), `rejected_permanent` (a 5xx reply: the sender or recipient address is refused; the notification is `failed` and is not tried again), `tries_used_up` (the last of `notify.max_attempts` tries failed), `outcome_unknown` (the connection broke after the message was handed over: the relay may or may not have it, so it is NOT sent again; the notification is `unknown`). Nothing reaches a person's request: the merge request flow never waits for mail."
diagnosis = "The log event carries `reason`, `stage` (`connect`, `tls`, `auth`, `mail_from`, `rcpt_to`, `data`, `end_of_data`), `smtp_code` (the relay's reply code, when it replied), `notification_id`, `attempt`, `max_attempts` and the job's `request_id`; never the relay's reply text, the message or the address. Backlog and failures: `forge doctor` check `notify.queue`, and SELECT state, count(*), min(created_at) FROM forge.notifications GROUP BY state; one notification: SELECT state, reason, attempts, created_at, updated_at FROM forge.notifications WHERE id = <notification_id>."
fix = "Follow runbook notification-email: check the relay (`notify.smtp_host` / `notify.smtp_port` reachable from the worker, its certificate and `notify.smtp_ca_file`, the login), correct the configuration and restart the worker. Notifications still `pending` or `retrying` are sent once the relay answers; `failed` and `unknown` ones are not sent again (they record that no mail went out)."
runbook = "notification-email"
test = "smtp_failures_are_int_0015"
# ── M3 I1c: the event feed of an integration (02 §5.7, §11.2, ADR-0016 §7, Amendment I1c) ──
[[error]]
code = "FG-INT-0007"
name = "FeedCursorExpired"
http_status = 410
severity = "info"
user_message_ja = "このカーソルからは続きを読めません。今の位置を取り直し、開発状況を取り直してから、その位置から読み直してください。"
user_message_en = "The feed cannot continue from this cursor. Get the current position, resync the development status, then read from that position."
user_message_id = "Feed tidak dapat dilanjutkan dari kursor ini. Ambil posisi saat ini, sinkronkan ulang status pengembangan, lalu baca dari posisi tersebut."
cause = "`GET /api/v1/integrations/{id}/events?cursor=…` got an authentic cursor of this integration that the feed cannot continue without silently skipping events (ADR-0016 §7). The answer is 410 with `reason` in the body (the only field besides error_code, user_message and request_id): `retention` (events after the cursor were deleted by events.retention, or the cursor is older than 1.5 × the retention period), `epoch_mismatch` (the feed's epoch was rotated: `forge admin events new-epoch` after a restore or rebuild of the database), `ahead_of_head` (the cursor points past the last numbered event: the database was restored to an earlier point), `visible_set_changed` (what the integration may see changed since the cursor was issued: a project bound or unbound — an unbind and a rebind of the same project too, the binding generation is part of the set —, the service account's role, a project's deletion, or the integration's event_types). Nothing was read. Not an alert: the consumer recovers by itself."
diagnosis = "The log event carries `reason`, `integration_id` and, by reason, `cursor_seq` with `retained_from` (retention) or `high_seq` (ahead_of_head); never the cursor's value. SELECT epoch, high_seq, retained_from FROM forge.event_feed_state; the binding history is in the audit log: SELECT action, project_id, occurred_at FROM forge.audit_log WHERE action IN ('integration.bound', 'integration.unbound') ORDER BY id DESC LIMIT 20."
fix = "The consumer (kanflow K3) follows docs/api/integration-feed.md: GET /api/v1/integrations/{id}/events/cursor first, then resync the development status (state=all), then read from the position it got. Nothing to do on the server unless the reason is unexpected (retention while the consumer was healthy: runbook integration-feed-lag)."
runbook = "integration-feed-lag"
test = "an_authentic_cursor_past_max_age_is_int_0007_retention"

[[error]]
code = "FG-INT-0008"
name = "FeedCursorInvalid"
http_status = 400
severity = "info"
user_message_ja = "カーソルの値が正しくありません。前の応答の next_cursor をそのまま送るか、今の位置を取り直してください。"
user_message_en = "The cursor is not valid. Send the previous answer's next_cursor unchanged, or get the current position again."
user_message_id = "Nilai kursor tidak valid. Kirim next_cursor dari jawaban sebelumnya tanpa diubah, atau ambil posisi saat ini lagi."
cause = "`GET /api/v1/integrations/{id}/events?cursor=…` got a cursor that is not one this integration was given (ADR-0016 §7): too long, not base64url, truncated, an unknown format version or key id (`api.cursor_keys_file` lost the key that sealed it), an AEAD tag that does not verify (changed, or sealed for another list), a payload of another shape, or the cursor of another integration (`rule=other_integration`). Nothing was read. The value is never logged."
diagnosis = "The log event carries `rule` (`too_long`, `encoding`, `truncated`, `version`, `kid`, `tag`, `payload`, `other_integration`) and `integration_id`, never the cursor. `kid` after a key rotation means the old key was removed before its cursors aged out (runbook integration-feed-lag)."
fix = "The consumer sends next_cursor exactly as received, for the same integration id. If the keys were rotated too early, put the old key back into api.cursor_keys_file (it then decrypts only), or let the consumer restart from GET …/events/cursor and a resync."
runbook = "integration-feed-lag"
test = "another_integrations_cursor_is_int_0008_other_integration"

[[error]]
code = "FG-INT-0009"
name = "FeedConsumerLag"
http_status = 500
severity = "warn"
user_message_ja = "連携先がイベントの履歴を読みに来ていないか、大きく遅れています。管理者に連絡してください。"
user_message_en = "An integration has not read its event feed for long, or is far behind. Contact the administrator."
user_message_id = "Sebuah integrasi sudah lama tidak membaca feed perubahannya, atau sangat tertinggal. Hubungi administrator."
cause = "An enabled integration with bound projects has not read its feed for 24 hours (`reason=not_reading`; one that never read counts 24 hours after its first binding), or the oldest event it has not read yet is older than half the retention period (`reason=behind`): when retention deletes it, the consumer gets 410 retention and has to resync (ADR-0016 §11, plan 02 §11.3). Raised by forge doctor (`integrations.feed_lag`) from forge.integration_feed_reads, and logged at warn by the feed itself when a read finds the consumer behind (at most once per minute per integration, with the read's request_id). No request fails with it."
diagnosis = "The doctor line or the log event carries `reason`, `integration_id`, `last_read_at` (RFC 3339, UTC, or `never`), `behind_seconds` (behind) and `retention_days`. SELECT integration_id, last_read_at, cursor_seq, read_bound_seq, oldest_unread_at FROM forge.integration_feed_reads ORDER BY last_read_at; kanflow's own logs show whether its poller runs."
fix = "Follow runbook integration-feed-lag: check that kanflow's poller runs and authenticates (the service account's token: runbook service-accounts), that the work-item-sync subscriber is not stuck (doctor subscribers.work-item-sync; it bounds what the feed returns), then let the consumer catch up. A consumer that cannot catch up before retention resyncs after its 410."
runbook = "integration-feed-lag"
test = "feed_lag_names_not_reading_and_behind_integrations"
# ── M3 I2: webhooks (ADR-0016 §8, plan 02 §5.5 / §11.1, ADR-0016 Amendment I2) ──
[[error]]
code = "FG-INT-0004"
name = "WebhookDeadLettered"
http_status = 500
severity = "warn"
user_message_ja = "Webhook の配信が再試行の上限まで失敗しました。配信の履歴を確かめ、受信先を直してから再送してください。"
user_message_en = "A webhook delivery failed on every retry. Check the delivery history, fix the receiver, then redeliver."
user_message_id = "Pengiriman webhook gagal pada setiap percobaan ulang. Periksa riwayat pengiriman, perbaiki penerima, lalu kirim ulang."
cause = "One delivery (one event to one webhook) failed on its last attempt: forge-integ's `webhook.deliver` job tried it `attempts` times (at most 10, backoff 10 s × 4^(n−1) up to 4 h, about 16 h in all) and every attempt failed — the receiver answered a status other than 2xx (a redirect is never followed and counts as a failure), refused or timed out the connection (3 s connect, 10 s in all), failed TLS, the name did not resolve, or the target is no longer allowed. The delivery's row is `state = failed` with the last status and reason; nothing is retried by itself after this. Also (I2 review) `reason=job_failed` when the delivery's job could not run it and will not again (a payload this build cannot read, the job's last run failing on the database: `last_reason = internal`, `cause` the job's code), `reason=stuck` when the worker's sweep failed a delivery left pending without a live job for 10 minutes, and from `forge doctor` (`webhook.deliveries`) `reason=secret_keys_missing` (webhooks exist but webhook.secret_keys_file is not set: nothing is delivered), `pending_too_long` (a stuck delivery, or one pending over 24 hours) and `failed_recently`. Not an alert: the receiver is outside forge, and the event stays readable in the integration feed."
diagnosis = "The log event carries `webhook_id`, `delivery_id` (the Forge-Delivery value), `event_id`, `event_type`, `attempts`, `last_status` (or `none`), `last_reason` (`status`, `redirect`, `connect`, `connect_timeout`, `timeout`, `tls`, `body`, `request`, `dns`, `target_forbidden`) and `origin` (scheme://host:port only, never the path or query). `gstn webhook deliveries <webhook_id> --project <id>` (or GET /api/v1/projects/{id}/webhooks/{webhook_id}/deliveries) lists them; SELECT state, attempts, last_status, last_reason, last_error_code FROM forge.webhook_deliveries WHERE delivery_uid = '<delivery_id>'."
fix = "Follow runbook webhook-delivery: make the receiver answer 2xx within 10 s at the configured URL (no redirect), check that `webhook.allowed_targets` still names it, then redeliver (`gstn webhook redeliver <webhook_id> <delivery_id> --project <id>`, a Maintainer). A receiver that missed many events reads them from the integration feed instead."
runbook = "webhook-delivery"
test = "a_delivery_out_of_attempts_is_int_0004"

[[error]]
code = "FG-INT-0010"
name = "WebhookTargetForbidden"
http_status = 400
severity = "warn"
user_message_ja = "この送り先は許可されていません。"
user_message_en = "This destination is not allowed."
user_message_id = "Tujuan ini tidak diizinkan."
cause = "A webhook URL or delivery was refused before anything was sent (ADR-0016 §8: only the operator's allowlist; SSRF defences resolved at connect time). On a create or update (400): the URL is not an absolute http(s) URL of at most 2048 bytes (`invalid_url`), uses http while `webhook.allow_http` is false (`scheme`), carries user information (`userinfo`) or a fragment (`fragment`), names a host and port that `webhook.allowed_targets` does not list (`not_allowlisted`; the list is empty by default, so nothing can be delivered until the operator adds the internal receivers), or names an address that is always refused whatever the list says (`loopback`, `link_local` — 169.254.169.254 metadata included —, `unspecified`, `multicast`, `broadcast`, `reserved`, `cgnat` (100.64.0.0/10), `benchmarking` (198.18.0.0/15), `ipv4_compatible`, `nat64` (64:ff9b::/96 and 64:ff9b:1::/48), `six_to_four`, `teredo` (2001::/32), `site_local` (fec0::/10); an IPv4-mapped IPv6 address is judged by its IPv4). At delivery time the same checks run again on the addresses the name resolves to now, and the connection is pinned to the checked address (DNS rebinding): `resolved_denied` when any resolved address is in an always-refused range, `resolved_not_allowlisted`, `dns` when the name does not resolve. A delivery is also refused when the webhook's owner (the person who created it, or last changed its URL or event types or rotated its secret) can no longer manage webhooks of the project (`owner_lost`: membership removed, demoted below Maintainer, account disabled, project pending deletion). The user sees only the one sentence; the reason is in the log."
diagnosis = "The log event carries `reason`, `origin` (scheme://host:port, never the path, query or user information) and, at delivery time, `webhook_id`, `delivery_id` and `address` (the resolved address that was refused); for `owner_lost` `owner_id` and `decision` (the code authorize() answered). Compare with the server's `webhook.allowed_targets` (`forge doctor` prints `webhook.allowed_targets`) and with `nslookup <host>` on the server."
fix = "If the receiver is a legitimate internal system, the operator adds `host:port` (or `cidr:port`) to `webhook.allowed_targets` and restarts (runbook webhook-delivery); never allowlist loopback, link-local or metadata addresses (they are refused regardless). For `owner_lost`, a Maintainer recreates the webhook under their own name, or the owner's role is restored."
runbook = "webhook-delivery"
test = "loopback_target_is_int_0010"

[[error]]
code = "FG-INT-0011"
name = "WebhookDisabled"
http_status = 500
severity = "warn"
user_message_ja = "Webhook が失敗し続けたので、自動で無効にしました。受信先を直してから、もう一度有効にしてください。"
user_message_en = "A webhook kept failing and was disabled automatically. Fix the receiver, then enable it again."
user_message_id = "Webhook terus gagal sehingga dinonaktifkan secara otomatis. Perbaiki penerima, lalu aktifkan kembali."
cause = "A webhook's delivery attempts failed 50 times in a row (`reason=failures`) or kept failing without a success for 24 hours (`reason=failing_24h`; ADR-0016 §8). forge disabled it (`webhooks.enabled = false`, `disabled_reason`), wrote the `webhook.disabled` audit row on the project as the system and published the `webhook.disabled` event (maintainer class: the hook point a notification, or another webhook naming the type, can follow). Its pending deliveries end as `skipped` (`webhook_disabled`); new events are not recorded for it until a Maintainer enables it again."
diagnosis = "The log event carries `webhook_id`, `project_id`, `reason`, `failures` and `failing_since` (RFC 3339, UTC). `gstn webhook view <webhook_id> --project <id>` shows `enabled`, `disabled_reason` and `consecutive_failures`; the deliveries show the last statuses and reasons. SELECT action, details, occurred_at FROM forge.audit_log WHERE action = 'webhook.disabled' ORDER BY id DESC LIMIT 10."
fix = "Follow runbook webhook-delivery: fix the receiver, then enable the webhook (`gstn webhook update <webhook_id> --project <id> --enable`, a Maintainer; enabling resets the failure count) and redeliver the deliveries that matter, or let the receiver catch up from the integration feed."
runbook = "webhook-delivery"
test = "fifty_consecutive_failures_disable_the_webhook"

[[error]]
code = "FG-INT-0020"
name = "WebhookAttemptFailed"
http_status = 502
severity = "info"
user_message_ja = "Webhook の配信の 1 回が失敗しました。自動で再試行します。"
user_message_en = "One webhook delivery attempt failed. It will be retried automatically."
user_message_id = "Satu percobaan pengiriman webhook gagal. Akan dicoba ulang secara otomatis."
cause = "One attempt of a webhook delivery failed and another is scheduled: the receiver answered a non-2xx status or a redirect (never followed), the connection was refused, timed out or failed TLS, or the name did not resolve. The delivery stays `pending` with `last_status` / `last_reason`; the next attempt runs after the backoff (10 s × 4^(n−1), at most 4 h). After the last attempt the delivery is `failed` (FG-INT-0004). Each failed attempt counts towards the webhook's automatic disable (FG-INT-0011). Nobody is waiting on it: info."
diagnosis = "The log event carries `webhook_id`, `delivery_id`, `attempt`, `status` (or `none`), `reason` (as FG-INT-0004's `last_reason`), `retry_in_s`, `consecutive_failures`, `origin` and, when the receiver answered, `response_head` (at most 128 printable characters of the body with long token-like runs replaced by `[redacted]`; the body itself is never stored)."
fix = "Usually nothing: a receiver that is briefly down catches up with the retries. If one webhook keeps failing, follow runbook webhook-delivery before it is disabled."
runbook = "webhook-delivery"
test = "a_failed_attempt_is_retried_with_backoff"
# ── M3 O2: the push mirror to GitLab (plan 11 §4.4, ADR-0024 Amendment O2) ──
[[error]]
code = "FG-INT-0013"
name = "PushMirrorFailed"
http_status = 500
severity = "alert"
user_message_ja = "GitLab へのミラーに失敗しました。問い合わせ番号を添えて管理者に連絡してください。"
user_message_en = "The mirror to GitLab failed. Contact the administrator with the request ID."
user_message_id = "Mirror ke GitLab gagal. Hubungi administrator dengan menyertakan ID permintaan."
cause = "The `repository.push_mirror` job (forge worker) could not bring a repository's GitLab mirror up to date on its last attempt (5 attempts, backoff 10 s × 2^(n−1)): `git push --porcelain --prune <url> +refs/heads/*:refs/heads/* +refs/tags/*:refs/tags/*` failed. `reason`: `rejected` (the destination refused a ref: a protected branch on GitLab, a pre-receive hook, a non-fast-forward the mirror account may not force; `ref` names the first one), `auth` (401/403: the token in the credential file is wrong, expired or lacks write_repository), `unreachable` (DNS, connect, TLS, a 5xx), `timeout` (the push ran past `mirror.push_timeout_secs`), `git` (another git failure; `exit_code` and the redacted `stderr`), `credential_unreadable` (the credential file named by the mirror is missing, not a regular file, or readable by group/others), `target_not_allowed` (the host is no longer in `mirror.allowed_hosts`). Earlier attempts log warn `forge.mirror.push_failed`; this code is logged once, at the last attempt, and `forge.push_mirror_status.last_error_code` keeps it until a push succeeds. The GitLab copy is now behind GitStation: it is the insurance (plan 06 D-2), so a failover would lose the pushes since `last_success_at`."
diagnosis = "Filter logs by error_code=FG-INT-0013: `repo_id`, `project_id`, `reason`, `origin` (scheme://host:port only, never the path or the token), `ref` (for `rejected`), `exit_code` and `stderr` (redacted: user:password@, tokens and Authorization headers are removed). `forge doctor` (`mirror.status`) lists failing mirrors; SELECT * FROM forge.push_mirror_status WHERE repo_id = <id>. `gstn mirror show --project <id> --json` shows the destination and the last result."
fix = "Follow runbook gitlab-mirror: fix the cause (unprotect or allow force-push for the mirror account on GitLab, renew the token in the credential file with mode 0600, add the host to mirror.allowed_hosts), then run `gstn mirror sync --project <id>` (an administrator: enqueues one push) and check that `mirror.status` is ok. Never push to GitLab by hand from a developer's clone: GitStation is the canonical copy and the next mirror run would overwrite it."
runbook = "gitlab-mirror"
test = "a_refused_push_is_int_0013_on_the_last_attempt"

[[error]]
code = "FG-INT-0014"
name = "PushMirrorLagging"
http_status = 500
severity = "alert"
user_message_ja = "GitLab へのミラーが遅れています。問い合わせ番号を添えて管理者に連絡してください。"
user_message_en = "The mirror to GitLab is behind. Contact the administrator with the request ID."
user_message_id = "Mirror ke GitLab tertinggal. Hubungi administrator dengan menyertakan ID permintaan."
cause = "A push mirror has had a push waiting longer than `mirror.lag_alert_secs` (default 900 s): `forge.push_mirror_status.pending_since` (the first push not yet mirrored) is older than the threshold. Found by the worker's mirror sweep (every minute; logged once per mirror per hour while it lasts) and by `forge doctor` (`mirror.lag`). Usual causes: the job keeps failing (see FG-INT-0013 for the same repo_id), the worker is down or its mirror lane is off (`forge.worker.mirror_lane_off`: `mirror.credentials_dir` unset), or the job queue is backed up. The insurance copy on GitLab is stale (plan 06 §4.11: \"保険が実は古かった\")."
diagnosis = "Filter logs by error_code=FG-INT-0014: `repo_id`, `project_id`, `pending_since`, `lag_secs`, `last_success_at`, `last_error_code`. Check `forge doctor` (`mirror.lag`, `mirror.status`, `jobs`), the worker's start-up log (`forge.worker.mirror_lane_off`) and SELECT state, attempts, last_error_code FROM forge.jobs WHERE kind = 'repository.push_mirror' ORDER BY id DESC LIMIT 5."
fix = "Follow runbook gitlab-mirror: start the worker or enable its mirror lane, fix the failure behind FG-INT-0013 if any, then `gstn mirror sync --project <id>`; the alert stops when a push succeeds (pending_since returns to NULL)."
runbook = "gitlab-mirror"
test = "a_mirror_behind_the_threshold_is_int_0014"

[[error]]
code = "FG-INT-0021"
name = "PushMirrorTargetInvalid"
http_status = 400
severity = "info"
user_message_ja = "ミラーの宛先か資格情報の名前が正しくありません。"
user_message_en = "The mirror destination or credential name is not valid."
user_message_id = "Tujuan mirror atau nama kredensial tidak valid."
cause = "A push mirror setting (`PUT /api/v1/projects/{id}/push-mirror`, `gstn mirror set`) was refused before anything was stored. `reason`: `invalid_url` (not an absolute URL of at most 2048 bytes), `scheme` (not https; http only when `mirror.allow_http` is true, for tests), `userinfo` (user or password in the URL: the token belongs in the credential file), `query_or_fragment`, `not_allowlisted` (the host and port are not in `mirror.allowed_hosts`; the list is empty by default), `credential_name` (not 1–64 of [a-z0-9._-] starting with a letter or digit), `credential_missing` (no regular file of that name in `mirror.credentials_dir`, or the directory is not configured: `detail=not_configured`), `credential_insecure` (the file is readable by group or others), `credential_invalid` (the file is unreadable, larger than 4 KiB or not one `<username>:<token>` line), `no_repository` (the project has no ready repository)."
diagnosis = "The log event carries `reason`, `origin` (scheme://host:port only) or `credential_name` and, for a credential, `detail` (the underlying check: `not_configured`, `unreadable`, `insecure_permissions`, `invalid`, or the line's shape such as `no_separator`, `several_lines`, `empty`; never the file's path or content). Compare with `forge doctor` (`mirror.config`), which prints mirror.allowed_hosts and whether mirror.credentials_dir is readable."
fix = "Use an https URL of a host listed in mirror.allowed_hosts without user information, and the name of a credential file in mirror.credentials_dir with mode 0600 (runbook gitlab-mirror, 「設定」)."
test = "an_invalid_mirror_target_is_400_int_0021"
# ── U2 follow-up: the rules' optimistic concurrency ──────────────────────
[[error]]
code = "FG-REVIEW-0018"
name = "ApprovalRuleChanged"
http_status = 409
severity = "info"
user_message_ja = "この承認の規則は、表示した後に変更されたか、同じ名前の規則が追加されました。最新の規則を読み直してから、もう一度保存してください。"
user_message_en = "This approval rule changed after you opened it, or a rule with the same name was added. Reload the latest rules, then save again."
user_message_id = "Aturan persetujuan ini berubah setelah Anda membukanya, atau aturan dengan nama yang sama telah ditambahkan. Muat ulang aturan terbaru, lalu simpan lagi."
cause = "`PUT /api/v1/projects/{id}/approval-rules/{name}` carried an `expected_updated_at` that does not match the rule as locked in the write transaction (after the project row lock and the re-authorization): `reason=stale_rule` — the rule's `updated_at` differs (someone saved it in between); `reason=rule_exists` — `null` (create only) but a rule with that name exists (two people adding the same name); `reason=rule_gone` — a stamp, but the rule was removed in between. The write is refused instead of silently replacing, re-creating or overwriting the other change. Nothing was written. Not an alert: two people editing at once."
diagnosis = "The log event carries `reason` (`stale_rule`, `rule_exists` or `rule_gone`), `expected` and `actual` (the two `updated_at` values, `none` for no rule), `project_id` and `approval_rule` (the name), with `action=ApprovalRuleManage`. The change in between is the newest audit row: SELECT action, actor_user_id, occurred_at, details FROM forge.audit_log WHERE resource_type = 'project' AND resource_id = <project_id> AND action LIKE 'approval_rule.%' ORDER BY id DESC LIMIT 5."
fix = "Read the rules again (`gstn approval-rule list --project <id>`, or reload the screen), check the other change, and save again with the rule's new `updated_at` (`gstn approval-rule set` reads it by itself; `null` only for a name no rule has)."
test = "stale_approval_rule_put_is_409"

[[error]]
code = "FG-REVIEW-0019"
name = "MergeRuleChanged"
http_status = 409
severity = "info"
user_message_ja = "このブランチのマージの条件は、表示した後に変更されました。最新の条件を読み直してから、もう一度保存してください。"
user_message_en = "The merge conditions of this branch changed after you opened them. Reload the latest conditions, then save again."
user_message_id = "Syarat merge untuk branch ini berubah setelah Anda membukanya. Muat ulang syarat terbaru, lalu simpan lagi."
cause = "`PUT /api/v1/projects/{id}/protected-refs/{rule_id}/merge-rule` carried an `expected_updated_at` that does not match the merge rule as locked in the write transaction (after the project and protection rule row locks and the re-authorization): `reason=stale_rule` — its `updated_at` differs (someone saved it in between); `reason=rule_exists` — `null` (create only) but the protection rule has a merge rule; `reason=rule_gone` — a stamp, but the merge rule was removed in between. The write is refused instead of silently replacing, re-creating or overwriting the other change (a second save could otherwise erase required approvals or checks). Nothing was written. Not an alert: two people editing at once."
diagnosis = "The log event carries `reason` (`stale_rule`, `rule_exists` or `rule_gone`), `expected` and `actual` (the two `updated_at` values, `none` for no merge rule), `project_id` and `protected_ref_id`, with `action=ProtectedRefManage`. The change in between is the newest audit row: SELECT action, actor_user_id, occurred_at, details FROM forge.audit_log WHERE resource_type = 'project' AND resource_id = <project_id> AND action LIKE 'protected_ref.merge_rule_%' ORDER BY id DESC LIMIT 5."
fix = "Read the rules again (`gstn protected-ref list --project <id>` or `GET …/protected-refs`, or reload the screen), check the other change, and save again with the merge rule's new `updated_at` (`gstn merge-rule set` reads it by itself; `null` only when the branch has no merge rule)."
test = "stale_merge_rule_put_is_409"

# ── M3 C1: the Checks API (ADR-0024 §10) ─────────────────────────────────
[[error]]
code = "FG-REVIEW-0020"
name = "CheckPayloadInvalid"
http_status = 422
severity = "info"
user_message_ja = "チェックの報告の内容が正しくありません。名前・状態・結論・注釈を確かめて、もう一度送ってください。"
user_message_en = "The check report is not valid. Check its name, status, conclusion and annotations, then send it again."
user_message_id = "Laporan pemeriksaan tidak valid. Periksa nama, status, kesimpulan, dan anotasinya, lalu kirim lagi."
cause = "`POST /api/v1/projects/{id}/commits/{sha}/checks` (or `gstn checks report`) sent a report that breaks the Checks API's rules (ADR-0024 §10, docs/api/checks.md): `reason=name_invalid` (not `<namespace>/<name>` under CheckName::parse, or an unknown namespace), `status_invalid`, `conclusion_invalid`, `conclusion_without_completed` / `completed_without_conclusion` (a conclusion exists exactly when the status is `completed`), `summary_too_long` (over 64 KiB), `summary_invalid` (a NUL character), `details_url_invalid` (not an http or https URL with a host, over 2 KiB, or with credentials; the server never fetches it), `too_many_annotations` (over 50), `annotation_path_invalid` (empty, absolute, a drive letter such as `C:`, a `..` segment, a backslash or a control character, over 4096 bytes), `annotation_lines_invalid` (a line below 1, or the end before the start), `annotation_level_invalid`, `annotation_message_invalid` (empty or over 4 KiB), `annotation_title_invalid` (over 255 bytes). Decided after the authorization (a caller who may not report gets the denial, never a hint about the body) — except `name_invalid`, decided first because the name's namespace is an input of the decision (it depends on the body alone, so it reveals nothing about the project). Also `reason=namespace_not_grantable` from the grant administration (`PUT|DELETE /api/v1/admin/service-accounts/{id}/check-grants/{project_id}/{namespace}`): only `ci` and `kanflow` are granted. Nothing was written."
diagnosis = "The log event carries `reason`, `project_id`, `name` (only when it parsed) and for annotations `index` (its position in the list) and `limit` / `len` where a size broke the rule — never the summary, URL or message text."
fix = "Fix the report and send it again; the rules are in docs/api/checks.md (`gstn checks report --help` shows the options)."
test = "an_annotation_over_the_limit_is_check_payload_invalid"

[[error]]
code = "FG-REVIEW-0021"
name = "CheckRunLimitReached"
http_status = 409
severity = "info"
user_message_ja = "このコミットにはこれ以上の種類のチェックを登録できません（上限 100）。既にある名前で報告してください。"
user_message_en = "No more kinds of checks can be reported on this commit (the limit is 100). Report under a name it already has."
user_message_id = "Tidak ada lagi jenis pemeriksaan yang dapat dilaporkan pada commit ini (batasnya 100). Laporkan dengan nama yang sudah ada."
cause = "A check report named a new check on a commit that already holds 100 check runs of reporters in the project (forge_core::MAX_CHECK_RUNS_PER_COMMIT, M3 C1; the names forge reports itself, `forge/spec-drift`, are neither counted nor capped — M3 X2 review — so reads hold at most MAX_STORED_CHECK_RUNS_PER_COMMIT = 101): the cap bounds every read of a commit's runs, the merge gate's included. Reports under a name the commit already has still update their run. Decided under the commit's report lock, so concurrent reports never exceed it. Nothing was written. Not an alert: usually a reporter that puts a run number or a date into the name."
diagnosis = "The log event carries `reason=too_many_runs`, `limit`, `project_id` and `head_sha`, with `action=CheckWrite`. The names on the commit: SELECT name, reported_by, updated_at FROM forge.check_runs WHERE project_id = <project_id> AND head_sha = '<head_sha>' ORDER BY name."
fix = "Report under a stable name per kind of check (for example `ci/gates`, not `ci/gates-<run>`); the details of one run belong in its summary and annotations."
test = "a_new_name_beyond_the_limit_is_check_run_limit_reached"

# ── M3 X6: conflict prediction between open merge requests (plan 04 C-2,
# ADR-0024 Amendment X6) ──
[[error]]
code = "FG-REVIEW-0022"
name = "ConflictPredictionIncomplete"
http_status = 500
severity = "warn"
user_message_ja = "ほかのマージリクエストとの衝突の見込みを、すべては確かめられていません。しばらくしてからもう一度確認してください。"
user_message_en = "Possible conflicts with other merge requests have not all been checked. Check again later."
user_message_id = "Kemungkinan konflik dengan merge request lain belum semuanya diperiksa. Periksa lagi nanti."
cause = "The conflict scan of a merge request (M3 X6, plan 04 C-2: the job merge_request.conflict_scan, run after a new head, a retarget or a reopen) did not try every other open merge request on the same target branch. reason=peers_capped: more open merge requests target the branch than the scan considers (50, the most recently updated first). reason=pairs_capped: more pairs change a common path than the scan tries with merge-tree (20). reason=budget_exhausted: the scan's time budget (120 s) ran out before the last candidate. reason=pair_failed: git failed on at least one pair (its own FG-GIT code is logged with the same request_id as forge.review.conflict_pair_failed; the failure is stored on the pair and the worker's sweep re-requests the scan — it is not the job's failure). reason=peer_moved: another merge request moved or closed after the scan read it (its own scan writes the pair). reason=peer_invalid: a peer's stored head is not an object id (never written by forge; that pair is left out). A scan that ends `failed` with reason=no_version, target_missing, unrelated_histories or budget_exhausted (nothing could be predicted for this merge request) is logged at warn with this code too (forge.review.conflict_scanned). The worker's sweep requests scans for open merge requests with a head and no scan (opened before this build, or a version job's request that failed: the version job never fails on it, forge.review.conflict_scan_request_failed) and re-requests retryable failures after 5 minutes, at most 3 times (forge.review.conflict_scan_swept). reason=job_failed: the job failed for good before it stored a result. reason=job_stale: a scan stayed pending or scanning longer than the job's time limit with no queued or running job (the worker's sweep ended it). The pairs it did try are stored and their predictions stand; the ones left out are not predicted (never shown as \"no conflict\"). Never a user request's failure: logged by the worker; `gstn conflicts` shows the scan as `incomplete` or `failed` with the reason."
diagnosis = "The event `forge.review.conflict_scan_incomplete` (or `forge.review.conflict_scan_not_finished` for job_failed / job_stale, `forge.review.conflict_scanned` status=failed) carries `reason`, `merge_request_id`, `scan_seq`, `peers`, `pairs_tried`, `pairs_skipped` and the job's request_id. For pair_failed, the git failure is logged under its own error_code with the same request_id (`other_merge_request_id`). Read the scan (read-only): SELECT merge_request_id, status, reason, scan_seq, scanned_head_sha, peers, pairs_tried, pairs_skipped, updated_at FROM forge.merge_request_conflict_scans WHERE merge_request_id = <id>; and its pairs: SELECT low_mr_id, high_mr_id, outcome, reason, checked_at FROM forge.merge_request_conflict_pairs WHERE <id> IN (low_mr_id, high_mr_id); and the jobs: SELECT id, state, attempts, last_error_code FROM forge.jobs WHERE kind = 'merge_request.conflict_scan' AND dedup_key LIKE 'mr_conflict_scan:<id>:%' ORDER BY id DESC LIMIT 5."
fix = "A cap or the budget: expected on a target branch with very many open merge requests — the pairs left out are scanned again when either side gets a new head. pair_failed: fix the cause its FG-GIT code names (its runbook); the job retries. job_failed / job_stale: fix the cause the job's own error code names; the next push, retarget or reopen scans again. Never edit forge.merge_request_conflict_scans or forge.merge_request_conflict_pairs by hand outside an approved runbook step."
runbook = "merge-request-mergeability"
test = "a_scan_with_more_candidates_than_the_cap_is_incomplete"

# ── M3 X7: deterministic risk check `forge/risk` (plan 04 M-6, ADR-0023
# Amendment X7). The three codes below are notices named in a run's summary
# and annotations, never HTTP errors. ──
[[error]]
code = "FG-REVIEW-0023"
name = "RiskStop"
http_status = 409
severity = "info"
user_message_ja = "この変更は、プログラムの破壊・DB の破壊・機密の流出のおそれがあるため、自動マージされません。チェック forge/risk の理由を確かめてください。"
user_message_en = "This change may break the program, destroy database data or leak a secret, so it is not merged automatically. Read the reasons in the forge/risk check."
user_message_id = "Perubahan ini berpotensi merusak program, menghapus data basis data atau membocorkan rahasia, sehingga tidak digabung otomatis. Baca alasannya pada pemeriksaan forge/risk."
cause = "The check `forge/risk` (M3 X7, plan 04 M-6 layer 1, ADR-0023 Amendment X7) found a deterministic rule of class `stop` in a merge request head's diff against the merge base with its target branch: an applied migration changed or removed, a destructive statement in a new migration (DROP TABLE / COLUMN / SCHEMA / DATABASE, TRUNCATE, DELETE or UPDATE without WHERE, a column type change or rename, a dropped constraint, a disabled trigger), a file that looks like a secret (a credential file by name, a private key or token pattern by content), a backup / restore / retention script or job file changed, a rollback step in a deploy file, a new migration or CI / deploy file that could not be read (too large, or past the read limit), a mass deletion (500 lines and 30 % of the target's text lines, or 20 files and 30 % of its files), or a change too large to assess (more than 5000 files). The run concludes `failure`; it blocks a merge only where a protected branch requires `forge/risk` (a `failure` never satisfies a required check), and M4's auto-merge never merges a head whose run is `failure`. The summary and annotations name the rule, the path and (for SQL) the line, never the matched text."
diagnosis = "Open the run: gstn checks list --project <id> --sha <head> (forge/risk; the summary lists every finding by rule, path and line; the rules and thresholds are in docs/api/checks.md). The worker's log event `forge.risk.recorded` carries `request_id`, `project_id`, `head_sha`, `level`, `findings` and `check_run_id`."
fix = "Nothing to change on the server. Read the reasons and fix the change (a migration is append-only: add a new one instead of editing an applied one; remove the secret and rotate it), or ask a maintainer to decide. The rules are fixed in code; a project cannot lower them yet."
test = "a_change_that_drops_a_table_is_a_failure_with_risk_stop"

[[error]]
code = "FG-REVIEW-0024"
name = "RiskWarn"
http_status = 409
severity = "info"
user_message_ja = "この変更には注意が要る点があります（認証・権限、CI やデプロイの設定、依存、新しいマイグレーションなど）。チェック forge/risk を確かめてください。"
user_message_en = "This change touches something that needs a look (authentication or permissions, CI or deploy configuration, dependencies, a new migration, ...). Read the forge/risk check."
user_message_id = "Perubahan ini menyentuh hal yang perlu diperhatikan (autentikasi atau izin, konfigurasi CI atau deploy, dependensi, migrasi baru, dan lain-lain). Baca pemeriksaan forge/risk."
cause = "The check `forge/risk` (M3 X7, plan 04 M-6) found only rules of class `warn` in the diff: authentication / permission code or files by path, CI or deploy configuration, a dependency manifest or lock file, a new migration, a symlink or submodule, an index or object dropped in a migration, a GRANT or REVOKE. The run concludes `neutral`; the merge proceeds as the merge method allows (a `warn` never stops auto-merge), and the warning stays on the commit."
diagnosis = "Open the run: gstn checks list --project <id> --sha <head>. The summary lists each finding by rule and path."
fix = "Nothing to fix: read the finding and make sure the change is intended. `neutral` does not satisfy a required check; a project that requires `forge/risk` needs a head without findings."
test = "a_new_migration_and_a_dependency_change_are_neutral_with_risk_warn"

[[error]]
code = "FG-REVIEW-0025"
name = "RiskNotAssessed"
http_status = 409
severity = "info"
user_message_ja = "この変更の危険を、すべては確かめられていません。チェック forge/risk の理由を確かめてください。"
user_message_en = "The risk of this change could not be fully assessed. Read the reasons in the forge/risk check."
user_message_id = "Risiko perubahan ini belum dapat dinilai sepenuhnya. Baca alasannya pada pemeriksaan forge/risk."
cause = "The check `forge/risk` (M3 X7) could not assess part of the head: no open merge request has this head any more, the target branch is gone, the target shares no history with the head, a changed path is not UTF-8, or more files changed than the content scan reads (the remainder is counted in the summary). It is a `warn`: the run concludes `neutral`, never `success`, so an unassessed head is never reported as safe. (A change of more than 5000 files is `stop`, FG-REVIEW-0023.)"
diagnosis = "Open the run: gstn checks list --project <id> --sha <head>; the finding's rule names the reason (`no_open_merge_request`, `target_missing`, `no_common_history`, `non_utf8_path`, `content_not_scanned`). The event `forge.risk.recorded` carries the same."
fix = "Nothing on the server. For no_open_merge_request / target_missing, open or retarget the merge request: a new head is assessed again. For non_utf8_path rename the path."
test = "a_head_with_no_open_merge_request_is_neutral_and_not_assessed"

[[error]]
code = "FG-CI-0001"
name = "CiConfigInvalid"
http_status = 422
severity = "info"
user_message_ja = "CI の定義ファイル .forge-ci.yml が規則に合っていません。一覧の行と理由を直してください。"
user_message_en = "The CI definition file .forge-ci.yml breaks a rule. Fix the lines and reasons listed."
user_message_id = "Berkas definisi CI .forge-ci.yml melanggar aturan. Perbaiki baris dan alasan yang dicantumkan."
cause = "The pipeline definition lint (forge_ci::check, plan 14 C1, plan 04 P-1) found a problem in a repository's `.forge-ci.yml`, or a plan for a trigger could not be made (forge_ci::plan). Each problem is `line reason [subject]`; `reason` is stable. Reading (bounded like forge-doc): too_large (over 64 KiB), not_utf8, empty_file, not_a_mapping, and the strict YAML tree's syntax / multiple_documents / yaml_anchor / yaml_alias / yaml_tag / too_deep (nesting over 16) / too_many_keys (over 64 in one mapping) / duplicate_key (also a job name written twice) / key_not_text. Schema (version 1; every key is known): key_unknown, field_missing (version, stages, jobs, stage, image), field_invalid (a wrong type, a duplicate list item, merge_requests not true/false), version_unsupported, stages_empty, stage_name_invalid, stage_duplicate, too_many_stages (over 16), stage_unknown, jobs_empty, too_many_jobs (over 48), job_name_invalid, image_not_pinned (not an OCI reference `[host[:port]/]lowercase/path[:tag]@sha256:<64 hex>`), script_empty, too_many_script_lines (over 200), script_line_invalid (a control character other than tab), script_line_too_long (over 4096 bytes), timeout_missing, timeout_invalid (not `<n>s|m|h`), timeout_too_long (over 4h), tag_invalid, too_many_tags (8), secret_name_invalid (the name is not echoed), too_many_secrets (16), branch_pattern_invalid, too_many_branches (16), artifact_path_invalid (absolute, `..`, `.git`, a glob metacharacter, a backslash, a drive), too_many_artifacts (16). Across jobs (only on a well-formed file): needs_unknown, needs_duplicate, too_many_needs (16), needs_later_stage, needs_cycle (each job on a cycle), secret_on_unprotected_ref (a job with secrets that runs for merge requests, or for a branch pattern the repository's protected patterns do not cover), secret_protection_unknown (a local check without the protected list: no branch counts as protected; pass `gstn ci lint --protected`). At most 100 problems, then too_many_problems; a subject is cut to 64 characters. Plan: needs_not_in_pipeline (a selected job needs a job the trigger does not run), secret_on_unprotected_ref (a selected job with secrets in a merge request's pipeline or on an unprotected branch: the plan fails rather than drop the secrets). Where: `gstn ci lint` / `gstn ci plan` on the working tree (exit 1) and the check `forge/ci-lint` on a merge request version's head (conclusion `failure`). Not a server fault: the file is the repository's content."
diagnosis = "The log event carries `reason` and `line` of the first problem and `problems` (how many). Reproduce with forge_ci::lint on the same bytes (each problem's line, reason and subject); the reasons and bounds are in crates/forge-ci/README.md."
fix = "Correct `.forge-ci.yml` at the listed line (pin the image by digest, set a timeout of at most 4h, keep secrets on jobs limited to protected branches with merge_requests: false, break the needs cycle). Nothing to change on the server."
test = "a_pipeline_definition_with_a_cycle_is_ci_config_invalid"

[[error]]
code = "FG-CI-0002"
name = "PipelineCreateFailed"
http_status = 503
severity = "warn"
user_message_ja = "CI のパイプラインを作れませんでした（定義ファイルを読めませんでした）。しばらくしてからもう一度実行してください。"
user_message_en = "The CI pipeline could not be created (the definition file could not be read). Run it again later."
user_message_id = "Pipeline CI tidak dapat dibuat (berkas definisi tidak dapat dibaca). Jalankan lagi nanti."
cause = "M4 C2 (plan 14): forge could not read `.forge-ci.yml` at the commit of a push, a merge request version or a manual run, or not the project's protected branches, so no plan was made. The job `ci.pipeline_create` retries what may pass (git timeout FG-GIT-0002, busy FG-GIT-0003 / 0004, the database, a repository still being provisioned FG-REPO-0003); on its last attempt — or at once for a failure that cannot pass — it records the pipeline with status `error` and this code so the push is never left without an answer. A manual run (`POST /api/v1/projects/{id}/pipelines`) answers 503 with this code at once (no row). Not the definition's fault (that is FG-CI-0001)."
diagnosis = "One warn log line `forge.ci.pipeline_create_failed` with `error_code`, `request_id`, `project_id`, `ref`, `sha`, `source` and `cause_code` (the underlying code, e.g. FG-GIT-0002) plus that error's own context (`operation`, `timeout_ms`). The job runner logged each earlier attempt with the underlying code (`kind=ci.pipeline_create`, `job_id`). If the `error` row itself could not be written, the same event is logged at error level with the write's `error_code` and the `cause_code`, and the job retries and then dies with the write's code (no row: the push is unanswered). `forge doctor` `ci.pipelines` fails with this code (`reason=unanswered_pushes`, `pipeline_ids`, `job_ids`) for an `error` pipeline of the last 24 hours or a `ci.pipeline_create` job dead in the last 7 days. Read the row: SELECT id, status, error_code, ref, sha FROM forge.ci_pipelines WHERE project_id = <id> ORDER BY id DESC LIMIT 5; and the job: SELECT id, state, attempts, last_error_code FROM forge.jobs WHERE kind = 'ci.pipeline_create' ORDER BY id DESC LIMIT 5."
fix = "Follow runbook ci-pipelines: fix the cause named by `cause_code` (its own runbook: git-unavailable / git-process-failed / db-unavailable / repository-provisioning), then start the pipeline again by hand (gstn pipeline run --project <id> --ref <branch>)."
runbook = "ci-pipelines"
test = "a_git_timeout_retries_then_records_an_error_pipeline"

[[error]]
code = "FG-CI-0003"
name = "PipelineStateConflict"
http_status = 409
severity = "info"
user_message_ja = "このパイプラインは今の状態では取り消し・再実行ができません。画面を読み込み直してください。"
user_message_en = "This pipeline cannot be cancelled or retried in its current state. Reload the page."
user_message_id = "Pipeline ini tidak dapat dibatalkan atau dijalankan ulang dalam keadaannya saat ini. Muat ulang halaman."
cause = "M4 C2: `POST …/pipelines/{pipeline_id}/cancel` on a pipeline that is already finished (succeeded, failed, canceled, skipped, invalid, error), or `POST …/retry` on one that is not `failed` or `canceled` (running ones are cancelled first; `invalid` / `error` have no jobs to retry — push a fix or run a new pipeline). The state is read under the row's lock, so two people pressing at once get one change and one conflict. Not a fault."
diagnosis = "The log event carries `pipeline_id`, `project_id`, `operation` (`cancel` / `retry`) and `status` (the state found)."
fix = "Nothing to fix: reload the pipeline. To run again a pipeline that cannot be retried, start a new one (gstn pipeline run --project <id> --ref <branch>)."
test = "cancelling_a_finished_pipeline_is_a_state_conflict"

[[error]]
code = "FG-CI-0004"
name = "JobLeaseLost"
http_status = 409
severity = "warn"
user_message_ja = "この CI のジョブの割り当ては失われました。ジョブは待ちの列に戻されています。"
user_message_en = "This CI job's lease was lost. The job has been returned to the queue."
user_message_id = "Sewa tugas CI ini hilang. Tugas telah dikembalikan ke antrean."
cause = "M4 C3 (plan 14, ADR-0029): a runner holds a job only while its lease lasts (`ci_jobs.lease_until`, extended by each heartbeat; compared with the database's `now()`). The lease ran out — the runner stopped sending heartbeats (crashed, lost its network, the host was overloaded) or sent one too late — and either the runner asked to extend, append a log to or complete the job after that (the runner API answers 409 with this code; the runner must stop the job), or the lease reaper (`forge worker`, `ci.lease_reaper`) took the job back: it returns the job to the queue (`pending`, a new attempt) exactly once and revokes its job token in the same transaction, or fails it with this code after the third lost lease (`lease_losses` reached the limit). Not a fault of the job's script."
diagnosis = "The reaper logs `forge.ci.job_lease_lost` (warn) with `error_code`, `request_id`, `job_id`, `pipeline_id`, `project_id`, `runner_id`, `lease_losses` and `outcome` (`requeued` / `failed`); the runner API logs the refused call with `job_id`, `runner_id` and `operation` (`heartbeat` / `log` / `complete`). Read the job: SELECT id, status, runner_id, lease_until, lease_losses, attempt, error_code FROM forge.ci_jobs WHERE id = <job_id>; and the runner: SELECT id, name, enabled, last_contact_at FROM forge.ci_runners WHERE id = <runner_id>; a runner whose `last_contact_at` is old has stopped (see runbook ci-runner)."
fix = "Follow runbook ci-runner: restart or repair the runner host named by `runner_id`. A requeued job runs again by itself on any runner; a job failed with this code is retried by hand (gstn pipeline retry --project <id> <pipeline_id>) once a runner is healthy."
runbook = "ci-runner"
test = "an_expired_lease_is_returned_to_the_queue_exactly_once"

[[error]]
code = "FG-CI-0005"
name = "NoRunnerAvailable"
http_status = 503
severity = "alert"
user_message_ja = "CI のジョブを実行できる Runner がいません。管理者に連絡してください。"
user_message_en = "No CI runner is available to run the jobs. Contact the administrator."
user_message_id = "Tidak ada runner CI yang tersedia untuk menjalankan tugas. Hubungi administrator."
cause = "M4 C3 (plan 14 §6, §7): CI jobs have been `pending` longer than the wait limit (10 minutes) and no enabled runner whose tags cover them has claimed them: no runner is registered or enabled, every runner has stopped contacting forge (`last_contact_at` older than 5 minutes), or the jobs ask for tags (`tags:` in `.forge-ci.yml`) no enabled runner has. Jobs wait; nothing is lost."
diagnosis = "`forge worker` logs `forge.ci.no_runner_available` (error, at most once per 10 minutes) with `error_code`, `request_id`, `waiting` (how many jobs), `oldest_job_id`, `oldest_wait_s`, `enabled_runners` and `live_runners`. `forge doctor` `ci.runners` fails with this code and the same facts. Read: SELECT id, name, enabled, tags, last_contact_at FROM forge.ci_runners ORDER BY id; and SELECT id, pipeline_id, tags, created_at FROM forge.ci_jobs WHERE status = 'pending' ORDER BY id LIMIT 10;"
fix = "Follow runbook ci-runner: start the runner process on its host, enable a disabled runner (PATCH /api/v1/admin/runners/{id} {\"enabled\": true}, an administrator's web session), or register a runner with the tags the jobs ask for."
runbook = "ci-runner"
test = "pending_jobs_without_a_live_runner_are_no_runner_available"

[[error]]
code = "FG-CI-0006"
name = "JobLogTooLarge"
http_status = 413
severity = "info"
user_message_ja = "CI のジョブのログが上限を超えました。これより後のログは保存されません。"
user_message_en = "The CI job's log exceeded its limit. Further output is not stored."
user_message_id = "Log tugas CI melampaui batasnya. Keluaran berikutnya tidak disimpan."
cause = "M4 C3: a runner appended a log chunk (`POST /api/v1/runner/jobs/{job_id}/log`) that would take the job attempt's stored log past 16 MiB, or the attempt already has 4096 chunks. The chunk is refused and nothing is stored for it; the job itself keeps running (the runner stops sending output and reports the result). A chunk over 64 KiB is refused earlier by the body cap (FG-WEB request too large)."
diagnosis = "The log event carries `job_id`, `runner_id`, `attempt`, `seq`, `stored_bytes` and `limit_bytes` (or `chunks`). Read: SELECT count(*), sum(octet_length(body)) FROM forge.ci_log_chunks WHERE job_id = <job_id> AND attempt = <attempt>;"
fix = "Make the job print less (quiet flags, write long reports to an artifact once C6 lands). Nothing to change on the server."
test = "a_log_past_the_job_limit_is_refused"

[[error]]
code = "FG-CI-0007"
name = "ContainerStartFailed"
http_status = 503
severity = "warn"
user_message_ja = "CI のジョブのコンテナを起動できませんでした。ジョブは失敗として報告されました。"
user_message_en = "The CI job's container could not be started. The job was reported as failed."
user_message_id = "Kontainer tugas CI tidak dapat dijalankan. Tugas dilaporkan gagal."
cause = "M4 C4 (plan 14, ADR-0029): `forge-runner` runs each job in a throwaway rootless Podman container (`podman create --network=none --read-only …`, then `podman start --attach`, argv only). Podman itself failed before the job's script ran: `podman create` failed (`step=create`: the image could not be pulled from the internal mirror or its digest is unknown, the storage is full, the user namespace is not set up), `podman start` exited 125 for a container `podman inspect` still shows as never started (`step=start`), or podman could not be started at all (the `podman` binary is missing or not executable). Also the runner host itself: the host is not rootless or the runner runs as root (it refuses to run jobs), or the job directory could not be created, written or removed (`workspace_unusable` / `workspace_dirty`: the runner then takes no further job). Not a fault of the job's script (that is a plain `failed` result with its exit code; 125 from a container that exited, and 126 / 127, are the script's)."
diagnosis = "The runner host (`journalctl -u forge-runner`, JSON) logs the failure once (warn) with `error_code`, `request_id` and in `context` `job_id`, `attempt`, `pipeline_id`, `project_id`, `reason` (`podman_exit` with `step` create / start / `spawn_failed` / `not_rootless` / `runs_as_root` / `workspace_unusable` / `workspace_dirty`), `exit_code` and `podman_stderr` (the last 2 KiB of Podman's own stderr), or `path` for the job directory; the job's log ends with the same code. `forge-runner check` repeats the host checks. On the runner host (as the runner's user): `podman info --format '{{.Host.Security.Rootless}}'` (must be true), `podman image exists <image>`, `podman system df`."
fix = "Follow runbook ci-runner (Runner host): pull or mirror the image into the internal registry, free container storage (`podman system prune` as the runner's user), or repair the rootless setup (subuid / subgid ranges). Then retry the pipeline (gstn pipeline retry --project <id> <pipeline_id>)."
runbook = "ci-runner"
test = "a_podman_error_exit_is_container_start_failed"

[[error]]
code = "FG-CI-0008"
name = "JobDefinitionMismatch"
http_status = 409
severity = "warn"
user_message_ja = "CI のジョブの定義がパイプラインを作ったときのものと一致しません。ジョブは実行されませんでした。"
user_message_en = "The CI job's definition does not match the one the pipeline was planned from. The job was not run."
user_message_id = "Definisi tugas CI tidak cocok dengan definisi saat pipeline direncanakan. Tugas tidak dijalankan."
cause = "M4 C4 (plan 14 C3 note, ADR-0029): the server keeps no job script; `forge-runner` reads `.forge-ci.yml` at the job's pinned commit and runs it only when its sha256 equals the claimed job's `definition_hash` (the bytes the pipeline was planned from), the file parses, and it still has the job with the claimed image and timeout. Any difference — the file is missing, its bytes changed (a corrupted repository, a forged pipeline row, a server bug), the job or its image is not in it, or the claim had no hash — fails the job before any container starts."
diagnosis = "The runner host (`journalctl -u forge-runner`, JSON) logs the failure once (warn) with `error_code`, `request_id` and in `context` `job_id`, `attempt`, `pipeline_id`, `project_id`, `reason` (`claim_invalid` / `hash_mismatch` / `no_hash` / `definition_missing` / `definition_invalid` / `job_missing` / `image_mismatch` / `timeout_mismatch`) and, for a hash mismatch, `expected` and `actual`; the job's log ends with the same code. Compare with SELECT definition_hash, sha FROM forge.ci_pipelines WHERE id = <pipeline_id>; and `git cat-file blob <sha>:.forge-ci.yml | sha256sum` in the repository."
fix = "Follow runbook ci-runner: a mismatch on a healthy repository is a defect (report it with the request id); a damaged repository is restored from backup. Push a new commit (or run the pipeline again) to plan a fresh pipeline."
runbook = "ci-runner"
test = "a_definition_hash_mismatch_fails_the_job_before_any_container"

[[error]]
code = "FG-CI-0009"
name = "JobFetchFailed"
http_status = 502
severity = "warn"
user_message_ja = "CI のジョブがリポジトリの固定したコミットを取得できませんでした。ジョブは失敗として報告されました。"
user_message_en = "The CI job could not fetch the pinned commit of the repository. The job was reported as failed."
user_message_id = "Tugas CI tidak dapat mengambil commit yang dipatok dari repositori. Tugas dilaporkan gagal."
cause = "M4 C4: `forge-runner` fetches only the job's pinned commit, over Smart HTTP with the job's token (`/api/v1/runner/jobs/{job_id}/repo.git`, which advertises only `refs/pipelines/<pipeline_id>/head`), into a fresh work directory. git failed or ran out of time (`git init`, `git fetch`, `git checkout`), the fetched commit was not the pinned one, or the server refused the copy (the job ended and its token was revoked: FG-AUTH-0001; another project or commit: FG-REPO-0005)."
diagnosis = "The runner host (`journalctl -u forge-runner`, JSON) logs the failure once (warn) with `error_code`, `request_id` and in `context` `job_id`, `attempt`, `pipeline_id`, `project_id`, `step` (`init` / `fetch` / `verify` / `checkout` / `read_definition`), `reason` (`exit` / `timeout` / `spawn_failed` / `sha_mismatch`), `exit_code` and `git_stderr` (the last 2 KiB, never the token). On the server, the job route logs the same `job_id` with `route=job_info_refs` / `job_upload_pack`."
fix = "Follow runbook ci-runner: check that the runner host reaches forge over HTTPS (`curl -sS https://<forge>/healthz`), that git is installed (`git --version`, 2.38 or newer) and that the job was still running. Then retry the pipeline."
runbook = "ci-runner"
test = "a_failed_fetch_is_job_fetch_failed"

[[error]]
code = "FG-CI-0010"
name = "JobTimedOut"
http_status = 504
severity = "info"
user_message_ja = "CI のジョブが時間切れで止められました。"
user_message_en = "The CI job was stopped because it ran out of time."
user_message_id = "Tugas CI dihentikan karena waktunya habis."
cause = "M4 C4: the job ran longer than its `timeout` in `.forge-ci.yml`. `forge-runner` killed its container (`podman kill`, then `podman rm -f`), removed the work directory and reported the job as failed."
diagnosis = "The runner host (`journalctl -u forge-runner`, JSON) logs it once (info) with `error_code`, `request_id` and in `context` `job_id`, `attempt`, `pipeline_id`, `project_id` and `timeout_s`; the job's log ends with the same code."
fix = "Make the job faster or raise its `timeout` (at most 4 hours) in `.forge-ci.yml`, then push."
runbook = "ci-runner"
test = "a_job_past_its_timeout_kills_and_removes_its_container"

[[error]]
code = "FG-CI-0011"
name = "JobImageNotAllowed"
http_status = 409
severity = "warn"
user_message_ja = "CI のジョブのイメージは、この Runner で許可されたレジストリのものではありません。ジョブは実行されませんでした。"
user_message_en = "The CI job's image is not from a registry this runner allows. The job was not run."
user_message_id = "Image tugas CI bukan dari registri yang diizinkan runner ini. Tugas tidak dijalankan."
cause = "M4 C4 review: `forge-runner` runs only images whose name starts with one of the prefixes in its configuration's `image_registries` (the internal registry mirror, plan 14 §9.3). The claimed job's image is outside every prefix, so the job fails before any git call, pull or container."
diagnosis = "The runner host (`journalctl -u forge-runner`, JSON) logs it once (warn) with `error_code`, `request_id` and in `context` `job_id`, `attempt`, `pipeline_id`, `project_id` and `image`; the job's log ends with the same code. Compare the image with `image_registries` in /etc/forge-runner/config.toml."
fix = "Follow runbook ci-runner: mirror the image into the internal registry and change the job's `image` in `.forge-ci.yml` to the mirror (pinned by digest), or — after review — add the registry prefix to `image_registries` and restart the runner."
runbook = "ci-runner"
test = "an_image_outside_the_allowed_registries_is_refused_before_any_call"

[[error]]
code = "FG-CI-0012"
name = "JobWorkspaceTooLarge"
http_status = 507
severity = "warn"
user_message_ja = "CI のジョブの作業ディレクトリが上限を超えました。ジョブは失敗として報告され、作業ディレクトリは消されました。"
user_message_en = "The CI job's work directory grew past its limit. The job was reported as failed and the work directory was removed."
user_message_id = "Direktori kerja tugas CI melampaui batasnya. Tugas dilaporkan gagal dan direktori kerja dihapus."
cause = "M4 C4 review: the runner configuration sets `work_dir_max_bytes`, and after the job's container ended its work directory (the checkout plus everything the job wrote to /workspace) held more bytes than that. The job is failed whatever its script's exit status, and the directory is removed like after every job. The hard bound while the job runs is the filesystem quota of `work_dir` (runbook ci-runner); this check catches a runner whose quota is missing or larger."
diagnosis = "The runner host (`journalctl -u forge-runner`, JSON) logs it once (warn) with `error_code`, `request_id` and in `context` `job_id`, `attempt`, `pipeline_id`, `project_id`, `bytes` and `limit_bytes`; the job's log ends with the same code. A work directory that could not be measured is logged as `forge.runner.workspace_unmeasured` (warn) and does not fail the job."
fix = "Make the job write less into /workspace (build outputs to /tmp, which is a bounded tmpfs, or clean up before the end), or raise `work_dir_max_bytes` and the filesystem quota of `work_dir` together (runbook ci-runner), then retry the pipeline."
runbook = "ci-runner"
test = "a_work_directory_past_its_bound_fails_the_job_and_is_wiped"

[[error]]
code = "FG-CI-0013"
name = "RequiredCheckStale"
http_status = 409
severity = "info"
user_message_ja = "必須のチェックが古いマージ結果のものです。対象のブランチが進んだので、新しいマージ結果でのパイプラインが終わるのを待ってからマージしてください。"
user_message_en = "A required check belongs to an older merge result. The target branch moved: wait for the pipeline on the new merge result to finish, then merge."
user_message_id = "Pemeriksaan wajib berasal dari hasil penggabungan yang lama. Cabang tujuan telah bergerak: tunggu pipeline pada hasil penggabungan yang baru selesai, lalu gabungkan."
cause = "M4 C7 (plan 04 M-1 / M-2, ADR-0024 Amendment 2026-11-11): the merge request's first blocking reason is `required_check_stale` — a check the target's merge rule requires has no run on the CURRENT merge result (the merge of the head into the live target tip, `refs/merge-requests/<iid>/merge`, a row of forge.merge_result_refs) but has one on an EARLIER merge result of the same head (the target branch advanced since). A run on an older merge result is stale whatever its conclusion. Precedence per required name: a run on the current merge result counts; else a run on an older merge result of the head is stale; else a run on the head counts (external reporters: the Checks API accepts only commits a branch or tag reaches), except `ci/pipeline`, which counts only on a merge result (the MR pipeline; a push pipeline's run on the head never satisfies it). Answered at the merge request (`POST …/merge-requests/{iid}/merge`, nothing written) or inside the merge job under the lock (the attempt is `superseded`, no ref moved); the merge status lists the same reason with `name=<check>`."
diagnosis = "The log event carries `reasons`, `details` (`required_check_stale:name=<check>`), `merge_request_id` and `head_sha`. `gstn mr status --json` shows `merge_result_sha` (the current merge result; null while it is being computed, on a conflict or when the target is gone) and `checks[].stale: true`. forge.merge_result_refs lists the merge results of the head (`target_sha`, `result_sha`, one row per pair); the MR pipeline of the new merge result is `gstn pipeline list --project <id>` (source merge_request, sha = merge_result_sha). The event `forge.review.merge_result_updated` (info) logs every new merge result with `request_id`."
fix = "Nothing to fix in the change: wait for the pipeline forge started on the new merge result (it reports the check on merge_result_sha), or run it again (gstn pipeline retry) if it failed; then merge. If no new merge result appears, the mergeability check is pending or failed (reason mergeability_unknown first; runbook merge-blocked)."
test = "a_required_check_of_an_older_merge_result_is_stale_and_blocks_the_merge"
