# The merge request first pass (plan 19 §3.1, §6): diffs with a planted
# defect (must not be missed) and clean diffs (false alarms are counted).
# Not run until the mr_review prompt lands (L5-5). Synthetic code only.

[[case]]
name = "planted-unwrap-on-user-input"
kind = "regular"
about = "A request handler unwraps a parse of user input (a panic on a production path)."
[[case.parts]]
label = "title"
class = "internal"
text = "Read the page size from the query"
[[case.parts]]
label = "diff"
class = "internal"
path = "crates/shop-web/src/orders.rs"
text = """
@@ -40,6 +40,8 @@ pub async fn list_orders(Query(q): Query<HashMap<String, String>>) -> Response {
     let db = state.db();
+    let size: u32 = q.get("size").unwrap().parse().unwrap();
+    let rows = db.orders(size).await?;
-    let rows = db.orders(50).await?;
     Json(rows).into_response()
 }
"""
[case.expect]
finding = { path = "crates/shop-web/src/orders.rs", quote_contains = "unwrap()" }

[[case]]
name = "planted-shell-string"
kind = "regular"
about = "A branch name from the request is interpolated into a shell string."
[[case.parts]]
label = "title"
class = "internal"
text = "Show the log of a branch"
[[case.parts]]
label = "diff"
class = "internal"
path = "crates/shop-tools/src/git_log.rs"
text = """
@@ -10,5 +10,9 @@ use std::process::Command;
 pub fn branch_log(branch: &str) -> std::io::Result<String> {
-    todo_log()
+    let out = Command::new("sh")
+        .arg("-c")
+        .arg(format!("git log --oneline {branch}"))
+        .output()?;
+    Ok(String::from_utf8_lossy(&out.stdout).into_owned())
 }
"""
[case.expect]
finding = { path = "crates/shop-tools/src/git_log.rs", quote_contains = "git log --oneline {branch}" }

