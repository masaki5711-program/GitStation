[package]
name = "forge-doc"
description = "forge documents, pure: the strict YAML tree, the spec document parser (and, from plan 13 stage 2, the document format, fmt and lint). No I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Pure (ADR-0026 §8): no I/O, clock or randomness. The only dependencies
# allowed are forge-errors and pure parsing parts (tests/purity.rs).
[dependencies]
yaml-rust2.workspace = true
regex.workspace = true
# Plan 17 P17-3 (ADR-0035): the AI assets are TOML and JSON. Both are pure
# parsers already in the tree (no I/O).
toml.workspace = true
serde_json.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
