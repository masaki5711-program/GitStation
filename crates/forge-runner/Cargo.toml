[package]
name = "forge-runner"
description = "the CI runner binary: claims jobs from forge over HTTPS, fetches the pinned commit with the job's token and runs each job in a throwaway rootless Podman container"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Contract 9 (CLAUDE.md §3.9, ADR-0029): the runner runs on a separate
# Linux host and talks to forge over HTTP only. It depends on forge-core
# (ids, telemetry), forge-errors (the registry) and forge-client (the HTTP
# client; forge-ci reaches it through `forge_client::forge_ci`) — never on a
# server crate — and nothing depends on it
# (`forge-hosting/tests/dependency_direction.rs`).
[dependencies]
forge-core.workspace = true
forge-errors.workspace = true
forge-client = { path = "../forge-client" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
url.workspace = true
clap.workspace = true
tracing.workspace = true
sha2.workspace = true
zeroize = "1"

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
