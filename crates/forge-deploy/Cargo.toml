[package]
name = "forge-deploy"
description = "forge deployments over SSH: environments, targets, requests and approvals, and the worker that runs the per-target script with a pinned host key"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A feature crate (plan 14 C11, ADR-0031, contract 9): forge-web / forge-cli
# -> forge-deploy -> forge-auth / forge-db -> forge-core -> forge-errors. It
# runs no SQL of its own (`forge_db::deploy`) and never depends on another
# feature crate.
[dependencies]
# Plan 17 P17-7: the pfs-ai-bundle manifest, digest and Ed25519 signature
# (pure; the same agent signing key and encoding as plan 16 A1) and the AI
# asset lint of what a release ships (pure forge-doc).
forge-agent.workspace = true
forge-doc.workspace = true
toml.workspace = true
forge-auth.workspace = true
forge-core.workspace = true
forge-db.workspace = true
forge-errors.workspace = true
# M4 C11 review: what may be deployed is read with git (browse API).
forge-git.workspace = true
# ADR-0038 §3 (step C): approver selectors arrive as JSON objects.
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
forge-db = { workspace = true, features = ["test-support"] }
tokio.workspace = true
sqlx.workspace = true
# tests/real_git.rs: a real bare repository under a temporary storage root.
uuid.workspace = true

[lints]
workspace = true
