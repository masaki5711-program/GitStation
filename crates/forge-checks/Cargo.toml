[package]
name = "forge-checks"
description = "forge check runs: validation of a report, the namespace grants, and the commit a run is reported on"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A feature crate (ADR-0024 §11): forge-web / forge-cli → forge-checks →
# forge-auth / forge-git / forge-db → forge-core → forge-errors. It runs no
# SQL of its own (the SQL is `forge_db::checks`) and never depends on
# another feature crate: forge-review reads the runs through forge-core's
# `CheckResultsSource`.
[dependencies]
forge-auth.workspace = true
# Plan 14 C1: the pipeline definition lint (`forge/ci-lint`), pure.
forge-ci.workspace = true
forge-core.workspace = true
forge-db.workspace = true
# Plan 13 stage 2: the document lint (`forge/doc-lint`), pure.
forge-doc.workspace = true
forge-errors.workspace = true
forge-git.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
forge-db = { workspace = true, features = ["test-support"] }
# Tests that need a git timeout use a git that never answers, not a 1 ns timeout.
forge-git = { workspace = true, features = ["test-support"] }
tokio.workspace = true
sqlx.workspace = true
# tests/real_browser.rs: a real bare repository under a temporary storage root.
tempfile.workspace = true
uuid.workspace = true

[lints]
workspace = true
