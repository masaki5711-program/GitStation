# ── end M3 R1b ──

# ── M3 R3: merge request discussions and notes (ADR-0024 §6, §12), audited on their project ──
[tables.merge_request_discussions]
guarded = false
kind = "audited"
ro_columns = ["*"]
audit_resource = "project"
audit_id_column = "project_id"
