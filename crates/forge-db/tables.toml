unaudited_columns = []
txn_audited_columns = []

# ── M4 C2 (20261204100000, plan 14 §4.1): CI pipelines and their jobs,
# planned from `.forge-ci.yml` at one commit; derived state written by forge
# (the `ci.pipeline_create` job, later the runner API: no person, so no
# txn_audited trigger). A person's cancel / retry / manual run is audited by
# the command in the same transaction (pipelines::*_decided, ChangeTx:
# `pipeline.canceled` / `.retried` / `.run_manual`), like
# merge_request_merges. Kept 90 days (the purge job comes with C5) ──
[tables.ci_pipelines]
guarded = false
kind = "derived"
ro_columns = ["*"]

[tables.ci_jobs]
guarded = false
kind = "derived"
ro_columns = ["*"]

# ── M4 C3 (20261205100000, plan 14 §4.1): the runner API. A runner is
# registered and changed by an administrator (audited on the runner:
# `ci_runner.registered` / `.updated`); last_contact_at is written by the
# runner's own requests. Job tokens are issued with a claim and revoked with
# the job's end or the project's deletion / move (derived). Job logs are
# appended by the runners (derived, append only; no body for the read pool
# before C5 decides the CI outputs on their marks) ──
[tables.ci_runners]
guarded = false
kind = "audited"
# Not secret_sha256 (ADR-0018: the read pool never sees token hashes).
ro_columns = [
    "id", "public_id", "name", "description", "tags", "enabled", "created_by", "created_at",
    "updated_at", "last_contact_at",
]
audit_resource = "ci_runner"
audit_id_column = "id"
unaudited_columns = ["updated_at", "last_contact_at"]
txn_audited_columns = []

[tables.ci_job_tokens]
guarded = false
kind = "derived"
# Not secret_sha256 (ADR-0018).
ro_columns = [
    "id", "public_id", "job_id", "attempt", "runner_id", "project_id", "sha", "created_at",
    "expires_at", "revoked_at", "revoked_reason",
]

[tables.ci_log_chunks]
guarded = false
kind = "derived"
# Not body: the log is read only on the write pool, after authorize_ci_output
# (M4 C5, ADR-0029 decision 5) or by the system's fingerprint sweep.
ro_columns = ["job_id", "attempt", "seq", "project_id", "created_at"]

# ── M4 C5 (20261206200000, plan 04 P-6 / P-7 / P-9): failure fingerprints
# (one per project and fingerprint, folded by the worker's sweep; no log
# text) and one failure row per failed job attempt (its fingerprint, error
# codes and masked excerpt). Derived: written by forge's worker only. The
# excerpt is log output: no read for the read pool; read through
# PipelineDiagnosisRead only. ci_jobs.diagnosed_attempt and
# ci_pipelines.check_status are the sweeps' marks ──
[tables.failure_fingerprints]
guarded = false
kind = "derived"
ro_columns = ["*"]

[tables.ci_job_failures]
guarded = false
kind = "derived"
# Not excerpt (log output, ADR-0029 decision 5).
ro_columns = [
    "job_id", "attempt", "project_id", "pipeline_id", "fingerprint_id", "error_codes", "first_line",
    "last_line", "created_at",
]

# ── M4 C7 (20261207100000, plan 04 M-1 / M-2): the merge results of merge
# requests (refs/merge-requests/<iid>/merge), one row per (merge request,
# head, target tip); recomputable from git ──
[tables.merge_result_refs]
guarded = false
kind = "derived"
ro_columns = ["*"]

# ── 2026-11-12 (20261210100000, ADR-0008 amendment "history import"): the
# one-time history import allowance of an empty repository, set by the
# operator CLI and used up by the first accepted push; audited on the project ──
[tables.repository_history_imports]
guarded = false
kind = "audited"
ro_columns = ["*"]
audit_resource = "project"
audit_id_column = "project_id"
unaudited_columns = []
txn_audited_columns = []
