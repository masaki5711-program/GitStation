# The table ledger (ADR-0016 §1, ADR-0018 §3). Every table in schema forge
# is here (test every_table_is_in_the_ledger); `guarded` tables are the
# ADR-0018 guarded objects (test guarded_objects_match_the_ledger, and the
# root migrations gate reads `guarded`).
#
#   kind       audited — state whose changes need an audit row in the same
#                        transaction (deferred trigger, with ChangeTx, C3);
#              derived — derived / operational state;
#              log     — the outbox and the audit log themselves.
#   ro_columns the columns the read pool (forge_ro) may select; "*" = all.
#
# kind = "audited" tables also carry (D1; they are the arguments of their
# deferred trigger forge.audited_change_present, which doctor checks):
#   audit_resource      the audit row's resource_type: a literal, or
#                       "=column" to read it from the row
#   audit_id_column     the column holding the audit row's resource_id
#   unaudited_columns   changes to these alone need no audit row; they are
#                       left out of the trigger's UPDATE OF list
#   txn_audited_columns changes to these alone need any succeeded audit row
#                       of the transaction (subtree path rewrites)
# Every other column is audited, columns added later included.
#
# guarded_functions: functions that are guarded although no guarded table
# uses them (the audit trigger function and the guards of state tables,
# which forge_app writes and are therefore not guarded tables).
#
# Shape (validated by scripts/validate-migrations.js in the root repo):
# [tables.<bare name>] with a boolean `guarded`.

guarded_functions = [
    "audited_change_present", "repositories_state_guard",
    # D5 MR2: deletes for the purge only.
    "purge_delete_guard",
    # M2 MR3: a web session's revocation is final.
    "web_sessions_revocation_guard",
    # M2 MR6: the purge deletes sessions only 30 days after they ended.
    "web_sessions_purge_guard",
    # M3 R1a: merged is final; the identity of a merge request never changes.
    "merge_requests_state_guard",
    # M3 R1b: a version's identity never changes; purge marks are final.
    "merge_request_versions_guard",
    # M3 R3: a discussion's identity and position never change; notes are final.
    "merge_request_discussions_guard",
    "merge_request_notes_guard",
    # M3 R4: a merge attempt only moves forward; final states never change.
    "merge_request_merges_guard",
    # M3 R5: an approval's identity never changes; it ends once.
    "merge_request_approvals_guard",
    # M3 R5 re-review: a push's unlisted ref updates are never changed.
    "push_unlisted_refs_guard",
    # M3 R5 round 4: the commits a push introduced are never changed.
    "push_commits_guard",
    # M3 S0 review: a user's kind never changes; a profile belongs to a
    # service account owned by a person; only a person has an identity
    # (guarded since 20261113100200).
    "users_kind_immutable",
    "service_account_profiles_kind_guard",
    "user_identities_human_guard",
    # M3 I1a: an integration acts as one service account, for its life.
    "integrations_service_account_guard",
    # M3 C1: a check run's identity never changes; grants go to service
    # accounts only.
    "check_runs_guard",
    "check_namespace_grants_kind_guard",
    # M3 I1b: a work item link's identity never changes; it ends once; the
    # purge alone deletes it.
    "merge_request_work_items_guard",
    # M3 I1b review: a person's link carries its audit row, a detected one
    # the subscriber's progress (deferred, 20261116100100).
    "merge_request_work_items_audited",
]

[tables.events]
guarded = true
kind = "log"
ro_columns = ["*"]

[tables.audit_log]
guarded = true
kind = "log"
# No personal (actor_label, source_ip, user_agent) or act-as (act_as_claimed,
# act_as_key_id) columns.
ro_columns = [
    "id", "seq", "sequenced_at", "txid", "occurred_at", "actor_kind", "actor_user_id",
    "actor_via_id", "credential_id", "via_assertion_id", "effective_scope", "action", "outcome",
    "resource_type", "resource_id", "project_id", "request_id", "error_code", "occurrences",
    "details",
]

[tables.event_feed_state]
guarded = true
kind = "log"
ro_columns = ["*"]

[tables.event_subscribers]
guarded = false
kind = "derived"
ro_columns = ["*"]

[tables.subscriber_dead_letters]
guarded = false
kind = "derived"
ro_columns = ["*"]

[tables.jobs]
guarded = false
kind = "derived"
ro_columns = ["*"]

# ── C8: the audit seal (ADR-0018 §4) ──
[tables.audit_seal]
guarded = true
kind = "log"
ro_columns = ["*"]
# ── end C8 ──

# ── D1: users and namespaces (ADR-0015, ADR-0016 §1) ──
[tables.users]
guarded = false
kind = "audited"
# Not email, employee_number or external_id (personal data).
ro_columns = [
    "id", "kind", "username", "display_name", "auth_source", "state", "is_admin", "created_at",
    "updated_at",
]
audit_resource = "user"
audit_id_column = "id"
unaudited_columns = ["updated_at"]
txn_audited_columns = []

[tables.namespaces]
guarded = false
kind = "audited"
ro_columns = ["*"]
# The owner's audit row covers its namespace (kind = user / group / project).
audit_resource = "=kind"
audit_id_column = "owner_id"
unaudited_columns = []
txn_audited_columns = ["full_path", "depth"]

[tables.namespace_tombstones]
guarded = false
kind = "audited"
ro_columns = ["*"]
audit_resource = "=cause_type"
audit_id_column = "cause_id"
# Changed only by ON DELETE SET NULL when a namespace is purged (forge_app
# has no UPDATE on this table).
unaudited_columns = ["namespace_id", "parent_namespace_id"]
txn_audited_columns = []
# ── end D1 ──

# ── D2: groups and their members (ADR-0010, ADR-0016 §1) ──
[tables.groups]
guarded = false
kind = "audited"
ro_columns = ["*"]
audit_resource = "group"
audit_id_column = "id"
unaudited_columns = ["updated_at"]
txn_audited_columns = []

[tables.group_members]
guarded = false
kind = "audited"
ro_columns = ["*"]
# A membership change is audited on its group (member.*).
audit_resource = "group"
audit_id_column = "group_id"
unaudited_columns = ["updated_at"]
txn_audited_columns = []
# ── end D2 ──

# ── D3: personal access tokens (ADR-0019, ADR-0018) ──
[tables.tokens]
guarded = false
kind = "audited"
# Not secret_sha256 (ADR-0018: the read pool never sees token hashes).
ro_columns = [
    "id", "user_id", "public_id", "name", "scopes", "created_at", "expires_at", "revoked_at",
    "revoked_reason", "last_used_at", "is_agent", "issued_by_user_id",
]
# token.created / token.revoked are audited on the owner (and publish events).
audit_resource = "user"
audit_id_column = "user_id"
# last_used_at is written at most every 10 minutes by authentication.
unaudited_columns = ["last_used_at"]
txn_audited_columns = []
# ── end D3 ──

# ── D4: projects and what belongs to them (ADR-0004, ADR-0008, ADR-0016 §1).
# Every change is audited on its project (resource 'project'). ──
# D5 MR2: deleted_by (who deleted it) is audited like the other columns.
[tables.projects]
guarded = false
kind = "audited"
ro_columns = ["*"]
audit_resource = "project"
audit_id_column = "id"
unaudited_columns = ["updated_at"]
txn_audited_columns = []

[tables.repositories]
guarded = false
kind = "audited"
# Not provision_token (it lets a provisioning retry adopt a directory).
ro_columns = ["id", "project_id", "kind", "state", "created_at", "ready_at"]
audit_resource = "project"
audit_id_column = "project_id"
unaudited_columns = []
txn_audited_columns = []

[tables.project_members]
guarded = false
kind = "audited"
ro_columns = ["*"]
audit_resource = "project"
audit_id_column = "project_id"
unaudited_columns = ["updated_at"]
txn_audited_columns = []

[tables.protected_refs]
guarded = false
kind = "audited"
ro_columns = ["*"]
audit_resource = "project"
audit_id_column = "project_id"
unaudited_columns = ["updated_at"]
txn_audited_columns = []
# ── end D4 ──

# ── M2 MR3: web sessions and IdP identities (ADR-0021 §4–§5, ADR-0018) ──
[tables.web_sessions]
guarded = false
kind = "audited"
# Not secret_sha256, refresh_token_enc, id_token_enc or oidc_sub (ADR-0021 §5:
# the read pool never sees session hashes, the IdP's tokens or its subject).
ro_columns = [
    "id", "public_id", "user_id", "created_at", "last_seen_at", "idle_expires_at",
    "absolute_expires_at", "revoked_at", "revoked_reason", "oidc_issuer", "oidc_sid",
    "refresh_checked_at", "access_role_seen_at", "refresh_without_id_token",
]
# session.created / session.revoked (and user.disabled) are audited on the user.
audit_resource = "user"
audit_id_column = "user_id"
# Activity (at most once a minute) and the refresh check (ADR-0021 §7).
unaudited_columns = [
    "last_seen_at", "idle_expires_at", "refresh_token_enc", "id_token_enc",
    "refresh_checked_at", "access_role_seen_at",
    # M2 MR5: refreshes in a row without an ID token (ADR-0021 §7).
    "refresh_without_id_token",
]
txn_audited_columns = []

[tables.user_identities]
guarded = false
kind = "audited"
# Not subject (the IdP's identifier of the person; no read path needs it).
ro_columns = ["id", "user_id", "issuer", "linked_at", "last_login_at"]
# user.identity_linked (MR4) is audited on the user.
audit_resource = "user"
audit_id_column = "user_id"
unaudited_columns = ["last_login_at"]
txn_audited_columns = []
# ── end M2 MR3 ──

# ── M3 R1a: merge requests (ADR-0024 §1), audited on their project ──
[tables.merge_requests]
guarded = false
kind = "audited"
ro_columns = ["*"]
audit_resource = "project"
audit_id_column = "project_id"
unaudited_columns = ["updated_at"]
txn_audited_columns = []

[tables.merge_request_counters]
guarded = false
kind = "audited"
ro_columns = ["*"]
audit_resource = "project"
audit_id_column = "project_id"
unaudited_columns = []
txn_audited_columns = []
# ── end M3 R1a ──

# ── M3 R1b: merge request versions (ADR-0024 §1, §2), audited on their project ──
[tables.merge_request_versions]
guarded = false
kind = "audited"
ro_columns = ["*"]
audit_resource = "project"
audit_id_column = "project_id"
unaudited_columns = []
