[tables.repository_maintenance]
guarded = false
kind = "derived"
ro_columns = ["*"]
# ── end M3 O3 ──
# ── M3 I1b: work items and their links (plan 02 §2, §5.7, §5.8, ADR-0016
# Amendment I1b). Derived: the ordered subscriber work-item-sync writes them
# (DerivedTx, no audit row); a person's manual link / unlink carries its own
# work_item.* audit row and event (ChangeTx). ──
# One kanflow work item (integration, external project, PBI-<n>); never
# updated or deleted.
[tables.work_items]
guarded = false
kind = "derived"
ro_columns = ["*"]

# One interval of a merge request <-> work item link; ended once, never
# deleted but by the project purge (repository `purging`). Derived, but the
# deferred trigger merge_request_work_items_audited (20261116100100) makes a
# person's link and its end need their work_item.* audit row, and a detected
# one the work-item-sync subscriber's progress, in the same transaction.
[tables.merge_request_work_items]
guarded = false
kind = "derived"
ro_columns = ["*"]

# The work items each event concerns (the feed's filter, I1c).
