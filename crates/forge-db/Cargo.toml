[package]
name = "forge-db"
description = "forge PostgreSQL layer: connection pool with timeouts and TLS, error mapping (FG-DB-*)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
forge-errors.workspace = true
forge-core.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
serde_json.workspace = true
uuid.workspace = true
# ── C8: the audit seal ──
sha2.workspace = true
hmac.workspace = true
serde_json_canonicalizer.workspace = true
# ── end C8 ──
# D1: the table ledger is parsed in production (doctor).
toml.workspace = true
tempfile = { workspace = true, optional = true }

[features]
# Bootstrapped test databases for other crates' tests (dev-dependency only).
test-support = ["dep:tempfile"]

[dev-dependencies]
tempfile.workspace = true
# D1: the shared path segment vectors (the database CHECK test).
forge-core = { workspace = true, features = ["test-support"] }
# C6: captured JSON logs in the job runner tests.
tracing-subscriber.workspace = true
# D4: generated protected ref patterns against the database CHECK.
proptest.workspace = true

[lints]
workspace = true
