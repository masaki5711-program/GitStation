[workspace]
resolver = "2"
members = ["crates/forge-errors", "crates/forge-core", "crates/forge-git", "crates/forge-auth", "crates/forge-web", "crates/forge-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
forge-errors = { path = "crates/forge-errors" }
forge-core = { path = "crates/forge-core" }
forge-git = { path = "crates/forge-git" }
forge-auth = { path = "crates/forge-auth" }
forge-web = { path = "crates/forge-web" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "sync", "fs", "net", "signal"] }
sha2 = "0.10"
tempfile = "3"
proptest = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
serde_json = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
wildcard_enum_match_arm = "deny"
