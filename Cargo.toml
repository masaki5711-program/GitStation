[workspace]
resolver = "2"
members = ["crates/forge-errors", "crates/forge-core", "crates/forge-git", "crates/forge-auth", "crates/forge-db", "crates/forge-web", "crates/forge-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
forge-errors = { path = "crates/forge-errors" }
forge-core = { path = "crates/forge-core" }
forge-git = { path = "crates/forge-git" }
forge-auth = { path = "crates/forge-auth" }
forge-db = { path = "crates/forge-db" }
forge-web = { path = "crates/forge-web" }
serde = { version = "1", features = ["derive"] }
url = "2"
percent-encoding = "2"
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
uuid = { version = "1", features = ["v4", "v7"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "sync", "fs", "net", "signal"] }
sha2 = "0.10"
tempfile = "3"
proptest = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
serde_json = "1"
http-body-util = "0.1"
# D3 MR3: HTTP Basic credentials (already in the lock through sqlx).
base64 = "0.22"
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-graceful", "service"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros"] }
# ── C8: the audit seal (ADR-0018 §4) ──
# HMAC-SHA256 of the seal (0.12: the digest 0.10 that sha2 0.10 uses).
hmac = "0.12"
# RFC 8785 (JCS) for the sealed rows; MIT. It turns on serde_json's
# float_roundtrip feature for the whole workspace.
serde_json_canonicalizer = "0.4.1"
# ── end C8 ──
# ── M1 phase 9 MR1: Smart HTTP transport (forge-git) ──
# gzip request bodies (git sends `Content-Encoding: gzip`); default backend is
# miniz_oxide (pure Rust). MIT OR Apache-2.0.
flate2 = "1"
# Unix: kill a git subprocess together with its helpers (killpg). Already in
# the lock through tempfile. Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT.
rustix = { version = "1", default-features = false, features = ["std", "process"] }
# Windows (dev machines only): a Job Object with kill-on-close, through a safe
# wrapper (the workspace forbids unsafe code). MIT.
win32job = "2"
# ── end M1 phase 9 MR1 ──
# ── M1 phase 8b MR6: API request bodies, cursors, OpenAPI ──
# AES-256-GCM for the opaque keyset cursor (ADR-0016 names AES-256-GCM);
# RustCrypto, Apache-2.0 OR MIT; >= 0.10.3 (GHSA-423w-p2w9-r7vq fixed).
# The nonce comes from getrandom (no rand_core OsRng feature).
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
# OpenAPI schemas of request / response bodies from the Rust types; MIT OR
# Apache-2.0. Only the derive and the model are used (no web framework glue).
utoipa = { version = "5", default-features = false, features = ["macros"] }
# ── end M1 phase 8b MR6 ──

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
wildcard_enum_match_arm = "deny"
